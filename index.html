ng the journey to a place","x":"We stopped for lunch on the way to the coast.","s":"on the WAY to"},{"e":"on short notice","t":"PREP","d":"with very little warning or time to prepare","x":"They changed our flight on short notice.","s":"on SHORT NOtice","uk":"UK: at short notice"}],"func":{"title":"Telling a story (and keeping people interested)","when":"Use these when you tell an anecdote about a trip — or about anything that happened to you.","phrases":[{"p":"You'll never guess what happened…","use":"starting a story and creating interest"},{"p":"So there I was, …","use":"setting the scene at a key moment"},{"p":"At first, … but then…","use":"showing a change in the story"},{"p":"All of a sudden, …","use":"introducing a surprise"},{"p":"Luckily, … / Unfortunately, …","use":"commenting on what happened"},{"p":"The funny thing was…","use":"highlighting an unexpected detail"},{"p":"Long story short, …","use":"skipping details and getting to the point"},{"p":"In the end, …","use":"saying how it finished"},{"p":"Looking back, …","use":"reflecting on the experience"}],"task":"Think of a real (or invented!) travel disaster. In pairs, tell it in two minutes using at least five of the phrases. Your partner reacts (No way! / Seriously?) and asks two follow-up questions at the end. Then swap."},"pron":{"focus":"Chunking and pausing when you tell a story","explain":"Good storytellers speak in chunks — small groups of words that belong together — with a short pause (|) between them. Each chunk has one main stress. The voice often goes up ↗ at the end of a chunk to say \"there's more coming\" and down ↘ at the end of the sentence.","tip":"Mark your story with a pencil: draw a line (|) where you breathe. Then say each chunk as if it were one long word.","lines":[{"t":"So there I was, at the airport, with no flight and no hotel.","m":"So there I WAS ↗ | at the AIRport ↗ | with NO FLIGHT ↗ | and NO hoTEL. ↘"},{"t":"We hit the road at dawn, and on the way to the coast, the car broke down.","m":"We hit the ROAD at DAWN ↗ | and on the WAY to the COAST ↗ | the CAR broke DOWN. ↘"},{"t":"After a month at home, I get itchy feet.","m":"After a MONTH at HOME ↗ | I get ITCHy FEET. ↘"},{"t":"Long story short, we stopped over in Lima for two days.","m":"LONG story SHORT ↗ | we stopped Over in LIma | for TWO DAYS. ↘"},{"t":"In the end, it was a once-in-a-lifetime experience.","m":"In the END ↗ | it was a ONCE-in-a-LIFEtime exPERience. ↘"}]},"acts":[{"type":"roleplay","cards":[{"sit":"Planning a trip together.","a":"You want a relaxing beach vacation at a resort. Convince your partner.","b":"You want an adventure off the beaten path: hiking and camping. Convince your partner and agree on a compromise."},{"sit":"Complaining at a hotel.","a":"Your room doesn't have the breathtaking view you paid for and the air conditioning is broken. Complain politely but firmly.","b":"You are the hotel manager. The hotel is full. Apologize and offer solutions."}]},{"type":"story","starters":["We hit the road at 5 a.m., but after an hour…","I was traveling light, which was a big mistake because…","Off the beaten path, we found a tiny village where…","Our flight was canceled, so we had to stop over in…"]},{"type":"pitch","brief":"Your group runs a small travel startup. Choose one idea (or invent your own), plan a 3-day trip for travelers who want to get off the beaten path in Chile, and pitch it to the \"investors\" (the rest of the class) in two minutes. The investors then ask questions and decide which trip to fund.","ideas":["A \"no phones\" hiking weekend in the Andes with a local guide","A stargazing road trip through the Atacama Desert","A food tour of small coastal towns, staying with fishing families","A bike-and-ferry adventure along the Carretera Austral","A \"mystery trip\": travelers only find out the destination at the airport"],"questions":["Who exactly is your target customer?","How much does it cost, and what's included?","What happens if the weather ruins your plan?","How will you protect local communities and nature?","Why would someone choose your trip instead of a normal tour?"]}],"ex":{"gap":{"items":[{"s":"I've been working nonstop for months. I really need to ___ for a few days.","a":"get away"},{"s":"There's no direct flight, so we'll ___ in Panama for one night.","a":"stop over"},{"s":"I only ever take a small backpack. I like to ___.","a":"travel light"},{"s":"The beach was empty and beautiful — totally ___. No hotels, no crowds.","a":"off the beaten path/off the beaten track"},{"s":"My boss asked me to fly to Lima tomorrow morning. I hate traveling ___!","a":"on short notice/at short notice"},{"s":"After two weeks of meetings in five different cities, I'm tired of ___. I just want to unpack!","a":"living out of a suitcase"}]},"match":{"pairs":[["hit the road","leave and start a journey"],["itchy feet","a strong desire to travel"],["soak up the atmosphere","enjoy the feeling of a place"],["a breathtaking view","an extremely beautiful view"],["stop over","stay somewhere briefly during a long journey"],["get away","take a break from your routine and go somewhere"]]},"fix":{"items":[{"s":"I always travel light — I only take two luggages.","wrong":"two luggages","fix":"two bags"},{"s":"We stopped over in Lima during two days.","wrong":"during two days","fix":"for two days"},{"s":"We lost our connecting flight in Lima.","wrong":"lost","fix":"missed"},{"s":"We arrived to Cusco late at night.","wrong":"arrived to","fix":"arrived in"}]}},"rec":{"prompt":"Describe a trip that didn't go as planned. What happened, and how did it end?","model":"A few years ago, I had itchy feet, so I booked a cheap flight to Buenos Aires on short notice. Then my flight was canceled, and the only option was a long bus ride across the Andes. Luckily, I was traveling light — just a backpack — so I decided to stop over in Mendoza for two days. At first I was annoyed, but then I rented a bike, visited two wineries and spent the evening in a little square, soaking up the atmosphere. Long story short, Mendoza was the best part of the whole trip. Looking back, the plans that go wrong are often the ones you remember.","use":["itchy feet","on short notice","travel light","stop over"]},"tips":[{"who":"teacher","t":"Before the Story Builder, tell a two-minute travel story yourself using the storytelling phrases. Students then retell it to a partner from memory before they invent their own."},{"who":"student","t":"Prepare one real travel story in English: write five key words on a card (not full sentences) and practice telling it until it takes about two minutes."},{"who":"student","t":"Notice American vs. British forms: off the beaten path / off the beaten track, on short notice / at short notice. Choose one style and be consistent."}]},{"id":"c1-travel","lv":"C1","tp":"travel","title":"Tourism & Its Impact","img":12406341,"goals":["discuss the economic, social and environmental impact of tourism with precise vocabulary","concede a point and counter-argue in a balanced, persuasive way","argue for and against tourism policies such as visitor caps and tourist taxes"],"warm":["Is tourism good or bad for local communities?","What's the most overrated destination you know?","Would you pay a tax to visit a city?","Has a place you love changed because of tourism?"],"model":{"kind":"text","title":"Loving a Place to Death","intro":"An opinion column from a travel magazine about the costs and benefits of mass tourism.","paras":["The headlines are depressingly familiar. Residents protest in Barcelona, Venice struggles with its crowds, and Thailand's famous Maya Bay had to close for more than three years to recover from the damage. Millions of travelers [[flock to]] the same handful of places at the same time, and the consequences are predictable: as apartments turn into short-term rentals, rents soar and locals are [[priced out of]] neighborhoods their families have lived in for generations.","Yet tourism is [[a double-edged sword]]. In many regions it is the main source of jobs, which leaves entire towns [[at the mercy of]] global trends — a pandemic or a currency crisis can empty them overnight. Meanwhile, airlines, cruise companies and property investors [[cash in on]] the boom, often putting little back into the communities that host it. Their interests are frequently [[at odds with]] those of the people who actually live there.","Some destinations are experimenting. Venice has charged day-trippers an entry fee on its busiest days, and closer to home, Rapa Nui limits visitors to a maximum stay of thirty days. Critics argue that such measures turn travel into a privilege for the wealthy; supporters say they are the only way to [[strike a balance between]] welcoming visitors and protecting the very place they came to see.","Travel can still [[broaden our horizons]], but only if we travel more thoughtfully: staying longer, visiting in the low season and skipping the obvious [[tourist traps]]. The question is no longer whether we should travel, but how."],"questions":[{"q":"According to the writer, what is happening to locals in popular destinations?","opts":["They are earning much more from short-term rentals.","They are moving to the coast to work in tourism.","They can no longer afford to live in their own neighborhoods."],"a":2},{"q":"Why does the writer call tourism \"a double-edged sword\"?","opts":["It creates jobs but also makes towns vulnerable and overcrowded.","It is dangerous for travelers.","It only benefits large hotel chains."],"a":0},{"q":"What is the writer's conclusion?","opts":["People should stop traveling altogether.","We should keep traveling, but more responsibly.","Tourist taxes are unfair to travelers."],"a":1}]},"lang":[{"e":"flock to","t":"PV","d":"to go somewhere in large numbers","x":"Millions of tourists flock to Venice every year.","s":"FLOCK to"},{"e":"price out","t":"PV","d":"to make something too expensive for certain people (be priced out of a place)","x":"Locals are being priced out of the city center.","s":"price OUT"},{"e":"cash in on","t":"PV","d":"to make money from a situation, often in an opportunistic way","x":"Hotels cash in on festival weekends by tripling their prices.","s":"cash IN on"},{"e":"a tourist trap","t":"ID","d":"an overpriced place designed to attract tourists","x":"That restaurant is a total tourist trap.","s":"a TOURist TRAP"},{"e":"go native","t":"ID","d":"to adopt the local customs and lifestyle (often humorous)","x":"After a year in Japan, he completely went native.","s":"go NAtive"},{"e":"broaden your horizons","t":"ID","d":"to increase your knowledge and experience of the world","x":"Traveling really broadens your horizons.","s":"BROADen your hoRIzons"},{"e":"a double-edged sword","t":"ID","d":"something that has both clear advantages and clear disadvantages","x":"For small towns, tourism is a double-edged sword.","s":"a DOUble-edged SWORD"},{"e":"overtourism","t":"COL","d":"too many tourists in one place, damaging it and local life","x":"Overtourism is damaging historic city centers.","s":"overTOURism"},{"e":"leave a carbon footprint","t":"COL","d":"to produce CO₂ through your actions","x":"Long-haul flights leave a huge carbon footprint.","s":"leave a CARbon FOOTprint"},{"e":"strike a balance between","t":"COL","d":"to find a reasonable middle point between two different needs","x":"Cities need to strike a balance between tourism and residents' quality of life.","s":"STRIKE a BALance between"},{"e":"at the mercy of","t":"PREP","d":"completely controlled or affected by something you cannot control","x":"Small islands are at the mercy of tourist demand.","s":"at the MERcy of"},{"e":"at odds with","t":"PREP","d":"in conflict with; not compatible with","x":"The new hotel project is at odds with the town's character.","s":"at ODDS with"}],"func":{"title":"Conceding a point and counter-arguing","when":"Use these in debates and discussions when you want to sound fair-minded and persuasive at the same time.","phrases":[{"p":"Admittedly, … but…","use":"accepting part of the other argument"},{"p":"Granted, … However, …","use":"conceding before you counter-argue"},{"p":"That's a fair point, although…","use":"acknowledging an idea and then qualifying it"},{"p":"While it's true that…, it doesn't follow that…","use":"challenging the logic of an argument"},{"p":"Be that as it may, …","use":"a formal way to say \"even so\""},{"p":"I take your point, but surely…","use":"pushing back firmly but politely"},{"p":"There's a case to be made for…","use":"presenting an argument you don't fully support"},{"p":"It cuts both ways.","use":"saying that something has both benefits and costs"},{"p":"On balance, I'd say…","use":"giving your final, considered view"}],"task":"In pairs, discuss the statement \"Every popular destination should charge a tourist tax.\" A argues for, B against. Each time you reply, first concede something with one of the phrases, then counter-argue. After three minutes, each of you sums up with \"On balance, …\""},"pron":{"focus":"Contrastive stress","explain":"When you contrast two ideas, you stress the words that carry the contrast — even if they are not normally stressed. In \"It's not tourism, it's overtourism\", the normal stress (overTOURism) moves to OVER because that's the new information. Contrastive stress makes arguments clearer and more persuasive.","tip":"Before you speak, decide which two ideas you are contrasting, and make those words louder, longer and higher. Say everything else more quietly.","lines":[{"t":"It's not tourism that's the problem; it's overtourism.","m":"It's NOT TOURism that's the PROBlem; | it's OVERtourism. ↘"},{"t":"Granted, tourism creates jobs, but it also prices locals out.","m":"GRANTed ↗ | tourism creates JOBS ↗ | but it ALSO prices LOCals OUT. ↘"},{"t":"The problem isn't how many people travel, but how they travel.","m":"The PROBlem isn't how MANy people travel ↗ | but HOW they travel. ↘"},{"t":"Admittedly, it's a double-edged sword, but on balance it's positive.","m":"adMITtedly ↗ | it's a DOUble-edged SWORD ↗ | but on BALance | it's POSitive. ↘"},{"t":"Visitors flock to the city in summer, not in winter.","m":"VISitors FLOCK to the city in SUMmer ↗ | NOT in WINter. ↘"}]},"acts":[{"type":"minute","items":["The pros and cons of tourism in my country","A place ruined by overtourism","How travel broadens your horizons","The worst tourist trap I've visited","Should flights be more expensive?","Eco-tourism: real or just marketing?"]},{"type":"wyr","items":[["Visit 30 countries quickly","Live in one country for a year"],["Travel by plane in hours","Travel by train in days"],["Visit a famous tourist trap","Visit an unknown place with no tourists"],["Pay a tourist tax of $100","Only travel in low season"],["Travel without your phone","Travel without a map or guide"],["Be a tourist in space","Explore the deep ocean"]]},{"type":"devil","motions":["Popular cities should cap the number of visitors per day.","Cruise ships should be banned from historic ports.","Short-term rentals should be banned in city centers.","Travel influencers do more harm than good.","Flying abroad for a weekend should be heavily taxed.","Locals should get free entry to the museums and parks that tourists pay for."]}],"ex":{"gap":{"items":[{"s":"Every January, thousands of visitors ___ the beaches of the central coast.","a":"flock to"},{"s":"Rents have doubled, and many young families have been ___ of the old town.","a":"priced out"},{"s":"Tourism is ___: it brings money, but it also brings crowds and noise.","a":"a double-edged sword"},{"s":"The island has no other industry, so it is completely ___ the tourist market.","a":"at the mercy of"},{"s":"Some hotels ___ the eclipse by charging five times their normal prices.","a":"cashed in on"},{"s":"The city is trying to ___ between attracting visitors and protecting residents. (3 words)","a":"strike a balance"}]},"match":{"pairs":[["a tourist trap","an overpriced place aimed at visitors"],["go native","adopt the local way of life"],["broaden your horizons","expand your experience of the world"],["at odds with","in conflict with"],["overtourism","more visitors than a place can handle"],["leave a carbon footprint","produce greenhouse gases through your actions"]]},"fix":{"items":[{"s":"Tourism has a huge impact in the local economy.","wrong":"impact in","fix":"impact on"},{"s":"Locals are being priced out from the city center.","wrong":"priced out from","fix":"priced out of"},{"s":"The town depends of tourism for most of its income.","wrong":"depends of","fix":"depends on"},{"s":"Living abroad for a year really broadened my horizon.","wrong":"my horizon","fix":"my horizons"}]}},"rec":{"prompt":"Is tourism doing more good than harm in a place you know well? Give a balanced answer and a clear conclusion.","model":"I'd say San Pedro de Atacama shows how tourism cuts both ways. Granted, it has created hundreds of jobs, and travelers flock to the desert for the stargazing and the geysers. But the town is also at the mercy of tourist demand: when visitors stopped coming during the pandemic, many families lost their income overnight. Water is another issue, since hotels and local communities compete for a very scarce resource. So it really is a double-edged sword. On balance, I think tourism is positive there, but only if the town can strike a balance between growth and protecting the people and the landscape that make it special.","use":["flock to","at the mercy of","a double-edged sword","strike a balance between"]},"tips":[{"who":"teacher","t":"Before the devil's advocate debate, give pairs three minutes to brainstorm arguments for BOTH sides. When you clap, they must switch sides immediately — and start their first turn with a concession phrase."},{"who":"student","t":"Collect two or three real examples (a city, a beach, a national park) before you debate. Specific examples make abstract arguments far more convincing."},{"who":"student","t":"Record a one-minute opinion and count your concession phrases. Aim for at least two, followed by a clear \"On balance…\""}]},{"id":"b1-humor","lv":"B1","tp":"humor","title":"Funny Moments","img":7149169,"goals":["tell a short funny or embarrassing story about something that happened to you","react naturally to other people's stories and show interest","talk about humor and the people who make you laugh"],"warm":["Who's the funniest person you know?","What makes you laugh?","Do you like comedy movies?","What's a funny video or meme you saw recently?"],"model":{"kind":"dialogue","title":"The Orange Tie","intro":"Diego tells his friend Carla about an embarrassing moment at his new job.","lines":[{"sp":"Carla","t":"So, how's the new job?"},{"sp":"Diego","t":"Great, but something terrible happened on my second day. I'm still so [[embarrassed about]] it!"},{"sp":"Carla","t":"Oh no. What happened?"},{"sp":"Diego","t":"I was in the elevator with a coworker and a man in a really bright orange tie. So I [[told a joke]] about it: “Is he going to work or to a party?”"},{"sp":"Carla","t":"Please tell me he didn't hear you."},{"sp":"Diego","t":"He heard everything. He was the CEO!"},{"sp":"Carla","t":"No way! What did he do?"},{"sp":"Diego","t":"He looked at his tie for a second and then [[burst out laughing]]. Then my coworker [[cracked up]] too."},{"sp":"Carla","t":"So he wasn't angry?"},{"sp":"Diego","t":"No, he has a great [[sense of humor]]. When we got out, he said, “See you at your goodbye party… [[just kidding]]!”"},{"sp":"Carla","t":"Ha! That's hilarious. Do people [[make fun of]] you now?"},{"sp":"Diego","t":"A little. Everyone calls me “the tie guy.” But it's OK — we all [[have a good laugh]] about it."},{"sp":"Carla","t":"You're famous now! At the next company dinner, you'll be [[the life of the party]]."}],"questions":[{"q":"Where did Diego tell the joke?","opts":["In a meeting","In the elevator","At an office party"],"a":1},{"q":"Who was the man in the orange tie?","opts":["Diego's new coworker","A man on his way to a party","The head of the company"],"a":2},{"q":"How does Diego feel about the story now?","opts":["He can laugh about it with his coworkers.","He's still angry with his coworker.","He wants to find a new job."],"a":0}]},"lang":[{"e":"crack up","t":"PV","d":"to suddenly start laughing a lot","x":"We cracked up when the teacher's chair broke.","s":"crack UP"},{"e":"make fun of","t":"PV","d":"to laugh at someone in an unkind way","x":"Don't make fun of your little brother.","s":"make FUN of"},{"e":"cheer up","t":"PV","d":"to become happier, or to make someone happier","x":"Her funny messages always cheer me up.","s":"cheer UP"},{"e":"burst out laughing","t":"COL","d":"to suddenly start laughing","x":"She burst out laughing in the middle of the class.","s":"burst out LAUGHing"},{"e":"tell a joke","t":"COL","d":"to say something funny (a short funny story)","x":"My dad loves telling terrible jokes.","s":"tell a JOKE"},{"e":"a sense of humor","t":"COL","d":"the ability to find things funny and make people laugh","x":"My boss has a great sense of humor.","s":"a SENSE of HUmor","uk":"UK: a sense of humour"},{"e":"have a good laugh","t":"COL","d":"to laugh a lot and enjoy something funny","x":"We had a good laugh looking at old photos.","s":"have a GOOD LAUGH"},{"e":"just kidding","t":"ID","d":"I'm only joking","x":"I'm leaving the company… just kidding!","s":"just KIDding"},{"e":"the life of the party","t":"ID","d":"a fun, lively person who makes a party more enjoyable","x":"My aunt is always the life of the party.","s":"the LIFE of the PARty","uk":"UK: the life and soul of the party"},{"e":"laugh at","t":"PREP","d":"to laugh because something is funny (or to make fun of someone)","x":"Everyone laughed at the cat video.","s":"LAUGH at"},{"e":"embarrassed about","t":"PREP","d":"feeling shy or ashamed about something","x":"I was so embarrassed about my mistake.","s":"emBARrassed about"},{"e":"in a good mood","t":"PREP","d":"feeling happy and positive","x":"You're in a good mood today! What happened?","s":"in a GOOD MOOD"}],"func":{"title":"Reacting to stories and showing interest","when":"Use these when someone tells you a story. They show you're listening and keep the conversation going.","phrases":[{"p":"No way!","use":"surprise — I can't believe it!"},{"p":"Seriously?","use":"surprise — asking if it's really true"},{"p":"You're kidding!","use":"strong surprise"},{"p":"Oh no! What happened?","use":"worry, asking for more information"},{"p":"And then what?","use":"asking the speaker to continue"},{"p":"That's hilarious!","use":"saying something is very funny"},{"p":"That's so embarrassing!","use":"sympathy for an awkward moment"},{"p":"I can imagine!","use":"showing you understand the feeling"},{"p":"That must have been awful!","use":"sympathy when something went wrong"}],"task":"In pairs, A tells a short funny or embarrassing story (true or invented). B must react at least five times with different phrases and ask two follow-up questions. Then swap. Who was the best listener?"},"pron":{"focus":"-ed endings: /t/, /d/ and /ɪd/","explain":"Regular past forms end in three different sounds: /t/ after sounds like k, p, f, s, sh and ch (cracked, laughed, embarrassed); /d/ after voiced sounds (cheered, played); and an extra syllable /ɪd/ only after t or d (started, wanted). When the next word starts with a vowel, link the -ed sound to it: cracked‿up sounds like \"crack-tup\".","tip":"Don't add an extra syllable: laughed has ONE syllable (\"laft\"), not \"laugh-ed\". Only say /ɪd/ after t or d.","lines":[{"t":"We cracked up at the end.","m":"We cracked‿UP‿at the END."},{"t":"Everyone laughed at the cat video.","m":"EVeryone LAUGHED‿at the CAT VIDeo."},{"t":"I was so embarrassed about it.","m":"I was SO emBARrassed‿about‿it."},{"t":"Her funny messages cheered me up.","m":"Her FUNny MESsages cheered me UP."},{"t":"He started laughing and couldn't stop.","m":"He STARTed LAUGHing and COULDn't STOP."}]},"acts":[{"type":"story","starters":["The funniest thing that ever happened to me was…","Everyone burst out laughing when…","I was so embarrassed when…","My friend told a joke, but…"]},{"type":"roulette","items":["Who's the funniest person in your family?","What's the funniest video you've ever seen?","Have you ever burst out laughing at the wrong moment?","Tell us a joke!","What was your most embarrassing moment?","Do you laugh at your own mistakes?","What comedy movie would you recommend?","Is it OK to make fun of your friends?"]},{"type":"taboo","cards":[{"w":"crack up","taboo":["laugh","funny","suddenly"]},{"w":"make fun of","taboo":["laugh","joke","unkind"]},{"w":"tell a joke","taboo":["funny","say","story"]},{"w":"a sense of humor","taboo":["funny","laugh","jokes"]},{"w":"just kidding","taboo":["joke","serious","true"]},{"w":"embarrassed about","taboo":["shy","red","mistake"]},{"w":"the life of the party","taboo":["fun","dance","people"]},{"w":"cheer up","taboo":["happy","sad","better"]},{"w":"in a good mood","taboo":["happy","feel","smile"]}]}],"ex":{"gap":{"items":[{"s":"When the dog ran off with the bride's shoe, all the guests ___. (2 words)","a":"cracked up"},{"s":"Kids at school used to ___ my big glasses. It really hurt. (3 words)","a":"make fun of"},{"s":"My boss isn't serious all the time. She has a great ___.","a":"sense of humor"},{"s":"I'm moving to Australia… ___! I'm staying right here.","a":"just kidding"},{"s":"I was so ___ my singing at karaoke that I left early.","a":"embarrassed about"},{"s":"You look sad. Watch this funny video — it'll ___. (3 words)","a":"cheer you up"}]},"match":{"pairs":[["crack up","suddenly start laughing a lot"],["just kidding","I'm only joking"],["the life of the party","a fun person who makes a party lively"],["in a good mood","feeling happy and positive"],["have a good laugh","enjoy something really funny together"],["embarrassed about","ashamed or uncomfortable because of something"]]},"fix":{"items":[{"s":"My dad has a great sense of humor and always says jokes.","wrong":"says jokes","fix":"tells jokes"},{"s":"I was so embarrassing when I fell down the stairs.","wrong":"embarrassing","fix":"embarrassed"},{"s":"Everybody laughed of my new haircut.","wrong":"laughed of","fix":"laughed at"},{"s":"The party was so funny — we danced all night!","wrong":"funny","fix":"fun"}]}},"rec":{"prompt":"Tell us about a funny or embarrassing moment in your life. What happened, and how did people react?","model":"A few years ago, I went to my friend's wedding and wanted to look really elegant, so I wore new shoes with very high heels. When I walked in, I tripped and fell right in front of the bride! I was so embarrassed about it. For a second, nobody said anything. Then the bride's grandmother burst out laughing, and soon everyone cracked up — even me. Later, the groom said in his speech, “Thanks to Ana for the best entrance of the night!” Now it's a family joke, and every time we remember it, we have a good laugh.","use":["embarrassed about","burst out laughing","crack up","have a good laugh"]},"tips":[{"who":"teacher","t":"Before the Story Builder, tell your own short embarrassing moment. Students listen and react with the phrases from the Functional Language section — then they do the same for each other."},{"who":"student","t":"In English you TELL a joke — never \"say a joke\". Write three true sentences: who tells the best jokes in your family, at work and in your group of friends?"},{"who":"student","t":"Use your voice when you react: \"No WAY!\" and \"SERiously?\" need energy. Practice them out loud — a flat \"no way\" sounds bored."}]},{"id":"b2-humor","lv":"B2","tp":"humor","title":"What Makes Us Laugh","img":9320849,"goals":["discuss what makes people laugh and how humor differs between cultures","tease people and respond to jokes and pranks in a friendly way","describe pranks and funny situations using idioms like pull someone's leg and in stitches"],"warm":["Is humor the same in every culture?","Can you laugh at yourself?","What's the secret to telling a good joke?","Have you ever fallen for a prank? What happened?"],"model":{"kind":"text","title":"Why Do We Laugh?","intro":"A short article from a popular psychology blog.","paras":["Think about the last time you were [[in stitches]]. Were you alone? Probably not. Researchers have found that we are about thirty times more likely to laugh when we're with other people than when we're alone. Laughter, it seems, is less about jokes and more about connection.","In fact, most of our laughter doesn't follow a joke at all. A friend [[cracks a joke]] that isn't even very funny, and we laugh anyway — it's a way of saying, “I like you. We're on the same team.” That's also why it feels so awkward when you don't [[get the joke]] and everyone else does.","Teasing works in a similar way. When a friend [[pulls your leg]] and you [[fall for]] it, the laugh you share can actually bring you closer — as long as it's [[all in good fun]]. The problem starts when the humor is always [[at someone else's expense]]. Then it isn't bonding anymore; it's bullying. And if someone tells you to “[[lighten up]]” when you're clearly hurt, they've missed the point.","So the next time you [[laugh your head off]] with your friends, remember: you're not just having fun. You're building a relationship."],"questions":[{"q":"According to the article, when are we most likely to laugh?","opts":["When we are alone","When we hear a clever joke","When we are with other people"],"a":2},{"q":"What does the article say about teasing?","opts":["It is always a form of bullying.","It can bring people closer if it's friendly.","It only works between family members."],"a":1},{"q":"Why do we often laugh at jokes that aren't very funny?","opts":["To show that we like the person","Because we don't understand them","Because we want to look intelligent"],"a":0}]},"lang":[{"e":"fall for","t":"PV","d":"to be tricked into believing something","x":"I can't believe you fell for that!","s":"FALL for"},{"e":"lighten up","t":"PV","d":"to stop being so serious (often said to someone)","x":"Lighten up! It was only a joke.","s":"lighten UP"},{"e":"pull someone's leg","t":"ID","d":"to joke with someone by telling them something untrue","x":"Relax, I'm just pulling your leg!","s":"pull someone's LEG"},{"e":"in stitches","t":"ID","d":"laughing a lot","x":"His story had us all in stitches.","s":"in STITCHes"},{"e":"laugh your head off","t":"ID","d":"to laugh very loudly and a lot","x":"We laughed our heads off at the comedy show.","s":"laugh your HEAD OFF"},{"e":"the butt of the joke","t":"ID","d":"the person everyone is laughing at","x":"I don't mind teasing, but I'm tired of always being the butt of the joke.","s":"the BUTT of the JOKE"},{"e":"play a prank on","t":"COL","d":"to trick someone as a joke","x":"We played a prank on our teacher on April Fools' Day.","s":"play a PRANK on"},{"e":"crack a joke","t":"COL","d":"to tell a joke, often spontaneously","x":"He cracked a joke to break the ice.","s":"crack a JOKE"},{"e":"get the joke","t":"COL","d":"to understand why something is funny","x":"I didn't get the joke at first.","s":"get the JOKE"},{"e":"keep a straight face","t":"COL","d":"to not laugh or smile, even though something is funny","x":"When he started dancing, I couldn't keep a straight face.","s":"keep a STRAIGHT FACE"},{"e":"at someone's expense","t":"PREP","d":"making fun of a particular person","x":"Don't make jokes at other people's expense.","s":"at someone's exPENSE"},{"e":"all in good fun","t":"PREP","d":"done to be friendly, not to hurt anyone","x":"Don't be upset — the teasing was all in good fun.","s":"ALL in GOOD FUN"}],"func":{"title":"Teasing and responding to jokes","when":"Use these with friends and coworkers when someone is joking with you — or when a joke goes wrong.","phrases":[{"p":"Very funny.","use":"a dry reply when you don't think a joke is funny (flat intonation!)"},{"p":"Are you pulling my leg?","use":"checking if someone is joking"},{"p":"You got me!","use":"admitting you fell for a joke"},{"p":"Nice try!","use":"saying you didn't fall for it"},{"p":"OK, that was funny, I'll give you that.","use":"admitting a joke was good"},{"p":"I'm just teasing you.","use":"showing you didn't mean it seriously"},{"p":"No offense, but…","use":"softening a teasing comment"},{"p":"Don't take it personally.","use":"telling someone not to feel hurt"},{"p":"Sorry, that came out wrong.","use":"apologizing when a joke goes wrong"},{"p":"I didn't mean it like that.","use":"explaining your real intention"}],"task":"In pairs, take turns telling your partner something surprising about yourself — it can be true or invented (e.g., \"I once met a famous soccer player\"). Your partner decides if you're pulling their leg and responds with the phrases. Then one of you makes a teasing comment that \"goes wrong\" and repairs it."},"pron":{"focus":"Weak forms in fast speech","explain":"In natural speech, small grammar words like of, at, for, a, was, your and to are usually unstressed and pronounced with a short /ə/ sound: at → /ət/, for → /fər/, was → /wəz/. The important words (verbs, nouns, adjectives) carry the stress, and the weak words are squeezed in between.","tip":"Tap the table only on the stressed words (in CAPITALS). Say the words in between quickly and quietly so that the rhythm stays regular.","lines":[{"t":"I can't believe you fell for that!","m":"I CAN'T beLIEVE you FELL for THAT! ↘"},{"t":"His story had us all in stitches.","m":"His STOry had‿us ALL‿in STITCHes. ↘"},{"t":"Relax, I'm just pulling your leg!","m":"reLAX ↘ | I'm just PULLing your LEG! ↘"},{"t":"Don't make jokes at other people's expense.","m":"DON'T make JOKES at OTHer PEOple's exPENSE. ↘"},{"t":"It was all in good fun.","m":"It was ALL‿in GOOD FUN. ↘"}]},"acts":[{"type":"agree","items":["Humor is the best way to deal with problems.","Some topics should never be joked about.","Pranks are just harmless fun.","Men and women find different things funny.","You can't translate humor into another language.","A good boss should have a sense of humor."]},{"type":"story","starters":["It was April Fools' Day and I decided to play a prank on…","Everyone was in stitches except…","I fell for the oldest trick in the book when…","He cracked a joke at the worst possible moment…"]},{"type":"podcast","title":"Why Are We Laughing?","segments":["Intro: introduce the hosts and say what kind of humor each of you loves","Lost in translation: a joke or type of humor that doesn't work in English (or in Spanish) — explain why","Prank stories: the best Día de los Inocentes or April Fools' prank you know — who fell for it?","Quick debate: where's the line between friendly teasing and bullying?","Outro: each host recommends one funny show, video or comedian"]}],"ex":{"gap":{"items":[{"s":"Don't believe him — he's ___. He doesn't really speak eight languages. (3 words)","a":"pulling your leg"},{"s":"My sister told me school was canceled, and I totally ___ it. I stayed in bed until ten!","a":"fell for"},{"s":"The comedian had us ___ from start to finish. (2 words)","a":"in stitches"},{"s":"When my boss walked in wearing a Santa hat, I couldn't ___.","a":"keep a straight face"},{"s":"Everyone laughed except Tom. He didn't ___, so he asked what was funny.","a":"get the joke"},{"s":"Good comedians don't need to make jokes ___. They can be funny without hurting anyone.","a":"at someone's expense/at other people's expense/at somebody's expense"}]},"match":{"pairs":[["play a prank on someone","trick someone as a joke"],["crack a joke","say something funny, often spontaneously"],["laugh your head off","laugh very loudly and a lot"],["the butt of the joke","the person everyone is laughing at"],["lighten up","stop being so serious"],["all in good fun","meant to be friendly, not hurtful"]]},"fix":{"items":[{"s":"We made a prank on our boss on April Fools' Day.","wrong":"made a prank on","fix":"played a prank on"},{"s":"Are you taking my hair? I don't believe you!","wrong":"taking my hair","fix":"pulling my leg"},{"s":"The show was so funny that we were laughing our head off.","wrong":"our head off","fix":"our heads off"},{"s":"I'm not agree that pranks are harmless fun.","wrong":"I'm not agree","fix":"I don't agree"}]}},"rec":{"prompt":"What kind of humor do you enjoy, and what kind do you find hard to laugh at? Give examples.","model":"I love silly, everyday humor — the kind of story that has everyone in stitches at a family barbecue. My uncle is a master at it: he can crack a joke about anything, and he never laughs at his own jokes, which makes them even funnier. I also love a good prank, as long as it's all in good fun. What I really can't stand is humor at someone's expense. Some comedians build their whole show on making fun of one type of person, and I just don't find it funny. When people tell me to lighten up, I say that laughing with someone and laughing at someone are two very different things.","use":["in stitches","crack a joke","all in good fun","at someone's expense"]},"tips":[{"who":"teacher","t":"During Agree or Disagree, ask students to support every opinion with a real example (a show, a prank, a comedian). Humor discussions get much richer when they're concrete."},{"who":"student","t":"Spanish \"tomar el pelo\" is \"pull someone's leg\" in English — never \"take someone's hair\". Start a list of Spanish expressions and their real English equivalents."},{"who":"student","t":"Watch a short stand-up clip with English subtitles and choose one joke you didn't get at first. Explain it to a classmate — explaining humor is great speaking practice."}]},{"id":"c1-humor","lv":"C1","tp":"humor","title":"Comedy & Satire","img":8170126,"goals":["discuss the role and the limits of comedy and satire with nuance","express and qualify opinions using hedging language","analyze why a joke works or falls flat, using terms like deadpan delivery and comic timing"],"warm":["Is satire important in a democracy?","Has comedy become too careful?","Which comedian do you admire and why?","Are jokes funnier in your own language than in English? Why?"],"model":{"kind":"dialogue","title":"Where's the Line?","intro":"Two hosts of a culture podcast discuss what makes satire work — and when comedy goes too far.","lines":[{"sp":"Nora","t":"Today's big question: is there anything comedians shouldn't joke about?"},{"sp":"Ben","t":"I'd argue that good comedy has always [[pushed the envelope]]. Satire exists to [[poke fun at]] people in power — that's the whole point."},{"sp":"Nora","t":"Sure, but there's a difference between punching up and punching down. When a joke targets people who are already struggling, it [[crosses the line]] for me."},{"sp":"Ben","t":"That's fair. Although intent matters, too. A lot of edgy jokes are [[tongue-in-cheek]] — the comedian is mocking an attitude, not a group of people."},{"sp":"Nora","t":"True, but not everyone gets the irony. Especially with [[deadpan delivery]]: if you say something outrageous with a straight face, some people will take it literally, even when it's obviously exaggerated [[for comic effect]]."},{"sp":"Ben","t":"Which is why online clips are a nightmare. A ten-second bit loses all its context, and suddenly [[a running joke]] from a whole show looks like a genuinely nasty comment."},{"sp":"Nora","t":"So when people get outraged by a clip, should we just [[take it with a grain of salt]]?"},{"sp":"Ben","t":"To some extent. But comedians can't just [[laugh off]] every criticism, either. Sometimes a joke is simply [[in poor taste]]."},{"sp":"Nora","t":"Agreed. And sometimes it just [[falls flat]], which for a comedian is probably even worse."},{"sp":"Ben","t":"Ha! Exactly. I suspect bad [[comic timing]] has killed more jokes than bad taste ever has."}],"questions":[{"q":"What is Ben's main view at the start?","opts":["Good comedy, especially satire, has always challenged limits.","Comedy should avoid sensitive topics.","Only professional comedians should joke about people in power."],"a":0},{"q":"Why does Nora think deadpan delivery can cause problems?","opts":["It makes jokes too long.","Audiences find it boring.","Some people don't realize the comedian is being ironic."],"a":2},{"q":"According to Ben, what shouldn't comedians do?","opts":["Make jokes about people in power","Dismiss every criticism as a joke","Use deadpan delivery"],"a":1}]},"lang":[{"e":"poke fun at","t":"PV","d":"to make fun of someone or something, often gently","x":"The show pokes fun at politicians every week.","s":"POKE FUN at"},{"e":"laugh off","t":"PV","d":"to treat something serious as if it were a joke","x":"He laughed off the criticism.","s":"laugh OFF"},{"e":"tongue-in-cheek","t":"ID","d":"said ironically, not seriously","x":"His review of the movie was totally tongue-in-cheek.","s":"TONGUE-in-CHEEK"},{"e":"push the envelope","t":"ID","d":"to go beyond normal limits","x":"That comedian always pushes the envelope.","s":"push the ENvelope"},{"e":"cross the line","t":"ID","d":"to go too far; to offend","x":"That joke really crossed the line.","s":"cross the LINE"},{"e":"take it with a grain of salt","t":"ID","d":"to not completely believe something","x":"He exaggerates a lot, so take his stories with a grain of salt.","s":"take it with a GRAIN of SALT","uk":"UK: take it with a pinch of salt"},{"e":"a running joke","t":"COL","d":"a joke that is repeated over time","x":"His terrible coffee became a running joke in the office.","s":"a RUNning JOKE"},{"e":"deadpan delivery","t":"COL","d":"telling a joke with a completely serious face and voice","x":"Her deadpan delivery makes everything funnier.","s":"DEADpan deLIVery"},{"e":"fall flat","t":"COL","d":"to fail to have the intended effect (for a joke: nobody laughs)","x":"His opening joke fell completely flat.","s":"fall FLAT"},{"e":"comic timing","t":"COL","d":"the skill of pausing and delivering a line at exactly the right moment","x":"She has perfect comic timing — she always waits a beat before the punchline.","s":"COMic TIMing"},{"e":"in poor taste","t":"PREP","d":"offensive or inappropriate in the circumstances","x":"Making jokes about the accident was in very poor taste.","s":"in POOR TASTE"},{"e":"for comic effect","t":"PREP","d":"in order to make people laugh","x":"He exaggerates his accent for comic effect.","s":"for COMic efFECT"}],"func":{"title":"Hedging and qualifying your opinions","when":"Use these when you discuss sensitive or complex topics, so you sound thoughtful rather than absolute.","phrases":[{"p":"I'd argue that…","use":"stating a view confidently but not aggressively"},{"p":"To some extent, …","use":"partial agreement"},{"p":"It depends largely on…","use":"showing that context matters"},{"p":"I'm not entirely convinced that…","use":"polite, soft disagreement"},{"p":"There's a fine line between … and …","use":"pointing out a subtle distinction"},{"p":"It's not so much … as …","use":"refining or correcting an idea"},{"p":"That's not to say that…","use":"preventing a misunderstanding of your view"},{"p":"Arguably, …","use":"presenting a view that could be debated"},{"p":"If anything, …","use":"suggesting that the opposite may be true"},{"p":"Generally speaking, …","use":"making a broad but careful generalization"}],"task":"In pairs, discuss: \"Comedians should never have to apologize for a joke.\" In three minutes, each of you must use at least four hedging phrases. Your partner ticks off every phrase they hear and then says which one sounded most natural."},"pron":{"focus":"Sincere vs. sarcastic intonation","explain":"The same words can be sincere or sarcastic, and intonation makes the difference. Sincere comments usually have a lively, natural fall ↘. Sarcasm is often slower and flatter, with heavy stress on the key word and short pauses (|) before it. The lines below are marked for the sarcastic version — much of tongue-in-cheek humor is in the tone.","tip":"Say each line twice: first sincerely, then sarcastically. Your partner guesses which version they heard.","lines":[{"t":"Oh, great. Another running joke about my coffee.","m":"Oh | GREAT. ↘ | aNOTHer RUNning JOKE | about MY COFfee. ↘"},{"t":"Sure, I'll just laugh it off.","m":"SURE. ↘ | I'll JUST | LAUGH it OFF. ↘"},{"t":"That wasn't in poor taste at all.","m":"That WASn't in POOR TASTE | at ALL. ↘"},{"t":"I'm sure he was being totally tongue-in-cheek.","m":"I'm SURE ↘ | he was being TOtally | TONGUE-in-CHEEK. ↘"},{"t":"Great comic timing, as always.","m":"GREAT | COMic TIMing ↘ | as ALways. ↘"}]},"acts":[{"type":"roulette","items":["Is there anything that should never be joked about?","What's a running joke with your friends or coworkers?","Which comedian pushes the envelope too far?","Can satire really change people's minds?","Do you prefer deadpan or slapstick humor?","When did a joke cross the line for you?","Is a sense of humor a sign of intelligence?","How do you laugh off criticism?"]},{"type":"ranking","task":"Rank these types of humor from your FAVORITE to your LEAST favorite, and explain why.","items":["Sarcasm","Slapstick","Political satire","Puns and wordplay","Dark humor","Self-deprecating humor"]},{"type":"balloon","sit":"A comedy festival has lost most of its funding and can keep only ONE act. Each student represents a type of comedy and must persuade the jury (the class) that the world needs their kind of humor most. After each round, the class votes one act out of the balloon.","roles":[{"name":"A satirist","why":"holds the powerful to account — and makes people think"},{"name":"A stand-up comedian","why":"turns everyday life into shared laughter"},{"name":"A clown / physical comedian","why":"needs no language and works for every age and culture"},{"name":"An improv group","why":"never the same show twice; builds creativity and teamwork"},{"name":"A sitcom writer","why":"reaches millions at home and creates running jokes people love"},{"name":"A meme creator","why":"the comedy of the internet generation: fast, shareable and free"}]}],"ex":{"gap":{"items":[{"s":"The CEO's strange video went viral, and every comedy show ___ it the next day. (3 words)","a":"poked fun at/made fun of"},{"s":"Nobody laughed. The joke completely ___.","a":"fell flat"},{"s":"She tells the most absurd stories with a totally serious face. Her ___ is famous. (2 words: d… d…)","a":"deadpan delivery"},{"s":"Everyone went quiet. Making jokes about his ex-wife in his wedding speech was really ___.","a":"in poor taste"},{"s":"He loves to exaggerate, so I'd ___ — he probably earns half what he says.","a":"take it with a grain of salt/take it with a pinch of salt"},{"s":"When journalists asked about the terrible reviews, he just ___ and changed the subject.","a":"laughed it off/laughed them off"}]},"match":{"pairs":[["tongue-in-cheek","ironic, not meant seriously"],["push the envelope","go beyond the usual limits"],["cross the line","go too far and offend people"],["a running joke","a joke that keeps coming back over time"],["comic timing","the skill of delivering a line at the perfect moment"],["for comic effect","in order to make people laugh"]]},"fix":{"items":[{"s":"The show makes fun at politicians every week.","wrong":"makes fun at","fix":"makes fun of"},{"s":"That joke really passed the line.","wrong":"passed the line","fix":"crossed the line"},{"s":"Satire matters because it critics people in power.","wrong":"critics","fix":"criticizes"},{"s":"I didn't get the joke until somebody explained me it.","wrong":"explained me it","fix":"explained it to me"}]}},"rec":{"prompt":"Should there be limits on what comedians can joke about? Give a nuanced answer.","model":"I'd argue that comedy needs the freedom to push the envelope — that's how satire pokes fun at power and makes us think. That's not to say that anything goes, though. There's a fine line between a joke that challenges the audience and one that simply targets vulnerable people, and when a comedian crosses that line, the joke usually falls flat anyway. To some extent, it also depends on context: something tongue-in-cheek in a comedy club can look terrible as a ten-second clip online. So, generally speaking, I don't think we need rules. If anything, audiences are the best judges — they simply stop laughing.","use":["push the envelope","poke fun at","cross the line","fall flat"]},"tips":[{"who":"teacher","t":"Keep the discussion on comedy itself, not on political positions. When students bring an example, ask them to analyze the technique (target, timing, irony) rather than the politics behind it."},{"who":"student","t":"Notice how hedging changes your tone: compare \"Comedy should have no limits\" with \"I'd argue that comedy needs very few limits.\" Rewrite three of your own opinions with hedges before class."},{"who":"student","t":"Watch a short clip of a deadpan comedian and shadow two lines. Copy the pauses and the flat tone — it's great practice for comic timing in English."}]},{"id":"b1-curious","lv":"B1","tp":"curious","title":"Amazing Facts","img":2280547,"goals":["share surprising facts using phrasal verbs like find out, look up and come up with","react naturally to surprising information and ask follow-up questions","link consonant and vowel sounds to say phrasal verbs smoothly"],"warm":["What's the most surprising fact you know?","Do you like quiz shows?","Where do you usually find interesting information?","What's a fact about Chile that surprises people from other countries?"],"model":{"kind":"dialogue","title":"Did You Know…?","intro":"Valentina and her coworker Jake are having lunch at their office in Santiago.","lines":[{"sp":"Valentina","t":"Jake, guess what I [[found out]] yesterday? [[Believe it or not]], octopuses have three hearts."},{"sp":"Jake","t":"No way! Three hearts? Are you sure?"},{"sp":"Valentina","t":"I didn't believe it either, so I [[looked it up]]. [[According to]] a science website, two hearts pump blood to the gills, and the third pumps it to the rest of the body."},{"sp":"Jake","t":"Huh. I guess that [[makes sense]]. OK, I've got one for you. Do you know how the microwave oven was invented?"},{"sp":"Valentina","t":"I [[have no idea]]."},{"sp":"Jake","t":"[[By accident]]! In the 1940s, an engineer was working with radar equipment when the candy bar in his pocket melted."},{"sp":"Valentina","t":"Seriously? So he [[came up with]] the idea because of a candy bar?"},{"sp":"Jake","t":"Exactly. A lot of great inventions start with a lucky mistake."},{"sp":"Valentina","t":"Well, [[you learn something new every day]]! I'm really [[interested in]] stories like that."},{"sp":"Jake","t":"Me too. Hey, there's a quiz night at a bar near here on Thursday. Want to join our team?"},{"sp":"Valentina","t":"Sure! If there's a question about Chile, I'm your expert."},{"sp":"Jake","t":"Perfect. So what's Chile [[famous for]]?"},{"sp":"Valentina","t":"Lots of things: the Andes, wine and the Atacama, one of the driest deserts in the world."}],"questions":[{"q":"How many hearts does an octopus have?","opts":["Two","Three","Four"],"a":1},{"q":"How was the microwave oven invented?","opts":["By accident","After years of planned research","By a famous chef"],"a":0},{"q":"What does Jake invite Valentina to?","opts":["A trip to the Atacama","A science class","A quiz night"],"a":2}]},"lang":[{"e":"find out","t":"PV","d":"to discover information","x":"I found out that octopuses have three hearts.","s":"find OUT"},{"e":"look up","t":"PV","d":"to search for information in a dictionary, online, etc.","x":"I didn't know the answer, so I looked it up.","s":"look UP"},{"e":"come up with","t":"PV","d":"to think of an idea","x":"Who came up with the idea of the internet?","s":"come UP with"},{"e":"believe it or not","t":"ID","d":"used to introduce a surprising fact","x":"Believe it or not, bananas are berries.","s":"beLIEVE it or NOT"},{"e":"you learn something new every day","t":"ID","d":"said when you hear a fact that surprises you","x":"Flamingos are pink because of the food they eat? Well, you learn something new every day!","s":"you LEARN something NEW every DAY"},{"e":"make sense","t":"COL","d":"to be logical or easy to understand","x":"That explanation doesn't make sense to me.","s":"make SENSE"},{"e":"have no idea","t":"COL","d":"to not know something at all","x":"I had no idea that the Eiffel Tower gets taller in the summer.","s":"have NO iDEA"},{"e":"make a discovery","t":"COL","d":"to find something new, especially in science","x":"Scientists make new discoveries about the deep ocean every year.","s":"make a disCOVery"},{"e":"be famous for","t":"PREP","d":"to be known for something","x":"Chile is famous for its wine and mountains.","s":"be FAmous for"},{"e":"interested in","t":"PREP","d":"wanting to know more about something","x":"I'm very interested in space.","s":"INterested in"},{"e":"by accident","t":"PREP","d":"without planning it","x":"Penicillin was discovered by accident.","s":"by ACcident"},{"e":"according to","t":"PREP","d":"as said or shown by a person, study or source","x":"According to NASA, a day on Venus is longer than a year on Venus.","s":"acCORDing to"}],"func":{"title":"Reacting to surprising facts","when":"Use these when someone tells you something interesting or hard to believe.","phrases":[{"p":"Really? I had no idea!","use":"surprise: you didn't know this"},{"p":"No way!","use":"strong surprise (informal)"},{"p":"Are you serious?","use":"checking if it's really true"},{"p":"Wait, is that true?","use":"polite doubt"},{"p":"That's amazing!","use":"a positive reaction"},{"p":"Huh, that's weird.","use":"reacting to a strange fact"},{"p":"That makes sense.","use":"showing you understand the reason"},{"p":"Where did you find that out?","use":"asking for the source"},{"p":"Tell me more!","use":"asking for more information"}],"task":"Write three 'facts' about yourself or the world: two true and one false. In pairs, take turns telling them. Your partner reacts to each one with a different phrase, asks one follow-up question and then guesses which fact is false."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them, so the two words sound like one. 'Find out' sounds like 'fine-dout'. This happens all the time in phrasal verbs.","tip":"Practice slowly first, then faster. Don't stop or add an extra 'e' sound between the words: move straight from the consonant to the vowel.","lines":[{"t":"I found out about it by accident.","m":"I FOUND‿OUT‿aBOUT‿it by ACcident."},{"t":"Let's look it up.","m":"Let's LOOK‿it‿UP."},{"t":"Who came up with that idea?","m":"Who came‿UP with that iDEA?"},{"t":"Believe it or not, it's true.","m":"beLIEVE‿it‿or NOT, | it's TRUE."},{"t":"I'm interested in animals.","m":"I'm INterested‿in‿ANimals."}]},"acts":[{"type":"agree","items":["Learning random facts is a waste of time.","Quiz shows are more fun than TV series.","The internet makes us smarter.","Science is more interesting than history.","Everyone should know basic first aid.","Many great inventions happen by accident."]},{"type":"ranking","task":"Rank these inventions from MOST to LEAST important for humanity.","items":["The internet","The wheel","Electricity","Vaccines","The smartphone","Writing"]},{"type":"taboo","cards":[{"w":"find out","taboo":["discover","learn","information"]},{"w":"look up","taboo":["search","Google","internet"]},{"w":"come up with","taboo":["idea","think","invent"]},{"w":"believe it or not","taboo":["surprising","true","fact"]},{"w":"make sense","taboo":["logical","understand","reason"]},{"w":"by accident","taboo":["plan","mistake","luck"]},{"w":"according to","taboo":["say","source","expert"]},{"w":"have no idea","taboo":["know","answer","clue"]},{"w":"make a discovery","taboo":["find","new","scientist"]},{"w":"be famous for","taboo":["known","popular","celebrity"]}]}],"ex":{"gap":{"items":[{"s":"I didn't know the word 'pulpo' in English, so I ___ in a dictionary.","a":"looked it up"},{"s":"Penicillin was discovered ___. Alexander Fleming wasn't looking for it.","a":"by accident"},{"s":"___ NASA, a day on Venus is longer than a year on Venus.","a":"According to"},{"s":"___, bananas are berries, but strawberries aren't!","a":"Believe it or not"},{"s":"Can you explain it again? It doesn't ___ to me.","a":"make sense"},{"s":"Who ___ the idea for sticky notes?","a":"came up with"}]},"match":{"pairs":[["find out","discover information"],["look up","search for information in a book or online"],["come up with","think of an idea"],["by accident","without planning it"],["have no idea","not know at all"],["make sense","be logical and easy to understand"]]},"fix":{"items":[{"s":"I'm very interested on space and planets.","wrong":"interested on","fix":"interested in"},{"s":"According with scientists, octopuses have three hearts.","wrong":"According with","fix":"According to"},{"s":"Scientists did an important discovery in the Atacama Desert.","wrong":"did an important discovery","fix":"made an important discovery"},{"s":"I didn't have idea that bananas are berries!","wrong":"didn't have idea","fix":"had no idea"}]}},"rec":{"prompt":"Tell us about a surprising fact you know. How did you find out about it, and why do you think it's interesting?","model":"A few months ago, I found out something amazing about my own country. Believe it or not, some parts of the Atacama Desert almost never get rain. I read that some weather stations there have never recorded a single drop! At first I thought it was a joke, so I looked it up, and it's true. When you read the explanation, it makes sense: the Andes block the rain from the east, and the cold ocean on the west keeps the air dry. I think it's interesting because I live in Chile, and I had no idea!","use":["find out","believe it or not","look up","make sense"]},"tips":[{"who":"teacher","t":"Before the Taboo game, model one card yourself. Give teams 30 seconds per card and keep score on the screen to make it competitive."},{"who":"student","t":"Keep a 'fun facts' note on your phone. When you learn something new, write one sentence starting with 'Believe it or not…' or 'I found out that…' and tell it to someone that week."},{"who":"student","t":"When someone tells you a fact, don't just say 'Ah, OK.' React with a phrase and ask a follow-up question. It keeps the conversation going."}]},{"id":"b2-curious","lv":"B2","tp":"curious","title":"Weird & Wonderful World","img":1462636,"goals":["talk about strange facts and common myths using idioms like the tip of the iceberg and once in a blue moon","speculate about the causes of mysteries with phrases like 'My best guess is…'","use weak forms (of, to, than) to sound more fluent"],"warm":["What's the strangest thing you've ever seen?","Do you like mysteries or do you always look for an explanation?","Which animal fascinates you most?","Is there a 'fact' you believed as a child that turned out to be false?"],"model":{"kind":"text","title":"Things I Got Wrong for Years","intro":"A blog post by Camila, a science teacher from Valparaíso who writes about curious facts.","paras":["Last weekend I was cleaning out my closet when I [[came across]] my old high school science notebook. It was full of 'amazing facts' that I used to repeat to anyone who would listen. Reading it again, I realized that a lot of them [[turned out]] to be completely false.","Take the Great Wall of China. It's [[a common myth]] that you can easily see it from space. Astronauts say it's almost impossible to spot with the naked eye: it's very long, but far too narrow. Or goldfish: [[contrary to]] popular belief, they don't have a three-second memory. Studies show they can remember things for months.","My notebook also claimed that bats are blind (they aren't; many species see quite well) and that bulls hate the color red. In fact, bulls can't even see red very well. It's the movement of the cape that makes them charge.","But here's [[a little-known fact]] that wasn't in my notebook, and I still can't [[wrap my head around]] it: sharks have been around longer than trees. Honestly, the more I read, the more I realize that what I know is just [[the tip of the iceberg]]. [[Truth is stranger than fiction]], and much more fun."],"questions":[{"q":"How did Camila find her old notebook?","opts":["She was looking for it for a class.","She found it by chance while cleaning.","An old classmate sent it to her."],"a":1},{"q":"Why do bulls charge at the cape?","opts":["Because it's red","Because they're blind","Because it moves"],"a":2},{"q":"Which of these is TRUE, according to the post?","opts":["Sharks are older than trees.","Bats can't see.","Goldfish forget everything in three seconds."],"a":0}]},"lang":[{"e":"come across","t":"PV","d":"to find something by chance","x":"I came across a weird documentary last night.","s":"come aCROSS"},{"e":"figure out","t":"PV","d":"to understand or solve something","x":"Scientists still can't figure out why we dream.","s":"figure OUT"},{"e":"turn out","t":"PV","d":"to be discovered to be; to end up being","x":"The 'monster' turned out to be a log.","s":"turn OUT"},{"e":"once in a blue moon","t":"ID","d":"very rarely","x":"I watch horror movies once in a blue moon.","s":"once in a BLUE MOON"},{"e":"the tip of the iceberg","t":"ID","d":"a small part of a much bigger thing","x":"What we know about the ocean is just the tip of the iceberg.","s":"the TIP of the ICEberg"},{"e":"wrap your head around","t":"ID","d":"to understand something difficult or hard to believe (informal)","x":"I still can't wrap my head around the fact that sharks are older than trees.","s":"WRAP your HEAD aROUND","uk":"UK: get your head around"},{"e":"truth is stranger than fiction","t":"ID","d":"real life can be more surprising than invented stories","x":"No one would believe that story in a movie. Truth really is stranger than fiction.","s":"TRUTH is STRANGer than FICtion"},{"e":"mind-blowing","t":"COL","d":"extremely surprising or impressive","x":"The size of the universe is mind-blowing.","s":"MIND-blowing"},{"e":"a common myth","t":"COL","d":"a false idea that many people believe","x":"It's a common myth that we only use 10% of our brain.","s":"a COMmon MYTH"},{"e":"a little-known fact","t":"COL","d":"something true that very few people know","x":"A little-known fact: Cleopatra lived closer in time to the moon landing than to the building of the Great Pyramid.","s":"a LITtle-known FACT"},{"e":"contrary to","t":"PREP","d":"opposite to; different from","x":"Contrary to popular belief, goldfish have good memories.","s":"CONtrary to"},{"e":"for no apparent reason","t":"PREP","d":"without any clear cause","x":"Sometimes my cat runs around the house at night for no apparent reason.","s":"for NO apPARent REAson"}],"func":{"title":"Speculating about causes","when":"Use these when you don't know the answer for sure but want to give your best guess.","phrases":[{"p":"My best guess is that…","use":"giving your most likely explanation"},{"p":"It might have something to do with…","use":"suggesting a possible cause"},{"p":"I'd say it's probably because…","use":"a fairly confident guess"},{"p":"It could be that…","use":"offering one possible explanation"},{"p":"I'm pretty sure that…","use":"strong certainty (informal)"},{"p":"I may be wrong, but…","use":"softening your guess"},{"p":"That would explain why…","use":"connecting a guess to the facts"},{"p":"I doubt it, because…","use":"saying something is unlikely"},{"p":"There's no way that…","use":"saying something is impossible (informal)"},{"p":"Your guess is as good as mine.","use":"admitting you really don't know"}],"task":"Mystery questions: Student A asks a 'Why…?' question (Why do cats purr? Why do we yawn? Why do zebras have stripes? Why is the ocean salty?). Student B speculates for one minute using at least four phrases. Then swap. At the end, check online: did your guesses turn out to be right? Some answers are still a mystery!"},"pron":{"focus":"Weak forms: of, to, a, than","explain":"In natural speech, small grammar words are usually unstressed and pronounced with the weak vowel /ə/ (schwa): 'of' sounds like /əv/, 'to' like /tə/ and 'than' like /ðən/. The important content words are stressed, so they're longer and louder.","tip":"Tap the table on each stressed syllable. The weak words should squeeze in between the taps, quickly and quietly.","lines":[{"t":"It's just the tip of the iceberg.","m":"It's JUST the TIP of the ICEberg."},{"t":"It turned out to be a log.","m":"It TURNED‿OUT to be a LOG."},{"t":"Sharks are older than trees.","m":"SHARKS are OLDer than TREES."},{"t":"Contrary to popular belief, goldfish have good memories.","m":"CONtrary to POPular beLIEF, | GOLDfish have GOOD MEMories."},{"t":"I watch horror movies once in a blue moon.","m":"I WATCH HORror MOVies once in a BLUE MOON."}]},"acts":[{"type":"roulette","items":["What's the most mind-blowing fact you know?","What common myth did you believe for years?","What mystery would you like scientists to figure out?","What's something you do once in a blue moon?","Which documentary would you recommend?","Contrary to popular belief, what is true about your country?","What's a weird habit you have?","Which unexplained phenomenon interests you?"]},{"type":"wyr","items":[["Speak every language","Know every fact in history"],["Explore the deep ocean","Explore space"],["Discover a new animal","Discover a new planet"],["Know the truth about one mystery","Live in a world full of mysteries"],["Be a famous scientist","Be a famous explorer"],["Read minds for a day","Be invisible for a day"]]},{"type":"podcast","title":"The Weird & Wonderful Podcast","segments":["Intro (30 seconds): welcome your listeners and introduce the hosts.","Myth-busting: each host shares a common myth and explains what turned out to be true.","Mind-blowing fact of the week: one host shares a little-known fact; the others react and speculate about why it happens.","Listener question: answer a 'Why…?' question (e.g., 'Why do we get goosebumps?'). If you're not sure, speculate!","Wrap-up: recommend a documentary, book or channel and say goodbye."]}],"ex":{"gap":{"items":[{"s":"I ___ a fascinating article about deep-sea creatures while I was looking for something else.","a":"came across"},{"s":"The strange noise in the attic ___ to be a family of squirrels.","a":"turned out"},{"s":"It's ___ that goldfish only remember things for three seconds. In fact, they can remember things for months.","a":"a common myth"},{"s":"___ popular belief, bats aren't blind.","a":"Contrary to"},{"s":"I only go to the movies ___, maybe once a year.","a":"once in a blue moon"},{"s":"I've read the instructions three times, and I still can't ___ how this thing works.","a":"figure out"}]},"match":{"pairs":[["once in a blue moon","very rarely"],["the tip of the iceberg","a small part of a much bigger thing"],["come across","find by chance"],["mind-blowing","extremely surprising"],["wrap your head around","understand something hard to believe"],["for no apparent reason","without any clear cause"]]},"fix":{"items":[{"s":"Contrary of popular belief, bats can see quite well.","wrong":"Contrary of","fix":"Contrary to"},{"s":"The story turned out be completely false.","wrong":"turned out be","fix":"turned out to be"},{"s":"I came across with an interesting video yesterday.","wrong":"came across with","fix":"came across"},{"s":"It's a common myth that you can see the Great Wall from the space.","wrong":"from the space","fix":"from space"}]}},"rec":{"prompt":"Talk about a myth or 'fact' you believed for a long time. When did you find out the truth, and how did you react?","model":"When I was a kid, my grandmother never let us swim for an hour after lunch. She said we'd get a cramp and drown. It's a common myth in a lot of countries, and I believed it until I was about thirty. Then I came across an article about it, and it turned out there's no real evidence for it. Contrary to what my grandmother thought, a sandwich won't make you sink! Honestly, I was a little disappointed, because I'd spent so many summers sitting by the pool, waiting. Now I swim whenever I want, but I can still hear her voice in my head.","use":["a common myth","come across","turn out","contrary to"]},"tips":[{"who":"teacher","t":"For the podcast, give groups 8 minutes to plan and 4 minutes to record on a phone. Play one episode to the class and ask listeners to note every lesson expression they hear."},{"who":"student","t":"Fact-check before you share. When someone tells you a surprising 'fact', look it up, then tell them what it turned out to be, starting with 'Contrary to popular belief…'."},{"who":"student","t":"Once a week, watch a short science video in English. Retell one mind-blowing fact in your own words in 30 seconds, without looking at your notes."}]},{"id":"c1-curious","lv":"C1","tp":"curious","title":"Science, Myths & Conspiracies","img":1427572,"goals":["discuss science, myths and conspiracy theories with precise idioms such as shed light on and a grain of truth","challenge claims diplomatically and ask for evidence","use contrastive stress to correct and clarify ideas"],"warm":["Why do people believe in conspiracy theories?","How do you check if information is true?","Is science always right?","Why do some myths survive even after they've been proven false?"],"model":{"kind":"text","title":"Why Smart People Believe Strange Things","intro":"An extract from a popular-science newsletter written by a psychology researcher.","paras":["It's tempting to assume that only gullible people [[buy into]] conspiracy theories, but the research tells a more uncomfortable story. Our brains are pattern-seeking machines, which is usually a strength. The catch is that we also see patterns where none exist, and we [[jump to conclusions]] when an event feels too big to have a simple cause. Psychologists call this 'proportionality bias': a dramatic event, we feel, must have an equally dramatic explanation.","Most myths also contain [[a grain of truth]], which is precisely what makes them persuasive. Governments and corporations have, at times, kept secrets, and those real scandals [[lend credence to]] stories that are wildly [[far-fetched]]. Take the claim that the moon landings were staged. It doesn't [[hold up]] for a moment (scientists still bounce lasers off reflectors that Apollo astronauts left on the lunar surface), yet it has survived for decades.","Why? Partly because simply [[debunking a theory]] rarely works on its own. People who feel ridiculed tend to cling to their beliefs, even [[in the face of]] overwhelming evidence.","So what's the alternative? When a viral claim seems too neat, [[take it with a grain of salt]], ask who benefits, and don't [[rule out]] the boring explanation. [[In light of]] what we now know about the brain, the healthiest attitude may be curiosity rather than certainty: the kind that welcomes any study that [[sheds light on]] how we think."],"questions":[{"q":"What is 'proportionality bias', according to the text?","opts":["The feeling that big events must have big causes","The habit of trusting only experts","The tendency to forget evidence over time"],"a":0},{"q":"Why does the writer mention the reflectors on the moon?","opts":["To explain how lasers work","As evidence that the moon landings really happened","To show that scientists also keep secrets"],"a":1},{"q":"What does the writer recommend?","opts":["Ignoring conspiracy theories completely","Laughing at people who believe them","Staying curious and checking claims carefully"],"a":2}]},"lang":[{"e":"buy into","t":"PV","d":"to believe an idea completely","x":"I don't buy into conspiracy theories.","s":"BUY INto"},{"e":"rule out","t":"PV","d":"to decide that something is not possible","x":"Scientists haven't ruled out life on other planets.","s":"rule OUT"},{"e":"hold up","t":"PV","d":"(of an argument or theory) to stay convincing when it is tested","x":"It's a clever theory, but it doesn't hold up under scrutiny.","s":"hold UP"},{"e":"jump to conclusions","t":"ID","d":"to decide something too quickly, without all the facts","x":"Don't jump to conclusions before you see the data.","s":"jump to conCLUsions"},{"e":"shed light on","t":"ID","d":"to help explain something","x":"New research sheds light on how memory works.","s":"SHED LIGHT on"},{"e":"a grain of truth","t":"ID","d":"a small amount of truth","x":"There's a grain of truth in most legends.","s":"a GRAIN of TRUTH"},{"e":"take something with a grain of salt","t":"ID","d":"to not completely believe something","x":"I take anything I read on social media with a grain of salt.","s":"TAKE something with a GRAIN of SALT","uk":"UK: take something with a pinch of salt"},{"e":"debunk a theory","t":"COL","d":"to show that an idea is false","x":"The study completely debunked the theory.","s":"deBUNK a THEOry"},{"e":"far-fetched","t":"COL","d":"difficult to believe","x":"The idea that the moon landing was fake is far-fetched.","s":"FAR-FETCHED"},{"e":"lend credence to","t":"COL","d":"to make an idea seem more likely to be true","x":"The discovery of feathered dinosaurs lent credence to the theory that birds evolved from dinosaurs.","s":"LEND CREDence to"},{"e":"in light of","t":"PREP","d":"considering new information","x":"In light of new evidence, the theory changed.","s":"in LIGHT of","uk":"UK: in the light of"},{"e":"in the face of","t":"PREP","d":"despite having to deal with something difficult","x":"Some people cling to their beliefs even in the face of overwhelming evidence.","s":"in the FACE of"}],"func":{"title":"Challenging claims and asking for evidence","when":"Use these in discussions when someone makes a claim you're not sure about, to question it without sounding rude.","phrases":[{"p":"What's that based on?","use":"asking for the source politely"},{"p":"Is there any hard evidence for that?","use":"asking for proof"},{"p":"I'm not entirely convinced.","use":"soft disagreement"},{"p":"That seems like a bit of a leap.","use":"pointing out weak logic"},{"p":"Correlation doesn't necessarily mean causation.","use":"challenging a cause-and-effect claim"},{"p":"Couldn't there be a simpler explanation?","use":"offering an alternative"},{"p":"I'd want to see the data before drawing any conclusions.","use":"suspending judgment"},{"p":"Let's not get ahead of ourselves.","use":"slowing down a hasty conclusion"},{"p":"To be fair, there may be something to that.","use":"partly accepting a claim"},{"p":"Where did you come across that?","use":"asking for the source casually"}],"task":"Student A chooses a popular claim (e.g., 'Full moons make people behave strangely,' 'Cracking your knuckles causes arthritis,' 'Sugar makes children hyperactive') and defends it for two minutes. Student B challenges it with at least four phrases. At the end, A admits which parts hold up and which don't. Then swap with a new claim."},"pron":{"focus":"Contrastive stress","explain":"To correct or challenge an idea, we put extra stress on the word that carries the contrast, even if it is a word that is normally unstressed. Moving the stress changes the meaning: 'I didn't say it was FALSE' (I said something else about it) is different from 'I didn't SAY it was false' (but maybe I implied it).","tip":"Before you speak, decide which word carries the contrast and make it louder, longer and higher. Keep the rest of the sentence low and quick so the contrast stands out.","lines":[{"t":"It's not that the theory is wrong, it's that it's incomplete.","m":"It's NOT that the theory is WRONG, | it's that it's inCOMplete."},{"t":"I didn't say it was false; I said it was far-fetched.","m":"I didn't say it was FALSE; | I said it was FAR-FETCHED."},{"t":"There's a grain of truth in it, not the whole truth.","m":"There's a GRAIN of truth in it, | not the WHOLE truth."},{"t":"We haven't ruled it out; we just haven't proven it.","m":"We haven't RULED it OUT; | we just haven't PROVen it."},{"t":"Is that based on evidence, or on a feeling?","m":"Is that based on EVidence, ↗ | or on a FEELing? ↘"}]},"acts":[{"type":"picture","prompts":["Describe what you can see.","Who built it and why? Speculate (It might have been… / They may have…).","Why do places like this inspire so many theories?","Which explanations seem far-fetched to you?"]},{"type":"story","starters":["Scientists couldn't rule out the possibility that…","At first it seemed far-fetched, but there was a grain of truth…","Everyone jumped to conclusions when…","A new discovery shed light on an old mystery…"]},{"type":"expert","topic":"Why do conspiracy theories spread, and what can we do about them?","expert":"You are a researcher who studies misinformation. Explain why intelligent people buy into conspiracy theories, which ideas are far-fetched and which contain a grain of truth, and what individuals and platforms can realistically do. Use evidence, stay calm under pressure and admit what science can't rule out.","journalists":"You are journalists from very different outlets: a science magazine, a celebrity gossip website and a radio talk show. Ask tough follow-up questions, challenge vague answers with the functional phrases, and try to get one clear quote for your headline.","questions":["Some 'conspiracy theories' later turned out to be true. How can ordinary people tell the difference?","Isn't calling someone a 'conspiracy theorist' just a way to shut down debate?","Why do educated, intelligent people buy into far-fetched ideas?","Should social media platforms remove false content, or does that make people even more suspicious?","In light of how easily AI can create fake images and videos, will we ever be able to trust what we see?","What's one myth you believed yourself, and what changed your mind?"]}],"ex":{"gap":{"items":[{"s":"Investigators haven't ___ the possibility that the fire was started on purpose.","a":"ruled out"},{"s":"I don't ___ the idea that the pyramids were built by aliens.","a":"buy into"},{"s":"Most urban legends contain ___, which is why they're so believable.","a":"a grain of truth"},{"s":"These newly discovered letters ___ daily life in colonial Santiago.","a":"shed light on"},{"s":"___ the new evidence, the museum changed the label on the exhibit.","a":"In light of"},{"s":"Fact-checkers quickly ___ the viral claim by showing that the photo had been edited.","a":"debunked"}]},"match":{"pairs":[["jump to conclusions","decide something too quickly, without all the facts"],["far-fetched","very difficult to believe"],["take something with a grain of salt","not believe something completely"],["lend credence to","make an idea seem more believable"],["hold up","stay convincing when examined closely"],["in the face of","despite (something difficult)"]]},"fix":{"items":[{"s":"Scientists haven't ruled out of the possibility of life on Mars.","wrong":"ruled out of","fix":"ruled out"},{"s":"I don't buy in conspiracy theories.","wrong":"buy in","fix":"buy into"},{"s":"This research sheds a light on how memory works.","wrong":"sheds a light on","fix":"sheds light on"},{"s":"Let's not jump to the conclusions before we see the data.","wrong":"jump to the conclusions","fix":"jump to conclusions"}]}},"rec":{"prompt":"Choose a popular myth or conspiracy theory. Why do you think people buy into it, and what would it take to change their minds?","model":"A lot of people buy into the idea that a full moon makes people behave strangely. Nurses and police officers often swear that their shifts are crazier on those nights. Large studies, however, haven't found any consistent effect, so the theory is pretty far-fetched. If there's a grain of truth, it's probably in how memory works: on a chaotic night, people notice the full moon and link the two, but they forget all the calm full-moon nights. I think the belief survives even in the face of the data because
