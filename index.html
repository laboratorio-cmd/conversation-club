","Will people need to keep learning new skills throughout their lives in the future?"]},{"topic":"Describe a decision that changed the direction of your life.","bullets":["what the decision was","when you made it","what other options you had","who helped you decide"],"end":"and explain how you feel about the decision now.","model":"The hardest decision I've ever made was to drop out of law school in my third year and start over in graphic design. I was twenty-one at the time, and it felt like the end of the world. The problem was that I had chosen law mainly because my parents expected it. My father is a lawyer, and I think everyone assumed I would eventually join his firm. I did reasonably well in my classes, but I was miserable. Meanwhile, I was spending every free moment drawing and designing posters for student events. My options were basically to stay, finish the degree, and hope I'd learn to like it, or to leave and start from scratch, which meant losing three years and, honestly, disappointing my family. I talked to a lot of people about it. My friends mostly told me to follow my instincts, but the person who really helped was a professor I trusted, who asked me a simple question: “Can you imagine doing this for the next forty years?” I realized the answer was no. Telling my parents was terrible. My father barely spoke to me for weeks. But looking back now, I'm absolutely sure it was the right choice. I love my work, and my father has completely changed his mind. In fact, he now proudly shows his clients the logo I designed for his firm.","p3":["Should young people choose a career based on passion or on job security?","How much should parents influence their children's important decisions?","Why do some people find it so hard to make decisions?","Do people today have too many choices in their lives?","Are decisions made by groups usually better than decisions made by one person?"]},{"topic":"Describe a change you helped to introduce at work or school.","bullets":["what the change was","why it was needed","what your role was","how people reacted to it"],"end":"and explain whether you think it was a success.","model":"A few years ago, I was part of a team that had to replace the paper forms our sales department used with a digital system. I work for a mid-sized company that sells farm equipment, and until then, salespeople filled out every order by hand and sent everything to the office at the end of the week, which caused endless mistakes and delays. There were five of us on the team: two people from IT, someone from sales, someone from accounting, and me. I was the project coordinator, which mostly meant organizing meetings, keeping track of deadlines, and making sure everyone was actually talking to each other. The biggest challenge wasn't technical at all. It was convincing the sales team to use the new system. Some of them had been doing things the same way for twenty years and were pretty resistant, so at first they kept sending paper forms anyway. What finally worked was asking a couple of the most respected salespeople to test the app early and give us feedback. Once they were on board, the others followed. Overall, I'd say the project was a success, although it took about three months longer than planned. Mistakes in orders dropped dramatically, and people now get their commissions much faster. Personally, I learned that managing people's expectations is often harder, and more important, than managing the technology itself.","p3":["Why do people often resist change at work?","What makes some teams work better together than others?","Is it better for a team to have one strong leader or to share decisions equally?","Should older workers get extra support when new technology is introduced?","Is it better to introduce big changes at work gradually or all at once?"]},{"topic":"Describe a job you would like to try for a while, just for the experience.","bullets":["what the job is","what it involves","what skills or training you would need","how you could get started"],"end":"and explain why this job appeals to you.","model":"If I could try a completely different job for a while, I'd love to work as a tour guide in Valparaíso. I currently work in accounting, which I don't dislike, but I spend most of my day in front of a spreadsheet, so this would be a big change. A tour guide there mainly takes groups of visitors around the hills of the old city, explaining the history of the port, the architecture, and of course the street art, which is what most tourists come to see. It would also involve a lot of walking, answering questions, recommending restaurants, and sometimes dealing with people who are tired or bored. In terms of skills, I'd definitely need to improve my English, and maybe learn some Portuguese, because there are lots of Brazilian visitors. I'd also have to study the history of the city in much more depth. As far as I know, there are short training courses for tour guides, and I think you also need some kind of official registration, though I'm not sure about the details. The easiest way to get started would probably be to volunteer with one of the free walking tours on weekends, just to see if I actually enjoy it. What appeals to me most is the idea of sharing a place I love with people from all over the world. I'm a very sociable person, and I think I'd find it much more rewarding than looking at numbers all day.","p3":["What jobs do you think will become more popular in the next twenty years?","Is it a good idea for people to change careers in the middle of their working lives?","Why do some people stay in jobs they don't enjoy?","How important is it for young people to get work experience before they finish their studies?","Is tourism a good industry for a country to depend on? Why or why not?"]},{"topic":"Describe a small habit you have that helps the environment.","bullets":["what you do","when you started doing it","how easy or difficult it is","whether other people around you do the same"],"end":"and explain why you think it is worth doing.","model":"Something I do to help the environment is composting my food waste. It might not sound very exciting, but it's become a real habit in our home. I started a few years ago, during the pandemic, when I was spending much more time at home and began to notice how much garbage we produced. I was shocked to see that almost half of it was fruit and vegetable peels, coffee grounds, and things like that. So I bought a compost bin, watched a few videos online, and set it up in a corner of our small backyard. Honestly, it was a bit difficult at the beginning. The first batch smelled terrible, because I didn't know you have to balance wet kitchen waste with dry things like leaves or cardboard. But once I figured that out, it became really easy. Now it takes me maybe five minutes a day, and every few months I get rich soil that I use for my plants and a small vegetable garden. As for other people, my neighbors were curious at first, and now two of them do it too. Our city government also started giving out free compost bins last year, which is encouraging. I think it's worth doing because it makes a real difference to the amount of garbage we throw away. And I like the idea that our waste becomes something useful instead of ending up in a landfill.","p3":["What are the biggest environmental problems in your country?","Should governments force people to recycle, or should it be voluntary?","Can individual actions really make a difference to the environment?","Who should pay to clean up pollution: companies, governments, or consumers?","How can schools encourage children to care about the environment?"]},{"topic":"Describe a documentary or TV program that changed one of your habits.","bullets":["what it was about","when and where you watched it","who you watched it with","what habit it changed"],"end":"and explain why it had such an effect on you.","model":"I'd like to talk about a documentary I watched last year about how social media apps are designed. I don't remember the exact title, but basically it interviewed former employees of big tech companies, who explained how features like endless scrolling and notifications are designed to keep us on our phones for as long as possible. I watched it at home on a streaming platform with my partner one Sunday evening. We'd chosen it almost by accident, because we couldn't agree on anything else, and we both expected it to be a bit boring. It turned out to be really eye-opening. The idea that stuck with me most was that if a service is free, then in a way we're the product, because our attention is what's being sold to advertisers. It also made me think about my own habits. That night, I checked my screen time for the first time and was honestly embarrassed: I was spending nearly four hours a day on my phone, mostly on things I couldn't even remember afterward. I think it affected me so much because it described my own behavior so precisely. I'd always assumed I was in control of how I used my phone, and the documentary made me realize that wasn't really true. Since then, I've turned off most notifications and deleted a couple of apps, and although I'm far from perfect, I feel calmer and I'm reading a lot more.","p3":["Why do you think documentaries have become so popular in recent years?","Can movies and series change the way people think about important issues?","Should there be stricter rules about what can be shown on streaming platforms?","How has streaming changed the way families spend their evenings?","Do you think people today have shorter attention spans than in the past?"]},{"topic":"Describe a time when someone's advice made a real difference to you.","bullets":["who gave you the advice","what situation you were in","what they told you","what you did afterward"],"end":"and explain why you think it was good advice.","model":"The best advice I've ever received came from my first boss, a woman named Isabel, when I started working at a marketing agency straight out of college. I was twenty-three, very nervous, and desperate to look competent. During my first couple of weeks, I made the mistake of pretending to understand things when I didn't. I'd nod in meetings, then spend hours afterward trying to figure out what people had meant. One day, I turned in a report that was completely off target, because I had misunderstood what the client wanted. Instead of getting angry, Isabel called me into her office and said something I've never forgotten: “Nobody expects you to know everything. I expect you to ask.” She also told me that a five-minute question can save five hours of work. I did follow her advice, although not immediately. It took me a while to feel comfortable admitting that I didn't know something, especially in front of more experienced colleagues. But gradually, I started asking questions earlier, and my work improved a lot. I think it was good advice because it applies to almost every situation, not just work. Pretending to understand only protects your ego for a moment, but asking helps you learn. Now that I supervise younger people myself, I find myself repeating her words almost exactly, and I always make a point of telling new team members that no question is too basic.","p3":["Who do young people usually go to for advice in your country?","Is it better to get advice from friends or from experts?","Why do some people find it difficult to accept advice?","Do you think people trust advice they find on the internet too easily?","What qualities make someone a good mentor?"]},{"topic":"Describe a time when you saw wild animals in their natural habitat.","bullets":["where you were","what animals you saw","what they were doing","who you were with"],"end":"and explain how you felt about the experience.","model":"A couple of summers ago, I went to Chiloé Island, in the south of Chile, with my parents, and one day we took a small boat trip to see a penguin colony on the west coast. I'd seen penguins in zoos before, but never in their natural habitat, so I was really excited. The boat left from a beach early in the morning, and the sea was pretty rough, which made my mother a little nervous. After a short ride, we reached some small rocky islands, and suddenly there they were: hundreds of penguins standing on the rocks, some of them diving into the water, others just lying in the sun. The guide explained that two different species nest there, which is apparently quite unusual. We also saw sea lions sleeping in a big pile, and at one point, a group of dolphins swam right next to our boat. What I loved was how natural it all was. The animals completely ignored us. The guide was very strict about keeping our distance and not making noise, which I appreciated, because it felt respectful rather than like a show. I felt incredibly lucky, and a bit emotional, to be honest. It reminded me how much wildlife we have in our country that most of us never see. It also made me think about how fragile these places are, because the guide told us the colony is threatened by pollution. Since then, I've become much more interested in protecting marine life.","p3":["Why are people so fascinated by wild animals?","Is it acceptable to keep wild animals in zoos? Why or why not?","Do nature documentaries help people care more about wildlife?","Is enough being done to protect endangered species in your country?","How has human activity affected wildlife in your region?"]}],"criteria":[{"name":"Fluency and Coherence","what":"Can you keep talking at a natural pace, and is your answer easy to follow? The examiner notices whether your ideas connect logically, whether you develop them beyond one sentence, and whether your pauses are for thinking about ideas (normal) or for searching for basic words (a problem).","tips":["Extend every answer with a reason, an example, or a comparison instead of stopping after one sentence.","Use linking phrases naturally, such as “the thing is,” “on top of that,” “that's why,” and “having said that,” but don't force one into every sentence.","If you need a moment, use a natural filler such as “That's an interesting question; let me think…” instead of silence.","Avoid memorized answers. They usually sound unnatural, and examiners are trained to notice them."]},{"name":"Lexical Resource","what":"This is about the range and precision of your vocabulary: whether you can talk about many different topics, use some less common words and natural expressions correctly, and explain something in another way when you don't know the exact word.","tips":["Learn words in chunks (collocations) such as “make a decision,” “heavy traffic,” or “a tough call,” not as single words.","Paraphrase the question instead of repeating it word for word.","If you forget a word, describe it (“the thing you use to…”) and keep going.","Watch out for false friends from Spanish: “actually” means “en realidad,” “assist” means “ayudar,” and “embarrassed” has nothing to do with “embarazada.”"]},{"name":"Grammatical Range and Accuracy","what":"The examiner wants to hear a mix of simple and complex sentences, using different tenses, conditionals, and relative clauses, and to see that most of your sentences are free of errors, especially errors that make your meaning unclear.","tips":["Match the tense to the question: past tenses for stories, the present perfect for life experience, and “would” for hypothetical questions.","Practice a few complex structures until they feel natural: “What I like most is…,” “If I had known…, I would have…,” “It was the first time I'd ever…”","Check typical errors for Spanish speakers: missing subjects (“Is very nice” → “It's very nice”), “people is” → “people are,” and the missing -s in “she work.”"]},{"name":"Pronunciation","what":"This covers how easy you are to understand: individual sounds, word stress, sentence stress, intonation, and rhythm. An accent is perfectly fine; what matters is that the listener doesn't have to work hard to follow you.","tips":["Don't add an “e” before words that start with s + consonant: say “Spain,” “study,” and “school,” not “Espain,” “estudy,” and “eschool.”","Pronounce -ed endings correctly: “worked” sounds like “workt,” “played” like “playd,” and only words like “wanted” or “needed” get an extra syllable.","Stress the important words in a sentence and let the small words (a, the, to, of) be quick and light.","Record yourself, then compare your rhythm and intonation with a model answer read aloud."]}],"tips":["Part 1: answer directly, then add one or two extra sentences, such as a reason, an example, or a contrast with the past. One-word answers don't show your level, but you don't need to give a speech either.","Part 2: use the full minute of preparation to write key words for each bullet point, not full sentences. A few words per bullet are enough to keep you on track.","Part 2: keep talking until the examiner stops you. If you run out of ideas, add a short story, a specific detail, or explain how you feel about it now.","Part 2: cover all the bullet points, but give the final “explain” part plenty of time. It's where you can show your best vocabulary and more complex ideas.","Part 3: develop your opinions. Give your view, explain why, add an example, and, if possible, mention another side (“Having said that, some people might argue…”).","It's a language test, not a knowledge test. You can invent details for your stories, and your opinions are never marked right or wrong, only the English you use to express them.","If you don't understand a question, ask: “Sorry, could you repeat the question?” It's much better than answering a question you weren't asked.","Practice under exam conditions: time yourself, record your answers, and listen back for long pauses, repeated words, and grammar slips you can fix next time."]},"toefl":{"repeat":[{"context":"A tour of the campus library","sentences":["The library is open every day.","Please switch your phone to silent mode.","The quiet study area is on the top floor.","Students can borrow laptops at the front desk for free.","If you can't find the book you need, ask a librarian for help.","Food isn't allowed inside, but you can bring water in a bottle with a lid.","Group study rooms can be reserved online, but they fill up quickly near the end of the semester."]},{"context":"First visit to the campus fitness center","sentences":["Welcome to the fitness center.","Please bring a towel to every workout.","You'll find free lockers next to the showers.","Please wipe down each machine when you're finished using it.","Our trainers are happy to show you how to use the equipment safely.","Yoga and dance classes are free, but you need to sign up in advance.","The gym gets really crowded in the late afternoon, so try to come earlier if you can."]},{"context":"Moving into the residence hall","sentences":["Moving day can be very busy.","You can pick up your key downstairs.","Every floor has a shared kitchen and laundry room.","Please be considerate and keep the noise down late at night.","If something in your room is broken, you can report it online.","Visitors are welcome during the day, but they need to sign in at the entrance.","Your resident advisor lives on your floor and can help if you have problems with a roommate."]},{"context":"Safety rules in the chemistry lab","sentences":["Please read the safety rules carefully.","Always wear safety glasses in the lab.","Long hair should be tied back at all times.","Never eat or drink anything while you're working in here.","If you spill anything at all, let your instructor know right away.","You'll find the emergency shower and the fire blanket right next to the back door.","Before you leave, please wash your hands and make sure your workspace is clean for the next class."]},{"context":"Lunchtime at the campus cafeteria","sentences":["Lunch is now being served.","Today's special is vegetable soup with bread.","You can pay with cash or your student card.","All the vegetarian options are marked with a green leaf.","If you have a food allergy, please tell the staff before you order.","Students who bring their own reusable cup get a discount on any hot drink.","If you're in a hurry, you can order ahead on the campus app and skip the line."]},{"context":"An introduction to the career center","sentences":["Our office helps students find jobs.","You can book appointments on our website.","An advisor can help you with your cover letter.","Every week we post new internships on the student job board.","You can also practice job interviews with a member of our team.","Local companies visit campus every spring to meet students and talk about open positions.","It's a good idea to start visiting us early, not just a few weeks before you graduate."]}],"interview":[{"topic":"Learning new skills","qs":["Tell me about a skill you've learned recently outside of school or work. How did you learn it?","Do you prefer learning new things on your own, or with a teacher or a group? Why?","Some people believe adults should spend part of their free time learning something new. Do you agree? Why or why not?","If your employer offered to pay for any course you wanted, what would you choose to study, and why?"],"model":"Last year, I taught myself to bake bread, which I'd always wanted to try. At first, I just followed videos online, but my first few loaves were a disaster, flat and really heavy. Then a friend who bakes gave me some sourdough starter and showed me how to knead the dough properly, and that made a huge difference. Now I bake almost every weekend, and I've even started experimenting with seeds and whole wheat flour. What I like most is that it forces me to be patient, which isn't one of my natural strengths."},{"topic":"Working and studying from home","qs":["Have you ever worked or studied from home? What was that experience like for you?","What do you find most difficult about staying focused when you're at home?","Some companies want their employees to return to the office full-time. Do you think that's a good idea? Why or why not?","If you could design the perfect weekly schedule for your work or studies, what would it look like?"],"model":"Yes, during the pandemic I worked from home for almost two years, and I still do it twice a week. At the beginning, I loved it. I saved over an hour of commuting every day, and I could have lunch with my family. But after a few months, I started to feel isolated, and the line between work and personal time just disappeared. I'd find myself answering emails at ten at night. Now I have a separate corner for working, and I try to close my laptop at six, which has helped a lot."},{"topic":"Getting around the city","qs":["How do you usually get around your city, and how do you feel about it?","Can you describe a time when you had trouble getting somewhere on time? What happened?","Some people say cities should charge drivers a fee to enter the downtown area. What's your opinion?","If you were in charge of transportation in your city, what's the first thing you would change, and why?"],"model":"I usually take the metro to work, and on weekends I walk or ride my bike. The metro is fast and fairly cheap, but during rush hour it's so crowded that sometimes I have to let two or three trains go by before I can get on. Still, I prefer it to driving, because traffic in my city is terrible and parking is expensive. On weekends, I really enjoy cycling, since there are many more bike lanes than there were a few years ago, and it's a nice way to discover different neighborhoods."},{"topic":"Online shopping","qs":["What's the last thing you bought online, and why did you decide to buy it that way?","Are there any products you would never buy online? Why not?","Some people think online shopping is hurting small local businesses. Do you agree?","Imagine that every store in your city closed and you could only shop online. How would your daily life change?"],"model":"The last thing I bought online was a pair of running shoes. I'd already tried them on at a store in the mall, but the price online was almost thirty percent lower, so I decided to order them from home. They arrived in just two days, which was surprisingly fast. I usually shop online for books, electronics, and clothes from brands I already know, because it saves time and I can compare prices easily. But honestly, I felt a little guilty this time, because the salesperson had spent twenty minutes helping me."},{"topic":"Healthy habits","qs":["What do you do to stay healthy during a busy week?","Is there a healthy habit you've tried to start but found hard to keep? What happened?","Do you think schools should be responsible for teaching children to eat well and stay active? Why or why not?","If your city wanted people to exercise more, what do you think would be the most effective thing it could do?"],"model":"During a busy week, the main thing I try to do is protect my sleep. I've noticed that if I sleep less than seven hours, I eat worse and I feel much less motivated to exercise. I also try to walk as much as possible, so instead of taking the bus for short trips, I walk, and I always take the stairs at work. And on Sundays, I cook a big pot of soup or lentils for the week, which stops me from ordering fast food when I get home late and tired."},{"topic":"Volunteering and community","qs":["Have you ever done any volunteer work? Tell me about it.","What do you think motivates people to give their time to help others for free?","Some schools require students to do volunteer work before they graduate. Is that a good idea? Why or why not?","If you had one free day every month to help your community, what would you like to do?"],"model":"Yes, a few years ago I volunteered at an animal shelter near my house on Saturday mornings. My job was mostly cleaning the kennels, feeding the dogs, and taking them for walks, which sounds simple, but it was physically exhausting. The best part was seeing animals that arrived scared and thin slowly gain confidence and finally get adopted. I stopped going when I changed jobs, because my schedule got too complicated, but I still donate food to the shelter, and I'd love to go back when I have more time."},{"topic":"Travel and tourism","qs":["Tell me about a place you've visited that you would recommend to a friend. Why would you recommend it?","When you travel, do you prefer to plan everything in advance or to be spontaneous? Why?","Some popular destinations have started limiting the number of tourists who can visit. Do you think that's fair?","If you could spend a year living in another country, where would you go, and what would you hope to learn?"],"model":"I'd definitely recommend San Pedro de Atacama, in the north of Chile. I went there two years ago with my sister, and it felt like being on another planet. The desert landscapes are incredible, especially at sunset, when the mountains turn pink and orange. We also got up before dawn one day to see some geysers, which was freezing but absolutely worth it. My only advice would be to drink lots of water and take it easy on the first day, because the town is pretty high up and the altitude can make you feel sick."},{"topic":"Social media and the news","qs":["How do you usually find out about the news, and how much time do you spend on it each day?","Have you ever believed or shared a story online that turned out to be false? What happened?","Should social media companies be responsible for removing false information from their platforms? Why or why not?","If you were a teacher, how would you help teenagers decide which news sources they can trust?"],"model":"These days, I mostly get my news from my phone. In the morning, while I'm having breakfast, I check a couple of news apps and read the headlines, and I usually listen to a news podcast on my way to work. In total, I'd say it's about half an hour a day. I used to rely a lot on social media, but I realized I was seeing the same kinds of opinions again and again, so now I try to follow a few reliable newspapers directly instead."},{"topic":"Money and saving","qs":["When you were a child, did you get an allowance? What did you do with it?","Do you find it easy or difficult to save money these days? Why?","Some people think high schools should teach students how to manage their money. Do you agree? Why or why not?","If you suddenly received a large amount of money, what would you do with it first?"],"model":"Yes, my parents gave me a small allowance every week from when I was about ten, but there was a condition: I had to help with chores, like washing the dishes and taking out the trash. Most of the time, I spent it on candy and comic books at the kiosk near my school. But I remember once saving for months to buy a soccer ball, and I felt incredibly proud when I finally had enough. Looking back, I think it was a good way to learn that money doesn't just appear by magic."},{"topic":"Artificial intelligence in everyday life","qs":["Do you use any AI tools, like chatbots or voice assistants, in your daily life? What do you use them for?","Can you remember a time when an AI tool gave you an answer that was wrong or unhelpful? What happened?","Some teachers think students shouldn't be allowed to use AI to help with their homework. What's your view?","Imagine that AI could take over some of your daily tasks. Which tasks would you hand over, and which would you keep for yourself?"],"model":"Yes, I use AI tools quite often, mostly for work. I'm in marketing, so I sometimes ask a chatbot to suggest ideas for social media posts or to help me rewrite an email in a more formal tone. I also use one to practice English conversation, which is really useful, because I can make mistakes without feeling embarrassed. But I'm careful with it. I always double-check the information, because I've noticed it can sound very confident even when it's wrong, so I never trust it completely."}],"criteria":[{"name":"Repeat accuracy","what":"In Listen and Repeat, how completely and exactly you reproduce each sentence: every word, in the right order, with the right endings, and clear enough to be understood. Small words like “the,” “to,” and “have” count too.","tips":["Listen for the meaning, not just the sounds. If you understand the sentence, it's much easier to rebuild it.","Hear the sentence in two or three chunks (“If you can't find the book you need / ask a librarian for help”) and repeat it chunk by chunk, with the same rhythm.","Start speaking as soon as the sentence ends, while it's still fresh in your memory."]},{"name":"Delivery","what":"How clear and natural your speech sounds: individual sounds, word stress, intonation, and a steady pace without long or frequent pauses. A Chilean accent is fine as long as the listener can follow you easily.","tips":["Speak at a comfortable, steady pace. Talking fast doesn't sound more fluent if your words become unclear.","Pay attention to final sounds, especially -s and -ed endings (“works,” “finished”), which Spanish speakers often drop.","Link words together naturally (“pick it up” sounds like “pi-ki-tup”) instead of pronouncing each word separately."]},{"name":"Language use","what":"The range and accuracy of your grammar and vocabulary in the interview: choosing the right tenses, connecting ideas with linking words, and using precise words instead of very general ones.","tips":["Match your grammar to the question: past tenses for experiences, the present for habits, and “would” for imaginary situations.","Replace vague words like “good,” “bad,” and “thing” with more precise ones, such as “rewarding,” “stressful,” or “habit.”","Use a few natural linking phrases (“The main reason is…,” “For example…,” “On the other hand…”) to guide the listener."]},{"name":"Topic development","what":"Whether your interview answers really respond to the question and are developed with reasons, details, and examples that are easy to follow from start to finish.","tips":["Answer the question directly in your first sentence, then support it.","Use a simple structure: answer, reason, example, short conclusion.","A specific personal example (“Last month, I…”) is usually more convincing than a general statement."]}],"tips":["Listen and Repeat: read the context before you start. Knowing the situation (a library, a gym, a lab) helps you predict the kind of words you'll hear.","Listen and Repeat: say the sentence exactly as you heard it. Don't correct the grammar, change words, or add anything of your own.","Listen and Repeat: if you lose part of a long sentence, keep going and say as much as you can. A nearly complete sentence is much better than silence.","Train your short-term memory: play short clips from a podcast or video, pause after each sentence, and say it back out loud. Gradually move on to longer sentences.","Take an Interview: there's no preparation time, so start with a direct answer in your first sentence, then add a reason and a specific example.","Take an Interview: aim to use most of the 45 seconds. Practice with a timer until you can feel how long 45 seconds is, and finish with a short concluding sentence rather than stopping in the middle of an idea.","Notice how the questions change: the first ones ask about your own experience (use past tenses), while the last ones ask for opinions or imaginary situations (use “I think…,” “In my view…,” and “would”).","The interviewer is virtual, so don't wait for nods or reactions. Record your practice answers and listen back for long pauses, repeated fillers like “um,” and missing word endings."]}};

function voices(){ try{ return window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ return []; } }

var VOICES = null;
function enVoices(){
  if(VOICES) return VOICES;
  var v = voices().filter(function(x){ return /^en[-_]US/i.test(x.lang); });
  if(!v.length) v = voices().filter(function(x){ return /^en/i.test(x.lang); });
  v.sort(function(a, b){ var r = function(x){ return /(Natural|Google|Aria|Jenny|Guy|Samantha|Online)/i.test(x.name) ? 0 : 1; }; return r(a) - r(b); });
  VOICES = v; return v;
}
var READ = {on: false, list: [], i: 0, rate: .95, cb: null, voice: null};
function speakU(text, opt){
  opt = opt || {};
  var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = opt.rate || .95;
  var vs = enVoices(); if(vs.length) u.voice = vs[(opt.voice || 0) % vs.length];
  if(opt.pitch) u.pitch = opt.pitch;
  return u;
}
// Says a text. If the device has no voice (or speech is blocked), the stress pattern is shown instead.
function say(text, opt){
  opt = opt || {};
  var fallback = function(){ if(opt.stress) toast("🗣 Say it: " + opt.stress); else toast("🔇 No English voice on this device."); if(opt.box) opt.box.classList.add("show"); };
  try{
    if(!window.speechSynthesis){ fallback(); return; }
    stopRead(); speechSynthesis.cancel();
    var u = speakU(text, opt), started = false;
    u.onstart = function(){ started = true; if(opt.btn) opt.btn.classList.add("on"); };
    u.onend = function(){ if(opt.btn) opt.btn.classList.remove("on"); if(opt.onend) opt.onend(); };
    u.onerror = function(){ if(opt.btn) opt.btn.classList.remove("on"); if(!started) fallback(); if(opt.onend) opt.onend(); };
    speechSynthesis.speak(u);
    setTimeout(function(){ if(!started && !speechSynthesis.speaking){ try{ speechSynthesis.cancel(); }catch(e){} fallback(); if(opt.onend) opt.onend(); } }, 1500);
  }catch(e){ fallback(); }
}
// Reads several lines one after another (each line can use a different voice).
function readSeq(list, opt){
  opt = opt || {};
  if(!window.speechSynthesis){ toast("🔇 No audio in this browser."); return; }
  speechSynthesis.cancel(); READ.on = true; READ.list = list; READ.i = 0; READ.rate = opt.rate || .95; READ.cb = opt.onLine || null; readNext();
}
function readNext(){
  if(!READ.on || READ.i >= READ.list.length){ READ.on = false; if(READ.cb) READ.cb(-1); return; }
  var i = READ.i, it = READ.list[i];
  var u = speakU(it.t, {rate: READ.rate, voice: it.v || 0, pitch: it.p});

  u.onerror = function(){ if(READ.i === i){ READ.on = false; if(READ.cb) READ.cb(-1); } };
  if(READ.cb) READ.cb(i);
  speechSynthesis.speak(u);
}

}
function recHtml(key, label){ return '<div class="recctl" id="rc_' + key + '"><button class="mic" onclick="toggleRec(\'' + key + '\')">🎙️ ' + (label || "Record") + '</button><div class="recs" id="rl_' + key + '">' + recList(key) + '</div><div id="rn_' + key + '"></div></div>'; }
function recList(key){ return (RECS[key] || []).map(function(u, i){ return '<div>Take ' + (i + 1) + ' <audio controls src="' + u + '"></audio></div>'; }).join(""); }
function recPaint(key){
  var c = $("rc_" + key); if(!c) return;
  var b = c.querySelector(".mic"), on = REC && REC.key === key;
  b.classList.toggle("rec", !!on); b.innerHTML = on ? "⏹ Stop (" + fmt((Date.now() - REC.t0) / 1000) + ")" : "🎙️ " + ((RECS[key] || []).length ? "Record again" : "Record");
  $("rl_" + key).innerHTML = recList(key);
}
function toggleRec(key, maxSec){ if(REC){ var k = REC.key; recStop(); if(k === key) return; } recStart(key, maxSec); }
function recStart(key, maxSec, onStop){
  var note = $("rn_" + key);
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){ if(note) note.innerHTML = '<div class="notice">' + micMsg({}) + '</div>'; if(onStop) onStop(null); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}).then(function(stream){
    var mr = new MediaRecorder(stream), chunks = [];
    var r = {key: key, mr: mr, stream: stream, t0: Date.now(), onStop: onStop};
    REC = r;
    mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(r.iv); clearTimeout(r.to);
      if(REC === r) REC = null;
      var url = chunks.length ? URL.createObjectURL(new Blob(chunks, {type: mr.mimeType || "audio/webm"})) : null;
      if(url){ (RECS[key] = RECS[key] || []).push(url); }
      recPaint(key); if(r.onStop) r.onStop(url);
    };

    r.iv = setInterval(function(){ recPaint(key); }, 500);
    if(maxSec) r.to = setTimeout(function(){ if(r.mr.state !== "inactive") r.mr.stop(); }, maxSec * 1000);
    if(note) note.innerHTML = ""; recPaint(key);
  }).catch(function(e){ if(note) note.innerHTML = '<div class="notice">' + micMsg(e) + '</div>'; else toast("🎙️ Microphone not available."); if(onStop) onStop(null); });
}
function recStop(){ if(!REC) return; var r = REC; REC = null; try{ if(r.mr.state !== "inactive") r.mr.stop(); }catch(e){} }

var TIMERS = {};
function ringHtml(id, sec, cls){ return '<div class="ring ' + (cls || "") + '" id="rg_' + id + '"><span id="rs_' + id + '">' + fmt(sec) + '</span></div>'; }

}
function stopRing(id){ if(TIMERS[id]){ clearInterval(TIMERS[id]); delete TIMERS[id]; } }
function setRing(id, sec, total){ var rr = $("rg_" + id); if(!rr) return; $("rs_" + id).textContent = fmt(sec); rr.style.setProperty("--p", sec / (total || sec) * 100); rr.classList.remove("done"); }

  var X = CUR.ex.gap.items, ok = 0;
  X.forEach(function(g, k){ var inp = $("gp" + k), alts = g.a.split("/").map(norm), got = norm(inp.value);
    var r = got && alts.indexOf(got) >= 0; inp.className = r ? "ok" : "no"; $("ga" + k).textContent = r ? "✓" : "→ " + g.a.split("/")[0]; if(r) ok++; });
  $("sc-gap").textContent = ok + " / " + X.length; exSave("gap", ok);
}
var MSEL = null;
function mPick(b){
  if(b.classList.contains("ok")) return;
  if(!MSEL || MSEL === b){ if(MSEL === b){ b.classList.remove("sel"); MSEL = null; return; } MSEL = b; b.classList.add("sel"); return; }
  if(MSEL.dataset.s === b.dataset.s){ MSEL.classList.remove("sel"); MSEL = b; b.classList.add("sel"); return; }
  var a = MSEL; MSEL = null; a.classList.remove("sel");
  if(a.dataset.k === b.dataset.k){ a.classList.add("ok"); b.classList.add("ok"); var n = document.querySelectorAll('.mi.ok[data-s="L"]').length; $("sc-match").textContent = n + " / " + CUR.ex.match.pairs.length; if(n === CUR.ex.match.pairs.length) exSave("match", n); }
  else { a.classList.add("bad"); b.classList.add("bad"); setTimeout(function(){ a.classList.remove("bad"); b.classList.remove("bad"); }, 600); }
}
function fixHtml(f, k){
  var i = f.s.indexOf(f.wrong), pre = f.s.slice(0, i), post = f.s.slice(i + f.wrong.length);
  var tok = function(s, w){ return s.split(/(\s+)/).map(function(p){ return /^\s*$/.test(p) ? p : '<span class="w" data-w="' + w + '" onclick="fixPick(' + k + ',this)">' + esc(p) + '</span>'; }).join(""); };
  return '<div class="fx" id="fx' + k + '">' + (k + 1) + '. ' + tok(pre, 0) + tok(f.wrong, 1) + tok(post, 0) + '</div>';
}
function fixPick(k, el){
  var box = $("fx" + k); if(box.dataset.done) return; box.dataset.done = el.dataset.w === "1" ? "ok" : "no";
  var f = CUR.ex.fix.items[k];
  box.querySelectorAll('.w[data-w="1"]').forEach(function(w){ w.classList.add(el.dataset.w === "1" ? "hit" : "miss"); });
  if(el.dataset.w !== "1") el.classList.add("miss");
  box.insertAdjacentHTML("beforeend", '<span class="fixed">' + (el.dataset.w === "1" ? "✓ " : "✗ ") + esc(f.s.replace(f.wrong, f.fix)) + '</span>');
  var done = document.querySelectorAll(".fx[data-done]").length, ok = document.querySelectorAll('.fx[data-done="ok"]').length;
  $("sc-fix").textContent = ok + " / " + CUR.ex.fix.items.length; if(done === CUR.ex.fix.items.length) exSave("fix", ok);
}
function exSave(k, v){ var e = PR.ex[CUR.id] = PR.ex[CUR.id] || {}; e[k] = Math.max(e[k] || 0, v); saveP(); }

/* ---------- wrap-up ---------- */
function useIt(b){ b.classList.toggle("on"); var n = document.querySelectorAll("#useit .ui.on").length, T = CUR.lang.length;
  $("ubar").style.width = (n / T * 100) + "%"; $("ucount").textContent = n + " / " + T;
  $("umsg").textContent = n === T ? "🏆 Fluency champion! You used them all." : n >= 8 ? "🔥 Impressive — keep going!" : n >= 4 ? "💪 Great — keep using them!" : n >= 1 ? "Nice start!" : ""; }
var QZ = null;
function buildQuiz(){
  var L = CUR, items = shuffle(L.lang).slice(0, 6); QZ = {n: 0, ok: 0, total: 6};
  var h = '<div class="qz">';
  items.forEach(function(it, k){ var others = shuffle(L.lang.filter(function(x){ return x !== it; })).slice(0, 2), opts = shuffle([it].concat(others)), mode = k % 2;
    var q = mode === 0 ? 'Which expression means: <em>“' + esc(it.d) + '”</em>?' : 'What does <em>“' + esc(it.e) + '”</em> mean?';
    h += '<div class="q"><div class="qt"><span>' + (k + 1) + '.</span>' + q + '</div><div class="qo" id="qo' + k + '">' +
      opts.map(function(o){ return '<button data-ok="' + (o === it ? 1 : 0) + '" onclick="qAns(' + k + ',this)">' + esc(mode === 0 ? o.e : o.d) + '</button>'; }).join("") +
      '</div><div class="qf" id="qf' + k + '">Example: ' + esc(it.x) + '</div></div>'; });
  h += '</div><div class="qscore" id="qscore"></div>';
  $("quiz").innerHTML = h;
}
function qAns(k, b){
  var box = $("qo" + k); if(box.classList.contains("lock")) return; box.classList.add("lock");
  var ok = b.dataset.ok === "1"; box.querySelectorAll("button").forEach(function(x){ if(x.dataset.ok === "1") x.classList.add("ok"); });
  if(!ok) b.classList.add("no"); else QZ.ok++;
  var f = $("qf" + k); f.classList.add("show"); f.style.color = ok ? "var(--green-d)" : "var(--red)"; f.textContent = (ok ? "✓ Correct! " : "✗ Not quite. ") + f.textContent;
  QZ.n++;
  if(QZ.n === QZ.total){ var s = $("qscore"), p = QZ.ok / QZ.total;
    PR.done[CUR.id] = true; PR.quiz[CUR.id] = Math.max(PR.quiz[CUR.id] || 0, QZ.ok); saveP();
    s.innerHTML = '<b>' + QZ.ok + ' / 6</b><div style="font-weight:800;margin-bottom:12px">' + (p === 1 ? "Perfect! You've nailed it. 🏆" : p >= .67 ? "Great job — almost there! 🔥" : "Good effort — review the language and try again. 💪") + '</div>' + tbtn("↺ Try a new quiz", "buildQuiz()", "") ;
    s.style.display = "block"; }
}

/* ---------- 90-minute class clock ---------- */
var CLK = {left: 5400, iv: null};
function clock(a){
  if(a === "start" && !CLK.iv) CLK.iv = setInterval(function(){ CLK.left = Math.max(0, CLK.left - 1); clockPaint(); if(!CLK.left){ clearInterval(CLK.iv); CLK.iv = null; chime(); } }, 1000);
  if(a === "pause" && CLK.iv){ clearInterval(CLK.iv); CLK.iv = null; }
  if(a === "reset"){ clockStop(); }
  clockPaint();
}
function clockStop(){ if(CLK.iv) clearInterval(CLK.iv); CLK.iv = null; CLK.left = 5400; }
function clockPaint(){
  var c = $("clk"); if(!c) return; c.textContent = fmt(CLK.left); c.classList.toggle("run", !!CLK.iv);
  var el = (5400 - CLK.left) / 60, acc = 0, cur = -1;
  if(CLK.left < 5400){ cur = STAGES.length - 1; for(var i = 0; i < STAGES.length; i++){ acc += STAGES[i].m; if(el < acc){ cur = i; break; } } }
  STAGES.forEach(function(s, i){ var t = $("t-" + s.id); if(t) t.classList.toggle("now", i === cur); });
}

/* =====================================================================
   EXAM ZONE · IELTS Speaking + TOEFL iBT Speaking (2026 format)
   ===================================================================== */
var EZ = {run: 0, k: 0, set: 0, card: 0};
// Runs the answer timer and records at the same time; moves on when time is up or when the student stops recording.
// (Without a microphone the timer still runs, so the exam keeps going.)
function timed(ring, sec, key, run, next){
  var done = false, fin = function(){ if(done || run !== EZ.run) return; done = true; stopRing(ring); if(REC && REC.key === key) recStop(); next(); };
  runRing(ring, sec, fin);
  recStart(key, sec + 1, function(url){ if(url) fin(); });
}
function ezStop(){ EZ.run++; stopAllRings(); recCancel(); try{ speechSynthesis.cancel(); }catch(e){} }
function ezHero(title, sub, tag){
  return '<button class="back" onclick="go(\'' + (tag ? "exam" : "home") + '\')">← ' + (tag ? "Exam Zone" : "Home") + '</button><div class="ezhero">' + img(EXAM_IMG, "") + '<div class="in"><div class="eyebrow" style="color:#ffd4ae">' + (tag || "Exam Zone") + '</div><h1>' + title + '</h1><p>' + sub + '</p></div></div>';
}
function renderExam(){
  var h = ezHero("Exam Zone 🎓", "Practice speaking exams with real timings: the examiner's questions are read aloud, your answers are recorded, and you can compare them with model answers. Original practice material in the style of each exam.") +
    '<div class="exams"><button class="exam" onclick="go(\'exam/ielts\')"><div class="eyebrow">IELTS</div><h2>IELTS Speaking</h2><p style="color:var(--gray);margin-top:6px">11–14 minutes · face-to-face interview · Academic & General Training</p><div class="parts">' +
      '<div><b>Part 1</b><span>Interview about familiar topics — ' + EXAM.ielts.p1.length + ' topic sets.</span></div><div><b>Part 2</b><span>Cue card: 1 minute to prepare, speak for up to 2 minutes — ' + EXAM.ielts.p2.length + ' cards with model answers.</span></div><div><b>Part 3</b><span>Deeper discussion linked to the cue card.</span></div></div></button>' +
    '<button class="exam" onclick="go(\'exam/toefl\')"><div class="eyebrow">TOEFL iBT</div><h2>TOEFL Speaking</h2><p style="color:var(--gray);margin-top:6px">New format (from January 2026) · about 8 minutes · computer-based</p><div class="parts">' +
      '<div><b>Task 1</b><span>Listen and Repeat — hear 7 sentences once and repeat them exactly · ' + EXAM.toefl.repeat.length + ' sets.</span></div><div><b>Task 2</b><span>Take an Interview — 4 questions, 45 seconds each, no preparation · ' + EXAM.toefl.interview.length + ' sets.</span></div></div></button></div>' +
    '<div class="notice" style="margin-top:18px">🎙️ Recording works when the site is open in its own tab (Chrome, Edge or Safari). Your recordings stay on your device and disappear when you close the page.</div>';
  $("app").innerHTML = h;
}
function etabs(base, tabs, cur){ return '<div class="etabs">' + tabs.map(function(t){ return '<button class="' + (t[0] === cur ? "on" : "") + '" onclick="go(\'' + base + '/' + t[0] + '\')">' + t[1] + '</button>'; }).join("") + '</div>'; }
function critHtml(X){ return '<h3 style="margin:8px 0 12px">What the examiners listen for</h3><div class="crit">' + X.criteria.map(function(c){ return '<div><h4>' + esc(c.name) + '</h4><p>' + esc(c.what) + '</p><ul>' + c.tips.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>'; }).join("") + '</div>' +
  '<h3 style="margin:24px 0 4px">Strategy tips</h3><div class="etips">' + X.tips.map(function(t, i){ return '<div><b>' + (i + 1) + '.</b> ' + esc(t) + '</div>'; }).join("") + '</div>'; }

/* ---------- IELTS ---------- */
function renderIelts(tab){
  ezStop(); tab = tab || "p1";
  var h = ezHero("IELTS Speaking", "Part 1 interview, Part 2 long turn with a cue card, Part 3 discussion. Practice with real timings and record every answer.", "IELTS") +
    etabs("exam/ielts", [["p1", "Part 1 · Interview"], ["p2", "Part 2 & 3 · Cue card + discussion"], ["tips", "Scoring & tips"]], tab) + '<div id="ez"></div>';
  $("app").innerHTML = h;
  if(tab === "p1") i1Draw(); else if(tab === "p2") i2Draw(); else $("ez").innerHTML = critHtml(EXAM.ielts);
}
function i1Draw(){
  var T = EXAM.ielts.p1, t = T[EZ.set % T.length];
  $("ez").innerHTML = '<p class="ins" style="margin-top:12px">The examiner asks short questions about familiar topics. Answer each one in 2–4 sentences (about 20–30 seconds): answer, explain, give an example.</p>' +
    '<div class="fbar">' + T.map(function(x, k){ return '<button class="fchip ' + (k === EZ.set % T.length ? "on" : "") + '" onclick="ezStop();EZ.set=' + k + ';EZ.k=0;i1Draw()">' + esc(x.topic) + '</button>'; }).join("") + '</div>' +
    '<div class="stage" style="margin-top:14px"><div class="phase" id="i1ph">Topic: ' + esc(t.topic) + ' · question 1 of ' + t.qs.length + '</div><div class="big-card"><small>Examiner</small><span id="i1q">' + esc(t.qs[0]) + '</span></div>' +
    '<div class="timer">' + ringHtml("i1", 30, "g") + '<div class="row">' + tbtn("▶ Exam mode (all 5 questions)", "i1Auto()", "or") + tbtn("⏹ Stop", "ezStop();i1Draw()") + '</div></div>' +
    '<div class="row">' + tbtn("🔊 Ask", "say($('i1q').textContent)") + tbtn("← Previous", "i1Go(-1)") + tbtn("Next question →", "i1Go(1)") + '</div><div style="width:100%;max-width:560px" id="i1rec">' + recHtml("i1-" + EZ.set + "-0", "Record my answer") + '</div></div>';
}
function i1Go(d){ var t = EXAM.ielts.p1[EZ.set % EXAM.ielts.p1.length]; ezStop(); EZ.k = (EZ.k + d + t.qs.length) % t.qs.length; i1Show(); }
function i1Show(){ var t = EXAM.ielts.p1[EZ.set % EXAM.ielts.p1.length]; $("i1q").textContent = t.qs[EZ.k]; $("i1ph").textContent = "Topic: " + t.topic + " · question " + (EZ.k + 1) + " of " + t.qs.length; $("i1rec").innerHTML = recHtml("i1-" + EZ.set + "-" + EZ.k, "Record my answer"); setRing("i1", 30); }
function i1Auto(){
  ezStop(); var run = EZ.run; EZ.k = 0;
  var step = function(){
    if(run !== EZ.run) return;
    var t = EXAM.ielts.p1[EZ.set % EXAM.ielts.p1.length];
    if(EZ.k >= t.qs.length){ chime(); toast("✅ Part 1 complete — listen to your answers."); i1Review(); return; }
    i1Show(); $("i1ph").textContent += " · listen…";
    say(t.qs[EZ.k], {onend: function(){ if(run !== EZ.run) return; $("i1ph").textContent = "Answer now (30 seconds)";
      timed("i1", 30, "i1-" + EZ.set + "-" + EZ.k, run, function(){ EZ.k++; setTimeout(step, 600); }); }});
  };
  step();
}
function i1Review(){ var t = EXAM.ielts.p1[EZ.set % EXAM.ielts.p1.length];
  $("i1rec").innerHTML = '<div class="qlist">' + t.qs.map(function(q, k){ return '<div><b>' + (k + 1) + '</b>' + esc(q) + '<div class="recs">' + recList("i1-" + EZ.set + "-" + k) + '</div></div>'; }).join("") + '</div>'; }
function i2Draw(){
  var C = EXAM.ielts.p2, c = C[EZ.card % C.length];
  $("ez").innerHTML = '<p class="ins" style="margin-top:12px">Part 2: you get a cue card and have <b>1 minute</b> to prepare (make notes). Then speak for <b>up to 2 minutes</b>. Part 3: the examiner asks deeper questions on the same theme.</p>' +
    '<div class="row" style="margin:10px 0"><select class="fchip" onchange="ezStop();EZ.card=+this.value;i2Draw()">' + C.map(function(x, k){ return '<option value="' + k + '"' + (k === EZ.card % C.length ? " selected" : "") + '>Card ' + (k + 1) + ': ' + esc(x.topic) + '</option>'; }).join("") + '</select>' + tbtn("🎲 Random card", "ezStop();EZ.card=Math.floor(Math.random()*EXAM.ielts.p2.length);i2Draw()") + '</div>' +
    '<div class="stage"><div class="cue"><h3>' + esc(c.topic) + '</h3><div style="font-size:.92em;color:var(--gray)">You should say:</div><ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join("") + '</ul><div>' + esc(c.end) + '</div></div>' +
    '<div class="phase" id="i2ph">Ready when you are</div><div class="timer">' + ringHtml("i2", 60, "g") + '<div class="row">' + tbtn("▶ Start: 1 min to prepare", "i2Start()", "or") + tbtn("⏩ Skip to speaking", "i2Speak()") + tbtn("⏹ Stop", "ezStop();$('i2ph').textContent='Stopped'") + '</div></div>' +
    '<textarea class="notes" placeholder="Your notes (key words only)…"></textarea><div style="width:100%;max-width:560px">' + recHtml("i2-" + EZ.card, "Record (up to 2 min)") + '</div>' +
    '<div class="row">' + tbtn("👀 Model answer", "var m=$('i2m');m.style.display=m.style.display==='none'?'block':'none'", "") + tbtn("🔊 Listen to the model", "say(EXAM.ielts.p2[EZ.card%EXAM.ielts.p2.length].model)") + '</div><div class="modelans" id="i2m" style="display:none;text-align:left;max-width:760px">' + esc(c.model) + '</div></div>' +
    '<h3 style="margin:24px 0 10px">Part 3 · Discussion</h3><div class="qlist" style="max-width:none">' + c.p3.map(function(q, k){ return '<div><b>' + (k + 1) + '</b>' + esc(q) + ' <button class="btn soft sm" style="margin-left:6px" onclick="say(EXAM.ielts.p2[EZ.card%EXAM.ielts.p2.length].p3[' + k + '])">🔊</button><div style="margin-top:6px">' + recHtml("i3-" + EZ.card + "-" + k, "Record") + '</div></div>'; }).join("") + '</div>';
}
function i2Start(){ ezStop(); var run = EZ.run; $("i2ph").textContent = "Preparation: 1 minute — make notes";
  runRing("i2", 60, function(){ if(run !== EZ.run) return; chime(); i2Speak(); }); }
function i2Speak(){ ezStop(); var run = EZ.run; $("i2ph").textContent = "Speak now — up to 2 minutes (recording)";
  timed("i2", 120, "i2-" + EZ.card, run, function(){ chime(); $("i2ph").textContent = "Done — listen to your answer and compare it with the model."; }); }

/* ---------- TOEFL ---------- */
function renderToefl(tab){
  ezStop(); tab = tab || "repeat";
  var h = ezHero("TOEFL iBT Speaking", "New format (2026): Listen and Repeat, then Take an Interview. No preparation time — just like the real test.", "TOEFL iBT") +
    etabs("exam/toefl", [["repeat", "Task 1 · Listen and Repeat"], ["interview", "Task 2 · Take an Interview"], ["tips", "Scoring & tips"]], tab) + '<div id="ez"></div>';
  $("app").innerHTML = h;
  if(tab === "repeat") trDraw(); else if(tab === "interview") tiDraw(); else $("ez").innerHTML = critHtml(EXAM.toefl);
}
function trSec(s){ var w = s.split(/\s+/).length; return Math.min(12, 8 + Math.floor(w / 5)); }
function trDraw(){
  var S = EXAM.toefl.repeat, s = S[EZ.set % S.length];
  $("ez").innerHTML = '<p class="ins" style="margin-top:12px">You will hear 7 sentences, <b>one time each</b>. Repeat each sentence exactly — same words, rhythm and pronunciation. You have 8–12 seconds. The text appears only at the end.</p>' +
    '<div class="fbar">' + S.map(function(x, k){ return '<button class="fchip ' + (k === EZ.set % S.length ? "on" : "") + '" onclick="ezStop();EZ.set=' + k + ';trDraw()">' + esc(x.context) + '</button>'; }).join("") + '</div>' +
    '<div class="stage" style="margin-top:14px"><div class="phase" id="trph">' + esc(s.context) + ' · 7 sentences</div><div class="big-card"><small id="trn">Sentence 1 of 7</small><span class="sentence hidden-s" id="trs">Listen carefully…</span></div>' +
    '<div class="timer">' + ringHtml("tr", 10, "g") + '<div class="row">' + tbtn("▶ Start the task", "trAuto()", "or") + tbtn("⏹ Stop", "ezStop();$('trph').textContent='Stopped'") + '</div></div><div id="trrev" style="width:100%;max-width:760px"></div></div>';
}
function trAuto(){
  ezStop(); var run = EZ.run, S = EXAM.toefl.repeat, s = S[EZ.set % S.length], k = 0; $("trrev").innerHTML = "";
  var step = function(){
    if(run !== EZ.run) return;
    if(k >= s.sentences.length){ chime(); $("trph").textContent = "Finished — compare your answers"; $("trs").textContent = "Well done!"; $("trs").classList.remove("hidden-s"); trReview(); return; }
    $("trn").textContent = "Sentence " + (k + 1) + " of " + s.sentences.length; $("trs").textContent = "Listen carefully…"; $("trs").classList.add("hidden-s"); $("trph").textContent = "Listen…";
    say(s.sentences[k], {onend: function(){ if(run !== EZ.run) return; var sec = trSec(s.sentences[k]); $("trph").textContent = "Repeat now (" + sec + " seconds)";
      timed("tr", sec, "tr-" + EZ.set + "-" + k, run, function(){ k++; setTimeout(step, 700); }); }});
  };
  step();
}
function trReview(){ var s = EXAM.toefl.repeat[EZ.set % EXAM.toefl.repeat.length];
  $("trrev").innerHTML = '<div class="qlist" style="max-width:none">' + s.sentences.map(function(x, k){ return '<div><b>' + (k + 1) + '</b>' + esc(x) + ' <button class="btn soft sm" onclick="say(EXAM.toefl.repeat[EZ.set%EXAM.toefl.repeat.length].sentences[' + k + '])">🔊</button><div class="recs">' + recList("tr-" + EZ.set + "-" + k) + '</div></div>'; }).join("") + '</div>'; }
function tiDraw(){
  var S = EXAM.toefl.interview, s = S[EZ.set % S.length];
  $("ez").innerHTML = '<p class="ins" style="margin-top:12px">A virtual interviewer asks you <b>4 questions</b> on one topic. Answer each one immediately — you have <b>45 seconds</b> and no preparation time. Give a clear answer, a reason and an example.</p>' +
    '<div class="fbar">' + S.map(function(x, k){ return '<button class="fchip ' + (k === EZ.set % S.length ? "on" : "") + '" onclick="ezStop();EZ.set=' + k + ';tiDraw()">' + esc(x.topic) + '</button>'; }).join("") + '</div>' +
    '<div class="stage" style="margin-top:14px"><div class="phase" id="tiph">Topic: ' + esc(s.topic) + '</div><div class="big-card"><small id="tin">Question 1 of 4</small><span id="tiq">' + esc(s.qs[0]) + '</span></div>' +
    '<div class="timer">' + ringHtml("ti", 45, "g") + '<div class="row">' + tbtn("▶ Start the interview", "tiAuto()", "or") + tbtn("⏹ Stop", "ezStop();$('tiph').textContent='Stopped'") + '</div></div><div id="tirev" style="width:100%;max-width:760px"></div></div>';
}
function tiAuto(){
  ezStop(); var run = EZ.run, s = EXAM.toefl.interview[EZ.set % EXAM.toefl.interview.length], k = 0; $("tirev").innerHTML = "";
  var step = function(){
    if(run !== EZ.run) return;
    if(k >= s.qs.length){ chime(); $("tiph").textContent = "Interview finished — listen to your answers"; tiReview(); return; }
    $("tin").textContent = "Question " + (k + 1) + " of " + s.qs.length; $("tiq").textContent = s.qs[k]; $("tiph").textContent = "Listen…";
    say(s.qs[k], {onend: function(){ if(run !== EZ.run) return; $("tiph").textContent = "Answer now (45 seconds)";
      timed("ti", 45, "ti-" + EZ.set + "-" + k, run, function(){ k++; setTimeout(step, 700); }); }});
  };
  step();
}
function tiReview(){ var s = EXAM.toefl.interview[EZ.set % EXAM.toefl.interview.length];
  $("tirev").innerHTML = '<div class="qlist" style="max-width:none">' + s.qs.map(function(q, k){ return '<div><b>' + (k + 1) + '</b>' + esc(q) + '<div class="recs">' + recList("ti-" + EZ.set + "-" + k) + '</div>' + (k === 0 ? '<div class="modelans" style="margin-top:8px"><b>Model answer:</b> ' + esc(s.model) + ' <button class="btn soft sm" onclick="say(EXAM.toefl.interview[EZ.set%EXAM.toefl.interview.length].model)">🔊</button></div>' : "") + '</div>'; }).join("") + '</div>'; }

route();
</script>
