<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRONWELL · Conversation Club</title>
<meta name="description" content="TRONWELL Conversation Club: speaking practice for B1, B2 and C1 students — idioms, expressions, conversation strategies, pronunciation, speaking games and IELTS / TOEFL speaking practice.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
<style>
:root{
  --ink:#111827;--gray:#526173;--gray-2:#7b8797;--line:#dce7f2;--soft:#f7faff;--tint:#eef7ff;--bg:#ffffff;
  --blue:#0066cc;--blue-2:#08a8e8;--blue-d:#004f9e;
  --orange:#f58220;--orange-d:#e56f0b;--orange-soft:#fff4e9;
  --green:#2f9e6e;--green-d:#23825a;--green-soft:#e8f6ef;--green-xs:#f4fbf7;
  --red:#d14c4c;--red-soft:#fdecec;
  --B1:#2f9e6e;--B2:#0066cc;--C1:#e56f0b;
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:900;letter-spacing:-.025em;line-height:1.12}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
input,select,textarea{font-family:inherit}
.app img.emoji,main img.emoji,header img.emoji{display:inline-block!important;position:static!important;width:1em!important;height:1em!important;margin:0 .04em!important;vertical-align:-.12em!important;object-fit:contain!important;opacity:1!important;border-radius:0!important;transform:none!important;box-shadow:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-2) 45%,var(--green) 70%,var(--orange))}
.hw{max-width:1240px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{cursor:pointer;width:132px;display:flex;flex-direction:column}
.logo .lw{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:26px;color:var(--blue);letter-spacing:-1px;line-height:1}
.logo .lb{position:relative;height:12px;margin-top:3px;background:linear-gradient(90deg,rgba(3,169,244,0),#6cc9f7 55%,#03a9f4);display:flex;justify-content:flex-end;align-items:center;padding-right:8px}
.logo .lb span{font-size:8px;font-weight:800;font-style:italic;color:#fff}
.logo .lb i{position:absolute;right:0;top:0;bottom:0;width:4px;background:#f7a600}
.club{font-weight:900;font-size:15px;color:var(--green-d);padding-left:14px;border-left:1px solid var(--line);letter-spacing:-.01em}
.club small{display:block;font-size:10px;font-weight:700;color:var(--gray-2);letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{font-weight:800;font-size:13.5px;padding:8px 13px;border-radius:10px;color:var(--gray)}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--tint);color:var(--blue)}
nav button.nlv.on[data-v=B1]{background:var(--green-soft);color:var(--B1)}
nav button.nlv.on[data-v=C1]{background:var(--orange-soft);color:var(--C1)}
nav button.nexam{color:var(--orange-d)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--gray);font-size:13px;padding:24px;background:var(--soft)}
footer b{color:var(--blue)}

/* ---------- common ---------- */
.eyebrow{font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-d);display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--orange);border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-weight:800;font-size:14.5px;padding:12px 20px;border-radius:11px;transition:filter .15s,transform .1s,box-shadow .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.or{background:var(--orange);box-shadow:0 8px 20px rgba(245,130,32,.25)}
.btn.gr{background:var(--green)}
.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft:hover{border-color:var(--blue);color:var(--blue)}
.btn.sm{font-size:13px;padding:8px 13px;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{font-weight:800;font-size:13.5px;color:var(--gray);padding:6px 0;margin-bottom:12px}
.back:hover{color:var(--blue)}
.sec{margin-top:52px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-size:30px}
.sec-h p{color:var(--gray);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--blue);border:1px solid #d6e8fa}
.chip.g{background:var(--green-soft);color:var(--green-d);border-color:#cdebdc}
.chip.o{background:var(--orange-soft);color:var(--orange-d);border-color:#fbdcc0}
.lvtag{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:26px;padding:0 9px;border-radius:8px;font-weight:900;font-size:13px;color:#fff;background:var(--c,var(--blue))}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;z-index:99;transition:transform .3s,visibility .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.empty{text-align:center;color:var(--gray);padding:40px;border:1px dashed var(--line);border-radius:16px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;padding:14px 0 8px}
.hero h1{font-size:clamp(38px,5vw,60px);margin:12px 0 14px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero h1 span{color:var(--green)}
.hero p.lead{font-size:17px;color:var(--gray);max-width:520px}
.hero .ph{position:relative;border-radius:26px;overflow:hidden;height:360px;background:var(--tint);box-shadow:0 20px 50px rgba(0,102,204,.14)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(8,168,232,.18),rgba(47,158,110,.12) 55%,rgba(245,130,32,.18))}
.bubble{position:absolute;z-index:2;background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 12px 28px rgba(17,24,39,.14)}
.bubble.a{left:-18px;bottom:38px;color:var(--orange-d)}
.bubble.b{right:16px;top:20px;color:var(--blue)}
.bubble.c{right:-10px;bottom:-12px;color:var(--green-d)}
.stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap}
.stats b{font-size:30px;font-weight:900;display:block;color:var(--ink);letter-spacing:-.03em}
.stats span{font-size:11.5px;font-weight:800;color:var(--gray-2);text-transform:uppercase;letter-spacing:.08em}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lv{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left}
.lv:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,102,204,.12)}
.lv .im{height:150px;position:relative;overflow:hidden;background:var(--tint)}
.lv .im img{width:100%;height:100%;object-fit:cover}
.lv .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,24,39,.45),transparent 60%)}
.lv .tag{position:absolute;left:16px;top:16px;z-index:1;font-weight:900;font-size:26px;color:#fff;background:var(--c);border-radius:14px;padding:2px 14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lv .bd{padding:18px 20px 20px}
.lv h3{font-size:21px;margin-bottom:6px}
.lv p{color:var(--gray);font-size:14px}
.lv .go{margin-top:12px;font-weight:900;color:var(--c);font-size:13.5px;display:flex;justify-content:space-between}
.lv .go small{color:var(--gray-2);font-weight:700}
.doms{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dom{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(160deg,#fff,var(--soft))}
.dom .di{font-size:28px}
.dom h3{font-size:19px;margin:8px 0 4px}
.dom p{font-size:13.5px;color:var(--gray)}
.dom .tps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dom .tps span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.flow div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;position:relative}
.flow .m{position:absolute;right:10px;top:10px;font-size:11px;font-weight:900;color:var(--orange-d)}
.flow .ic{font-size:20px}
.flow b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.flow span{font-size:11.5px;color:var(--gray);line-height:1.35;display:block;margin-top:3px}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:22px;padding:24px 26px;flex-wrap:wrap}
.cta.exam{background:linear-gradient(110deg,#fff4e9,#fff)}
.cta.bank{background:linear-gradient(110deg,var(--green-soft),#fff)}
.cta h3{font-size:22px}
.cta p{color:var(--gray);font-size:14px;max-width:420px}

/* ---------- level page ---------- */
.lvhead{border-radius:24px;padding:26px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(110deg,var(--hb),#fff);border:1px solid var(--line)}
.lvhead .big{font-size:64px;font-weight:900;color:var(--c);line-height:1;letter-spacing:-.04em}
.lvhead h1{font-size:32px}
.lvhead p{color:var(--gray);font-weight:500;max-width:640px}
.lvhead .can{margin-left:auto;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--gray)}
.lvhead .can b{display:block;color:var(--green-d);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.fchip{border:1px solid var(--line);background:#fff;color:var(--gray);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dgroup{margin-top:26px}
.dgroup h3{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dgroup h3 small{font-size:12px;font-weight:700;color:var(--gray-2);letter-spacing:0}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tp{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left;position:relative}
.tp:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,102,204,.12)}
.tp .im{height:132px;overflow:hidden;position:relative;background:var(--tint)}
.tp .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tp:hover .im img{transform:scale(1.05)}
.tp .ic{position:absolute;left:12px;bottom:-16px;width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tp .done{position:absolute;right:10px;top:10px;background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px}
.tp .bd{padding:22px 16px 16px}
.tp small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-2)}
.tp h3{font-size:17px;margin:4px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- lesson ---------- */
.lhero{position:relative;border-radius:26px;overflow:hidden;height:280px;background:var(--tint)}
.lhero img{width:100%;height:100%;object-fit:cover}
.lhero .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,30,60,.86) 0%,rgba(10,30,60,.45) 60%,rgba(10,30,60,.08));display:flex;flex-direction:column;justify-content:flex-end;padding:28px 32px;color:#fff}
.lhero .meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lhero .meta span{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.lhero .meta span.lvb{background:var(--c)}
.lhero h1{font-size:clamp(28px,4vw,44px)}
.lhero .goals{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.lhero .goals span{font-size:12.5px;font-weight:600;background:rgba(47,158,110,.85);padding:4px 11px;border-radius:999px}
.credit{position:absolute;right:12px;top:10px;font-size:10px;color:rgba(255,255,255,.85);background:rgba(17,24,39,.4);padding:2px 8px;border-radius:10px;z-index:2}
.credit a{color:inherit}
.ltools{position:sticky;top:66px;z-index:30;display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:8px 10px;margin:14px 0 6px;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(16,35,63,.05)}
.ltools a{font-size:12.5px;font-weight:800;color:var(--gray);text-decoration:none;padding:6px 9px;border-radius:9px;white-space:nowrap}
.ltools a:hover{background:var(--tint);color:var(--blue)}
.ltools a.now{background:var(--orange-soft);color:var(--orange-d)}
.ltools .rt{margin-left:auto;display:flex;gap:4px;align-items:center}
.ltools .rt button{min-width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;padding:0 8px}
.ltools .clk{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;min-width:52px;text-align:center}
.ltools .clk.run{color:var(--orange-d)}
.lbody{font-size:var(--fs)}
.blk{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 26px;margin-top:18px;scroll-margin-top:130px;box-shadow:0 3px 14px rgba(16,35,63,.025)}
.blk-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.blk-h .n{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff}
.blk-h h2{font-size:1.45em}
.blk-h .tag{margin-left:auto;font-size:12px;font-weight:900;color:var(--orange-d);background:var(--orange-soft);padding:4px 11px;border-radius:999px}
.blk-h .tag.self{color:var(--green-d);background:var(--green-soft)}
.ins{color:var(--gray);margin-bottom:16px;font-size:.95em}
.tnote{background:var(--green-xs);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:9px 13px;font-size:.86em;color:var(--gray);margin:-4px 0 16px}
.tnote b{color:var(--green-d)}
.warm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.warm div{background:var(--tint);border:1px solid #d6e8fa;border-radius:16px;padding:16px 18px;font-weight:700;font-size:1.05em;display:flex;gap:12px;align-items:flex-start}
.warm div b{color:var(--blue);font-size:1.3em;font-weight:900;line-height:1}

/* model input */
.model{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.dlg{display:flex;flex-direction:column;gap:10px}
.ln{display:flex;gap:10px;align-items:flex-start}
.ln .sp{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8em;color:#fff;background:var(--blue)}
.ln.s1 .sp{background:var(--green)}.ln.s2 .sp{background:var(--orange)}
.ln .bb{background:var(--soft);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;cursor:pointer;transition:background .15s;max-width:620px}
.ln .bb:hover{border-color:#bcd6f0}
.ln .bb small{display:block;font-size:.72em;font-weight:900;color:var(--gray-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.ln.reading .bb,.para.reading{background:#fff7d6;border-color:#f3dd8b}
.para{font-size:1.02em;line-height:1.75;margin-bottom:12px;padding:4px 8px;border-radius:8px;cursor:pointer}
mark.tl{background:linear-gradient(transparent 55%,#ffe0b8 55%);color:inherit;font-weight:700;cursor:help;border-radius:2px;padding:0 1px}
.mside{display:flex;flex-direction:column;gap:12px}
.mside .im{height:180px;border-radius:16px;overflow:hidden;background:var(--tint)}
.mside .im img{width:100%;height:100%;object-fit:cover}

/* language */
.tfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lang{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ex{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-content:start}
.ex .ty{grid-column:1/-1;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.ty.PV{color:var(--blue)}.ty.ID{color:var(--orange-d)}.ty.COL{color:#7a5cd6}.ty.PREP{color:var(--green-d)}
.ex .e{font-size:1.18em;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.ex .st{font-size:.8em;font-weight:700;color:var(--gray-2);letter-spacing:.02em}
.ex .d{grid-column:1/-1;font-size:.93em}
.ex .x{grid-column:1/-1;font-size:.9em;color:var(--gray);font-style:italic;border-left:3px solid var(--green-soft);padding-left:10px;margin-top:4px}
.ex .uk{grid-column:1/-1;font-size:.8em;font-weight:700;color:#7a5cd6;background:#f4f1ff;border-radius:8px;padding:3px 8px;justify-self:start;margin-top:4px}
.say{width:38px;height:38px;border-radius:11px;background:var(--orange-soft);border:1px solid #fbdcc0;font-size:16px;align-self:start;grid-row:2/4;grid-column:2}
.say:hover{background:#ffe6cf}
.say.on{background:var(--orange);color:#fff}
.stk{grid-column:1/-1;display:none;background:var(--orange-soft);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--orange-d);font-size:.9em}
.stk.show{display:block}

/* functional language */
.func{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.phrases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phrases button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--green-xs);border:1px solid #d3ecdf;border-radius:12px;padding:10px 12px;transition:.15s}
.phrases button:hover{border-color:var(--green)}
.phrases b{font-size:1em;color:var(--ink)}
.phrases span{font-size:.8em;color:var(--green-d);font-weight:700}
.taskcard{background:linear-gradient(160deg,var(--blue-d),var(--blue) 60%,var(--blue-2));color:#fff;border-radius:18px;padding:18px 20px}
.taskcard small{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd4ae}
.taskcard p{margin-top:6px;font-weight:600;line-height:1.5}

/* pronunciation */
.pron{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.pbox{background:var(--tint);border-radius:16px;padding:16px 18px}
.pbox h3{font-size:1.1em;color:var(--blue)}
.pbox p{font-size:.92em;margin-top:6px}
.pbox .tip{margin-top:10px;background:#fff;border-radius:10px;padding:8px 12px;font-size:.88em;border:1px dashed #b9d8f3}
.plines{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pl .m{flex:1;min-width:220px;font-size:1.12em;font-weight:500;letter-spacing:.01em}
.pl .m .lk{color:var(--orange-d);font-weight:900}
.pl .m .ar{color:var(--green-d);font-weight:900}
.pl .m .ps{color:var(--gray-2)}

var TOPICS = {"everyday":{"name":"Everyday Life","ic":"☕","dom":"social"},"personal":{"name":"Personal Stories","ic":"📖","dom":"social"},"music":{"name":"Music","ic":"🎵","dom":"social"},"plans":{"name":"Plans & Future","ic":"🗓️","dom":"social"},"travel":{"name":"Travel","ic":"✈️","dom":"social"},"humor":{"name":"Humor","ic":"😂","dom":"social"},"curious":{"name":"Fun Facts & Curiosities","ic":"🔭","dom":"social"},"hobbies":{"name":"Hobbies","ic":"🎨","dom":"social"},"food":{"name":"Food & Culture","ic":"🍽️","dom":"social"},"relationships":{"name":"Friendship & Relationships","ic":"🤝","dom":"social"},"careers":{"name":"Jobs & Careers","ic":"💼","dom":"work"},"meetings":{"name":"Meetings & Teamwork","ic":"👥","dom":"work"},"negotiation":{"name":"Negotiation & Persuasion","ic":"🗣️","dom":"work"},"presentations":{"name":"Presentations & Pitching","ic":"🎤","dom":"work"},"workplace":{"name":"Workplace Problems","ic":"🧩","dom":"work"},"tech":{"name":"Technology & AI","ic":"🤖","dom":"debate"},"environment":{"name":"Environment & Climate","ic":"🌱","dom":"debate"},"health":{"name":"Health & Well-being","ic":"🧘","dom":"debate"},"media":{"name":"Media & Fake News","ic":"📰","dom":"debate"},"ethics":{"name":"Ethics & Dilemmas","ic":"⚖️","dom":"debate"}};
var LESSONS = [{"id":"b1-everyday","lv":"B1","tp":"everyday","title":"Daily Routines & Little Problems","img":7243794,"goals":["describe your daily routine using common phrasal verbs like wake up, get up and run out of","talk about small everyday problems and react with sympathy","link words smoothly in phrases like wake up at and run out of"],"warm":["What's the first thing you do in the morning?","Which daily task do you hate the most?","Are you a morning person or a night owl?","What little problem really annoys you at home or at work?"],"model":{"kind":"dialogue","title":"A Bad Monday Morning","intro":"It's Monday morning in a Santiago office. Camila arrives late, and her coworker Ben asks what happened.","lines":[{"sp":"Ben","t":"Morning, Camila! Are you OK? You look stressed."},{"sp":"Camila","t":"Ugh, what a morning! I [[hit the snooze button]] three times, so I didn't [[get up]] until 7:45."},{"sp":"Ben","t":"Oh no! I thought you were [[an early bird]]."},{"sp":"Camila","t":"I usually am. I normally [[wake up]] at six. But last night I watched a series until 2 a.m."},{"sp":"Ben","t":"Ha! So now you're [[a night owl]]?"},{"sp":"Camila","t":"Only on Sundays! And then I went to make breakfast, and we'd [[run out of]] coffee."},{"sp":"Ben","t":"That's the worst. Didn't you [[do the shopping]] on Saturday?"},{"sp":"Camila","t":"No, I [[put it off]]... again. Then the bus wasn't [[on time]], so I texted my boss: “Sorry, I'm [[running late]]!”"},{"sp":"Ben","t":"Well, you're here now. Want some coffee? I just made a fresh pot."},{"sp":"Camila","t":"You're a lifesaver! I owe you one."},{"sp":"Ben","t":"No problem. Just help me [[tidy up]] the kitchen later, OK?"},{"sp":"Camila","t":"Deal!"}],"questions":[{"q":"Why did Camila get up late?","opts":["Her alarm clock didn't work.","She went to bed late and hit the snooze button.","The bus didn't come."],"a":1},{"q":"What did Camila put off?","opts":["Doing the shopping","Texting her boss","Making breakfast"],"a":0},{"q":"What does Ben offer Camila?","opts":["A ride to work","Some breakfast","A cup of coffee"],"a":2}]},"lang":[{"e":"wake up","t":"PV","d":"to stop sleeping","x":"I usually wake up at 6:30, even on weekends.","s":"wake UP"},{"e":"get up","t":"PV","d":"to leave your bed","x":"I get up ten minutes after my alarm goes off.","s":"get UP"},{"e":"run out of","t":"PV","d":"to have no more of something","x":"We've run out of coffee again!","s":"run OUT of"},{"e":"put off","t":"PV","d":"to delay doing something","x":"I always put off doing the dishes.","s":"put OFF"},{"e":"tidy up","t":"PV","d":"to make a place clean and organized","x":"I tidy up my desk every Friday.","s":"tidy UP"},{"e":"do the shopping","t":"COL","d":"to buy food and things for the home (also: do the grocery shopping)","x":"Who does the shopping in your house?","s":"do the SHOPping"},{"e":"be good at","t":"PREP","d":"to have a skill in something","x":"My brother is really good at cooking.","s":"be GOOD at"},{"e":"on time","t":"PREP","d":"punctual; at the correct time","x":"The bus is never on time in the morning.","s":"on TIME"},{"e":"a night owl","t":"ID","d":"a person who likes to stay up late at night","x":"I'm a night owl. I do my best work after 10 p.m.","s":"a NIGHT owl"},{"e":"an early bird","t":"ID","d":"a person who likes to get up very early","x":"My mom is an early bird; she's up at 5:30 every day.","s":"an EARly bird"},{"e":"be running late","t":"COL","d":"to be later than you planned","x":"Sorry, I'm running late. I'll be there in ten minutes.","s":"be RUNning LATE"},{"e":"hit the snooze button","t":"COL","d":"to stop your alarm so you can sleep a few more minutes","x":"I hit the snooze button three times this morning.","s":"hit the SNOOZE button"}],"func":{"title":"Complaining and sympathizing (in a friendly way)","when":"Use these when you chat with friends or coworkers about small everyday problems.","phrases":[{"p":"It's so annoying when…","use":"complaining about a situation"},{"p":"I can't stand it when…","use":"making a stronger complaint"},{"p":"You'll never guess what happened this morning.","use":"starting a complaint story"},{"p":"The worst part is…","use":"giving the main problem"},{"p":"Oh no! That's the worst.","use":"sympathizing"},{"p":"I hate it when that happens.","use":"sympathizing"},{"p":"That happens to me all the time!","use":"showing you understand"},{"p":"That sounds really frustrating.","use":"showing empathy"},{"p":"Why don't you…?","use":"making a suggestion"},{"p":"Have you tried…?","use":"making a suggestion"}],"task":"In pairs, Student A complains about three little problems from this morning (use run out of, be running late, put off…). Student B reacts with a different sympathy phrase each time and gives one suggestion. Then swap roles. 3 minutes."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them. “Wake up at” sounds like one word: “way-ku-pat”. Phrasal verbs are almost always linked like this.","tip":"In American English, a t between two vowel sounds often becomes a quick, soft d: “put it off” sounds like “pu-di-doff” and “get up” like “ge-dup”.","lines":[{"t":"I wake up at six.","m":"I wake‿UP‿at SIX."},{"t":"The bus is never on time.","m":"The BUS‿is NEVer‿on TIME."},{"t":"We've run out of eggs.","m":"We've run‿OUT‿of‿EGGS."},{"t":"I always put it off.","m":"I ALways put‿it‿OFF."},{"t":"She's good at cooking.","m":"She's GOOD‿at COOKing."}]},"acts":[{"type":"minute","items":["My perfect Sunday","A task I always put off","My morning routine","Something I'm good at","The last time I ran out of something important","How I organize my week"]},{"type":"wyr","items":[["Wake up at 5 a.m. every day","Go to bed at 3 a.m. every day"],["Cook every meal for a month","Clean the whole house every day"],["Never use your phone before 10 a.m.","Never watch TV again"],["Do the shopping every day","Do it only once a month"],["Have a messy bedroom","Have a messy desk at work"],["Always be 10 minutes early","Always be 10 minutes late"]]},{"type":"taboo","cards":[{"w":"wake up","taboo":["sleep","morning","eyes"]},{"w":"run out of","taboo":["finish","more","empty"]},{"w":"put off","taboo":["later","delay","tomorrow"]},{"w":"tidy up","taboo":["clean","messy","room"]},{"w":"do the shopping","taboo":["supermarket","buy","food"]},{"w":"on time","taboo":["late","early","clock"]},{"w":"a night owl","taboo":["sleep","bed","late"]},{"w":"an early bird","taboo":["morning","sunrise","get up"]},{"w":"be running late","taboo":["time","hurry","minutes"]},{"w":"hit the snooze button","taboo":["alarm","sleep","again"]}]}],"ex":{"gap":{"items":[{"s":"I always ___ at 6:30, but I stay in bed until 7.","a":"wake up"},{"s":"Can you stop at the store on your way home? We've ___ milk.","a":"run out of"},{"s":"Stop ___ your homework and just do it!","a":"putting off"},{"s":"My sister is ___. She's never in bed before 1 a.m.","a":"a night owl"},{"s":"Sorry, I'm ___! There's a lot of traffic. See you in 15 minutes.","a":"running late"},{"s":"Your alarm went off ten minutes ago! If you ___ again, you'll miss the bus.","a":"hit the snooze button"}]},"match":{"pairs":[["get up","leave your bed"],["tidy up","make a place clean and organized"],["do the shopping","buy food and things for the home"],["be good at","have a skill in something"],["on time","at the correct time; not late"],["an early bird","a person who likes to get up very early"]]},"fix":{"items":[{"s":"I make the shopping every Saturday.","wrong":"make the shopping","fix":"do the shopping"},{"s":"I wake up at 6, but I don't stand up until 6:30.","wrong":"stand up","fix":"get up"},{"s":"I always put off to do my taxes.","wrong":"put off to do","fix":"put off doing"},{"s":"My brother is very good in cooking.","wrong":"good in","fix":"good at"}]}},"rec":{"prompt":"Describe a typical weekday morning for you. What little problems sometimes happen?","model":"On weekdays, I usually wake up at 6:30, but honestly, I always hit the snooze button at least once. I'm definitely not an early bird! I get up around 6:45, take a quick shower and make coffee. The little problems usually start in the kitchen. Last week, for example, we ran out of milk, so I had to drink my coffee black. Then I couldn't find my keys, and of course I was running late. I texted my boss and said the Metro was slow, which was partly true! To be honest, my mornings would be much easier if I got everything ready the night before.","use":["wake up","hit the snooze button","run out of","be running late"]},"tips":[{"who":"teacher","t":"Before the Taboo game, model one card yourself so students hear how to explain an expression without the taboo words (e.g., “It's what happens when there's no more milk in the fridge…”)."},{"who":"student","t":"“Wake up” = open your eyes; “get up” = leave your bed. The Spanish “levantarse” is “get up”, not “stand up”."},{"who":"student","t":"Write five true sentences about your own routine with phrasal verbs from this lesson and read them aloud every morning this week, linking the words."}]},{"id":"b2-everyday","lv":"B2","tp":"everyday","title":"Modern Life & Habits","img":4046112,"goals":["talk about modern habits and lifestyle changes using phrasal verbs and idioms","agree and disagree politely in a discussion","stress the particle in multi-word verbs like cut DOWN on and keep UP with"],"warm":["How has your daily routine changed in the last five years?","What habit would you like to break?","Do you think people today are busier than before?","Are you a creature of habit, or do you like to change your routine?"],"model":{"kind":"text","title":"One Habit at a Time","intro":"A blog post by Valentina, a working mom in Santiago, about trying to change her daily habits.","paras":["I've always been [[a creature of habit]]: same breakfast, same route to work, same coffee shop. But last year I realized that some of my habits weren't helping me at all. With [[a hectic schedule]] and two kids, I was eating lunch [[on the go]], sleeping five hours a night and checking my phone about 150 times a day. Honestly, I was [[addicted to]] it.","So in January, I decided to [[break a habit]] that was making me miserable: scrolling in bed. I deleted my social media apps and [[got into the habit of]] reading for twenty minutes before bed instead. The first week was hard. I kept reaching for my phone [[on autopilot]].","I also tried to [[cut down on]] coffee, but that experiment lasted exactly three days. The real win? I stopped [[burning the midnight oil]] to answer work emails. I'll never [[keep up with]] everything, and I've accepted that.","My advice? Don't try to change your whole life at once. Pick one small habit, [[stick to]] it for a month and see what happens."],"questions":[{"q":"Why did Valentina decide to change her habits?","opts":["Her doctor told her to.","She realized some of her habits weren't helping her.","She wanted more followers for her blog."],"a":1},{"q":"Which experiment didn't work?","opts":["Reading before bed","Deleting social media","Cutting down on coffee"],"a":2},{"q":"What is Valentina's main advice?","opts":["Change one small habit at a time.","Delete all the apps on your phone.","Stop drinking coffee completely."],"a":0}]},"lang":[{"e":"get into the habit of","t":"PV","d":"to start doing something regularly","x":"I've gotten into the habit of reading before bed.","s":"get INto the HABit of","uk":"UK: I've got into the habit of…"},{"e":"cut down on","t":"PV","d":"to reduce the amount of something","x":"I'm trying to cut down on sugar.","s":"cut DOWN on"},{"e":"keep up with","t":"PV","d":"to stay at the same level or speed","x":"It's hard to keep up with all my messages.","s":"keep UP with"},{"e":"stick to","t":"PV","d":"to continue with a plan or decision","x":"I can never stick to a diet for more than a week.","s":"STICK to"},{"e":"burn the midnight oil","t":"ID","d":"to work or study late at night","x":"She's been burning the midnight oil to finish the project.","s":"burn the MIDnight OIL"},{"e":"make ends meet","t":"ID","d":"to have just enough money to live","x":"With prices rising, many families struggle to make ends meet.","s":"make ENDS MEET"},{"e":"a hectic schedule","t":"COL","d":"a very full, busy plan of activities","x":"I have a hectic schedule on Mondays.","s":"a HECtic SCHEDule"},{"e":"be addicted to","t":"PREP","d":"to be unable to stop doing or using something","x":"Many teenagers are addicted to their phones.","s":"be adDICTed to"},{"e":"break a habit","t":"COL","d":"to stop doing something you do regularly, usually something bad","x":"It took me two years to break the habit of biting my nails.","s":"BREAK a HABit"},{"e":"a creature of habit","t":"ID","d":"a person who likes to do the same things in the same way every day","x":"My dad is a creature of habit. He's eaten the same breakfast for 30 years.","s":"a CREAture of HABit"},{"e":"on the go","t":"PREP","d":"busy and moving from place to place; while doing other things","x":"I'm always on the go, so I usually grab a sandwich for lunch.","s":"on the GO"},{"e":"on autopilot","t":"PREP","d":"doing something automatically, without thinking","x":"I drove to my old office on autopilot this morning!","s":"on AUtopilot"}],"func":{"title":"Agreeing and disagreeing politely","when":"Use these in discussions when you want to share your view without sounding rude.","phrases":[{"p":"I couldn't agree more.","use":"strong agreement"},{"p":"That's exactly how I feel.","use":"agreement"},{"p":"You've got a point there.","use":"accepting part of an argument"},{"p":"I see where you're coming from, but…","use":"polite disagreement"},{"p":"That's true to some extent, but…","use":"partial disagreement"},{"p":"I'm not so sure about that.","use":"soft disagreement"},{"p":"I see it a bit differently.","use":"offering another view"},{"p":"Fair enough, but what about…?","use":"accepting a point and adding a counterargument"},{"p":"Honestly, I completely disagree.","use":"strong disagreement (use carefully)"}],"task":"In groups of three, take turns reading a statement from the Agree or Disagree activity. The other two respond with a different phrase each time (no repeats!) and give a reason. Keep score: who used the most phrases in 3 minutes?"},"pron":{"focus":"Stress in multi-word verbs","explain":"In multi-word verbs like cut down on and keep up with, the stress falls on the particle (DOWN, UP), not on the final preposition. The final on, with, to and of are weak and short: to sounds like /tə/ and of like /əv/.","tip":"Tap the table on each capital syllable while you shadow. If you tap on “on”, “to” or “with”, you're stressing the wrong word.","lines":[{"t":"I'm trying to cut down on sugar.","m":"I'm TRYing to cut DOWN on SUGar."},{"t":"It's hard to keep up with my messages.","m":"It's HARD to keep UP with my MESsages."},{"t":"I can never stick to a plan.","m":"I can NEVer STICK to a PLAN."},{"t":"I've gotten into the habit of walking to work.","m":"I've gotten INto the HABit of WALKing to WORK."},{"t":"She's addicted to her phone.","m":"She's adDICTed to her PHONE."}]},"acts":[{"type":"agree","items":["Smartphones have made our lives more stressful.","Working from home is better than working in an office.","People should cut down on social media.","A good routine is the key to happiness.","It's impossible to keep up with the news nowadays.","Everyone should learn to cook basic meals."]},{"type":"roulette","items":["What is one habit you'd like to get into?","What do you find hard to keep up with?","Have you ever burned the midnight oil? Why?","What would you like to cut down on?","Describe your most hectic day of the week.","What app could you not live without?","What do you do to relax after a long day?","Which plan or resolution have you stuck to the longest?"]},{"type":"pitch","brief":"Modern life is busy. In teams, design an app, product or service that helps people build good habits or break bad ones. You have 2 minutes to pitch it to the investors (the rest of the class). Use at least three expressions from the lesson.","ideas":["A phone case that locks your phone for a set amount of time","A habit-tracking app that rewards you with discounts at local stores","A healthy lunch delivery service for office workers who always eat on the go","A smart alarm clock that won't stop ringing until you get out of bed","A “digital detox” weekend in the Cajón del Maipo with no Wi-Fi"],"questions":["Who exactly is your customer?","Why would people stick to using your product after the first week?","How much will it cost, and how will you make money?","What makes it different from what's already out there?","What's the biggest risk, and how will you deal with it?"]}],"ex":{"gap":{"items":[{"s":"I drink way too much coffee. I really need to ___ it.","a":"cut down on"},{"s":"There are so many new apps these days that it's impossible to ___ all of them.","a":"keep up with"},{"s":"Prices keep going up, and a lot of families are struggling to ___.","a":"make ends meet"},{"s":"My grandpa is ___: same breakfast, same newspaper, same walk every single day.","a":"a creature of habit"},{"s":"I have three exams next week, so I'll be ___ every night.","a":"burning the midnight oil"},{"s":"I take the same route to work every day, so I basically drive there ___.","a":"on autopilot"}]},"match":{"pairs":[["stick to","continue with a plan or decision"],["a hectic schedule","a very full, busy plan of activities"],["break a habit","stop doing something you do regularly"],["on the go","busy and moving from place to place"],["get into the habit of","start doing something regularly"],["be addicted to","be unable to stop doing or using something"]]},"fix":{"items":[{"s":"I'm trying to cut down sugar.","wrong":"cut down sugar","fix":"cut down on sugar"},{"s":"I think I'm addicted to check my phone.","wrong":"addicted to check","fix":"addicted to checking"},{"s":"I got into the habit to read before bed.","wrong":"habit to read","fix":"habit of reading"},{"s":"It's difficult to keep up my emails.","wrong":"keep up my emails","fix":"keep up with my emails"}]}},"rec":{"prompt":"Talk about one habit you'd like to break and one you'd like to get into. Why, and how will you do it?","model":"I'd really like to break the habit of checking my phone the moment I wake up. I'm not exactly addicted to it, but I definitely spend too much time scrolling in bed. My plan is to leave my phone in the kitchen at night and buy a real alarm clock. I'd also like to get into the habit of going for a run three times a week. I've tried before, but I've never managed to stick to it for more than a month, usually because of my hectic schedule. This time I'm going to start small, just twenty minutes, and stop making excuses!","use":["break a habit","get into the habit of","stick to","a hectic schedule"]},"tips":[{"who":"teacher","t":"During the Agree or Disagree activity, write each opinion phrase on the board the first time a student uses it. At the end, ask the class which phrases nobody used and have them try those in a quick final round."},{"who":"student","t":"In American English, the past participle of “get” is usually “gotten”: “I've gotten into the habit of…”, “It's gotten really cold.”"},{"who":"student","t":"Pick one expression a day (for example, “cut down on”) and say three true sentences about your life with it while you're on the go."}]},{"id":"c1-everyday","lv":"C1","tp":"everyday","title":"Work-Life Balance","img":7792752,"goals":["discuss work-life balance and burnout using sophisticated idioms and collocations","hedge and soften your opinions in a nuanced discussion","negotiate a flexible work arrangement within realistic limits"],"warm":["What does “balance” mean to you?","Do you find it easy to switch off after work?","Has being busy become a status symbol?","What's one boundary you've set (or would like to set) between work and the rest of your life?"],"model":{"kind":"dialogue","title":"The Myth of Always Being On","intro":"An excerpt from a podcast in which host Laura interviews Andrés, an organizational psychologist, about burnout.","lines":[{"sp":"Laura","t":"Andrés, burnout seems to be everywhere these days. Why are so many people [[burning out]]?"},{"sp":"Andrés","t":"Part of it is that work no longer has clear edges. Your phone buzzes at 10 p.m. and you reply, because it only takes a second. But those seconds add up. People never really [[switch off]], so they never get the chance to [[wind down]]."},{"sp":"Laura","t":"And a lot of people are [[juggling commitments]] at home as well."},{"sp":"Andrés","t":"Exactly. Parents especially. They're [[stretched thin]], and they feel guilty whichever way they turn."},{"sp":"Laura","t":"So is it actually possible to [[strike a balance]], or is that a fantasy?"},{"sp":"Andrés","t":"It's possible, but it doesn't happen by accident. You have to [[set boundaries]] and stick to them. One client of mine decided that once she was [[off the clock]], her laptop stayed in her bag. No exceptions."},{"sp":"Laura","t":"How did her boss react?"},{"sp":"Andrés","t":"Surprisingly well, because her work actually improved. When you work [[around the clock]], you're not more productive; you're just more tired."},{"sp":"Laura","t":"That's a hard sell in some industries, though."},{"sp":"Andrés","t":"Absolutely. In some workplaces, exhaustion is almost a badge of honor. But success that comes [[at the expense of]] your health isn't really success."},{"sp":"Laura","t":"What would you say to listeners who feel trapped in [[the daily grind]]?"},{"sp":"Andrés","t":"Start small. Choose one evening a week when you [[call it a day]] at six, no matter what. Notice how you feel. Then build from there."}],"questions":[{"q":"According to Andrés, why do so many people never wind down?","opts":["They work much longer hours than in the past.","Small work interruptions after hours stop them from switching off.","They don't have any hobbies."],"a":1},{"q":"What happened when Andrés's client set boundaries?","opts":["Her boss complained.","She lost an important client.","Her work improved."],"a":2},{"q":"What does Andrés recommend to people who feel trapped?","opts":["Stopping work at six one evening a week as a first step","Changing careers as soon as possible","Working around the clock for a short time"],"a":0}]},"lang":[{"e":"wind down","t":"PV","d":"to relax gradually after activity or stress","x":"I need at least an hour to wind down after work.","s":"wind DOWN"},{"e":"burn out","t":"PV","d":"to become exhausted from working too hard","x":"If you never take breaks, you'll burn out.","s":"burn OUT"},{"e":"juggle commitments","t":"COL","d":"to manage several responsibilities at once","x":"Parents often juggle work and family commitments.","s":"JUGgle comMITments"},{"e":"be stretched thin","t":"ID","d":"to have too many responsibilities at the same time","x":"With three projects at once, I'm stretched thin.","s":"be STRETCHED THIN"},{"e":"call it a day","t":"ID","d":"to stop working for the day","x":"It's 8 p.m. Let's call it a day.","s":"call it a DAY"},{"e":"the daily grind","t":"ID","d":"the tiring, repetitive routine of work","x":"Weekends help me escape the daily grind.","s":"the DAIly GRIND"},{"e":"strike a balance","t":"COL","d":"to find a good middle point between two things","x":"It's hard to strike a balance between ambition and rest.","s":"strike a BALance"},{"e":"at the expense of","t":"PREP","d":"causing harm or loss to something","x":"He built his career at the expense of his health.","s":"at the exPENSE of"},{"e":"switch off","t":"PV","d":"to stop thinking about work and relax completely","x":"Even on weekends, I find it hard to switch off.","s":"switch OFF"},{"e":"set boundaries","t":"COL","d":"to decide clear limits on what you will and won't do","x":"I've learned to set boundaries: no work calls after 7 p.m.","s":"set BOUNDaries"},{"e":"off the clock","t":"PREP","d":"not officially working (and not being paid)","x":"Once I'm off the clock, I don't answer work emails.","s":"off the CLOCK"},{"e":"around the clock","t":"PREP","d":"all day and all night, without stopping","x":"The team worked around the clock to meet the deadline.","s":"aROUND the CLOCK","uk":"UK also: round the clock"}],"func":{"title":"Hedging and softening opinions","when":"Use these to sound measured and diplomatic, especially when you discuss sensitive or complex issues at work.","phrases":[{"p":"I'd tend to think that…","use":"softening an opinion"},{"p":"It could be argued that…","use":"presenting an idea without fully committing to it"},{"p":"To some extent, …","use":"partial agreement"},{"p":"I'm not entirely convinced that…","use":"polite disagreement"},{"p":"I wouldn't go so far as to say…","use":"rejecting an extreme view"},{"p":"That's not necessarily the case.","use":"challenging a generalization"},{"p":"There's a case to be made for…","use":"acknowledging the other side"},{"p":"Generally speaking, …","use":"making a generalization safer"},{"p":"It seems to me that…","use":"giving a personal, tentative view"},{"p":"Admittedly, …","use":"conceding a point before you argue"}],"task":"In pairs, choose two statements from the Agree or Disagree activity. Student A gives a strong, extreme opinion. Student B rephrases it in a hedged, diplomatic way using at least two of the phrases, then adds their own view. Swap after each statement. 3 minutes."},"pron":{"focus":"Chunking and pausing in longer sentences","explain":"In longer sentences, fluent speakers group words into meaningful chunks, pause briefly between them (|) and stress one or two key words in each chunk. This makes complex ideas easier to follow and makes you sound calm and in control.","tip":"Read the sentence silently first and draw the | lines yourself. Then shadow it, and never pause in the middle of a chunk like “at the expense of”.","lines":[{"t":"If you never switch off, you'll burn out sooner or later.","m":"If you NEVer switch OFF, | you'll burn OUT | SOONer or LATer."},{"t":"It's hard to strike a balance between ambition and rest.","m":"It's HARD to strike a BALance | between amBItion and REST."},{"t":"I'm stretched thin, so I'm calling it a day.","m":"I'm STRETCHED THIN, | so I'm CALLing it a DAY."},{"t":"He built his career at the expense of his health.","m":"He built his caREER | at the exPENSE of his HEALTH."},{"t":"Once I'm off the clock, I really try to wind down.","m":"Once I'm OFF the CLOCK, | I REALly try to wind DOWN."}]},"acts":[{"type":"ranking","task":"Rank these from MOST to LEAST important for a healthy work-life balance.","items":["Flexible working hours","A supportive boss","Regular vacations","Exercise","Time with friends and family","A well-paid job"]},{"type":"agree","items":["Burnout is the employee's responsibility, not the company's.","A four-day workweek should be the norm.","Answering work emails after hours should be illegal.","Ambition always comes at the expense of something.","Hobbies are just as important as work.","The daily grind is an unavoidable part of adult life."]},{"type":"negotiation","sit":"A mid-sized marketing agency in Santiago. After months of being stretched thin, an experienced employee asks their manager for a more flexible arrangement. The meeting lasts 10 minutes, and you must agree on something concrete or agree to meet again.","a":{"role":"Employee: account manager, six years at the company, one of the best on the team","goal":"Get a four-day week OR two days working from home, plus no emails after 7 p.m.","limits":"You can't accept a pay cut of more than 10%. You're willing to be available for real emergencies. If you get nothing, you'll start looking for another job, but you'd honestly prefer to stay."},"b":{"role":"Manager of a team of eight","goal":"Keep this valuable employee happy without upsetting the rest of the team.","limits":"Two key clients need someone available Monday to Friday. You can't offer a four-day week on full pay. You can approve one remote day a week now, and maybe a second one after a three-month trial."}}],"ex":{"gap":{"items":[{"s":"If you keep working 70-hour weeks, you're going to ___.","a":"burn out/burn yourself out"},{"s":"It's almost 9 p.m., and we're all exhausted. Let's ___.","a":"call it a day"},{"s":"Many people want a successful career, but not ___ their health.","a":"at the expense of"},{"s":"Our support team works ___, 24 hours a day, seven days a week.","a":"around the clock"},{"s":"I never answer messages from my boss when I'm ___.","a":"off the clock"},{"s":"Between my job, my kids and my master's degree, I'm really ___ (= with too many responsibilities) right now.","a":"stretched thin/stretched too thin"}]},"match":{"pairs":[["wind down","relax gradually after activity or stress"],["switch off","stop thinking about work completely"],["juggle commitments","manage several responsibilities at once"],["strike a balance","find a good middle point between two things"],["the daily grind","the tiring, repetitive routine of work"],["set boundaries","decide clear limits on what you will and won't do"]]},"fix":{"items":[{"s":"He built his career on the expense of his health.","wrong":"on the expense of","fix":"at the expense of"},{"s":"We're all tired, so let's call it the day.","wrong":"call it the day","fix":"call it a day"},{"s":"After a stressful day, I need an hour to wind up before I can sleep.","wrong":"wind up","fix":"wind down"},{"s":"I've been working around the clock since three weeks.","wrong":"since three weeks","fix":"for three weeks"}]}},"rec":{"prompt":"How do you try to keep a healthy balance between work (or study) and the rest of your life? Is it working?","model":"To be honest, I'm still figuring it out. For years I worked around the clock because I thought that was what ambitious people did, and it came at the expense of my sleep and my friendships. Last year I came close to burning out, which was a real wake-up call. Since then, I've tried to set boundaries: I don't check email after eight, and on Sundays my phone stays in a drawer. It's not perfect. I still struggle to switch off when a big deadline is coming up, but I'd say I've managed to strike a balance that feels sustainable, at least for now.","use":["at the expense of","set boundaries","switch off","strike a balance"]},"tips":[{"who":"teacher","t":"Before the negotiation, give each pair two minutes to plan silently with their secret card. Afterwards, ask pairs to report their final deal and which hedging phrases helped them stay diplomatic."},{"who":"student","t":"Record yourself giving your opinion on one Agree or Disagree statement twice: first bluntly, then with hedging phrases. Listen and notice how different the two versions sound."},{"who":"student","t":"“Wind down” rhymes with “find”, not with the “wind” that blows: /waɪnd/."}]},{"id":"b1-personal","lv":"B1","tp":"personal","title":"Memories & Childhood","img":1989747,"goals":["talk about your childhood and family using phrasal verbs like grow up and take after","tell a short story about a memory and show interest when others tell theirs","pronounce -ed endings correctly when you tell a story in the past"],"warm":["Where did you grow up?","What was your favorite toy as a child?","Who was your best friend at school?","What smell or song brings back memories of your childhood?"],"model":{"kind":"text","title":"Grandma's House in Valparaíso","intro":"Javiera, an English student, wrote this short text about her childhood for her class blog.","paras":["I [[grew up]] in Valparaíso, a city on the coast with colorful houses and lots of hills. My parents worked long hours, so my grandma [[brought me up]] until I was ten. When I [[look back on]] those years, I always smile.","Grandma's house had a big garden with a lemon tree. I remember it [[like it was yesterday]]. I [[was crazy about]] climbing that tree, but I [[was afraid of]] her dog, Bruno, because he barked at everyone. My cousins lived next door, and I [[got along with]] them really well. We played soccer in the street until it got dark.","People say I [[take after]] my grandma: we're both stubborn, and we both love to talk! Last summer I visited the old house again. The lemon tree is still there. It was a real [[trip down memory lane]]."],"questions":[{"q":"Who brought Javiera up until she was ten?","opts":["Her grandma","Her parents","Her cousins"],"a":0},{"q":"What was Javiera afraid of?","opts":["Climbing the lemon tree","Playing in the street","Her grandma's dog"],"a":2},{"q":"How is Javiera similar to her grandma?","opts":["They both love gardening.","They're both stubborn and love to talk.","They both play soccer."],"a":1}]},"lang":[{"e":"grow up","t":"PV","d":"to change from a child into an adult","x":"I grew up in a small town near the coast.","s":"grow UP"},{"e":"bring up","t":"PV","d":"to take care of a child until they are an adult (also: raise)","x":"My grandparents brought me up.","s":"bring UP"},{"e":"look back on","t":"PV","d":"to remember something from the past","x":"I look back on my school days with a smile.","s":"look BACK on"},{"e":"get along with","t":"PV","d":"to have a good relationship with someone","x":"I get along really well with my sister.","s":"get aLONG with","uk":"UK: get on (well) with"},{"e":"take after","t":"PV","d":"to look or behave like an older relative","x":"I take after my dad. We're both very stubborn.","s":"TAKE AFter"},{"e":"make friends","t":"COL","d":"to start a friendship","x":"I made friends easily in elementary school.","s":"make FRIENDS"},{"e":"be afraid of","t":"PREP","d":"to feel fear about something","x":"I was afraid of the dark when I was little.","s":"be aFRAID of"},{"e":"be proud of","t":"PREP","d":"to feel pleased about something you or others did","x":"My parents were proud of my grades.","s":"be PROUD of"},{"e":"like it was yesterday","t":"ID","d":"very clearly, even though it happened a long time ago","x":"I remember my first day of school like it was yesterday.","s":"like it was YESterday"},{"e":"a trip down memory lane","t":"ID","d":"a time when you remember happy things from the past","x":"Looking at old photos with my mom was a real trip down memory lane.","s":"a TRIP down MEMory LANE"},{"e":"bring back memories","t":"COL","d":"to make you remember something from the past","x":"This song brings back so many memories of my teenage years.","s":"bring BACK MEMories"},{"e":"be crazy about","t":"PREP","d":"to like something or someone very much","x":"As a kid, I was crazy about dinosaurs.","s":"be CRAzy about"}],"func":{"title":"Telling a story and showing interest","when":"Use these when you share memories with friends, and when you listen to theirs.","phrases":[{"p":"When I was little, …","use":"starting a memory"},{"p":"I remember one time…","use":"starting a story"},{"p":"One day, …","use":"introducing the main event"},{"p":"Suddenly, …","use":"introducing a surprise"},{"p":"After that, …","use":"putting events in order"},{"p":"In the end, …","use":"finishing the story"},{"p":"Really? What happened next?","use":"showing interest"},{"p":"No way!","use":"showing surprise"},{"p":"That sounds like so much fun!","use":"reacting positively"},{"p":"Aw, that's so sweet.","use":"reacting to a touching story"}],"task":"In pairs, Student A tells a 2-minute story about a childhood memory using at least four storytelling phrases. Student B reacts at least three times and asks one follow-up question. Then swap."},"pron":{"focus":"-ed endings: /t/, /d/ and /ɪd/","explain":"Regular past verbs end in -ed, but -ed has three sounds: /t/ after voiceless sounds (walked, looked), /d/ after voiced sounds (played, smiled) and /ɪd/, an extra syllable, only after t or d (started, hated).","tip":"Don't add an extra syllable to every verb: “walked” is one syllable (“wokt”), not “walk-ed”. Only say “id” when the verb ends in a t or d sound.","lines":[{"t":"I grew up in a small town and walked to school.","m":"I grew UP in a SMALL TOWN | and WALKED to SCHOOL."},{"t":"I played with my cousins and made friends easily.","m":"I PLAYED with my COUSins | and made FRIENDS EAsily."},{"t":"I was afraid of dogs, so I hated going to the park.","m":"I was aFRAID of DOGS, | so I HATed going to the PARK."},{"t":"My parents were proud of me when I started school.","m":"My PARents were PROUD of me | when I STARTed SCHOOL."},{"t":"I looked back on those days and smiled.","m":"I looked BACK on those DAYS | and SMILED."}]},"acts":[{"type":"roulette","items":["Where did you grow up and what was it like?","Who do you take after in your family?","What were you afraid of as a child?","Who brought you up?","What's a happy memory you look back on?","Which family member do you get along with best?","How did you make friends at school?","What were you proud of as a kid?"]},{"type":"story","starters":["When I was eight years old, something strange happened at school…","My grandmother always told me one story…","The best birthday I ever had was…","I'll never forget the day I got lost…"]},{"type":"fluency","topics":["Your earliest memory","A teacher you remember well","A typical summer vacation when you were a kid","Your favorite place to play as a child","A family member you take after","Something you were crazy about as a kid"]}],"ex":{"gap":{"items":[{"s":"I ___ in Concepción, but now I live in Santiago.","a":"grew up"},{"s":"I ___ my mom. We have the same eyes and the same laugh.","a":"take after"},{"s":"When I was little, I was ___ the dark, so I slept with the light on.","a":"afraid of"},{"s":"I didn't ___ my brother when we were kids, but now we're best friends.","a":"get along with"},{"s":"This song always ___ of summers at the beach.","a":"brings back memories"},{"s":"I remember my tenth birthday ___. It was the best day ever!","a":"like it was yesterday"}]},"match":{"pairs":[["bring up","take care of a child until they are an adult"],["look back on","remember something from the past"],["make friends","start a friendship"],["be proud of","feel pleased about something you or others did"],["a trip down memory lane","a time when you remember happy things from the past"],["be crazy about","like something very much"]]},"fix":{"items":[{"s":"My grandparents brought up me.","wrong":"brought up me","fix":"brought me up"},{"s":"I was afraid to the dark when I was little.","wrong":"afraid to the dark","fix":"afraid of the dark"},{"s":"I growed up in a small town near Temuco.","wrong":"growed","fix":"grew"},{"s":"When I was child, I loved riding my bike.","wrong":"was child","fix":"was a child"}]}},"rec":{"prompt":"Describe a happy childhood memory. Where were you, who were you with, and why do you remember it?","model":"I grew up in La Serena, near the beach. When I look back on my childhood, I always think of Sunday lunches at my aunt's house. All my cousins were there, and after lunch we played soccer on the beach until it got dark. I remember one Sunday like it was yesterday: my uncle bought us all ice cream, and my little cousin dropped his in the sand. He cried so much! I was crazy about soccer back then, and I still love it today. Those Sundays were simple, but they were really special.","use":["grow up","look back on","like it was yesterday","be crazy about"]},"tips":[{"who":"teacher","t":"For the 4/3/2 activity, change partners each round and time it strictly. Afterwards, ask students what changed the third time. Most will notice they were faster and more fluent, which is the whole point."},{"who":"student","t":"Use “used to” for things you did often as a child: “I used to climb my grandma's lemon tree.” It makes your memories sound much more natural."},{"who":"student","t":"Find an old photo and describe it out loud for one minute using “I remember…”, “grow up” and “look back on”. Check your -ed endings!"}]},{"id":"b2-personal","lv":"B2","tp":"personal","title":"Turning Points","img":12712085,"goals":["talk about life-changing moments and decisions using idioms and phrasal verbs","tell a personal story with impact, building suspense and reflecting on what you learned","use weak forms in should have, could have and would have to talk about the past"],"warm":["What's the best decision you've ever made?","Have you ever changed your mind about something important?","Who has influenced you the most?","What's something you were afraid to do but did anyway?"],"model":{"kind":"dialogue","title":"From Banker to Baker","intro":"Tom runs into his old friend Isabel, who left her job at a bank to open a bakery.","lines":[{"sp":"Tom","t":"So, how's the bakery going? I still can't believe you left the bank!"},{"sp":"Isabel","t":"It's going really well, actually. Leaving was definitely [[a turning point]] for me."},{"sp":"Tom","t":"What made you do it? You had a great salary."},{"sp":"Isabel","t":"I know, but I was miserable. I [[went through]] a really tough year: long hours, no free time, and then my dad got sick."},{"sp":"Tom","t":"I had no idea. I'm so sorry."},{"sp":"Isabel","t":"Thanks, he's fine now. But it made me rethink everything. I'd always dreamed of opening a bakery, so one day I just [[took the plunge]]. The moment I [[made the decision]], I felt so much lighter."},{"sp":"Tom","t":"Weren't you scared?"},{"sp":"Isabel","t":"Terrified! I had to [[step out of my comfort zone]] big time. And I [[learned the hard way]] that you can't do everything yourself. The first three months, I barely slept."},{"sp":"Tom","t":"And now?"},{"sp":"Isabel","t":"Now I have two employees, and I actually get weekends off. [[In hindsight]], I should have done it years ago."},{"sp":"Tom","t":"Well, I'm really happy for you."},{"sp":"Isabel","t":"Thanks. And I'm [[grateful for]] friends like you who didn't think I was crazy."},{"sp":"Tom","t":"Oh, I definitely thought you were crazy. I just didn't say it!"}],"questions":[{"q":"Why did Isabel leave the bank?","opts":["She was unhappy and had a very difficult year.","She was fired.","Her dad asked her to help him."],"a":0},{"q":"What did Isabel learn the hard way?","opts":["That bakeries don't make money","That she should have stayed at the bank","That you can't do everything yourself"],"a":2},{"q":"What did Tom really think when Isabel quit?","opts":["That it was a great idea","That she was crazy","That she would be a great baker"],"a":1}]},"lang":[{"e":"a turning point","t":"ID","d":"a moment when an important change happens","x":"Moving abroad was a turning point in my life.","s":"a TURNing point"},{"e":"go through","t":"PV","d":"to experience a difficult situation","x":"She went through a hard time after college.","s":"go THROUGH"},{"e":"get over","t":"PV","d":"to recover from something bad","x":"It took me months to get over the breakup.","s":"get OVer"},{"e":"open up","t":"PV","d":"to talk honestly about your feelings","x":"It took me years to open up to my parents.","s":"open UP"},{"e":"learn the hard way","t":"ID","d":"to learn from a bad experience","x":"I learned the hard way that saving money matters.","s":"learn the HARD WAY","uk":"UK also: learnt the hard way"},{"e":"step out of your comfort zone","t":"ID","d":"to do something new or difficult","x":"Public speaking made me step out of my comfort zone.","s":"step OUT of your COMfort zone"},{"e":"make a decision","t":"COL","d":"to decide something","x":"I made the decision to change careers at 30.","s":"make a deCISion"},{"e":"be grateful for","t":"PREP","d":"to feel thankful for something","x":"I'm grateful for the teachers who believed in me.","s":"be GRATEful for"},{"e":"take the plunge","t":"ID","d":"to finally do something important or risky after thinking about it for a long time","x":"After years of renting, we finally took the plunge and bought an apartment.","s":"take the PLUNGE"},{"e":"in hindsight","t":"PREP","d":"looking back now, with what you know today","x":"In hindsight, I should have studied something different.","s":"in HINDsight","uk":"UK also: with hindsight"},{"e":"make a fresh start","t":"COL","d":"to begin again in a new way, leaving the past behind","x":"After the divorce, he moved to Puerto Varas to make a fresh start.","s":"make a FRESH START"},{"e":"work out","t":"PV","d":"to end in a successful way","x":"I was worried about changing jobs, but everything worked out in the end.","s":"work OUT"}],"func":{"title":"Telling a personal story with impact","when":"Use these to make your stories more engaging and to reflect on what an experience meant to you.","phrases":[{"p":"It all started when…","use":"beginning a story"},{"p":"At the time, I had no idea that…","use":"creating suspense"},{"p":"Out of nowhere, …","use":"introducing a surprise"},{"p":"That's when I realized…","use":"marking the key moment"},{"p":"I'll never forget the moment…","use":"emphasizing an important moment"},{"p":"To make a long story short, …","use":"skipping the less important details"},{"p":"The funny thing is…","use":"adding an unexpected detail"},{"p":"Looking back, …","use":"reflecting on the experience"},{"p":"If I hadn't…, I would never have…","use":"imagining a different past"},{"p":"It taught me that…","use":"giving the lesson you learned"}],"task":"In pairs, tell your partner about a decision that changed your life (big or small) in 2–3 minutes. Use at least five of the phrases, including one “If I hadn't…” sentence. Your partner ticks off each phrase they hear and asks one follow-up question. Then swap."},"pron":{"focus":"Weak forms: should have, could have, would have","explain":"When we talk about the past with should, could, would and might, “have” is almost never said in full. It becomes a weak /əv/ and links to the modal: “should have” sounds like “SHOULD-uv” and “wouldn't have” like “WOULD-n-uv”. The stress goes on the main verb and the key information, not on “have”.","tip":"Practice the chunks alone first (“shoulda, coulda, woulda”), then put them in the sentence. But never write “should of”: that's only how it sounds!","lines":[{"t":"I should have opened up sooner.","m":"I SHOULD‿have opened‿UP SOONer."},{"t":"I would never have gotten over it without my friends.","m":"I would NEVer‿have gotten‿OVer‿it | without my FRIENDS."},{"t":"I could have made a different decision.","m":"I could‿have MADE a DIFferent deCISion."},{"t":"If I hadn't taken the plunge, I wouldn't have grown so much.","m":"If I HADn't taken the PLUNGE, | I WOULDn't‿have GROWN so MUCH."},{"t":"In hindsight, it might have been the best thing that ever happened to me.","m":"In HINDsight, | it might‿have been the BEST thing | that EVer HAPpened to me."}]},"acts":[{"type":"minute","items":["A turning point in my life","Something I learned the hard way","A time I stepped out of my comfort zone","A person I'm grateful for","A difficult decision I made","Something I had to get over"]},{"type":"picture","prompts":["Describe what you can see in the photo.","What do you think this person is thinking about?","What decision might they be facing?","Have you ever been in a similar situation?"]},{"type":"podcast","title":"Turning Points: Real Stories","segments":["Intro: welcome the listeners, introduce the guests and today's theme (30 seconds).","The story: one guest describes a turning point in their life or a time they took the plunge.","Looking back: the host asks what the guest learned the hard way and what they would do differently.","Listener question: answer this message from a listener: “How do you know when it's time to make a big change?”","Wrap-up: each person gives one piece of advice, and the host closes the episode."]}],"ex":{"gap":{"items":[{"s":"It took me almost a year to ___ the breakup, but I'm fine now.","a":"get over"},{"s":"My grandfather never talked about his feelings, but last year he finally started to ___.","a":"open up"},{"s":"She ___ a really difficult time after her father died.","a":"went through"},{"s":"___, leaving that job was the best thing that could have happened to me.","a":"In hindsight"},{"s":"I was nervous about changing careers, but it all ___ in the end.","a":"worked out"},{"s":"I'm so ___ my family's support during that difficult time.","a":"grateful for"}]},"match":{"pairs":[["a turning point","a moment when an important change happens"],["learn the hard way","learn from a bad experience"],["step out of your comfort zone","do something new or difficult"],["take the plunge","finally do something risky after thinking about it for a long time"],["make a fresh start","begin again in a new way"],["make a decision","decide something"]]},"fix":{"items":[{"s":"I'm so grateful with all your help.","wrong":"grateful with","fix":"grateful for"},{"s":"If I wouldn't have moved to Chile, I wouldn't have met my wife.","wrong":"If I wouldn't have moved","fix":"If I hadn't moved"},{"s":"I'm going through a difficult time since January.","wrong":"I'm going through","fix":"I've been going through"},{"s":"I should have open up to my parents sooner.","wrong":"should have open up","fix":"should have opened up"}]}},"rec":{"prompt":"Talk about a turning point in your life. What happened, how did you feel, and what did you learn?","model":"A real turning point for me was when I moved from Rancagua to Santiago for college. I was eighteen, I didn't know anyone, and I'd never lived away from my family. For weeks I thought about staying home, but in the end I took the plunge. The first semester was tough. I learned the hard way how to cook, pay bills and manage my time. I once lived on instant noodles for a whole week! But I also made friends from all over Chile, and I became much more independent. In hindsight, it was the best decision I could have made.","use":["a turning point","take the plunge","learn the hard way","in hindsight"]},"tips":[{"who":"teacher","t":"Some students may think of sensitive stories. Remind the class that small turning points count too (a new hobby, a trip, a course) and that nobody has to share more than they want."},{"who":"student","t":"Write your own “If I hadn't…, I would never have…” sentence about a real decision and practice it until the weak “have” sounds natural."},{"who":"student","t":"End your stories with “In hindsight…” or “Looking back…” to sound more reflective and help your listener understand why the story matters."}]},{"id":"c1-personal","lv":"C1","tp":"personal","title":"Identity & Values","img":1134190,"goals":["discuss identity, values and personal change using sophisticated idioms and collocations","express personal beliefs with nuance, conviction and respect for other views","use contrastive stress to highlight the ideas that matter most"],"warm":["Which three words describe you best?","Have your values changed over time?","Is your personality more nature or nurture?","Is there a value you would never compromise on, even for a great job?"],"model":{"kind":"text","title":"Between Two Worlds","intro":"A personal essay by Tomás, a Chilean engineer who has lived in Toronto for twelve years, published on a blog about life abroad.","paras":["When I moved to Toronto at twenty-five, I thought my identity was fixed: I was Chilean, period. Within a year, though, I was apologizing to strangers who bumped into me and making small talk about the weather. My friends back home teased me about my new accent, and I began to feel that my habits were increasingly [[at odds with]] the person I thought I was.","For a long time, I tried to [[live up to]] everyone's expectations. My parents wanted me to stay exactly the same; my colleagues wanted me to blend in. It took me years to [[come to terms with]] the fact that I might never fully belong in either place, and that this was fine. Living between two cultures has [[shaped my identity]] far more than either country could have on its own.","What I eventually realized is that identity has less to do with where you're from than with your [[core values]]. Mine haven't changed much: loyalty, honesty and a slightly stubborn need to [[stand up for]] people who are treated unfairly. I suspect that last one [[stems from]] watching my mother, who never stayed quiet when something wasn't right.","These days, I've found [[a sense of belonging]] in unexpected places: a Sunday soccer league, a community choir, a group of other immigrants who also feel slightly out of place. I'm still [[set in my ways]] about some things (dinner before eight still feels wrong), but I've learned that you can belong somewhere [[regardless of]] where you were born."],"questions":[{"q":"What happened during Tomás's first year in Toronto?","opts":["He decided to return to Chile.","He stopped talking to his family.","His habits started to change in ways that surprised him."],"a":2},{"q":"Where does Tomás think his need to stand up for others comes from?","opts":["His colleagues in Canada","His mother's example","His soccer league"],"a":1},{"q":"What is the main idea of the essay?","opts":["Identity depends more on your values than on where you're from.","Living abroad always makes people lose their identity.","Your accent defines who you are."],"a":0}]},"lang":[{"e":"stand up for","t":"PV","d":"to defend a person or idea","x":"You should always stand up for what you believe in.","s":"stand UP for"},{"e":"live up to","t":"PV","d":"to be as good as people expect","x":"I felt pressure to live up to my parents' expectations.","s":"live UP to"},{"e":"come to terms with","t":"ID","d":"to accept a difficult situation","x":"He finally came to terms with his mistakes.","s":"come to TERMS with"},{"e":"wear your heart on your sleeve","t":"ID","d":"to show your emotions openly","x":"She wears her heart on her sleeve. You always know how she feels.","s":"wear your HEART on your SLEEVE"},{"e":"set in your ways","t":"ID","d":"unwilling to change habits or opinions","x":"My uncle is very set in his ways.","s":"SET in your WAYS"},{"e":"a sense of belonging","t":"COL","d":"the feeling of being accepted in a group","x":"Volunteering gave me a real sense of belonging.","s":"a SENSE of beLONGing"},{"e":"shape someone's identity","t":"COL","d":"to influence who someone becomes","x":"Living in three countries has shaped my identity.","s":"SHAPE someone's iDENtity"},{"e":"regardless of","t":"PREP","d":"without being affected by something","x":"Everyone deserves respect, regardless of their background.","s":"reGARDless of"},{"e":"at odds with","t":"PREP","d":"in disagreement or conflict with","x":"Her job was increasingly at odds with her values.","s":"at ODDS with"},{"e":"stem from","t":"PV","d":"to be the result of; to have its origin in","x":"His fear of failure stems from a very strict childhood.","s":"STEM from"},{"e":"core values","t":"COL","d":"the most important principles that guide your behavior","x":"Honesty is one of my core values, so I could never work for a company that lies to its clients.","s":"CORE VALues"},{"e":"march to the beat of your own drum","t":"ID","d":"to do things your own way, without caring what others think","x":"My aunt has always marched to the beat of her own drum. She went backpacking around Asia at sixty.","s":"march to the BEAT of your OWN DRUM"}],"func":{"title":"Expressing personal beliefs with nuance","when":"Use these to share deeply held views clearly but respectfully, especially when others may see things differently.","phrases":[{"p":"I'm a firm believer in…","use":"stating a strong belief"},{"p":"For me, it all comes down to…","use":"identifying the key point"},{"p":"What matters most to me is…","use":"prioritizing your values"},{"p":"I've come to realize that…","use":"showing how your view has changed"},{"p":"I'd like to think that…","use":"expressing a hopeful belief modestly"},{"p":"That's not to say that…","use":"preventing a misunderstanding"},{"p":"Where I draw the line is…","use":"setting a personal limit"},{"p":"I'm torn on this one.","use":"admitting mixed feelings"},{"p":"It depends on how you define…","use":"questioning a key term"},{"p":"I can see why some people feel that way, but personally…","use":"respecting a different view before giving yours"}],"task":"In pairs, choose three statements from the Agree or Disagree activity. For each one, explain your personal position in about a minute using at least three phrases, including “That's not to say that…”. Before replying, your partner must summarize your view in one sentence."},"pron":{"focus":"Contrastive stress","explain":"To contrast two ideas, we put extra stress on the words that carry the contrast (THEIR vs. MINE, WORK vs. NEIGHborhood), and the rest of the sentence becomes lighter and faster. This tells the listener exactly which part of your message matters.","tip":"Before you speak, ask yourself: “What am I contrasting?” Make those two words louder, longer and higher, and say everything else more quickly and quietly.","lines":[{"t":"It's not who you are, it's who you choose to be.","m":"It's NOT who you ARE, | it's who you CHOOSE to be."},{"t":"I don't want to live up to their expectations; I want to live up to mine.","m":"I don't want to live up to THEIR expectations; | I want to live up to MINE."},{"t":"She doesn't just stand up for herself, she stands up for everyone.","m":"She doesn't JUST stand up for herSELF, | she stands up for EVeryone."},{"t":"I'm not set in my ways; I just know what I like.","m":"I'm NOT set in my WAYS; | I just KNOW what I LIKE."},{"t":"I didn't find a sense of belonging at work; I found it in my neighborhood.","m":"I didn't find a sense of beLONGing at WORK; | I found it in my NEIGHborhood."}]},"acts":[{"type":"story","starters":["The moment I realized I had changed was…","Everyone expected me to…, but I decided to…","I once had to stand up for someone, and…","One conversation completely changed how I see myself…"]},{"type":"agree","items":["Our personality is fixed by the age of 20.","Social media makes it harder to know who you really are.","It's better to keep your emotions to yourself at work.","People who a
