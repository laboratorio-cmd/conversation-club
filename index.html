 it's a good story and it confirms what people already expect. To change their minds, I don't think statistics are enough. You'd have to show them how easily our memory tricks us.","use":["buy into","far-fetched","a grain of truth","in the face of"]},"tips":[{"who":"teacher","t":"During the expert interview, choose one student as a 'fact-checker' who notes every claim that isn't backed up. At the end, they challenge those claims using the functional phrases."},{"who":"student","t":"When you see a viral claim online, practice challenging it out loud: 'What's that based on?' 'Couldn't there be a simpler explanation?' This makes the phrases automatic in real discussions."},{"who":"student","t":"Notice the American and British forms: Americans say 'in light of' and 'take it with a grain of salt'; British speakers often say 'in the light of' and 'with a pinch of salt'. Choose one variety and be consistent."}]},{"id":"b1-hobbies","lv":"B1","tp":"hobbies","title":"Free Time Activities","img":19598115,"goals":["talk about your free-time activities using phrasal verbs like take up, give up and work out","invite people to do activities and accept or decline politely","pronounce -ed endings correctly when you talk about the past"],"warm":["What do you do in your free time?","Do you have a hobby you love?","What hobby would you like to try?","Is there a hobby you gave up? Why did you stop?"],"model":{"kind":"dialogue","title":"Never Too Late for a New Hobby","intro":"Diego runs into his friend Emily at a café in Santiago on a Saturday morning.","lines":[{"sp":"Emily","t":"Diego! You look great. Have you been [[working out]]?"},{"sp":"Diego","t":"Thanks! Actually, I [[took up]] climbing in March. I [[signed up for]] a beginners' class at a gym near my office."},{"sp":"Emily","t":"Climbing? Isn't that really hard?"},{"sp":"Diego","t":"At first, yes. My arms hurt for days! But I'm starting to [[get the hang of]] it, and the people are great. We [[had a blast]] at a small competition last weekend."},{"sp":"Emily","t":"That's so cool. I used to play the piano, but I [[gave it up]] when I started college."},{"sp":"Diego","t":"Why don't you start again?"},{"sp":"Emily","t":"I don't know. These days I'm a bit of a [[couch potato]]. [[In my spare time]], I just watch shows on my laptop."},{"sp":"Diego","t":"Come on! You could [[join a club]]. My cousin is in a choir, and they meet on Tuesday evenings."},{"sp":"Emily","t":"Hmm, I'm not really into singing. But maybe I should [[spend time]] practicing the piano again."},{"sp":"Diego","t":"Great idea! Or come climbing with me next Saturday. The first class is free."},{"sp":"Emily","t":"OK, OK, I'll try it. But if I fall, you're buying lunch!"}],"questions":[{"q":"What hobby did Diego take up?","opts":["Climbing","The piano","Singing"],"a":0},{"q":"Why did Emily give up the piano?","opts":["She hurt her arm.","She started college.","She joined a choir."],"a":1},{"q":"What does Emily do in her spare time now?","opts":["She sings in a choir.","She goes climbing.","She watches shows on her laptop."],"a":2}]},"lang":[{"e":"take up","t":"PV","d":"to start a new hobby or activity","x":"I took up yoga last year.","s":"take UP"},{"e":"give up","t":"PV","d":"to stop doing something","x":"I gave up the guitar because I had no time.","s":"give UP"},{"e":"work out","t":"PV","d":"to do physical exercise","x":"I work out three times a week.","s":"work OUT"},{"e":"sign up for","t":"PV","d":"to register for a class, course or activity","x":"I signed up for a salsa class on Thursday evenings.","s":"sign UP for"},{"e":"get the hang of","t":"ID","d":"to learn how to do something after some practice","x":"Snowboarding is hard at first, but you'll get the hang of it.","s":"get the HANG of"},{"e":"a couch potato","t":"ID","d":"a person who watches a lot of TV and doesn't exercise","x":"On rainy Sundays, I'm a total couch potato.","s":"a COUCH poTAto"},{"e":"have a blast","t":"ID","d":"to have a really good time (informal)","x":"We had a blast at the climbing gym last night.","s":"have a BLAST"},{"e":"join a club","t":"COL","d":"to become a member of a group","x":"I joined a running club in my neighborhood.","s":"join a CLUB"},{"e":"spend time","t":"COL","d":"to use your time doing something","x":"I spend a lot of time reading.","s":"SPEND TIME"},{"e":"go for a walk","t":"COL","d":"to walk for pleasure","x":"Let's go for a walk after lunch.","s":"go for a WALK"},{"e":"be into","t":"PREP","d":"to like something a lot (informal)","x":"My sister is really into photography.","s":"be INto","uk":"UK: be keen on"},{"e":"in my spare time","t":"PREP","d":"when I am not working or studying","x":"In my spare time, I paint and cook.","s":"in my SPARE TIME"}],"func":{"title":"Making, accepting and declining invitations","when":"Use these when you invite a friend to do an activity with you, or when you answer an invitation.","phrases":[{"p":"Do you want to … this weekend?","use":"inviting (informal)"},{"p":"Why don't we …?","use":"making a suggestion"},{"p":"How about going … on Saturday?","use":"suggesting a plan"},{"p":"Are you free on …?","use":"checking if someone is available"},{"p":"Sounds great! I'm in.","use":"accepting with enthusiasm"},{"p":"Sure, why not?","use":"accepting casually"},{"p":"I'd love to, but I can't. I have to …","use":"declining politely with a reason"},{"p":"Maybe next time?","use":"declining but leaving the door open"},{"p":"I'm not really into …, but we could …","use":"declining and suggesting something else"},{"p":"What time should we meet?","use":"making arrangements"}],"task":"Write down three activities you'd like to do this weekend. In pairs, invite your partner to each one. Your partner accepts one, declines one politely with a reason, and suggests something different for the third. Finish by agreeing on a day, a time and a place."},"pron":{"focus":"Past tense -ed endings: /t/, /d/, /ɪd/","explain":"Regular past verbs end in -ed, but -ed has three sounds: /t/ after voiceless sounds like k, p, s, sh and ch (worked, watched); /d/ after voiced sounds (joined, signed, played); and /ɪd/, an extra syllable, only after t or d (started, decided). When the next word starts with a vowel, the -ed sound links to it: 'worked‿out'.","tip":"Don't add an extra syllable to most -ed verbs: 'worked' has ONE syllable, not 'work-ed'. Only add the extra syllable after t or d.","lines":[{"t":"I worked out this morning.","m":"I WORKED‿OUT this MORNing."},{"t":"I joined a club last year.","m":"I JOINED‿a CLUB last YEAR."},{"t":"We signed up for a salsa class.","m":"We SIGNED‿UP for a SALsa CLASS."},{"t":"She started painting in March.","m":"She STARTed PAINTing in MARCH."},{"t":"I decided to take up yoga.","m":"I deCIDed to TAKE‿UP YOga."}]},"acts":[{"type":"ranking","task":"Rank these hobbies from MOST to LEAST interesting for you.","items":["Cooking","Video games","Photography","Playing a sport","Reading","Gardening"]},{"type":"wyr","items":[["Read a book","Watch a movie"],["Play a team sport","Do an individual sport"],["Learn to cook","Learn to dance"],["Spend a weekend camping","Spend a weekend at a spa"],["Collect something","Create something"],["Play video games all day","Never play them again"]]},{"type":"fluency","topics":["A hobby you love: how you started, how often you do it and why you like it","A hobby you gave up: what happened?","Your perfect weekend: what you do in your spare time","A new activity you'd like to take up, and why","A time you had a blast doing something for the first time"]}],"ex":{"gap":{"items":[{"s":"I ___ yoga last year, and now I do it every morning.","a":"took up"},{"s":"I ___ the guitar because I didn't have time to practice.","a":"gave up"},{"s":"I ___ at the gym three times a week.","a":"work out"},{"s":"It's a beautiful day. Let's ___ in the park!","a":"go for a walk"},{"s":"Snowboarding is difficult at first, but after a few days you ___ it.","a":"get the hang of"},{"s":"I ___ (sign) a pottery class at the community center. It starts next Monday.","a":"signed up for"}]},"match":{"pairs":[["take up","start a new hobby"],["give up","stop doing something"],["work out","do exercise"],["a couch potato","a person who watches a lot of TV and doesn't exercise"],["have a blast","have a really good time"],["get the hang of","learn how to do something with practice"]]},"fix":{"items":[{"s":"In my spare time I like go for a walk.","wrong":"like go","fix":"like to go"},{"s":"I want to make exercise every day.","wrong":"make exercise","fix":"work out"},{"s":"I spend a lot of time to read.","wrong":"to read","fix":"reading"},{"s":"I gave up to play the guitar last year.","wrong":"to play","fix":"playing"}]}},"rec":{"prompt":"Talk about a hobby you have or want to take up. How did you start (or how will you start), and why do you enjoy it?","model":"In my spare time, I love cooking, but last year I decided to take up something completely different: salsa dancing. A friend invited me to a free class, and I had a blast, so I signed up for a course on Wednesday evenings. At first I was terrible. I always stepped on my partner's feet! But after a couple of months, I started to get the hang of it. Now I dance twice a week. It's great because I don't need to work out at the gym anymore, and I've made a lot of new friends.","use":["take up","in my spare time","get the hang of","work out"]},"tips":[{"who":"teacher","t":"In the 4/3/2 activity, time each round strictly and change partners quickly. After round 3, ask students what got easier. They usually notice they were faster and more fluent."},{"who":"student","t":"Make a vocabulary list for YOUR hobbies: the equipment, the places and the verbs (for climbing: harness, wall, 'reach the top'). You'll need these words when people ask about your free time."},{"who":"student","t":"When someone asks 'What do you do in your free time?', don't just say 'I like reading.' Add when, how often and why: 'In my spare time, I read, mostly thrillers. I usually read before bed.'"}]},{"id":"b2-hobbies","lv":"B2","tp":"hobbies","title":"Passions & Pastimes","img":10354612,"goals":["describe how you got into your hobbies and what they mean to you using idiomatic language","discuss the pros and cons of turning a hobby into a side hustle","keep a conversation going with follow-up questions and natural question intonation"],"warm":["How did you get into your favorite hobby?","Do hobbies help you deal with stress?","Have you ever made money from a hobby?","Is there a popular hobby that you think is overrated?"],"model":{"kind":"dialogue","title":"From Hobby to Side Hustle","intro":"Three coworkers, Paula, Ben and Tomás, are chatting over coffee during a break.","lines":[{"sp":"Ben","t":"Paula, I saw your ceramics on Instagram. They're amazing! How did you [[get into]] pottery?"},{"sp":"Paula","t":"Totally by chance. A friend dragged me to a workshop two years ago, and I [[got hooked]] right away. Now it's how I [[unwind after work]]."},{"sp":"Tomás","t":"And you sell your pieces now, right?"},{"sp":"Paula","t":"Yeah, it's become a little [[side hustle]]. Last year I [[took the plunge]] and bought my own kiln. It wasn't cheap!"},{"sp":"Ben","t":"Would you ever do it [[for a living]]?"},{"sp":"Paula","t":"Honestly, I'm not sure. Right now it's [[a labor of love]]. I spend hours on each piece, and I don't really make money. If it became my job, I might stop enjoying it."},{"sp":"Tomás","t":"I get that. I [[picked up]] the guitar during lockdown, and I love it. But when a friend asked me to play at her wedding, it suddenly felt like work."},{"sp":"Ben","t":"Well, I don't really have a hobby. I just scroll on my phone to [[kill time]]."},{"sp":"Paula","t":"Then come to my studio on Saturday! You should [[try your hand at]] the wheel."},{"sp":"Ben","t":"Me? I'm terrible with my hands."},{"sp":"Paula","t":"Everybody is at first. Just [[stick with]] it for a few classes, and you'll see."},{"sp":"Tomás","t":"Careful, Ben. Paula's very [[passionate about]] this. You won't escape!"}],"questions":[{"q":"How did Paula get into pottery?","opts":["A friend took her to a workshop.","She saw it on Instagram.","She studied it in college."],"a":0},{"q":"Why isn't Paula sure about doing pottery for a living?","opts":["She doesn't have a kiln.","She's afraid she'd stop enjoying it.","She's too busy at work."],"a":1},{"q":"What does Ben usually do to kill time?","opts":["He plays the guitar.","He makes ceramics.","He scrolls on his phone."],"a":2}]},"lang":[{"e":"get into","t":"PV","d":"to become interested in something","x":"How did you get into photography?","s":"get INto"},{"e":"get hooked on","t":"PV","d":"to become very enthusiastic about something, almost addicted","x":"I got hooked on chess during lockdown.","s":"get HOOKED on"},{"e":"pick up","t":"PV","d":"to learn something informally","x":"I picked up some guitar chords on YouTube.","s":"pick UP"},{"e":"stick with","t":"PV","d":"to continue doing something, even when it's difficult","x":"The violin is hard at first, but if you stick with it, you'll improve.","s":"STICK with"},{"e":"try your hand at","t":"ID","d":"to try doing something for the first time","x":"I'd love to try my hand at surfing.","s":"TRY your HAND at","uk":"UK: have a go at"},{"e":"a labor of love","t":"ID","d":"hard work done for pleasure, not money","x":"Restoring this old car was a labor of love.","s":"a LAbor of LOVE","uk":"UK: a labour of love"},{"e":"take the plunge","t":"ID","d":"to finally decide to do something new or risky","x":"I finally took the plunge and bought a pottery wheel.","s":"take the PLUNGE"},{"e":"kill time","t":"COL","d":"to do something while you wait","x":"I play games on my phone to kill time.","s":"KILL TIME"},{"e":"unwind after work","t":"COL","d":"to relax after a busy day","x":"Painting helps me unwind after work.","s":"unWIND after WORK"},{"e":"a side hustle","t":"COL","d":"work you do to earn extra money besides your main job, often based on a hobby (informal)","x":"Her baking side hustle now earns more than her day job.","s":"a SIDE hustle"},{"e":"passionate about","t":"PREP","d":"having very strong feelings for something","x":"He's passionate about cycling.","s":"PASSionate about"},{"e":"for a living","t":"PREP","d":"as your job, to earn money","x":"Could you imagine taking photos for a living?","s":"for a LIVing"}],"func":{"title":"Showing interest and asking follow-up questions","when":"Use these to keep a conversation going when someone talks about their interests.","phrases":[{"p":"Oh, really? How did you get into that?","use":"asking how it started"},{"p":"What do you like most about it?","use":"asking for reasons"},{"p":"How long have you been doing it?","use":"asking about time"},{"p":"Is it hard to get started?","use":"asking about difficulty"},{"p":"That sounds like a lot of fun!","use":"showing enthusiasm"},{"p":"I've always wanted to try that.","use":"connecting it to your own interests"},{"p":"Wait, so you actually…?","use":"showing surprise and checking"},{"p":"No kidding! I had no idea you were into…","use":"surprise (informal)"},{"p":"I can see why you love it.","use":"showing understanding"},{"p":"So what's next for you?","use":"asking about future plans"}],"task":"Talk to your partner about a hobby for three minutes. The listener can't talk about themselves: they can only react and ask follow-up questions (at least five phrases from the list). Then swap. Who found out the most surprising detail?"},"pron":{"focus":"Intonation in questions: yes/no ↗ vs. wh- ↘","explain":"In American English, yes/no questions usually rise at the end (↗), while wh- questions (how, what, why…) usually fall (↘). Short reactions like 'Really?' rise to show interest. A flat voice can sound bored, even when your words are friendly.","tip":"Exaggerate the melody when you practice; it will sound normal when you speak. Record yourself asking 'How did you get into it?' and check that your voice falls at the end.","lines":[{"t":"How did you get into pottery?","m":"How did you get‿INto POTtery? ↘"},{"t":"Have you ever tried your hand at surfing?","m":"Have you EVer TRIED your HAND‿at SURFing? ↗"},{"t":"What do you do to unwind after work?","m":"What do you DO to unWIND‿after WORK? ↘"},{"t":"Really? You do it for a living?","m":"REALly? ↗ | You DO‿it for a LIVing? ↗"},{"t":"Are you still passionate about it?","m":"Are you STILL PASSionate‿aBOUT‿it? ↗"}]},"acts":[{"type":"minute","items":["How I got into my favorite hobby","A hobby I got hooked on","Something I'd love to try my hand at","How I unwind after a long day","A labor of love in my life","Hobbies that are too expensive"]},{"type":"agree","items":["Video games are a waste of time.","Everyone should have at least one creative hobby.","Turning your hobby into your job is a bad idea.","Expensive hobbies are only for rich people.","Team sports teach more than individual sports.","Adults don't have time for hobbies."]},{"type":"pitch","brief":"Turn a hobby into a side hustle! In groups, choose one idea (or invent your own), plan a small business around it and pitch it to the 'investors' (the rest of the class) in two minutes. Explain who your customers are, how much you'll charge and why people will pay for it.","ideas":["Weekend pottery workshops for stressed office workers","A guitar app that teaches only the songs each user wants to play","Bike tours of Santiago led by passionate local cyclists","A board game café where staff teach you new games","Custom illustrations of people's pets, sold online"],"questions":["Who exactly is your customer, and how will you reach them?","How much will you charge, and why would people pay that?","How many hours a week can you realistically spend on this?","What happens if you stop enjoying it once it becomes work?","What makes your idea different from what's already out there?","How will you know if it's working after six months?"]}],"ex":{"gap":{"items":[{"s":"I got completely ___ chess during lockdown. I couldn't stop playing, even at 3 a.m.!","a":"hooked on"},{"s":"I never took lessons. I just ___ a few songs from YouTube videos.","a":"picked up"},{"s":"My flight is delayed, so I'm reading a magazine to ___.","a":"kill time"},{"s":"Building this treehouse for my kids took months, but it was ___.","a":"a labor of love"},{"s":"After years of thinking about it, she finally ___ and opened her own bakery.","a":"took the plunge"},{"s":"He works as a nurse, but he sells his photos online as ___.","a":"a side hustle"}]},"match":{"pairs":[["get into","become interested in"],["try your hand at","try something for the first time"],["stick with","continue even when it's difficult"],["unwind after work","relax at the end of the workday"],["for a living","as your job"],["passionate about","having very strong feelings for"]]},"fix":{"items":[{"s":"I'm very passionate for cycling.","wrong":"passionate for","fix":"passionate about"},{"s":"How did you get in photography?","wrong":"get in","fix":"get into"},{"s":"I'd love to try my hand at surf.","wrong":"at surf","fix":"at surfing"},{"s":"She makes ceramics for living.","wrong":"for living","fix":"for a living"}]}},"rec":{"prompt":"Describe a hobby you're passionate about (or one you'd like to try). How did you get into it, and would you ever turn it into a side hustle?","model":"I'm really passionate about cooking, especially Peruvian food. I got into it about five years ago, when a Peruvian coworker brought ceviche to an office party and I asked her for the recipe. Now cooking is how I unwind after work: I put on some music, open a bottle of wine and forget about my emails. A few friends have told me I should start a side hustle selling lunch boxes, and I'll admit I've thought about it. But honestly, I'm not sure I'd enjoy it as much if I had to cook for strangers every day. For now, it's just for me and the people I love.","use":["passionate about","get into","unwind after work","a side hustle"]},"tips":[{"who":"teacher","t":"Before the pitch, give each 'investor' an imaginary budget of $10,000 to divide among the ideas. At the end, reveal which group got the most money and ask investors to justify their choices."},{"who":"student","t":"Prepare a one-minute answer about your own hobby: how you got into it, what you love about it and something you'd still like to try your hand at. Practice it until it feels natural. It's perfect for small talk."},{"who":"student","t":"Follow-up questions are your secret weapon. One good question ('What got you started?') keeps a conversation going much longer than a comment about yourself."}]},{"id":"c1-hobbies","lv":"C1","tp":"hobbies","title":"Obsessions & Expertise","img":1040157,"goals":["discuss expertise, practice and obsession using sophisticated idioms such as second nature and a jack of all trades","persuade others and make concessions diplomatically","divide long sentences into thought groups with natural pausing"],"warm":["Can a hobby become an obsession?","Is it better to be excellent at one thing or good at many?","What does it take to master a skill?","Have you ever gone down an internet rabbit hole? What was it about?"],"model":{"kind":"text","title":"Is 10,000 Hours Really the Magic Number?","intro":"An extract from a podcast episode about expertise, obsession and the joy of amateur hobbies.","paras":["You've probably heard of the '10,000-hour rule': practice anything for ten thousand hours and you'll become world-class. It's a seductive idea, popularized by a bestselling book in 2008. The trouble is that Anders Ericsson, the psychologist whose research inspired it, felt it had been badly oversimplified. What mattered in his studies wasn't just the number of hours but the kind of practice: focused, uncomfortable sessions that target your weaknesses, ideally with expert feedback. Mindlessly repeating what you can already do won't [[hone your skills]]; it just makes your mistakes [[second nature]].","That kind of practice is exhausting, though. Anyone who has taken up an instrument as an adult knows it involves [[a steep learning curve]], and plenty of people quit before they've even [[learned the ropes]]. Others go the opposite way: they [[go down a rabbit hole]], [[delve into]] every forum and tutorial, and pursue their hobby [[to the point of]] obsession.","So is it better to be a specialist or [[a jack of all trades]]? Some researchers argue that sampling widely before specializing pays off, because skills transfer in unexpected ways. A painter who [[branches out]] into photography may start to see light differently; a chess player who tries poker learns to think in probabilities.","Maybe the real question is why we have hobbies at all. If you play the piano [[for the sake of]] pleasure rather than performance, you don't need ten thousand hours. You just need to enjoy the next one, and ideally find a few people to [[geek out]] with."],"questions":[{"q":"According to the speaker, what did Ericsson think mattered most?","opts":["The total number of hours","The type and quality of practice","Natural talent"],"a":1},{"q":"Why do many adults quit a new instrument?","opts":["The first months are very hard.","Lessons are too expensive.","They become obsessed with it."],"a":0},{"q":"What is the speaker's final point?","opts":["Everyone should specialize early.","Ten thousand hours is the minimum for any hobby.","You don't need to become an expert to enjoy a hobby."],"a":2}]},"lang":[{"e":"delve into","t":"PV","d":"to explore a subject in detail","x":"I love delving into the history of chess openings.","s":"DELVE into"},{"e":"branch out","t":"PV","d":"to expand into a new area","x":"After painting, I branched out into sculpture.","s":"branch OUT"},{"e":"geek out","t":"PV","d":"to talk about or do something you're very enthusiastic about, in great detail (informal)","x":"My brother and I can geek out over vintage synthesizers for hours.","s":"geek OUT"},{"e":"a jack of all trades","t":"ID","d":"someone who can do many things, but none perfectly","x":"I'm a jack of all trades, master of none.","s":"a JACK of all TRADES"},{"e":"learn the ropes","t":"ID","d":"to learn the basics of something","x":"It took me a month to learn the ropes.","s":"learn the ROPES"},{"e":"second nature","t":"ID","d":"something you do automatically","x":"After years of practice, it's second nature.","s":"SECond NAture"},{"e":"go down a rabbit hole","t":"ID","d":"to become completely absorbed in a topic, moving from one thing to the next (often online)","x":"I went down a rabbit hole about medieval bookbinding and lost my whole Sunday.","s":"go down a RABbit hole"},{"e":"hone your skills","t":"COL","d":"to improve your skills through practice","x":"He spends hours honing his skills.","s":"HONE your SKILLS"},{"e":"devote time to","t":"COL","d":"to give a lot of time to something","x":"She devotes most of her free time to climbing.","s":"deVOTE TIME to"},{"e":"a steep learning curve","t":"COL","d":"a situation where you have to learn a lot very quickly","x":"Woodworking has a steep learning curve, but the first year is the hardest.","s":"a STEEP LEARNing curve"},{"e":"for the sake of","t":"PREP","d":"for the benefit or purpose of","x":"I don't play for the sake of winning; I play because I love the game.","s":"for the SAKE of"},{"e":"to the point of","t":"PREP","d":"to such a degree that something else happens","x":"She's dedicated to the point of obsession.","s":"to the POINT of"}],"func":{"title":"Persuading and making concessions","when":"Use these in friendly arguments or negotiations, when you want to convince someone but also show that you've listened.","phrases":[{"p":"I take your point, but…","use":"acknowledging, then disagreeing"},{"p":"Granted, it's expensive, but…","use":"conceding a fact before your argument"},{"p":"Admittedly, …","use":"admitting a weakness in your position"},{"p":"That's a fair point.","use":"conceding"},{"p":"Hear me out.","use":"asking for a chance to explain"},{"p":"Wouldn't it be worth…?","use":"persuading with a question"},{"p":"I'm not asking you to…, just to…","use":"making your request smaller"},{"p":"Let me put it another way.","use":"rephrasing to persuade"},{"p":"What if we met halfway?","use":"proposing a compromise"},{"p":"Would you be open to…?","use":"a tentative suggestion"}],"task":"Choose a 'big hobby decision' (buying a $3,000 bike, spending every Saturday at chess tournaments, turning the spare room into a home studio). Student A has three minutes to persuade Student B, who starts strongly against it. B must concede at least two points before making a final decision. Then swap roles with a new decision."},"pron":{"focus":"Chunking and pausing (thought groups)","explain":"Fluent speakers divide long sentences into thought groups: short chunks of meaning, each with one main stress. A short pause (|) between chunks gives listeners time to process, and the words inside a chunk are linked together. Pausing in the wrong place, for example between 'hone' and 'your skills', makes an idea harder to follow.","tip":"Before you read a sentence aloud, mark the chunks with a pencil. Breathe at the pauses, never in the middle of a chunk, and put the main stress near the end of each chunk.","lines":[{"t":"After years of practice, it's become second nature.","m":"After YEARS of PRACtice, | it's become SECond NAture."},{"t":"I'm a jack of all trades, master of none.","m":"I'm a JACK of all TRADES, | MASter of NONE."},{"t":"If you want to hone your skills, you need honest feedback.","m":"If you WANT to HONE your SKILLS, | you need HONest FEEDback."},{"t":"She took up painting, then branched out into sculpture.","m":"She TOOK‿UP PAINTing, | then BRANCHED‿OUT‿into SCULPture."},{"t":"It took me a month to learn the ropes and a year to feel confident.","m":"It TOOK me a MONTH | to learn the ROPES | and a YEAR | to feel CONfident."}]},"acts":[{"type":"wyr","items":[["Be an expert in one hobby","Be quite good at ten hobbies"],["Devote 10,000 hours to one skill","Try a new hobby every month"],["Win a competition","Teach your hobby to others"],["Earn money from your hobby","Keep it just for fun"],["Learn the ropes alone","Learn with an expensive coach"],["Own a famous collection","Create a famous work of art"]]},{"type":"roleplay","cards":[{"sit":"Convincing a friend to join your hobby.","a":"You are passionate about a hobby (choose one). Convince your friend to try it with you this weekend.","b":"You're not interested and you have lots of excuses. Ask difficult questions before you agree or refuse."},{"sit":"A family discussion.","a":"Your partner spends all their free time and money on a hobby. Express your concerns diplomatically.","b":"Your hobby is your passion and helps you unwind. Defend it and suggest a compromise."}]},{"type":"devil","motions":["It's better to be a jack of all trades than a master of one.","Talent matters more than practice.","Parents should push children to master one skill from an early age.","Turning a passion into a career is the fastest way to ruin it.","Going down internet rabbit holes is a waste of time.","Competitive hobbies do more harm than good."]}],"ex":{"gap":{"items":[{"s":"When I joined the climbing gym, an instructor spent my first week helping me ___.","a":"learn the ropes"},{"s":"I've been driving for twenty years, so changing gears is ___ for me.","a":"second nature"},{"s":"She started with watercolors and later ___ (branch) into oil painting and printmaking.","a":"branched out"},{"s":"I only meant to check one fact, but I ___ and spent three hours reading about Viking ships.","a":"went down a rabbit hole"},{"s":"Professional musicians spend hours every day ___ their skills.","a":"honing"},{"s":"He loves fishing ___ obsession. He even takes his rod on business trips.","a":"to the point of"}]},"match":{"pairs":[["delve into","explore a subject in depth"],["a jack of all trades","someone who can do many different things"],["a steep learning curve","a lot to learn in a short time"],["geek out","get very excited about a niche interest"],["for the sake of","for the purpose or benefit of"],["devote time to","give a lot of time to"]]},"fix":{"items":[{"s":"It took me months to learn the rope.","wrong":"learn the rope","fix":"learn the ropes"},{"s":"She devotes all her weekends to climb.","wrong":"to climb","fix":"to climbing"},{"s":"After years of painting, he branched off into sculpture.","wrong":"branched off","fix":"branched out"},{"s":"Playing the cello has become a second nature to me.","wrong":"a second nature","fix":"second nature"}]}},"rec":{"prompt":"Is it better to master one skill or to be a jack of all trades? Use your own hobbies and experience as examples.","model":"Personally, I've always been a jack of all trades. I've played the guitar, done some photography and even tried woodworking, but I've never stuck with anything long enough to become truly good. For years I saw that as a weakness, but I've changed my mind. Every time I branch out into something new, I take something from the last hobby with me: photography taught me to notice light and composition, which helped a lot when I started sketching. That said, I envy people who devote years to one craft and hone their skills until the hardest parts become second nature. There's a depth there that a dabbler like me will never experience. So maybe the ideal is to sample widely when you're young, and then commit.","use":["a jack of all trades","branch out","hone your skills","second nature"]},"tips":[{"who":"teacher","t":"In the devil's advocate activity, signal the switch with a sound halfway through. Students who argued passionately for a motion now have to argue against it. Afterward, ask which side was harder to defend and why."},{"who":"student","t":"Notice how skilled speakers concede before they disagree ('Granted…, but…'). In your next discussion, concede one point before making yours. It sounds more persuasive, not weaker."},{"who":"student","t":"Pick a niche interest and geek out about it in English: follow a specialist channel or forum and note five technical words. Explaining your passion in detail is excellent C1 practice."}]},{"id":"b1-food","lv":"B1","tp":"food","title":"Food & Eating Out","goals":["talk about your eating habits using common food expressions","order food and make polite requests in a restaurant","plan a meal out with friends, from choosing a place to paying the check"],"warm":["What did you have for breakfast today?","How often do you eat out, and where do you usually go?","What's a Chilean dish that every visitor should try?","Do you prefer cooking at home or ordering takeout? Why?"],"model":{"kind":"dialogue","title":"Lunch Break","intro":"Camila and her coworker Jake are hungry, so they go out for lunch near their office in Santiago.","lines":[{"sp":"Jake","t":"I'm starving. Do you want to [[grab a bite]]?"},{"sp":"Camila","t":"Sure! What are you [[in the mood for]]?"},{"sp":"Jake","t":"Something fast. There's a new burger place on the corner."},{"sp":"Camila","t":"Hmm, I'm trying to [[cut down on]] fast food."},{"sp":"Jake","t":"They have salads too. Come on, let's go before it gets busy."},{"sp":"Server","t":"Hi, guys! Are you ready to order?"},{"sp":"Camila","t":"Yes. Could I get the chicken salad, please? Oh, and I'm [[allergic to]] nuts."},{"sp":"Server","t":"No problem. I'll tell the kitchen. And for you?"},{"sp":"Jake","t":"I'll have the cheeseburger with fries, please."},{"sp":"Server","t":"Sorry, we just [[ran out of]] regular fries. Would you like sweet potato fries instead?"},{"sp":"Jake","t":"Sure, that sounds good."},{"sp":"Camila","t":"That was delicious! We should [[eat out]] together more often. So, do you want to [[split the check]]?"},{"sp":"Jake","t":"No way. [[It's on me]]. You paid last time."},{"sp":"Camila","t":"Thanks! Next time, let's [[make a reservation]]. This place is getting really popular."}],"questions":[{"q":"Why isn't Camila sure about the burger place?","opts":["She's allergic to beef.","She's trying to eat less fast food.","It's too far from the office."],"a":1},{"q":"What's the problem with Jake's order?","opts":["The restaurant has no regular fries left.","His burger is cold.","The kitchen forgot it."],"a":0},{"q":"Who pays for lunch, and why?","opts":["They split it because it's fair.","Camila, because Jake forgot his wallet.","Jake, because Camila paid last time."],"a":2}]},"lang":[{"e":"eat out","t":"PV","d":"to eat at a restaurant instead of at home","x":"We usually eat out on Friday nights.","s":"eat OUT"},{"e":"cut down on","t":"PV","d":"to eat or drink less of something","x":"I'm trying to cut down on sugar.","s":"cut DOWN on"},{"e":"run out of","t":"PV","d":"to use all of something, so there's none left","x":"We've run out of bread, so I'll stop at the store.","s":"run OUT of"},{"e":"grab a bite","t":"ID","d":"to have a quick meal or snack (informal)","x":"Do you want to grab a bite after class?","s":"grab a BITE"},{"e":"have a sweet tooth","t":"ID","d":"to love sweet food","x":"My dad has a real sweet tooth. He eats manjar straight from the jar!","s":"have a SWEET TOOTH"},{"e":"it's on me","t":"ID","d":"I'll pay (for the food or drinks)","x":"Put your wallet away. It's on me today!","s":"it's on ME"},{"e":"make a reservation","t":"COL","d":"to book a table at a restaurant in advance","x":"It's a popular place, so I made a reservation for eight o'clock.","s":"make a reserVAtion"},{"e":"split the check","t":"COL","d":"to share the cost of a meal","x":"There were six of us, so we split the check.","s":"SPLIT the CHECK","uk":"UK: split the bill"},{"e":"order takeout","t":"COL","d":"to buy food from a restaurant to eat at home","x":"We were too tired to cook, so we ordered takeout.","s":"order TAKEout","uk":"UK: get a takeaway"},{"e":"be allergic to","t":"PREP","d":"to get sick if you eat or touch a certain thing","x":"I'm allergic to nuts, so I always check the ingredients.","s":"be alLERgic to"},{"e":"be in the mood for","t":"PREP","d":"to want to eat or do something at a particular moment","x":"I'm in the mood for something spicy tonight.","s":"be in the MOOD for"},{"e":"on a diet","t":"PREP","d":"eating less, or eating only certain foods, usually to lose weight","x":"No dessert for me, thanks. I'm on a diet.","s":"on a DIet"}],"func":{"title":"Ordering and making requests in a restaurant","when":"Use these when you order food, ask about the menu, have a problem with your order or want to pay.","phrases":[{"p":"Could I get the…, please?","use":"ordering politely (very common in the US)"},{"p":"I'll have the…","use":"ordering"},{"p":"What do you recommend?","use":"asking the server for advice"},{"p":"Does it come with…?","use":"asking about side dishes"},{"p":"Could I get it without…?","use":"changing a dish"},{"p":"Could we have a few more minutes?","use":"when you aren't ready to order"},{"p":"Excuse me, I don't think this is what I ordered.","use":"complaining politely"},{"p":"Could we get the check, please?","use":"asking to pay"},{"p":"Could I get a to-go box?","use":"taking leftovers home"}],"task":"In pairs: Student A is a server, and Student B is a customer who is in a hurry and is allergic to one ingredient. B orders a full meal, changes one dish, has a small problem with the order and asks for the check. Use at least five phrases, then swap roles."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them, so two words sound like one. 'Eat out' sounds like 'ea-tout', and 'run out of' sounds like 'ru-nou-tof'.","tip":"Don't stop between small words. Say each line slowly with the links, then faster, as if it were one long word.","lines":[{"t":"Let's eat out tonight.","m":"Let's‿EAT‿OUT toNIGHT."},{"t":"We've run out of bread.","m":"We've RUN‿OUT‿of BREAD."},{"t":"Let's grab a bite at eight.","m":"Let's GRAB‿a BITE‿at EIGHT."},{"t":"I'm allergic to eggs.","m":"I'm‿alLERgic to EGGS."},{"t":"Could I get it without onions?","m":"Could‿I GET‿it withOUT‿Onions ↗?"}]},"acts":[{"type":"roulette","items":["How often do you eat out, and where do you like to go?","Which food would be the hardest for you to cut down on?","Do you have a sweet tooth? What's your favorite dessert?","Are you allergic to any food, or do you know someone who is?","What do you usually order when you get takeout?","When you go out with friends, do you split the check or take turns paying?","What are you in the mood for right now?","Have you ever been on a diet? Did it work?","Where's the best place to grab a bite near your home or office?","What do you do when you run out of an ingredient while you're cooking?"]},{"type":"taboo","cards":[{"w":"eat out","taboo":["restaurant","home","dinner"]},{"w":"cut down on","taboo":["less","reduce","eat"]},{"w":"run out of","taboo":["finish","empty","more"]},{"w":"grab a bite","taboo":["quick","food","lunch"]},{"w":"have a sweet tooth","taboo":["sugar","dessert","candy"]},{"w":"split the check","taboo":["pay","half","bill"]},{"w":"make a reservation","taboo":["book","table","call"]},{"w":"order takeout","taboo":["home","delivery","restaurant"]},{"w":"be allergic to","taboo":["sick","reaction","doctor"]},{"w":"on a diet","taboo":["weight","lose","eat"]}]},{"type":"wyr","items":[["eat out every night for a month","cook every meal at home for a month"],["give up sugar for a year","give up coffee for a year"],["eat only Chilean food for the rest of your life","never eat Chilean food again"],["always order the same dish","try something new every time"],["work as a chef in a busy restaurant","work as a food critic who eats out every day"],["have breakfast for dinner","have dinner for breakfast"],["eat a very spicy meal","eat a very sweet meal"]]}],"ex":{"gap":{"items":[{"s":"My doctor told me to ___ salt, so now I use much less when I cook.","a":"cut down on"},{"s":"We've ___ milk, so I'll buy some on the way home.","a":"run out of"},{"s":"I don't want anything heavy tonight. I'm ___ a salad.","a":"in the mood for"},{"s":"My son can't eat peanuts because he's ___ them.","a":"allergic to"},{"s":"We hardly ever cook on weekends. We usually ___ at a little place near our apartment. (2 words)","a":"eat out"},{"s":"Dinner cost 45,000 pesos for the three of us, so we decided to ___. We each paid 15,000.","a":"split the check/split the bill"}]},"match":{"pairs":[["grab a bite","have a quick meal"],["have a sweet tooth","love sugary food"],["it's on me","I'll pay"],["make a reservation","book a table in advance"],["order takeout","buy restaurant food to eat at home"],["on a diet","eating less to lose weight"]]},"fix":{"items":[{"s":"Excuse me, can you bring us the account, please?","wrong":"the account","fix":"the check"},{"s":"Don't worry, I'll pay the dinner tonight.","wrong":"pay the dinner","fix":"pay for dinner"},{"s":"I'm trying to cut down sugar this month.","wrong":"cut down sugar","fix":"cut down on sugar"},{"s":"We've run out bread, so let's buy some.","wrong":"run out bread","fix":"run out of bread"}]}},"rec":{"prompt":"Describe your favorite place to eat out. What do you usually order, and who do you go with?","model":"My favorite place to eat out is a small Peruvian restaurant near my office in Providencia. I usually go there with my coworkers on Fridays, when we want to grab a bite after a long week. It's always busy, so we make a reservation the day before. I almost always order lomo saltado, and the ceviche is amazing too. I'm trying to cut down on sugar, but I have a real sweet tooth, so I usually share a dessert with a friend. At the end, we normally split the check. Sometimes my boss says, \"It's on me,\" and everyone is very happy!","use":["eat out","grab a bite","make a reservation","split the check"]},"tips":[{"who":"teacher","t":"Before the role-play, ask students for real Chilean dishes (pastel de choclo, lomo a lo pobre, completo) so they practice explaining a menu in English, not just ordering from it."},{"who":"student","t":"When you order, say \"Could I get…?\" or \"I'll have…\" instead of \"I want…\". In English, \"I want\" can sound direct and a little rude."},{"who":"student","t":"In the US, servers often ask \"How is everything?\" during the meal. A short answer like \"Great, thanks!\" is perfect. It's small talk, not a request for a review."}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/OZQYQOCG3K.jpg","by":"Ryan Plomp","lic":"CC0","url":"https://stocksnap.io/photo/food-kids-OZQYQOCG3K"}},{"id":"b2-food","lv":"B2","tp":"food","title":"Food Culture & Traditions","goals":["describe food traditions and family recipes using idiomatic expressions","explain dishes and customs from your culture to someone who doesn't know them","compare food cultures and give opinions with tact"],"warm":["What dish reminds you most of your childhood?","What does your family eat for special occasions like Christmas or Fiestas Patrias?","Is there a food from another country that you just can't get used to?","Do you think young people today cook less than their parents did? Why?"],"model":{"kind":"text","title":"What My Grandmother Never Wrote Down","intro":"Tomás, a Chilean living in Chicago, writes a blog post about the food traditions he misses most.","paras":["When I was growing up in Talca, the whole family met at my grandmother's house every Sunday for lunch. In winter it was cazuela; in summer, pastel de choclo. The moment the food hit the table, my grandfather would say, \"[[Dig in]]!\" and the conversation would stop for at least ten minutes.","None of those recipes were ever written down. They were [[passed down]] from my great-grandmother to my grandmother, and then to my mom. Good cooking clearly [[runs in the family]], although it seems to have skipped me. Here in Chicago, I can [[whip up]] a decent pebre, but my empanadas look like they've been in a fight.","Living abroad has taught me how much food is tied to who we are. Bread is [[a staple of]] the Chilean diet, and I didn't realize how much I missed marraquetas until I couldn't buy them. My American friends love trying Chilean food, although some things are [[an acquired taste]]. My roommate tried mote con huesillo and asked, very politely, why there was a whole peach in his drink.","Last month I cooked for eight friends and, of course, my [[eyes were bigger than my stomach]]: we ate leftovers for a week. But when everyone asked for the recipes, I felt like my grandmother was in the room. For me, that's what [[comfort food]] really means."],"questions":[{"q":"What does Tomás say about his own cooking?","opts":["He's as good a cook as his grandmother.","He can make some simple things, but his empanadas aren't great.","He never cooks because he lives with a roommate."],"a":1},{"q":"How were the family recipes kept?","opts":["Older family members taught them to younger ones.","They were written in a notebook.","His grandmother found them in a cookbook."],"a":0},{"q":"What happened when he cooked for eight friends?","opts":["Some guests didn't like the food.","There wasn't enough food for everyone.","He made much more food than they could eat."],"a":2}]},"lang":[{"e":"pass down","t":"PV","d":"to give knowledge, objects or traditions to younger people in a family","x":"My grandmother's empanada recipe has been passed down for four generations.","s":"pass DOWN"},{"e":"dig in","t":"PV","d":"to start eating, especially with enthusiasm (informal)","x":"The food's getting cold. Come on, dig in!","s":"dig IN"},{"e":"whip up","t":"PV","d":"to prepare a meal or dish quickly","x":"My dad can whip up a great pebre in five minutes.","s":"whip UP"},{"e":"an acquired taste","t":"ID","d":"something you only start to like after trying it several times","x":"Fernet is definitely an acquired taste. It's incredibly bitter.","s":"an acQUIRED TASTE"},{"e":"your eyes are bigger than your stomach","t":"ID","d":"you take more food than you can actually eat","x":"I always pile my plate too high at buffets. My eyes are bigger than my stomach.","s":"your EYES are BIGger than your STOMach"},{"e":"run in the family","t":"ID","d":"to be a quality or talent that many people in a family have","x":"Good cooking runs in the family. My mom and my grandma are both amazing cooks.","s":"RUN in the FAMily"},{"e":"comfort food","t":"COL","d":"simple food that makes you feel happy and safe, often because it reminds you of home","x":"On cold winter nights, cazuela is my ultimate comfort food.","s":"COMfort food"},{"e":"spoil your appetite","t":"COL","d":"to eat something that makes you less hungry for your next meal","x":"Don't eat those chips now. You'll spoil your appetite for dinner.","s":"SPOIL your APpetite"},{"e":"a staple of","t":"COL","d":"a basic, everyday part of something, for example a diet","x":"Bread is a staple of the Chilean diet.","s":"a STAple of"},{"e":"be famous for","t":"PREP","d":"to be well known because of something","x":"Valparaíso is famous for its chorrillana.","s":"be FAmous for"},{"e":"with a twist","t":"PREP","d":"with a new or unexpected change to something traditional","x":"This restaurant serves classic Chilean dishes with a modern twist.","s":"with a TWIST"},{"e":"be hooked on","t":"PREP","d":"to like something so much that you can't stop having it (informal)","x":"Ever since my trip to Lima, I've been hooked on ceviche.","s":"be HOOKED on"}],"func":{"title":"Describing and explaining unfamiliar things","when":"Use these when you explain a dish, a custom or a tradition to someone from another culture.","phrases":[{"p":"It's a kind of…","use":"giving the general category"},{"p":"It's similar to…, but…","use":"comparing it with something the listener knows"},{"p":"It's made with…","use":"explaining the main ingredients"},{"p":"It's basically…","use":"giving a quick, simple summary"},{"p":"The closest thing I can think of is…","use":"when there's no exact equivalent"},{"p":"It tastes a bit like…","use":"describing the flavor"},{"p":"It's usually served with…","use":"explaining how or when people eat it"},{"p":"What makes it special is…","use":"highlighting the key feature"},{"p":"You have to try it to understand!","use":"recommending it with enthusiasm"}],"task":"Student A describes a Chilean dish or food tradition (for example once, curanto or sopaipillas pasadas) without saying its name, using at least four phrases. Student B guesses what it is and asks two follow-up questions. Then swap."},"pron":{"focus":"Stress in phrasal verbs and compound nouns","explain":"In phrasal verbs, the particle is usually stressed: pass DOWN, dig IN, whip UP. In compound nouns, the first part is usually stressed: COMfort food, STREET food, SEAfood. Getting this pattern right makes you much easier to understand.","tip":"Tap the table on each stressed syllable as you say the line. When the rhythm feels natural, say it again without tapping.","lines":[{"t":"My grandma passed down the recipe.","m":"My GRANDma passed DOWN the REcipe."},{"t":"The food's ready, so dig in!","m":"The FOOD'S READy | so dig IN!"},{"t":"Cazuela is my favorite comfort food.","m":"CaZUEla is my FAvorite COMfort food."},{"t":"She whipped up a quick dessert.","m":"She whipped UP a QUICK desSERT."},{"t":"I got hooked on street food in Mexico.","m":"I got HOOKED on STREET food in MEXico."}]},"acts":[{"type":"agree","items":["Family recipes should never be changed.","Traditional food is always better than modern fusion food.","Every child should learn to cook at least five family dishes.","It's rude to refuse food when you're a guest in someone's home.","Tourists should try every local dish, even the strange ones.","Sharing a meal is the best way to understand another culture.","Fast food chains are killing local food traditions."]},{"type":"ranking","task":"A friend from the US is visiting Chile for one week. Rank these food experiences from MOST to LEAST essential, and explain your choices.","items":["Empanadas de pino at a fonda during Fiestas Patrias","A completo from a street stand","Seafood at the Mercado Central in Santiago","Once (afternoon tea) with a Chilean family","Pastel de choclo at a traditional restaurant","Curanto in Chiloé","A pisco sour at sunset"]},{"type":"podcast","title":"Taste of Home","segments":["Intro (30 seconds): welcome your listeners and explain what today's episode is about.","Our family classics: each host describes a dish that has been passed down in their family.","The acquired-taste challenge: talk about a food from Chile or abroad that people either love or hate.","Tradition or change? Discuss whether family recipes should be updated with a modern twist.","Listener question: \"I'm a foreigner and I've been invited to a Chilean family lunch. What should I know?\" Give your best advice."]}],"ex":{"gap":{"items":[{"s":"This soup recipe has been ___ in my family for over a hundred years.","a":"passed down/handed down"},{"s":"Don't eat cookies right before dinner. You'll ___. (3 words)","a":"spoil your appetite/ruin your appetite"},{"s":"Olives are ___. I hated them as a kid, but now I love them.","a":"an acquired taste"},{"s":"My mom, my aunt and my grandpa are all amazing cooks. Talent in the kitchen really ___.","a":"runs in the family"},{"s":"Valparaíso is ___ its chorrillana, a huge plate of fries topped with meat, onions and eggs.","a":"famous for/known for"},{"s":"Our guests arrived early, so I ___ a quick salad with whatever was in the fridge. (past tense)","a":"whipped up"}]},"match":{"pairs":[["dig in","start eating with enthusiasm"],["comfort food","food that makes you feel safe and happy"],["a staple of","a basic, everyday part of"],["be hooked on","like something so much you can't stop"],["with a twist","with a new or surprising change"],["your eyes are bigger than your stomach","you take more food than you can eat"]]},"fix":{"items":[{"s":"My grandmother passed down me her recipe.","wrong":"passed down me her recipe","fix":"passed her recipe down to me"},{"s":"Chile is famous of its wine.","wrong":"famous of","fix":"famous for"},{"s":"I'm used to eat dinner at ten at night.","wrong":"used to eat","fix":"used to eating"},{"s":"This dish is very typical from the south of Chile.","wrong":"typical from","fix":"typical of"}]}},"rec":{"prompt":"Describe a food tradition from your family or your country to someone who has never been to Chile. Why is it important to you?","model":"In my family, the most important food tradition happens during Fiestas Patrias in September. We all get together at my uncle's house and make empanadas de pino with a recipe that was passed down from my great-grandmother. It's basically a baked pastry filled with beef, onion, egg and an olive. As soon as they come out of the oven, everyone digs in. We also drink chicha, which is a bit of an acquired taste. It's a sweet, slightly fermented drink. For me, empanadas are the ultimate comfort food because they remind me of helping my grandma in the kitchen when I was a kid.","use":["pass down","dig in","an acquired taste","comfort food"]},"tips":[{"who":"teacher","t":"Students often say \"typical food\" for everything. Push them to be more precise: traditional, regional, homemade, seasonal, signature dish."},{"who":"student","t":"When you describe a Chilean dish, don't translate its name. Say the Spanish name, then explain it: \"It's a kind of…\". That's what English speakers do with foreign food too."},{"who":"student","t":"\"Dig in!\" is friendly and informal, perfect at home or with friends. At a formal dinner, say \"Please, go ahead and start.\""}],"photo":{"src":"https://live.staticflickr.com/7504/15653081732_99c99f0438_b.jpg","by":"kurmanstaff","lic":"CC BY","url":"https://www.flickr.com/photos/62558987@N07/15653081732"}},{"id":"c1-food","lv":"C1","tp":"food","title":"The Future of Food","goals":["discuss food technology, sustainability and food security using sophisticated vocabulary","speculate about future trends while expressing different degrees of certainty","build and challenge arguments about controversial food innovations"],"warm":["Would you eat a burger made from meat grown in a lab? Why or why not?","How has the way people in Chile eat changed in the last twenty years?","Chile was one of the first countries to put black warning labels on unhealthy packaged food. Have they changed what you buy?","Which foods do you think people will eat much more of in 2050?"],"model":{"kind":"dialogue","title":"Will We Still Eat Steak in 2050?","intro":"On a food podcast, host Rachel talks to food scientist Ignacio Rojas and chef Megan Lee about what we'll be eating in the future.","lines":[{"sp":"Rachel","t":"So, Ignacio, will we all be eating lab-grown meat by 2050?"},{"sp":"Ignacio","t":"Honestly, [[the jury is still out]]. We can already grow meat from animal cells, but nobody has managed to produce it [[on a large scale]] at a price ordinary people will pay. Until companies can [[scale up]], it'll remain a novelty for wealthy foodies."},{"sp":"Rachel","t":"Megan, as a chef, would you put it on your menu?"},{"sp":"Megan","t":"Maybe, but I take all the hype [[with a grain of salt]]. Every few years there's a miracle food that's supposed to change everything. Remember when insect protein was going to [[catch on]] everywhere?"},{"sp":"Ignacio","t":"To be fair, insects are popular in some places. But I can't see Chileans swapping their asado for crickets any time soon."},{"sp":"Rachel","t":"So what will actually change?"},{"sp":"Megan","t":"Meat will play a smaller role, I think. Younger customers have [[a growing appetite for]] plant-based dishes, and today's veggie burgers are [[a far cry from]] the cardboard patties of twenty years ago."},{"sp":"Ignacio","t":"There's also the climate issue. Beef has an enormous [[carbon footprint]], and with the droughts we've seen in central Chile, [[food security]] is becoming a genuine concern."},{"sp":"Rachel","t":"So should we [[phase out]] meat altogether?"},{"sp":"Megan","t":"I wouldn't go that far. But [[in the long run]], I suspect we'll eat less of it and choose better quality. Steak might go back to being what it was for our grandparents: a treat, not an everyday habit."}],"questions":[{"q":"What is Ignacio's main point about lab-grown meat?","opts":["It's too unhealthy to sell.","It exists, but it can't yet be made cheaply in large quantities.","Most people in Chile have already tried it."],"a":1},{"q":"Why is Megan skeptical about \"miracle foods\"?","opts":["Similar predictions have often failed to come true.","She has never cooked with new ingredients.","Her customers refuse to try them."],"a":0},{"q":"What does Megan predict?","opts":["Meat will be banned in most countries.","Insects will replace beef in Chile.","People will eat meat less often but choose better quality."],"a":2}]},"lang":[{"e":"phase out","t":"PV","d":"to gradually stop using or producing something","x":"Many supermarkets are phasing out single-use plastic packaging.","s":"phase OUT"},{"e":"scale up","t":"PV","d":"to increase the size or amount of something, especially production","x":"The real challenge for lab-grown meat is scaling up production without the price going through the roof.","s":"scale UP"},{"e":"catch on","t":"PV","d":"to become popular or widely accepted","x":"Eating insects is common in parts of Mexico and Asia, but it hasn't really caught on in Chile.","s":"catch ON"},{"e":"a far cry from","t":"ID","d":"very different from (usually much better or much worse than)","x":"Today's plant-based burgers are a far cry from the dry veggie patties of the 1990s.","s":"a FAR CRY from"},{"e":"the jury is still out","t":"ID","d":"people haven't decided yet; there's no clear answer","x":"The jury is still out on whether vertical farms can ever be truly profitable.","s":"the JUry is still OUT"},{"e":"take something with a grain of salt","t":"ID","d":"to not completely believe something you hear or read","x":"I take most \"superfood\" headlines with a grain of salt.","s":"take something with a GRAIN of SALT","uk":"UK: take something with a pinch of salt"},{"e":"food security","t":"COL","d":"reliable access to enough safe, affordable and nutritious food","x":"Climate change is a growing threat to global food security.","s":"FOOD seCUrity"},{"e":"carbon footprint","t":"COL","d":"the amount of greenhouse gases that a product or activity produces","x":"A kilo of beef has a much bigger carbon footprint than a kilo of lentils.","s":"CARbon FOOTprint"},{"e":"a growing appetite for","t":"COL","d":"an increasing desire or demand for something","x":"There's a growing appetite for meat alternatives among younger consumers.","s":"a GROWing APpetite for"},{"e":"in the long run","t":"PREP","d":"over a long period of time; eventually","x":"Cutting food waste saves families a lot of money in the long run.","s":"in the LONG RUN"},{"e":"on a large scale","t":"PREP","d":"in large amounts or over a wide area","x":"No one has managed to produce cultivated meat cheaply on a large scale yet.","s":"on a LARGE SCALE"},{"e":"in favor of","t":"PREP","d":"choosing one thing instead of another","x":"More and more restaurants are dropping imported ingredients in favor of local, seasonal produce.","s":"in FAvor of","uk":"UK: in favour of"}],"func":{"title":"Speculating and expressing degrees of certainty","when":"Use these when you make predictions or discuss what might happen, and want to show how sure you are.","phrases":[{"p":"It's bound to…","use":"near certainty"},{"p":"In all likelihood, …","use":"strong probability (formal)"},{"p":"There's every chance that…","use":"strong probability"},{"p":"Chances are…","use":"probability (informal)"},{"p":"It's conceivable that…","use":"possible, but far from certain"},{"p":"It remains to be seen whether…","use":"an open question"},{"p":"I can't see that happening any time soon.","use":"skepticism"},{"p":"I'd be very surprised if…","use":"strong improbability"},{"p":"I wouldn't go that far.","use":"rejecting an exaggerated prediction"},{"p":"What makes you so sure?","use":"challenging someone's certainty"}],"task":"In pairs, make predictions about food in 2050: insects, lab-grown meat, 3D-printed meals, the price of beef, the future of the asado. Each of you must use at least five different phrases, and your partner must challenge every prediction before giving their own view."},"pron":{"focus":"Contrastive stress","explain":"When we contrast two ideas, we put extra stress on the words that carry the contrast, and the rest of the sentence becomes quieter. This helps listeners follow your argument in a debate.","tip":"Before you speak, ask yourself what you're contrasting. Then say those two words louder, longer and slightly higher, and keep everything else light.","lines":[{"t":"It's not the taste that worries me, it's the price.","m":"It's not the TASTE that worries me | it's the PRICE."},{"t":"I said lab-grown meat, not plant-based meat.","m":"I said LAB-grown meat | not PLANT-based meat."},{"t":"It might catch on in cities, but not in rural areas.","m":"It might catch on in CIties | but NOT in RURal areas."},{"t":"The problem isn't growing the food, it's getting it to people.","m":"The problem isn't GROWing the food | it's GETting it to PEOple."},{"t":"In the short run it's expensive, but in the long run it's cheaper.","m":"In the SHORT run it's exPENsive | but in the LONG run it's CHEAPer."}]},"acts":[{"type":"pitch","brief":"Your group is a food-tech startup looking for investors. Choose one idea, prepare a two-minute pitch, then defend it against the investors' questions. The investors decide which startup gets the money.","ideas":["An app that sells supermarket food close to its expiration date at a big discount","A vertical farm inside an empty parking garage in downtown Santiago","Cricket-flour snacks for school lunch boxes","A subscription box of \"ugly\" fruit and vegetables that supermarkets won't sell","A 3D printer that makes soft, personalized meals for elderly people"],"questions":["Who exactly is your customer, and how do you know they want this?","Why hasn't anyone done this successfully already?","How will you scale up without losing quality?","What's the biggest risk to your business in the long run?","How would you convince a skeptical Chilean consumer to try it?","What happens if a big company copies your idea?"]},{"type":"devil","motions":["Lab-grown meat should be allowed to be sold simply as \"meat.\"","Supermarkets should be legally required to donate unsold food.","Eating meat will be socially unacceptable by 2075.","Schools should serve only vegetarian meals.","Protecting traditional food culture matters more than reducing our carbon footprint.","Food delivery apps have done more harm than good."]},{"type":"ranking","task":"Rank these measures from MOST to LEAST effective for making our food system more sustainable over the next twenty years. Be ready to defend your top and bottom choices.","items":["Reducing food waste in homes and supermarkets","Eating less red meat","Investing in vertical and urban farming","Buying local and seasonal products","Developing drought-resistant crops","Labels that show each product's carbon footprint","Lab-grown meat"]}],"ex":{"gap":{"items":[{"s":"The company plans to ___ plastic packaging by 2030, gradually replacing it with compostable materials.","a":"phase out"},{"s":"Oat milk took a while to ___, but now almost every café offers it.","a":"catch on"},{"s":"The bakery works well as a small business, but the owners aren't sure they can ___ production to supply supermarkets.","a":"scale up"},{"s":"Some studies say intermittent fasting works and others say it doesn't, so ___ on that one.","a":"the jury is still out/the jury's still out"},{"s":"Flying strawberries halfway around the world in winter gives them a huge ___.","a":"carbon footprint"},{"s":"Solar panels are expensive to install, but they save farmers money ___.","a":"in the long run"}]},"match":{"pairs":[["a far cry from","very different from"],["take something with a grain of salt","not fully believe it"],["food security","reliable access to enough nutritious food"],["a growing appetite for","an increasing desire for"],["on a large scale","in big quantities or across a wide area"],["in favor of","choosing one thing instead of another"]]},"fix":{"items":[{"s":"The jury is still out if lab-grown meat is safe in the long term.","wrong":"out if","fix":"out on whether"},{"s":"Insect protein hasn't caught up in Chile yet.","wrong":"caught up","fix":"caught on"},{"s":"In a long run, vertical farms could feed entire cities.","wrong":"In a long run","fix":"In the long run"},{"s":"There's a growing appetite of plant-based food among teenagers.","wrong":"appetite of","fix":"appetite for"}]}},"rec":{"prompt":"Will people in your country eat very differently in 2050? Speculate about at least two changes and say how certain you are.","model":"I'd be very surprised if Chileans stopped eating meat by 2050. The asado is far too important to us socially. That said, I think meat will play a smaller role. Plant-based products have really started to catch on among younger people, and as droughts get worse, the carbon footprint of beef will be harder to ignore. In the long run, I suspect red meat will become a weekend treat rather than an everyday food. As for lab-grown meat, the jury is still out. It's conceivable that it'll become cheap and common, but I can't see that happening any time soon, mainly because people here are quite traditional about food.","use":["catch on","carbon footprint","in the long run","the jury is still out"]},"tips":[{"who":"teacher","t":"In the pitch activity, choose two students as \"tough investors\" and give them the questions in advance. Reward follow-up questions that ask for evidence, not just opinions."},{"who":"student","t":"When you speculate, don't use \"maybe\" in every sentence. Rotate \"It's bound to…\", \"I'd be surprised if…\" and \"It remains to be seen whether…\" to sound more precise."},{"who":"student","t":"If you aren't sure of a number in a debate, hedge it: \"roughly a third\", \"something like\", \"if I remember correctly\". It sounds natural and protects your credibility."}],"photo":{"src":"https://images.pexels.com/photos/348689/pexels-photo-348689.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/view-of-vegetables-348689/"}},{"id":"b1-relationships","lv":"B1","tp":"relationships","title":"Friends & Family","goals":["describe your family and friends using common phrasal verbs and expressions","talk about how relationships change over time","show interest and keep a conversation going when someone talks about their life"],"warm":["How many people are there in your family? Who are you closest to?","How did you meet your best friend?","How often do you see your aunts, uncles and cousins?","What do you usually do when you get together with your friends?"],"model":{"kind":"dialogue","title":"Running Into an Old Friend","intro":"Valentina runs into Diego, an old friend from school, at a café in Santiago.","lines":[{"sp":"Diego","t":"Valentina? No way! How are you?"},{"sp":"Valentina","t":"Diego! I can't believe it! We haven't seen each other in, what, five years?"},{"sp":"Diego","t":"At least! We need to [[catch up]]. Do you have time for a coffee?"},{"sp":"Valentina","t":"Sure! So, tell me everything. Are you still in Concepción?"},{"sp":"Diego","t":"No, I moved here last year for work. And guess what? I'm [[married to]] Sofía now."},{"sp":"Valentina","t":"Sofía from our English class? That's so nice! You two always [[had a lot in common]]."},{"sp":"Diego","t":"We did! What about you? Do you still [[hang out with]] the old group?"},{"sp":"Valentina","t":"Not really. We [[grew apart]] after graduation. Everyone got busy with jobs and kids. But I'm still [[close to]] Javiera. We talk almost every day."},{"sp":"Diego","t":"And your family? How's your brother?"},{"sp":"Valentina","t":"He's fine. We [[get along]] much better now than when we were kids. He used to [[get on my nerves]] all the time!"},{"sp":"Diego","t":"Ha! My sister was the same. Hey, let's [[keep in touch]] this time. What's your number?"},{"sp":"Valentina","t":"Definitely! And say hi to Sofía for me."}],"questions":[{"q":"Why is Diego living in Santiago now?","opts":["His wife is from Santiago.","He moved there for work.","He wanted to be near Valentina."],"a":1},{"q":"What happened to Valentina's old group of friends?","opts":["They slowly became less close.","They had a big fight.","They all moved abroad."],"a":0},{"q":"How is Valentina's relationship with her brother now?","opts":["It's worse than before.","They never talk.","It's better than when they were kids."],"a":2}]},"lang":[{"e":"get along with","t":"PV","d":"to have a friendly relationship with someone","x":"I get along really well with my older brother.","s":"get aLONG with","uk":"UK: get on with"},{"e":"hang out with","t":"PV","d":"to spend free time relaxing with someone (informal)","x":"After class, I usually hang out with my friends at the park.","s":"hang OUT with"},{"e":"catch up","t":"PV","d":"to talk with someone about everything that has happened since you last met","x":"Let's get coffee and catch up. I haven't seen you in ages!","s":"catch UP"},{"e":"grow apart","t":"PV","d":"to slowly become less close to someone","x":"We were best friends in high school, but we grew apart after graduation.","s":"grow aPART"},{"e":"the black sheep of the family","t":"ID","d":"a family member who is very different from the others, often in a way the family doesn't like","x":"My uncle is the black sheep of the family. He's always getting into trouble.","s":"the BLACK SHEEP of the FAMily"},{"e":"see eye to eye","t":"ID","d":"to agree with someone","x":"My mom and I don't always see eye to eye about money.","s":"see EYE to EYE"},{"e":"get on someone's nerves","t":"ID","d":"to annoy someone, often again and again","x":"My little brother gets on my nerves when he uses my things.","s":"get on someone's NERVES"},{"e":"keep in touch","t":"COL","d":"to stay in contact with someone","x":"We live in different countries, but we keep in touch on WhatsApp.","s":"keep in TOUCH"},{"e":"have a lot in common","t":"COL","d":"to share many interests or opinions","x":"We have a lot in common. We both love hiking and old movies.","s":"have a LOT in COMmon"},{"e":"extended family","t":"COL","d":"relatives outside your parents and siblings, like aunts, uncles, cousins and grandparents","x":"My extended family is huge. I have more than thirty cousins!","s":"exTENDed FAMily"},{"e":"be close to","t":"PREP","d":"to have a strong, warm relationship with someone","x":"I'm very close to my grandmother. I call her every day.","s":"be CLOSE to"},{"e":"be married to","t":"PREP","d":"to be someone's husband or wife","x":"My sister is married to a guy from Argentina.","s":"be MARried to"}],"func":{"title":"Showing interest and keeping the conversation going","when":"Use these when a friend, classmate or coworker tells you about their life. Good listeners react and ask questions.","phrases":[{"p":"Really? Tell me more!","use":"asking for more details"},{"p":"That's so nice!","use":"reacting to good news"},{"p":"Oh no, that's too bad.","use":"reacting to bad news"},{"p":"No way!","use":"showing surprise (informal)"},{"p":"And then what happened?","use":"encouraging someone to continue a story"},{"p":"So, what's he/she like?","use":"asking about someone's personality"},{"p":"Same here! / Me too!","use":"saying you have something in common"},{"p":"That makes sense.","use":"showing you understand"},{"p":"How about you?","use":"returning the question"}],"task":"Student A talks for two minutes about a family member or a close friend. Student B can't talk about themselves at all. B can only react and ask questions, using at least five phrases. Then swap."},"pron":{"focus":"Weak forms: to, of, for, from, and","explain":"Small grammar words are usually unstressed. We say them quickly with a weak 'uh' sound /ə/: to → /tə/, of → /əv/, for → /fər/, from → /frəm/, and → /ən/. The important words (nouns, verbs, adjectives) are the stressed ones.","tip":"Don't say every word clearly and equally, because it sounds robotic. Say the CAPITAL words strongly and let the small words almost disappear between them.","lines":[{"t":"I'm very close to my sister.","m":"I'm VEry CLOSE to my SIster."},{"t":"My cousin is married to a chef.","m":"My COUsin is MARried to a CHEF."},{"t":"He's the black sheep of the family.","m":"He's the BLACK SHEEP of the FAMily."},{"t":"I keep in touch with my friends from school.","m":"I KEEP in TOUCH with my FRIENDS from SCHOOL."},{"t":"Let's get together for lunch and catch up.","m":"Let's get toGETHer for LUNCH and catch UP."}]},"acts":[{"type":"picture","prompts":["Who do you think these people are? Are they family, friends or both?","What are they doing, and how do you think they feel?","Does this picture remind you of a moment with your own family or friends?","What's your favorite way to get together with the people you love?","Imagine this group in ten years. Will they still keep in touch? Why or why not?"]},{"type":"fluency","topics":["How you met your best friend","A family member you really admire, and why","A friend you grew apart from. What happened?","The best family celebration you remember","A time a friend or relative really helped you"]},{"type":"agree","items":["Family is more important than friends.","It's easier to make friends as a child than as an adult.","You can't be real friends with your boss.","Men and women can be best friends.","Social media helps us keep in touch with old friends.","It's normal to grow apart from your school friends.","Brothers and sisters get along better when they're adults."]}],"ex":{"gap":{"items":[{"s":"I ___ my roommate really well. We never argue.","a":"get along with/get on with"},{"s":"We were best friends in high school, but we ___ when I moved to another city. (past tense)","a":"grew apart"},{"s":"My sister is ___ a doctor from Peru. Their wedding was last year.","a":"married to"},{"s":"I don't see my school friends very often, but we ___ on Instagram.","a":"keep in touch/stay in touch"},{"s":"My best friend and I like the same music, movies and food. We have ___.","a":"a lot in common"},{"s":"I haven't seen you since college! Let's get a coffee so we can ___. I want to hear all your news.","a":"catch up"}]},"match":{"pairs":[["hang out with","spend free time with"],["the black sheep of the family","the relative who is very different from the others"],["see eye to eye","agree with each other"],["get on someone's nerves","annoy someone"],["extended family","aunts, uncles, cousins and grandparents"],["be close to","have a strong, warm relationship with"]]},"fix":{"items":[{"s":"My sister is married with an engineer.","wrong":"married with","fix":"married to"},{"s":"I get along well to my cousins.","wrong":"well to","fix":"well with"},{"s":"Last weekend I hanged out with my friends.","wrong":"hanged out","fix":"hung out"},{"s":"My family is very big. I have a lot of parents in the south.","wrong":"parents","fix":"relatives"}]}},"rec":{"prompt":"Talk about a family member or a friend you're very close to. How did your relationship start, and what do you do together?","model":"The person I'm closest to is my cousin Francisca. We're the same age, so we grew up together, and we've always had a lot in common. When we were kids, she got on my nerves sometimes because she always wanted to win, but now we get along perfectly. She lives in Viña del Mar and I live in Santiago, so we don't see each other every week, but we keep in touch on WhatsApp almost every day. When she comes to Santiago, we hang out at a café and catch up for hours. She's like a sister to me.","use":["get along with","keep in touch","hang out with","have a lot in common"]},"tips":[{"who":"teacher","t":"Listen for the false friend \"parents\" (only mother and father). Students often mean \"relatives\" (parientes). Correct it gently every time, because it's very common."},{"who":"student","t":"English speakers expect follow-up questions. When someone mentions a friend or relative, ask \"What's she like?\" or \"How did you meet?\" It shows real interest."},{"who":"student","t":"\"Hang out\" is very common and casual in American English. Use it with friends, but in a job interview say \"spend time with\" instead."}],"photo":{"src":"https://images.pexels.com/photos/745045/pexels-photo-745045.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/group-of-people-sitting-on-white-mat-on-grass-field-745045/"}},{"id":"b2-relationships","lv":"B2","tp":"relationships","title":"Relationships Today","goals":["discuss modern dating, friendship and social media using idiomatic expressions","give and justify opinions about how relationships are changing","agree and disagree tactfully in a group discussion"],"warm":["How do most people you know meet their partners these days?","Do you think it's harder to make friends as an adult? Why?","What do you think of dating apps?","Have you ever had a long-distance relationship or friendship? How did you make it work?"],"model":{"kind":"dialogue","title":"Swipe Left on Dating Apps?","intro":"Three friends, Carla, Ben and Nico, are having drinks after work and talking about dating today.","lines":[{"sp":"Carla","t":"So, Nico, how did your date go on Saturday?"},{"sp":"Nico","t":"Honestly? We [[hit it off]] right away. We talked for three hours."},{"sp":"Ben","t":"Nice! Are you going to see her again?"},{"sp":"Nico","t":"I hope so. I texted her yesterday, but she hasn't answered. I think she's [[ghosting]] me."},{"sp":"Carla","t":"Ugh, dating apps. Everyone's so busy looking for someone better that nobody wants to [[make an effort]] anymore."},{"sp":"Ben","t":"I'm not so sure about that. I met Andrea on an app, and we've been together for two years."},{"sp":"Carla","t":"Fair enough, but you two got lucky. Most people I know just go on endless first dates."},{"sp":"Nico","t":"Maybe. But before apps, you could only meet friends of friends or people from work. At least now you have more options."},{"sp":"Ben","t":"That's a good point. For me, the key is to be honest from the start. Andrea and I talked about kids and money really early, just to make sure we were [[on the same page]]."},{"sp":"Carla","t":"Wow, that's mature. My last boyfriend always changed the subject when I asked about his plans. Looking back, that was [[a red flag]]."},{"sp":"Nico","t":"Is that why you [[broke up with]] him?"},{"sp":"Carla","t":"Partly. When he finally told me, it turned out he wanted to [[settle down]] on a farm in the south, and I'm a total city girl!"},{"sp":"Ben","t":"Anyway, Nico, give her a couple of days. Maybe she's just busy."},{"sp":"Nico","t":"Or maybe she'll text me [[out of the blue]] next month. Who knows?"}],"questions":[{"q":"Why is Nico worried?","opts":["His date was boring.","The woman he met isn't answering his message.","He forgot to ask for her number."],"a":1},{"q":"What is Ben's opinion of dating apps?","opts":["They can work. He met his girlfriend on one.","They're a complete waste of time.","He has never used one, so he doesn't know."],"a":0},{"q":"Why did Carla's last relationship end, at least partly?","opts":["He ghosted her.","He was rude to her friends.","They wanted very different lifestyles."],"a":2}]},"lang":[{"e":"ask someone out","t":"PV","d":"to invite someone to go on a date","x":"He finally asked her out after weeks of texting.","s":"ASK someone OUT"},{"e":"break up with","t":"PV","d":"to end a romantic relationship with someone","x":"She broke up with her boyfriend after three years.","s":"break UP with"},{"e":"settle down","t":"PV","d":"to start a calmer, more stab
