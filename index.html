ses they hear and share one 'best moment' before the groups swap."},{"who":"student","t":"Interrupting isn't rude in English meetings if you do it politely. Practice 'Sorry to interrupt, but…' and 'Can I just jump in here?' until they come out automatically."},{"who":"student","t":"On video calls, say 'Sorry, go ahead' when you and someone else start speaking at the same time. It's one of the most useful phrases in online meetings."}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/FSU5SG0X4U.jpg","by":"Benjamin Child","lic":"CC0","url":"https://stocksnap.io/photo/office-work-FSU5SG0X4U"}},{"id":"c1-meetings","lv":"C1","tp":"meetings","title":"Leading Discussions & Decisions","goals":["chair a discussion and manage different personalities diplomatically","build consensus, handle pushback and make decisions under time pressure","summarize outcomes and close a meeting with clear next steps"],"warm":["Who's the best meeting leader you've ever worked with? What made them so effective?","Should important decisions be made by consensus or by one person? Does it depend?","How do you deal with someone who dominates a discussion?","Have you ever stayed quiet in a meeting and regretted it later?"],"model":{"kind":"text","title":"Why your meetings end without decisions","intro":"An article from a leadership newsletter for managers.","paras":["Most of us have sat through meetings that end with everyone nodding and nothing decided. The problem is rarely a lack of ideas. More often, the person leading the discussion has failed to [[read the room]]. They miss the colleague who is quietly [[on the fence]], or the two departments that are clearly [[at odds with]] each other but too polite to say so.","Great facilitators do three things differently. First, they make it safe to disagree. They actively invite quieter people to [[weigh in]], and they welcome those who [[push back]], because a decision that hasn't been challenged is rarely a good one. Some even ask a team member to [[play devil's advocate]] on purpose.","Second, they identify the real [[sticking point]] early. Instead of letting the conversation drift, they ask a simple question: “What exactly is stopping us from agreeing?” Once the obstacle has been named, it can usually be dealt with.","Finally, they know when to stop talking. [[Reaching a consensus]] is ideal, but it isn't always realistic. [[In the interest of time]], a good leader will sometimes [[make a judgment call]], explain the reasoning and move on; the decision can always be revisited [[in light of]] new information. What matters is that people leave the room knowing who will do what, by when, and who needs to [[sign off on]] it."],"questions":[{"q":"According to the article, why do many meetings end without a decision?","opts":["There aren't enough good ideas","The leader doesn't notice how people really feel","Meetings are usually too short"],"a":1},{"q":"Why do good facilitators welcome people who push back?","opts":["Unchallenged decisions are rarely good ones","It makes meetings shorter","It helps managers look open-minded"],"a":0},{"q":"What does the article say about consensus?","opts":["It should always be the goal, however long it takes","It's only possible in small teams","It's ideal, but sometimes the leader has to decide"],"a":2}]},"lang":[{"e":"weigh in","t":"PV","d":"to give your opinion in a discussion, often with some authority","x":"I'd love to hear from finance. Would you like to weigh in?","s":"weigh IN"},{"e":"push back","t":"PV","d":"to resist or argue against a proposal or a demand","x":"The team pushed back on the unrealistic deadline.","s":"push BACK"},{"e":"sign off on","t":"PV","d":"to give official approval to something","x":"The CFO still has to sign off on the budget.","s":"sign OFF on"},{"e":"read the room","t":"ID","d":"to sense the mood and feelings of a group and adapt to them","x":"A good facilitator knows how to read the room.","s":"READ the ROOM"},{"e":"play devil's advocate","t":"ID","d":"to argue the opposite side on purpose to test an idea","x":"Let me play devil's advocate: what if the client says no?","s":"play DEVil's ADvocate"},{"e":"on the fence","t":"ID","d":"unable to decide between two options","x":"Half the board is still on the fence about the merger.","s":"on the FENCE"},{"e":"reach a consensus","t":"COL","d":"to arrive at general agreement in a group","x":"After two hours, we finally reached a consensus.","s":"REACH a conSENsus"},{"e":"a sticking point","t":"COL","d":"an issue that prevents people from reaching an agreement","x":"Price wasn't the problem; the main sticking point was the delivery date.","s":"a STICKing point"},{"e":"make a judgment call","t":"COL","d":"to make a decision based on your own experience when there's no clear right answer","x":"There was no data, so the director had to make a judgment call.","s":"make a JUDGment call","uk":"UK: judgement call"},{"e":"in light of","t":"PREP","d":"considering new information or events","x":"In light of the survey results, we're changing our strategy.","s":"in LIGHT of"},{"e":"at odds with","t":"PREP","d":"in disagreement or conflict with","x":"The sales team is at odds with marketing over the launch date.","s":"at ODDS with"},{"e":"in the interest of time","t":"PREP","d":"in order to save time (often used to move a meeting forward)","x":"In the interest of time, let's skip the last item.","s":"in the INterest of TIME","uk":"UK also: in the interests of time"}],"func":{"title":"Chairing a discussion: managing turns, building consensus and summarizing","when":"Use these when you chair a meeting or lead a group discussion and need to manage people, build agreement and close with clear decisions.","phrases":[{"p":"Let's hear from someone who hasn't spoken yet.","use":"bring quieter people into the discussion"},{"p":"What's your take on this, Ana?","use":"ask a specific person for their opinion"},{"p":"If I could stop you there for a second…","use":"politely interrupt someone who is dominating"},{"p":"Let's park that for now and come back to it.","use":"postpone a side issue"},{"p":"I'm sensing some hesitation. What's behind it?","use":"bring hidden concerns into the open"},{"p":"It sounds like there's broad agreement on…","use":"build consensus"},{"p":"Can everyone live with that?","use":"check that everyone accepts a compromise"},{"p":"Where do we stand on…?","use":"check the current position before deciding"},{"p":"Let's take a step back. What problem are we actually trying to solve?","use":"refocus a discussion that has lost direction"},{"p":"So, to recap: we've agreed to…, and Diego will…","use":"summarize decisions and assign tasks"}],"task":"Work in groups of four. One person chairs a 3-minute discussion: 'Our company has budget for only ONE of these: a team retreat, new laptops or a training program.' The chair must use at least five phrases, give everyone a turn to speak and close with a recap. Then rotate the chair."},"pron":{"focus":"Contrastive stress","explain":"We put extra stress on a word to contrast it with something else or to correct a misunderstanding. The meaning can change completely depending on the word you stress: 'I didn't say WE should cancel it' (someone else should) vs. 'I didn't say we should CANCEL it' (I said something different). Good chairs use contrastive stress to clarify, correct and summarize precisely.","tip":"Before you clarify or correct something in a meeting, decide which ONE word carries the contrast, and make it louder, longer and higher than the rest.","lines":[{"t":"I'm not against the idea; I'm just on the fence.","m":"I'm NOT aGAINST the idea; | I'm just on the FENCE."},{"t":"The budget isn't the sticking point; the timeline is.","m":"The BUDGet isn't the sticking point; | the TIMEline IS."},{"t":"I didn't say we should cancel it; I said we should postpone it.","m":"I didn't say we should CANcel it; | I said we should postPONE it."},{"t":"Legal needs to sign off on it, not marketing.","m":"LEgal needs to sign off on it, | NOT MARketing."},{"t":"I'm playing devil's advocate; I don't actually believe it.","m":"I'm PLAYing devil's advocate; | I don't ACtually beLIEVE it."}]},"acts":[{"type":"roleplay","cards":[{"sit":"The dominant participant","a":"You're chairing a meeting to choose a new project management tool. B keeps dominating. Stop B politely, invite others to weigh in and steer the group toward a decision.","b":"You're a senior engineer with strong opinions. You've already decided which tool is best, and you keep interrupting. Only accept the chair's lead if they handle you diplomatically."},{"sit":"The silent stakeholder","a":"You're leading a discussion about a reorganization. B hasn't said a word in 20 minutes, but you sense they're unhappy. Draw them out and find out what the real sticking point is.","b":"You're worried the reorganization will mean your team loses two people, but you don't want to seem negative. Only open up if A asks the right questions."},{"sit":"Deadlock","a":"Two options are on the table, and the team is split 50/50. As chair, you have to make a judgment call in the interest of time, explain your reasoning and get B on board.","b":"You strongly prefer the other option. Push back firmly but professionally. You'll accept the decision if A acknowledges your concerns and offers a date to review it."}]},{"type":"devil","motions":["Decisions made by one person are usually better than decisions made by consensus.","Leaders should always speak last in a discussion.","Meetings without a decision to make should be replaced by a written update.","Anonymous voting produces more honest decisions than open discussion.","Disagreement in meetings should be encouraged, even when it makes people uncomfortable.","Remote teams make better decisions than teams who share an office."]},{"type":"negotiation","sit":"Your company has a one-time budget of US$50,000 left this year. Two department heads have ten minutes to agree on how to use it before the CFO signs off on Friday. If they can't agree, the money goes back to head office.","a":{"role":"Head of Sales","goal":"Buy a new CRM system (full version: US$40,000) so your team can track clients better.","limits":"The basic version costs US$30,000, and you can live with it, but you won't go lower. You'd accept less money now only if Sales gets guaranteed priority in next year's budget."},"b":{"role":"Head of People (HR)","goal":"Pay for a leadership course for 20 team leaders (US$30,000), because turnover among team leaders is high.","limits":"A shorter version for 10 leaders costs US$20,000, and that's your minimum. You'd agree to wait until January if Sales commits to sharing the cost of the full program next year."}}],"ex":{"gap":{"items":[{"s":"Before we decide, I'd like to hear from Sofía. Sofía, would you like to ___?","a":"weigh in"},{"s":"We've agreed on the budget and the schedule. The only ___ is who will manage the project.","a":"sticking point"},{"s":"When management proposed working on Saturdays, the team strongly ___.","a":"pushed back"},{"s":"We can't start until the CFO ___ the budget.","a":"signs off on/has signed off on"},{"s":"___ the new sales figures, we've decided to delay the launch.","a":"In light of"},{"s":"I'm still ___ about the proposal. I can see good arguments on both sides.","a":"on the fence"}]},"match":{"pairs":[["read the room","sense how people in a group are feeling"],["play devil's advocate","argue the opposite view to test an idea"],["reach a consensus","get general agreement from a group"],["make a judgment call","decide based on your own experience when there's no clear answer"],["at odds with","in disagreement with"],["in the interest of time","because there isn't much time left"]]},"fix":{"items":[{"s":"Let me do the devil's advocate for a moment.","wrong":"do the devil's advocate","fix":"play devil's advocate"},{"s":"In light to the new data, we should rethink the plan.","wrong":"In light to","fix":"In light of"},{"s":"I'm still in the fence about this proposal.","wrong":"in the fence","fix":"on the fence"},{"s":"Would anyone else like to weigh on this issue?","wrong":"weigh on","fix":"weigh in on"}]}},"rec":{"prompt":"Think of a difficult decision a group you belonged to had to make. How was the discussion led, and what would you have done differently as the leader?","model":"A couple of years ago, my team had to choose between two software providers, and honestly, the discussion was a mess. Our manager didn't read the room: two senior engineers were completely at odds with each other, and the rest of us were on the fence but too intimidated to weigh in. After three meetings, we still hadn't decided anything. If I'd been leading it, I would have identified the real sticking point much earlier, which, as it turned out, was cost, not quality. Then, in the interest of time, I'd have made a judgment call, explained my reasoning and set a date to review it. Sometimes a good decision today beats a perfect one next month.","use":["read the room","at odds with","weigh in","a sticking point"]},"tips":[{"who":"teacher","t":"Rotate the chair so every student leads at least once. After each round, ask the group: 'What did the chair do that helped? What could they do better?' Focus the feedback on the language for managing people, not on the decision itself."},{"who":"student","t":"When you push back, criticize the idea, not the person. 'I'm not sure this plan addresses the cost issue' works much better than 'You're wrong.'"},{"who":"student","t":"Notice how experienced chairs close meetings: 'So, to recap…', 'Can everyone live with that?' Borrow these phrases and use them in your next real meeting, even in a mixed Spanish-English team."}],"photo":{"src":"https://images.pexels.com/photos/7792770/pexels-photo-7792770.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/colleagues-having-a-meeting-7792770/"}},{"id":"b1-negotiation","lv":"B1","tp":"negotiation","title":"Asking & Making Deals","goals":["ask for a better price and make offers politely","negotiate simple everyday deals with expressions like meet halfway and come down","accept or refuse an offer clearly and politely"],"warm":["Do you enjoy shopping at markets where you can negotiate prices?","What was the last thing you bought secondhand?","Who in your family is the best at getting a good price?","Have you ever sold something online? How did it go?"],"model":{"kind":"dialogue","title":"Buying a Used Bike","intro":"Daniela found a used mountain bike online, and she's meeting the seller, Jake, to take a look at it.","lines":[{"sp":"Jake","t":"Hi, you must be Daniela. Here's the bike. It's only two years old."},{"sp":"Daniela","t":"It looks great! You're asking three hundred dollars, right?"},{"sp":"Jake","t":"That's right. A new one [[costs an arm and a leg]], almost a thousand."},{"sp":"Daniela","t":"I know, but I'm [[on a budget]]. Could you [[come down]] a little?"},{"sp":"Jake","t":"Well, what were you thinking?"},{"sp":"Daniela","t":"I'd like to [[make an offer]]: two hundred, in cash."},{"sp":"Jake","t":"Two hundred? That's too low. Someone else is coming to see it this afternoon."},{"sp":"Daniela","t":"OK, why don't we [[meet halfway]]? Two fifty?"},{"sp":"Jake","t":"Hmm… Two seventy-five, and I'll include the lock and the helmet."},{"sp":"Daniela","t":"That's [[a good deal]]. Can I take it for a quick ride first?"},{"sp":"Jake","t":"Sure, go ahead."},{"sp":"Daniela","t":"It rides really well. OK, two seventy-five. But can you keep it for me until Saturday? I need to get the cash."},{"sp":"Jake","t":"I can keep it until Saturday [[in exchange for]] a small deposit. Is fifty dollars OK?"},{"sp":"Daniela","t":"Sure. And don't worry, I won't [[back out]]."},{"sp":"Jake","t":"Great. So we've [[agreed on]] two seventy-five, with the lock and the helmet. It's a deal!"}],"questions":[{"q":"Why does Daniela ask Jake to come down on the price?","opts":["She thinks the bike is too old.","She has a limited amount of money.","Someone else offered less."],"a":1},{"q":"What is the final price of the bike?","opts":["$250","$300","$275"],"a":2},{"q":"What does Jake want in exchange for keeping the bike until Saturday?","opts":["a $50 deposit","the lock and the helmet","a quick test ride"],"a":0}]},"lang":[{"e":"come down","t":"PV","d":"to lower a price","x":"Could you come down a little? It's a bit too expensive for me.","s":"come DOWN"},{"e":"think it over","t":"PV","d":"to consider something carefully before you decide","x":"It's a nice car, but I need to think it over.","s":"think it OVer"},{"e":"back out","t":"PV","d":"to decide not to do something you agreed to do","x":"The buyer backed out at the last minute.","s":"back OUT"},{"e":"meet someone halfway","t":"ID","d":"to compromise, so each person gets part of what they want","x":"You want 50,000 pesos and I offered 30,000. Can we meet halfway at 40,000?","s":"MEET someone halfWAY"},{"e":"take it or leave it","t":"ID","d":"said when your offer is final and you won't change it","x":"Twenty dollars for both. Take it or leave it.","s":"TAKE it or LEAVE it"},{"e":"cost an arm and a leg","t":"ID","d":"to be very expensive","x":"Eating out in that neighborhood costs an arm and a leg.","s":"cost an ARM and a LEG"},{"e":"make an offer","t":"COL","d":"to say how much you are willing to pay","x":"I made an offer of eight million pesos for the car.","s":"make an OFfer"},{"e":"get a discount","t":"COL","d":"to pay less than the normal price","x":"If you pay in cash, you can get a discount.","s":"get a DIScount"},{"e":"a good deal","t":"COL","d":"a good price or a good agreement","x":"Three avocados for 2,000 pesos? That's a good deal!","s":"a GOOD DEAL"},{"e":"in exchange for","t":"PREP","d":"giving one thing to get another thing","x":"I fixed my neighbor's computer in exchange for a homemade cake.","s":"in exCHANGE for"},{"e":"agree on","t":"PREP","d":"to decide something together","x":"After ten minutes, we finally agreed on a price.","s":"aGREE on"},{"e":"on a budget","t":"PREP","d":"with only a limited amount of money to spend","x":"We're on a budget, so we're staying at a hostel.","s":"on a BUDget"}],"func":{"title":"Making, accepting and refusing offers","when":"Use these phrases when you buy, sell or agree on something with another person.","phrases":[{"p":"Could you do it for…?","use":"asking for a lower price"},{"p":"Is that your best price?","use":"checking if the price can go lower"},{"p":"How about…?","use":"suggesting a price or a deal"},{"p":"I can pay… if you…","use":"making an offer with a condition"},{"p":"What if I…?","use":"suggesting a change"},{"p":"Can you do any better than that?","use":"pushing politely for a better offer"},{"p":"I'm afraid that's a bit too much for me.","use":"saying no politely"},{"p":"Let me get back to you.","use":"asking for time to decide"},{"p":"That sounds fair.","use":"accepting an offer"},{"p":"It's a deal!","use":"closing the deal"}],"task":"Work in pairs. A wants to sell something they really own (a phone, a bike, a guitar). B wants to buy it but is on a budget. Negotiate for 2–3 minutes and use at least five phrases. Finish with \"It's a deal!\" or a polite \"no.\" Then swap roles with a different object."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join the two words, so they sound like one. For example, \"take it or leave it\" sounds like \"tay-ki-tor-lee-vit.\"","tip":"Say each line slowly with the links, then faster. Don't stop between the linked words: say each phrase in one breath.","lines":[{"t":"Take it or leave it.","m":"TAKE‿it‿or LEAVE‿it."},{"t":"I'll think it over.","m":"I'll THINK‿it‿OVer."},{"t":"It costs an arm and a leg.","m":"It COSTS‿an ARM‿and‿a LEG."},{"t":"That's a good deal.","m":"That's‿a GOOD DEAL."},{"t":"Can I make an offer?","m":"Can‿I MAKE‿an OFfer↗?"}]},"acts":[{"type":"roulette","items":["Do you like negotiating prices, or do you prefer fixed prices? Why?","What's the best deal you've ever gotten?","Have you ever asked for a discount? What happened?","When was the last time you had to meet someone halfway?","What's something that costs an arm and a leg in your city?","Have you ever backed out of a plan or a deal? Why?","Where do people usually negotiate prices in Chile?","Would you ask your boss for a raise? How would you do it?","How do you decide what to do when your friends all want something different?","What do you do for fun when you're on a budget?"]},{"type":"roleplay","cards":[{"sit":"At a flea market: buying a vintage leather jacket","a":"You're the buyer. The price tag says 40,000 pesos, but you only want to pay 30,000. Ask for a discount and try to meet halfway.","b":"You're the seller. You don't want to go below 35,000 pesos, but it's the end of the day and you'd like to sell the jacket. If the buyer pays in cash, you can include a free scarf."},{"sit":"Asking your manager for a day off","a":"You're an employee. You want next Friday off for your sister's wedding. In exchange, you can work on Saturday morning or finish your report early.","b":"You're the manager. Friday is a very busy day, and an important report is due. You can say yes, but only if the report is finished by Thursday afternoon."},{"sit":"Sharing an apartment: who does what?","a":"You hate cleaning the bathroom, but you love cooking. Offer to cook dinner twice a week in exchange for never cleaning the bathroom.","b":"You don't mind cleaning, but you can't cook at all. You also want your roommate to take out the trash every day."}]},{"type":"taboo","cards":[{"w":"come down","taboo":["price","lower","less"]},{"w":"think it over","taboo":["decide","time","consider"]},{"w":"back out","taboo":["cancel","agree","promise"]},{"w":"meet someone halfway","taboo":["middle","both","compromise"]},{"w":"take it or leave it","taboo":["final","offer","accept"]},{"w":"cost an arm and a leg","taboo":["expensive","money","price"]},{"w":"get a discount","taboo":["cheaper","pay","less"]},{"w":"a good deal","taboo":["cheap","price","bargain"]},{"w":"in exchange for","taboo":["give","get","trade"]},{"w":"on a budget","taboo":["money","spend","limited"]}]}],"ex":{"gap":{"items":[{"s":"This bike is great, but 300 dollars is too much for me. Could you ___ a little?","a":"come down"},{"s":"I'm not sure yet. Let me ___ and call you tomorrow.","a":"think it over"},{"s":"You want 50,000 and I offered 30,000. Let's ___ and say 40,000.","a":"meet halfway/meet you halfway"},{"s":"We said yes to the apartment, but then we ___ because the rent went up.","a":"backed out"},{"s":"I'll help you paint your living room ___ dinner and a movie.","a":"in exchange for"},{"s":"We're ___ this month, so let's eat at home instead of going out.","a":"on a budget"}]},"match":{"pairs":[["take it or leave it","this is my final offer"],["cost an arm and a leg","be very expensive"],["make an offer","say how much you will pay"],["a good deal","a good price or agreement"],["agree on","decide something together"],["get a discount","pay less than the normal price"]]},"fix":{"items":[{"s":"Can you make me a discount if I pay in cash?","wrong":"make","fix":"give"},{"s":"I'll fix your laptop in exchange of a pizza.","wrong":"of","fix":"for"},{"s":"It's a good price, but I need to think over it.","wrong":"think over it","fix":"think it over"},{"s":"After an hour, we agreed in a price.","wrong":"in","fix":"on"}]}},"rec":{"prompt":"Tell us about a time you bought or sold something and negotiated the price. What happened? Was it a good deal?","model":"Last year, I wanted to buy a used guitar from a guy online. He was asking 150,000 pesos, but I was on a budget, so I asked him to come down a little. At first, he said no, but I told him I could pay in cash that same day. In the end, we met halfway at 120,000 pesos. I think it was a good deal, because the guitar was in great condition and it came with a case. Honestly, I was nervous, but now I always try to negotiate when I buy something secondhand.","use":["on a budget","come down","meet someone halfway","a good deal"]},"tips":[{"who":"teacher","t":"Before the role-plays, act out a short negotiation with a confident student so the class hears the phrases at natural speed. Then leave the key phrases on the screen while pairs practice."},{"who":"student","t":"Use \"Could you…?\" and \"Would you…?\" when you ask for a better price. They sound polite, not demanding."},{"who":"student","t":"Next time you're at a feria or buying something secondhand, have the conversation in English in your head first. It's free practice!"}],"photo":{"src":"https://live.staticflickr.com/8022/7533422858_5cdae708f5_b.jpg","by":"USAG-Humphreys","lic":"CC BY","url":"https://www.flickr.com/photos/31687107@N07/7533422858"}},{"id":"b2-negotiation","lv":"B2","tp":"negotiation","title":"Negotiation Skills","goals":["negotiate a business deal using idiomatic expressions","make conditional offers and concessions","describe how a negotiation went and what the sticking points were"],"warm":["What's the toughest negotiation you've ever been part of, at work or at home?","Do you think good negotiators are born or made?","Is it common to negotiate your salary in Chile? Why or why not?","What's more important in a negotiation: preparation or confidence?"],"model":{"kind":"dialogue","title":"The Supplier Call","intro":"Paula, a purchasing manager at a food company in Santiago, tells her colleague Ben how her negotiation with a packaging supplier went.","lines":[{"sp":"Ben","t":"So, how did the call with the packaging supplier go?"},{"sp":"Paula","t":"Better than I expected, but they really [[drove a hard bargain]]."},{"sp":"Ben","t":"I'm not surprised. Did they agree to lower the price?"},{"sp":"Paula","t":"Not at first. They said a ten percent discount was impossible, and I wasn't going to [[back down]] either."},{"sp":"Ben","t":"So what was the [[sticking point]]?"},{"sp":"Paula","t":"Delivery times. They wanted six weeks, and we need everything in three."},{"sp":"Ben","t":"That's a big gap. Did you threaten to [[walk away]]?"},{"sp":"Paula","t":"I hinted at it. I mentioned that we were [[open to]] offers from other suppliers. That got their attention."},{"sp":"Ben","t":"Nice. And then?"},{"sp":"Paula","t":"Then I [[made a concession]]: we'll sign a two-year contract instead of one. In return, they'll deliver in four weeks and give us seven percent off."},{"sp":"Ben","t":"Seven percent? Why didn't you [[hold out for]] ten?"},{"sp":"Paula","t":"Honestly, I didn't want to [[leave money on the table]], but I didn't want to lose them, either. Their quality is excellent."},{"sp":"Ben","t":"Fair enough. So have you signed anything yet?"},{"sp":"Paula","t":"Not yet. We've [[reached an agreement]] [[in principle]], and I'm sending them the draft contract today."},{"sp":"Ben","t":"Good. Just don't let them rush you. Never sign anything [[under pressure]]."},{"sp":"Paula","t":"Don't worry. Once they get the draft, [[the ball's in their court]]."}],"questions":[{"q":"What was the main problem in the negotiation?","opts":["the length of the contract","delivery times","the quality of the packaging"],"a":1},{"q":"What did Paula offer the supplier to get a better deal?","opts":["a longer contract","faster payment","a bigger order"],"a":0},{"q":"What happens next?","opts":["Paula will sign the contract today.","Paula will look for a new supplier.","The supplier will review the draft and reply."],"a":2}]},"lang":[{"e":"hold out for","t":"PV","d":"to refuse to accept less and wait until you get something better","x":"She turned down two offers and held out for a higher salary.","s":"hold OUT for"},{"e":"back down","t":"PV","d":"to stop insisting on what you wanted","x":"Neither side was willing to back down, so the talks broke down.","s":"back DOWN"},{"e":"walk away (from)","t":"PV","d":"to leave a negotiation without making a deal","x":"If the terms don't work for us, we're ready to walk away.","s":"walk aWAY"},{"e":"drive a hard bargain","t":"ID","d":"to negotiate firmly and insist on a good deal for yourself","x":"Our new client drives a hard bargain. He questioned every single number.","s":"drive a HARD BARgain"},{"e":"the ball is in your court","t":"ID","d":"it's your turn to act or make a decision","x":"We've sent our best offer, so the ball is in their court now.","s":"the BALL is in your COURT"},{"e":"leave money on the table","t":"ID","d":"to get a worse deal than you could have gotten","x":"If you accept the first offer, you might be leaving money on the table.","s":"leave MONey on the TAble"},{"e":"reach an agreement","t":"COL","d":"to finally agree after a discussion","x":"After three long meetings, we reached an agreement.","s":"REACH an aGREEment"},{"e":"make a concession","t":"COL","d":"to give up something to help reach a deal","x":"We made a concession on price to get a longer contract.","s":"make a conCESsion"},{"e":"a sticking point","t":"COL","d":"an issue that stops people from agreeing","x":"Payment terms were the main sticking point.","s":"a STICKing point"},{"e":"open to","t":"PREP","d":"willing to consider","x":"We're open to other options if this price doesn't work for you.","s":"Open to"},{"e":"in principle","t":"PREP","d":"in general, although the details aren't decided yet","x":"We agree in principle, but we still need to check the numbers.","s":"in PRINciple"},{"e":"under pressure","t":"PREP","d":"while someone is pushing you to act quickly","x":"Never make a big decision under pressure.","s":"under PRESsure"}],"func":{"title":"Making proposals and concessions","when":"Use these in business negotiations to bargain firmly but politely.","phrases":[{"p":"If you could…, we'd be able to…","use":"making a conditional offer"},{"p":"We might be able to…, provided that…","use":"offering something with a condition"},{"p":"What would it take to…?","use":"finding out what the other side needs"},{"p":"Where do you have some flexibility?","use":"looking for room to negotiate"},{"p":"I hear what you're saying, but…","use":"acknowledging and then disagreeing"},{"p":"I'm afraid that's not something we can agree to.","use":"refusing firmly but politely"},{"p":"Let's see if we can find some middle ground.","use":"suggesting a compromise"},{"p":"Just so we're on the same page, …","use":"checking and summarizing"},{"p":"Let me run it by my team and get back to you.","use":"buying time"},{"p":"I think we have a deal.","use":"closing the negotiation"}],"task":"In pairs: A is a freelance web designer; B owns a small café and needs a new website. A wants $2,000 and six weeks to do the job. B has a budget of $1,200 and needs the website in four weeks. Negotiate for three minutes. Each of you must make at least two conditional offers and use one phrase to buy time."},"pron":{"focus":"Contrastive stress","explain":"In negotiations, we often compare two numbers, dates or options. Put extra stress on the words that show the difference, so the other side hears exactly what you are offering and what you are not.","tip":"Before you speak, ask yourself: what's the contrast here? Then make those words louder, longer and a little higher.","lines":[{"t":"We can't do ten percent, but we could do seven.","m":"We CAN'T do TEN percent, | but we COULD do SEVen."},{"t":"I said four weeks, not six.","m":"I said FOUR weeks, | NOT SIX."},{"t":"The price isn't the problem; the delivery time is.","m":"The PRICE isn't the problem; | the deLIVery time IS."},{"t":"We agree on the price, but not on the dates.","m":"We aGREE on the PRICE, | but NOT on the DATES."},{"t":"Now the ball's in their court, not ours.","m":"NOW the ball's in THEIR court, | not OURS."}]},"acts":[{"type":"agree","items":["Everything is negotiable, including your salary.","It's rude to negotiate prices at a small family business.","The person who makes the first offer usually gets a worse deal.","Negotiating by email is more effective than negotiating face to face.","You should always be ready to walk away from a deal.","In a negotiation, being direct is more important than being polite.","A good negotiator makes sure both sides feel like winners."]},{"type":"ranking","task":"Rank these negotiation tactics from most to least effective. Then agree on a top three with your group and explain your choices.","items":["Researching the other side before you meet","Making the first offer","Staying silent after the other side makes an offer","Threatening to walk away","Building a friendly relationship first","Setting a deadline for the decision","Asking lots of questions to find out what the other side really wants"]},{"type":"negotiation","sit":"A small coffee roaster from Valparaíso wants to supply coffee to a chain of 12 hotels. The two sides meet to agree on the price per kilo, deliveries, payment terms and the length of the contract.","a":{"role":"Sales manager at the coffee roaster","goal":"Sell 400 kilos a month at 18,000 pesos per kilo, with a one-year contract and payment within 30 days.","limits":"Your absolute minimum is 15,000 pesos per kilo, and only with a two-year contract. You can easily deliver every two weeks; weekly deliveries cost you an extra 150,000 pesos a month. You can't wait more than 45 days for payment."},"b":{"role":"Purchasing manager at the hotel chain","goal":"Pay 14,000 pesos per kilo or less, with weekly deliveries and payment after 60 days.","limits":"You can go up to 16,000 pesos per kilo, but only with weekly deliveries. You'll accept a two-year contract only if you can cancel it after the first year. Your boss also wants free barista training for your staff."}}],"ex":{"gap":{"items":[{"s":"If the price is still too high, we'll ___ and talk to another supplier.","a":"walk away"},{"s":"Don't accept their first offer. I think we should ___ a better price.","a":"hold out for"},{"s":"We like your proposal ___, but we need to discuss the details.","a":"in principle"},{"s":"Delivery dates were the main ___. We spent two hours on them.","a":"sticking point"},{"s":"We've sent our final offer, so ___ now. Let's wait for their answer.","a":"the ball is in their court/the ball's in their court"},{"s":"Never sign a contract ___. Take the time to read it carefully.","a":"under pressure"}]},"match":{"pairs":[["back down","stop insisting on what you wanted"],["drive a hard bargain","negotiate firmly to get the best possible deal"],["leave money on the table","accept less than you could have gotten"],["make a concession","give up something to help reach a deal"],["open to","willing to consider"],["reach an agreement","finally agree after a discussion"]]},"fix":{"items":[{"s":"After three meetings, we finally arrived to an agreement.","wrong":"arrived to","fix":"reached"},{"s":"We're open for new ideas, so feel free to make suggestions.","wrong":"for","fix":"to"},{"s":"We had to do a concession on the delivery dates.","wrong":"do","fix":"make"},{"s":"Let's wait. I want to hold out a better price.","wrong":"hold out","fix":"hold out for"}]}},"rec":{"prompt":"Describe a negotiation you've been part of, at work or in your personal life (a salary, a contract, a big purchase). What was the sticking point, and how did it end?","model":"A couple of years ago, I negotiated a contract with a new client for my design studio. They really drove a hard bargain. They wanted a twenty percent discount and payment after ninety days. The sticking point was the payment terms, because as a small business, we couldn't wait three months for our money. In the end, I made a concession on price and gave them ten percent off, and in return, they agreed to pay within thirty days. We reached an agreement in less than a week, and they're still one of our best clients. Looking back, I'm glad I didn't give in on everything.","use":["drive a hard bargain","a sticking point","make a concession","reach an agreement"]},"tips":[{"who":"teacher","t":"Give pairs three minutes of silent preparation before the negotiation activity: each student writes their ideal outcome, their walk-away point and two concessions they could make."},{"who":"student","t":"Prepare a few conditional sentences (\"If you can…, we could…\") before any negotiation in English. They sound professional and give you time to think."},{"who":"student","t":"If you lose track of the numbers, summarize: \"Just so we're on the same page, you're offering…\" Checking is a negotiation skill, not a sign of weak English."}],"photo":{"src":"https://live.staticflickr.com/7351/14090438714_33bec862fe_b.jpg","by":"flazingo_photos","lic":"CC BY-SA","url":"https://www.flickr.com/photos/124247024@N07/14090438714"}},{"id":"c1-negotiation","lv":"C1","tp":"negotiation","title":"Persuasion & Influence","goals":["discuss the psychology of persuasion with sophisticated expressions","persuade colleagues diplomatically, even when they disagree","evaluate where persuasion ends and manipulation begins"],"warm":["Who is the most persuasive person you know? What makes them so convincing?","Has an ad ever persuaded you to buy something you didn't need?","Are you easy or hard to persuade? Why?","Which changes people's minds more often: facts or emotions?"],"model":{"kind":"text","title":"Why Good Arguments Aren't Enough","intro":"A short article from a leadership blog about how influence really works at work.","paras":["Most of us assume that if we [[make a compelling case]], people will agree with us. Show the data, explain the logic, and the room will follow. In reality, facts alone rarely [[win over]] a skeptical audience. People need to trust you before they trust your numbers.","That's why experienced negotiators take time to [[build rapport]] before they talk business. They ask questions, look for common ground and listen more than they speak. They also [[establish credibility]] early, often by admitting what they don't know. Ironically, people who [[play down]] their own importance can come across as more trustworthy, not less.","Psychology offers other clues. In a well-known experiment from the 1960s, homeowners who first agreed to put a small road-safety sign in their window were far more likely to accept a large, unattractive sign on their lawn two weeks later. Once you [[get your foot in the door]] with a small request, a bigger one feels like a natural next step.","Finally, know your audience. Arguments that [[appeal to]] people's values tend to travel further than a pile of statistics. And if half your team is [[on the fence]], don't spend your energy on colleagues who already support you; that's just [[preaching to the choir]]. Focus on the undecided. Often, one respected colleague changing sides is enough to [[tip the scales]]."],"questions":[{"q":"According to the article, why do facts alone often fail to persuade?","opts":["People rarely understand statistics.","People need to trust the speaker first.","Most data presented at work is unreliable."],"a":1},{"q":"What does the experiment from the 1960s suggest?","opts":["A small first request makes a bigger one more likely to succeed.","Large signs are more persuasive than small ones.","Homeowners care more about road safety than anything else."],"a":0},{"q":"If half your team is undecided, where should you focus your energy?","opts":["on your strongest supporters","on adding more statistics","on the colleagues who haven't decided yet"],"a":2}]},"lang":[{"e":"win over","t":"PV","d":"to gain someone's support or approval, especially when they doubted you at first","x":"Her honesty won over even the most skeptical investors.","s":"win OVer"},{"e":"bring someone around","t":"PV","d":"to persuade someone to change their opinion","x":"My dad hated the idea at first, but we eventually brought him around.","s":"bring someone aROUND","uk":"UK: bring someone round"},{"e":"play down","t":"PV","d":"to make something seem less important or serious than it really is","x":"The CEO played down the risks in his presentation.","s":"play DOWN"},{"e":"get your foot in the door","t":"ID","d":"to take a small first step that can lead to bigger opportunities","x":"Offer a free trial. It's a great way to get your foot in the door.","s":"get your FOOT in the DOOR"},{"e":"preach to the choir","t":"ID","d":"to try to persuade people who already agree with you","x":"Posting about it on your own page is just preaching to the choir.","s":"PREACH to the CHOIR","uk":"UK: preach to the converted"},{"e":"tip the scales","t":"ID","d":"to be the factor that decides the result","x":"Their after-sales service tipped the scales in their favor.","s":"tip the SCALES"},{"e":"make a compelling case (for)","t":"COL","d":"to present very convincing arguments for something","x":"She made a compelling case for hiring two more engineers.","s":"make a comPELling CASE"},{"e":"build rapport","t":"COL","d":"to create a friendly, trusting relationship with someone","x":"Good salespeople build rapport before they talk about price.","s":"build rapPORT"},{"e":"establish credibility","t":"COL","d":"to show people that you know what you're talking about and can be believed","x":"Sharing real client results helped him establish credibility quickly.","s":"eSTABlish crediBILity"},{"e":"appeal to","t":"PREP","d":"to attract or interest someone, often through their emotions or values","x":"The campaign appeals to parents who worry about screen time.","s":"apPEAL to"},{"e":"on the fence","t":"PREP","d":"undecided between two options","x":"I'm still on the fence about the job offer.","s":"on the FENCE"},{"e":"in light of","t":"PREP","d":"considering; because of (new information)","x":"In light of the new data, we've changed our recommendation.","s":"in LIGHT of"}],"func":{"title":"Persuading diplomatically","when":"Use these when you need to influence colleagues, clients or managers without sounding pushy.","phrases":[{"p":"I'd urge you to consider…","use":"recommending strongly but politely"},{"p":"Wouldn't you agree that…?","use":"inviting agreement"},{"p":"I take your point, but have you considered…?","use":"acknowledging an objection and redirecting"},{"p":"Let me put it another way.","use":"reframing your argument"},{"p":"What if we looked at it from the client's point of view?","use":"changing the perspective"},{"p":"With all due respect, …","use":"disagreeing with someone senior"},{"p":"The way I see it, we stand to gain…","use":"highlighting the benefits"},{"p":"The risk of doing nothing is…","use":"creating a sense of urgency"},{"p":"Imagine for a moment that…","use":"inviting people to picture a scenario"},{"p":"Why don't we start with a small pilot?","use":"making it easier to say yes"}],"task":"In pairs: A wants their manager (B) to approve something important, such as a bigger budget, an extra team member or flexible hours. B is on the fence and raises at least three objections. A has three minutes to win B over using at least four phrases. Then swap roles with a new request."},"pron":{"focus":"Intonation in tag questions","explain":"A tag question with a falling tone (↘) means \"I'm sure; please agree with me.\" That makes it a powerful persuasion tool. A rising tone (↗) means you really aren't sure and want an answer. Pause briefly before the tag.","tip":"Say each line twice, first with a fall and then with a rise, and notice how the meaning changes. When you want to persuade, use the fall.","lines":[{"t":"The numbers speak for themselves, don't they?","m":"The NUMbers SPEAK for themSELVES, | DON'T they↘?"},{"t":"We can't afford to wait, can we?","m":"We CAN'T afFORD to WAIT, | CAN we↘?"},{"t":"That would tip the scales, wouldn't it?","m":"That would TIP the SCALES, | WOULDn't it↘?"},{"t":"You're still on the fence, aren't you?","m":"You're STILL on the FENCE, | AREN'T you↗?"},{"t":"It's a compelling case, isn't it?","m":"It's a comPELling CASE, | ISn't it↘?"}]},"acts":[{"type":"devil","motions":["Persuasion is just manipulation with better manners.","At work, emotional arguments are more effective than logical ones.","Good ideas sell themselves, so persuasion skills are overrated.","It's acceptable to play down the risks if it helps you win over a client.","Introverts make better persuaders than extroverts.","Online stores should not be allowed to use countdown timers or \"only 2 left!\" messages."]},{"type":"balloon","sit":"A hot-air balloon is losing height over the Andes, and only one passenger can stay on board. Every passenger is a professional persuader. In turn, argue that your skills are the most valuable to society. After each round, the group votes one person out.","roles":[{"name":"A trial lawyer","why":"persuades juries and protects people's rights"},{"name":"An advertising director","why":"shapes what millions of people buy and believe"},{"name":"A diplomat","why":"prevents conflicts through negotiation"},{"name":"A family doctor","why":"convinces patients to change unhealthy habits"},{"name":"A high school teacher","why":"persuades teenagers that learning is worth the effort"},{"name":"A charity fundraiser","why":"convinces strangers to give money to good causes"}]},{"type":"fishbowl","questions":["Where is the line between persuasion and manipulation?","Are some people naturally persuasive, or is it a skill anyone can learn?","What persuades people more in your culture: data, stories or personal relationships?","Should leaders try to win people over, or simply make the decision and explain it?","How has social media changed the way companies and individuals try to influence us?","Is it ever right to change your mind just because the majority disagrees with you?"]}],"ex":{"gap":{"items":[{"s":"In his report, the CEO ___ the risks, so investors were shocked when the project failed.","a":"played down"},{"s":"Most of the team supports the plan, but a few people are still ___.","a":"on the fence"},{"s":"Don't send the newsletter only to loyal customers; that's just ___.","a":"preaching to the choir"},{"s":"___ last quarter's results, we've decided to postpone the launch.","a":"In light of"},{"s":"Both offers were similar, but their excellent customer service ___ in their favor.","a":"tipped the scales"},{"s":"Ads that ___ our emotions are often more memorable than ads full of statistics.","a":"appeal to"}]},"match":{"pairs":[["win over","gain someone's support"],["get your foot in the door","take a small first step toward something bigger"],["make a compelling case","present a very convincing argument"],["build rapport","create a friendly, trusting connection"],["establish credibility","show that you know what you're talking about"],["on the fence","unable to decide"]]},"fix":{"items":[{"s":"She made a compelling case of remote work.","wrong":"of","fix":"for"},{"s":"We need a message that appeals the younger customers.","wrong":"appeals","fix":"appeals to"},{"s":"It took weeks, but we finally brought around him.","wrong":"brought around him","fix":"brought him around"},{"s":"Half the board is still in the fence.","wrong":"in","fix":"on"}]}},"rec":{"prompt":"Think of a time you changed someone's mind, or someone changed yours. What made the argument persuasive in the end?","model":"A few years ago, I wanted my company to let our team work from home two days a week. My manager was skeptical, and the rest of the leadership team was on the fence. Instead of arguing, I tried to win them over gradually. I proposed a three-month pilot with clear targets, so the risk felt small. I also built rapport with the operations director by asking about his concerns first, which were mostly about response times. At the end of the pilot, our productivity numbers had actually improved slightly, and that's what tipped the scales. The lesson for me was that people rarely change their minds in one meeting; they need time and evidence.","use":["on the fence","win over","build rapport","tip the scales"]},"tips":[{"who":"teacher","t":"During the balloon debate, note one persuasive phrase each student uses well and one they could upgrade. Share both in feedback so everyone leaves with a concrete improvement."},{"who":"student","t":"Before you argue, ask a question like \"What matters most to you here?\" You'll persuade far more effectively when you know the other person's priorities."},{"who":"student","t":"Learn persuasive expressions as complete chunks (\"make a compelling case for,\" \"in light of\") so you don't hesitate over prepositions in the moment."}],"photo":{"src":"https://images.pexels.com/photos/8353802/pexels-photo-8353802.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/woman-in-white-suit-discussing-stock-market-data-to-her-colleagues-8353802/"}},{"id":"b1-presentations","lv":"B1","tp":"presentations","title":"Talking About Your Work","goals":["introduce yourself and describe your job clearly","talk about your responsibilities and current projects","give a short, well-organized talk about your work"],"warm":["How do you usually explain your job or studies to people you've just met?","Does your job title really explain what you do? Why or why not?","What's the best part of your job or studies?","Have you ever had to speak in front of a group? How did you feel?"],"model":{"kind":"text","title":"Meet the Team: Carolina","intro":"At the monthly team meeting, new employees give a two-minute talk about their work. This is Carolina's.","paras":["Hi, everyone! I'm Carolina, and I joined the Customer Success team in March. Before that, I worked at a hotel in Viña del Mar for five years, so as you can imagine, I'm [[a people person]].","So, what do I do here? I'm [[responsible for]] our clients in Chile and Peru, and I [[report to]] Andrés. On [[a typical day]], I answer emails, run online training sessions and [[deal with]] any problems when a client is unhappy. In a small team like ours, you [[wear many hats]]!","Right now, I'm [[working on]] a new welcome guide for our clients. It's due at the end of the month, so I'm [[working long hours]] this week to [[meet the deadline]].","The first few weeks weren't easy, but you all helped me [[learn the ropes]], so thank you! Next year, I'd like to [[take on]] more projects, maybe in Brazil. Thanks for listening, and come say hi in the kitchen!"],"questions":[{"q":"Where did Carolina work before?","opts":["at a hotel","at a bank","at a school"],"a":0},{"q":"What is she working on right now?","opts":["training sessions in Brazil","a welcome guide for clients","a new office in Peru"],"a":1},{"q":"Why is she working long hours this week?","opts":["Her manager is on vacation.","She has a lot of unhappy clients.","She has to finish the guide by the end of the month."],"a":2}]},"lang":[{"e":"deal with","t":"PV","d":"to take action to solve a problem or handle a situation","x":"I deal with customer complaints every day.","s":"DEAL with"},{"e":"work on","t":"PV","d":"to spend time doing or improving something","x":"I'm working on a new website for the company.","s":"WORK on"},{"e":"take on","t":"PV","d":"to accept new work or responsibility","x":"This year, I've taken on two new clients.","s":"take ON"},{"e":"learn the ropes","t":"ID","d":"to learn how to do a new job","x":"It took me about a month to learn the ropes.","s":"learn the ROPES"},{"e":"wear many hats","t":"ID","d":"to have several different jobs or roles at the same time","x":"In a startup, everyone wears many hats.","s":"wear MANy HATS"},{"e":"a people person","t":"ID","d":"someone who enjoys being with and working with other people","x":"I'm a people person, so I love working in sales.","s":"a PEOple person"},{"e":"meet a deadline","t":"COL","d":"to finish something by the time it is due","x":"We worked all weekend to meet the deadline.","s":"meet a DEADline"},{"e":"work long hours","t":"COL","d":"to work many hours every day","x":"Nurses often work long hours.","s":"work LONG HOURS"},{"e":"a typical day","t":"COL","d":"a normal day, when nothing special happens","x":"On a typical day, I start work at 8:30.","s":"a TYPical DAY"},{"e":"in charge of","t":"PREP","d":"leading or managing something or someone","x":"Who's in charge of the new project?","s":"in CHARGE of"},{"e":"responsible for","t":"PREP","d":"having the job or duty of doing something","x":"I'm responsible for hiring new staff.","s":"reSPONsible for"},{"e":"report to","t":"PREP","d":"to have someone as your direct manager","x":"I report to the finance director.","s":"rePORT to"}],"func":{"title":"Organizing a short talk","when":"Use these to guide your listeners when you talk about your work at a meeting or an event.","phrases":[{"p":"Let me start by telling you a bit about myself.","use":"opening your talk"},{"p":"Today I'm going to talk about…","use":"introducing your topic"},{"p":"First, … Then, … Finally, …","use":"putting your points in order"},{"p":"So, what do I do exactly?","use":"asking a question to introduce a point"},{"p":"For example, …","use":"giving an example"},{"p":"Moving on to…","use":"changing to a new point"},{"p":"The best part of my job is…","use":"giving a personal opinion"},{"p":"To sum up, …","use":"summarizing"},{"p":"Thanks for listening. Any questions?","use":"finishing your talk"},{"p":"That's a good question.","use":"responding to a question"}],"task":"Prepare a 90-second talk about your job or studies. Use at least five phrases. Your partner listens, checks off each phrase they hear, and asks you one question at the end. Then swap."},"pron":{"focus":"Word stress in work vocabulary","explain":"Long words have one main stressed syllable that is louder and longer. Spanish speakers often stress work words on the wrong syllable, for example responsible (reSPONsible), customer (CUStomer) and develop (deVELop). Correct stress helps people understand you immediately.","tip":"When you learn a new work word, check the stress in an online dictionary and clap it out: re-SPON-si-ble.","lines":[{"t":"I'm responsible for our clients in Chile.","m":"I'm reSPONsible for our CLIents in CHIle."},{"t":"I report to the marketing manager.","m":"I rePORT to the MARketing MANager."},{"t":"I deal with customers every day.","m":"I DEAL with CUStomers EVery DAY."},{"t":"We have to meet the deadline on Friday.","m":"We HAVE to MEET the DEADline on FRIday."},{"t":"I'm working on a new project.","m":"I'm WORKing on a NEW PROject."}]},"acts":[{"type":"minute","items":["Your job or studies in 60 seconds","A typical day at work or school","The best and worst parts of your job","Your first day at a new job or school","A colleague or teacher you learned a lot from","A project you're proud of","Your dream job"]},{"type":"picture","prompts":["Who do you think these people are? Where are they?","What do you think the person is talking about?","How do the listeners feel? How can you tell?","Do you have meetings like this at your job or school? What are they like?","Would you like to be the speaker in this photo? Why or why not?"]},{"type":"fluency","topics":["Introduce yourself and your job to a new colleague.","Describe the busiest week you've had at work or school recently.","Tell the story of how you got your current job or chose your studies.","Explain a project you're working on right now.","Describe the best job you've ever had."]}],"ex":{"gap":{"items":[{"s":"Andrés is my manager, so I ___ him.","a":"report to"},{"s":"When a customer is angry, I'm the one who has to ___ them.","a":"deal with"},{"s":"I'm ___ a new website for the company. It'll be ready in May.","a":"working on"},{"s":"My first month was hard, but my colleagues helped me ___.","a":"learn the ropes"},{"s":"In a small company, you ___: I'm the receptionist, the accountant and the IT person!","a":"wear many hats"},{"s":"We stayed at the office until midnight to ___. The report was due the next morning.","a":"meet the deadline/meet a deadline/meet our deadline"}]},"match":{"pairs":[["take on","accept new work or responsibility"],["in charge of","leading or managing a team or project"],["a typical day","a normal day, when nothing special happens"],["work long hours","work much more than eight hours a day"],["a people person","someone who enjoys working with others"],["wear many hats","have several different roles at the same time"]]},"fix":{"items":[{"s":"I'm responsible of the marketing budget.","wrong":"of","fix":"for"},{"s":"On a typical day, I answer to emails and phone calls.","wrong":"answer to","fix":"answer"},{"s":"I report Andrés every Friday.","wrong":"report","fix":"report to"},{"s":"Who is in charge for the new project?","wrong":"for","fix":"of"}]}},"rec":{"prompt":"Introduce yourself and your job (or studies) as if you were speaking at a team meeting. What do you do, and what are you working on right now?","model":"Hi, I'm Felipe, and I'm an accountant at a logistics company in Santiago. I'm responsible for paying our suppliers and preparing monthly reports for my manager. On a typical day, I check invoices, answer emails and deal with questions from other departments. It sounds boring, but I like it because every day is a little different. Right now, I'm working on a new system to pay suppliers faster. It's a big change, and we have to finish it by December, so I'm pretty busy. In my free time, I play soccer and try to forget about numbers!","use":["responsible for","a typical day","deal with","work on"]},"tips":[{"who":"teacher","t":"In the 4/3/2 activity, keep the timing strict and change partners quickly. At the end, ask students how their third version was different from their first."},{"who":"student","t":"Prepare a 30-second introduction to your job in English and practice it until you can say it without notes. You'll use it again and again."},{"who":"student","t":"Don't translate your job title word for word. Describe what you do instead: \"I'm responsible for…,\" \"I deal with…\""}],"photo":{"src":"https://images.pexels.com/photos/8154794/pexels-photo-8154794.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/a-woman-in-a-business-meeting-doing-a-presentation-8154794/"}},{"id":"b2-presentations","lv":"B2","tp":"presentations","title":"Presenting Ideas","goals":["structure a presentation clearly with signposting language","present an idea and support it with evidence","handle questions from the audience confidently"],"warm":["What's the best presentation you've ever seen? What made it so good?","How do you feel before you give a presentation?","Do you prefer presentations with slides or without? Why?","What's the most common mistake people make when they present?"],"model":{"kind":"dialogue","title":"The Practice Run","intro":"Lucía is going to present an idea to her company's directors tomorrow, so she's practicing with her colleague Tom.","lines":[{"sp":"Lucía","t":"OK, here goes. \"Good morning, everyone. To [[get the ball rolling]], I'd like to share one number with you: forty percent.\""},{"sp":"Tom","t":"Nice opening. A number like that will [[grab their attention]]."},{"sp":"Lucía","t":"Then I say: \"Last year, forty percent of our new hires left within twelve months. [[In a nutshell]], we're losing talent and money.\""},{"sp":"Tom","t":"Good. Short and clear. So what's your proposal?"},{"sp":"Lucía","t":"A mentoring program for every new employee. Next, I [[walk them through]] the plan: who the mentors are, how often they meet and what it costs."},{"sp":"Tom","t":"And how are you going to [[back up]] the numbers?"},{"sp":"Lucía","t":"With our own data. [[Based on]] a pilot we ran in the Lima office, turnover dropped by a third."},{"sp":"Tom","t":"That's convincing. But don't overload them with details. The directors want [[the big picture]]."},{"sp":"Lucía","t":"I know. That's why I've put everything on one slide, so they can see the costs and benefits [[at a glance]]."},{"sp":"Tom","t":"Smart. They'll also ask about the schedule."},{"sp":"Lucía","t":"[[In terms of]] timing, we could start in March if they approve it this month."},{"sp":"Tom","t":"Perfect. And how do you [[wrap up]]?"},{"sp":"Lucía","t":"I repeat the [[key takeaway]]: keeping a good employee is much cheaper than hiring a new one."},{"sp":"Tom","t":"That's strong. Honestly, I think you'll [[get your point across]] in less than ten minutes."},{"sp":"Lucía","t":"Let's hope so. I always get nervous when the CEO starts checking his phone!"}],"questions":[{"q":"What is Lucía's proposal?","opts":["a new hiring process","a mentoring program for new employees","a new office in Lima"],"a":1},{"q":"What evidence is she going to use?","opts":["the results of a pilot in another office","a survey of the directors","data from two competitors"],"a":0},{"q":"According to Tom, what do the directors want?","opts":["detailed numbers on every slide","a longer presentation","the main ideas, not lots of details"],"a":2}]},"lang":[{"e":"walk someone through","t":"PV","d":"to explain something to someone step by step","x":"Let me walk you through the main results.","s":"walk someone THROUGH"},{"e":"back up","t":"PV","d":"to support an idea or claim with evidence","x":"Make sure you can back up every number on your slides.","s":"back UP"},{"e":"wrap up","t":"PV","d":"to finish a talk, meeting or activity","x":"Let's wrap up with a quick summary.","s":"wrap UP"},{"e":"get the ball rolling","t":"ID","d":"to start an activity or discussion","x":"To get the ball rolling, let's hear from the sales team.","s":"get the BALL ROLLing"},{"e":"in a nutshell","t":"ID","d":"in very few words; briefly","x":"In a nutshell, we need more staff and a bigger budget.","s":"in a NUTshell"},{"e":"the big picture","t":"ID","d":"the general situation, not the small details","x":"Before we discuss the details, let's look at the big picture.","s":"the BIG PICture"},{"e":"grab someone's attention","t":"COL","d":"to make people suddenly interested","x":"Start with a surprising fact to grab the audience's attention.","s":"GRAB someone's atTENtion"},{"e":"get your point across","t":"COL","d":"to make people understand your idea clearly","x":"Simple slides will help you get your point across.","s":"get your POINT aCROSS"},{"e":"the key takeaway","t":"COL","d":"the most important idea people should remember","x":"The key takeaway is that our customers want faster service.","s":"the KEY TAKEaway"},{"e":"in terms of","t":"PREP","d":"when talking about a particular aspect of something","x":"In terms of cost, the second option is much better.","s":"in TERMS of"},{"e":"based on","t":"PREP","d":"using something as evidence or as a starting point","x":"Based on our survey, most clients are happy with the service.","s":"BASED on"},{"e":"at a glance","t":"PREP","d":"with just a quick look","x":"This chart shows our progress at a glance.","s":"at a GLANCE"}],"func":{"title":"Signposting and handling questions","when":"Use these to guide your audience through a presentation and to deal with questions confidently.","phrases":[{"p":"I've divided my talk into three parts.","use":"outlining the structure"},{"p":"Let's move on to…","use":"starting a new section"},{"p":"As you can see from this chart, …","use":"referring to a visual"},{"p":"What this means is…","use":"explaining why something is important"},{"p":"To put it another way, …","use":"rephrasing an idea"},{"p":"I'll come back to that in a minute.","use":"postponing a question"},{"p":"That's a fair question.","use":"acknowledging a difficult question"},{"p":"I don't have that figure with me, but I'll get back to you.","use":"handling a question you can't answer"},{"p":"Does that answer your question?","use":"checking that your answer was clear"},{"p":"Let me leave you with one final thought.","use":"ending memorably"}],"task":"In pairs, A presents an idea to improve their workplace, school or neighborhood in two minutes. B interrupts with two questions at any moment. A must use one signposting phrase in each part of the talk and two phrases for handling questions. Then swap."},"pron":{"focus":"Chunking and pausing","explain":"Good presenters speak in chunks: short groups of words that belong together, with a small pause (|) between them. Stress the most important words in each chunk. Chunking gives your audience time to think and makes you sound calm and confident.","tip":"Print the first paragraph of your next presentation, mark the pauses with a slash (/) and underline the key words. Then read it aloud three times.","lines":[{"t":"In a nutshell, we're losing talent and money.","m":"In a NUTshell, | we're LOSing TALent | and MONey."},{"t":"Let me walk you through the plan.","m":"Let me WALK you through | the PLAN."},{"t":"Based on our pilot, turnover dropped by a third.","m":"BASED on our PIlot, | TURNover DROPPED | by a THIRD."},{"t":"The key takeaway is simple: keeping people is cheaper than hiring them.","m":"The KEY TAKEaway is SIMple: | KEEPing people | is CHEAPer than HIRing them."},{"t":"As you can see at a glance, the costs are low.","m":"As you can SEE at a GLANCE, | the COSTS are LOW."}]},"acts":[{"type":"wyr","items":[["give a presentation to 500 strangers","give a presentation to your company's five top directors"],["present with no slides at all","present 40 slides in ten minutes"],["forget what you were saying in the middle of a talk","have your laptop crash just before you start"],["answer difficult questions you didn't expect","speak for 20 minutes with no questions at all"],["present in person to a silent room","present online to people with their cameras off"],["be the first speaker of the day","be the last speaker before lunch"],["get honest negative feedback after your talk","get polite comments that don't help you improve"]]},{"type":"ranking","task":"Rank these presentation habits from most to least annoying. Then explain your top choice to the group and suggest a better alternative.","items":["Reading every word on the slides","Going over time","Starting with a long apology or a technical problem","Using lots of jargon and acronyms","Never looking at the audience","Saying \"um\" and \"like\" all the time","Showing slides full of tiny text"]},{"type":"expert","topic":"A proposal: our company should move to a four-day workweek, with the same pay.","expert":"You're the HR director who designed the proposal. Present the idea in two minutes: what will change, why it's a good idea and how you'll measure success. Back up your points with examples, and stay calm when the questions get tough.","journalists":"You're reporters from a business magazine. Listen to the presentation and take notes. Then ask challenging questions and push for details, numbers and risks.","questions":["How will you make sure productivity doesn't drop?","What happens to customers who need help on Fridays?","How much will this cost the company in the first year?","What evidence do you have that this works in companies like ours?","What will you do if the trial fails?","Is this fair to employees who work in shifts and can't easily change their schedules?"]}],"ex":{"gap":{"items":[{"s":"Let me ___ the plan step by step.","a":"walk you through"},{"s":"You'll need some data to ___ your argument.","a":"back up"},{"s":"OK, we're almost out of time, so let's ___.","a":"wrap up"},{"s":"I could talk about this for hours, but ___, we're losing customers because our app is too slow.","a":"in a nutshell"},{"s":"The first option is better ___ quality, but the second one is much cheaper.","a":"in terms of"},{"s":"Don't get lost in the details. The directors want to see ___.","a":"the big picture"}]},"match":{"pairs":[["get the ball rolling","start an activity or discussion"],["grab someone's attention","make people suddenly interested"],["get your point across","make people understand your idea"],["the key takeaway","the most important idea to remember"],["based on","using something as evidence"],["at a glance","with a quick look"]]},"fix":{"items":[{"s":"Let me explain you how the program works.","wrong":"explain you","fix":"explain to you"},{"s":"In term of cost, this option is better.","wrong":"term","fix":"terms"},{"s":"Based in our research, most customers want a faster app.","wrong":"in","fix":"on"},{"s":"Can you give us a resume of the main points?","wrong":"resume","fix":"summary"}]}},"rec":{"prompt":"Present an idea to improve your workplace, school or neighborhood. Explain the problem, your idea and why it would work.","model":"In a nutshell, my idea is to start a shared bike program for our office. Right now, most of us drive to work, and parking costs the company a lot of money every month. Let me walk you through the plan. First, we'd buy twenty electric bikes and keep them near the metro station. Then employees could book them with an app. Based on a short survey I did, about forty percent of my colleagues would use them at least twice a week. In terms of cost, the bikes would pay for themselves in about two years. So the key takeaway is simple: healthier employees and lower costs.","use":["in a nutshell","walk someone through","based on","the key takeaway"]},"tips":[{"who":"teacher","t":"During the expert interview, ask the journalists to note every signposting phrase the expert uses. Share the list at the end and add any useful missing phrases to the board."},{"who":"student","t":"Write your first and last sentences word for word and memorize them. A strong start and finish make the whole presentation feel confident."},{"who":"student","t":"If you lose your train of thought, pause, look at your notes and say, \"So, where was I?\" Pausing is completely normal; panicking is what the audience notices."}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/3PLFDQQZ5M.jpg","by":"Matt Moloney","lic":"CC0","url":"https://stocksnap.io/photo/office-graph-3PLFDQQZ5M"}},{"id":"c1-presentations","lv":"C1","tp":"presentations","title":"Pitching & Public Speaking","goals":["pitch an idea persuasively to a demanding audience","use emphasis, pausing and storytelling for impact","field difficult questions and think on your feet"],"warm":["Who is the best public speaker you've ever heard? What made them stand out?","What's harder for you: preparing a talk or delivering it? Why?","How do you deal with nerves before you speak in public?","If you had five minutes to pitch any idea to a group of investors, what would it be?"],"model":{"kind":"text","title":"Five Minutes to Win the Room","intro":"A pitch coach who works with startups in Santiago shares her advice before a big demo day.","paras":["Every year, I watch dozens of founders [[deliver their pitches]] at demo day, and the ones who succeed rarely have the flashiest slides. What they have is clarity. They know exactly what's [[at stake]] for their customers, and they say it in the first thirty seconds.","My first piece of advice: don't [[gloss over]] the hard parts. Investors will find the weaknesses in your business model anyway, so name them first. If competition is your biggest risk, address it head-on. Saying “Here's why we'll win” [[with conviction]] is far more persuasive than hoping nobody asks.","Second, use one story to [[drive your point home]]. Numbers prove that a problem exists; a story about a real customer makes people care. When a story [[strikes a chord with]] the audience, they remember your company long after the event.","Third, learn to [[read the room]]. If people look lost, slow down and simplify. If they're nodding along, skip ahead. And when you [[field questions]], resist the urge to answer [[off the cuff]] if you're not sure. “Great question. Let me get you the exact figure” builds more trust than a confident guess.","Finally, if you don't have [[a proven track record]] yet, borrow credibility: an experienced advisor, a pilot client, a letter of intent. Then rehearse until you can [[think on your feet]] without losing your structure. Preparation is what makes spontaneity possible."],"questions":[{"q":"According to the coach, what do successful founders have in common?","opts":["the most impressive slides","a clear message from the start","a long list of investors"],"a":1},{"q":"What does the coach say about weaknesses in a business model?","opts":["Mention them before investors find them.","Only discuss them if investors ask.","Hide them in an appendix."],"a":0},{"q":"What should you do if you're not sure of an answer during the Q&A?","opts":["Give a confident guess.","Change the subject to a story.","Promise to send the exact information later."],"a":2}]},"lang":[{"e":"drive home (a point)","t":"PV","d":"to make a point very clear so that people remember it","x":"She ended with a customer's story to drive her point home.","s":"drive HOME"},{"e":"gloss over","t":"PV","d":"to deal with something too quickly and avoid the difficult details","x":"The report glosses over the project's biggest risks.","s":"gloss OVer"},{"e":"flesh out","t":"PV","d":"to add more details to an idea or plan","x":"We need to flesh out the financial plan before the meeting.","s":"flesh OUT"},{"e":"read the room","t":"ID","d":"to understand how an audience or group is feeling and react to it","x":"A good speaker reads the room and changes the plan if people look bored.","s":"READ the ROOM"},{"e":"think on your feet","t":"ID","d":"to react quickly and well without time to prepare","x":"When the projector died, she had to think on her feet.","s":"THINK on your FEET"},{"e":"strike a chord with","t":"ID","d":"to make people feel emotion or a personal connection","x":"His story about failing in his first business struck a chord with the audience.","s":"strike a CHORD with"},{"e":"field questions","t":"COL","d":"to answer questions from an audience","x":"After the talk, the founder fielded questions for twenty minutes.","s":"FIELD QUEStions"},{"e":"deliver a pitch","t":"COL","d":"to present a business idea to persuade people, especially investors","x":"Each team has five minutes to deliver its pitch.","s":"deLIVer a PITCH"},{"e":"a proven track record","t":"COL","d":"a history of success that shows you can do something well","x":"Investors prefer founders with a proven track record.","s":"a PROVen TRACK record"},{"e":"off the cuff","t":"PREP","d":"without any preparation","x":"I hadn't planned to speak, so my comments were completely off the cuff.","s":"off the CUFF"},{"e":"at stake","t":"PREP","d":"at risk; able to be won or lost","x":"With a million dollars at stake, every word of the pitch matters.","s":"at STAKE"},{"e":"with conviction","t":"PREP","d":"in a way that shows you strongly believe what you say","x":"Speak with conviction, even when you feel nervous.","s":"with conVICtion"}],"func":{"title":"Adding emphasis and impact","when":"Use these in pitches and speeches to highlight your key messages and keep the audience with you.","phrases":[{"p":"Picture this: …","use":"opening with a vivid scene"},{"p":"What really matters here is…","use":"emphasizing the key point"},{"p":"Let me be absolutely clear: …","use":"stating something firmly"},{"p":"The real question isn't…; it's…","use":"reframing the issue"},{"p":"Here's the thing: …","use":"introducing a key point informally"},{"p":"Not only does it…, but it also…","use":"adding emphasis with inversion"},{"p":"Make no mistake, …","use":"stressing that something is serious"},{"p":"It's not just about…; it's about…","use":"widening the argument"},{"p":"Think about it: …","use":"involving the audience"},{"p":"The bottom line is…","use":"summarizing your main message"}],"task":"Choose a product, place or idea you love. Pitch it to your partner in 90 seconds using at least four phrases. Your partner scores your impact from 1 to 10, then asks one tough question that you must answer on the spot. Then swap."},"pron":{"focus":"Pausing for effect and emphatic stress","explain":"Confident speakers slow down before their most important words. Use a short pause (|) right before the key idea and put strong stress on it. In emphatic sentences, words we usually say quickly, like will, do or not, can carry strong stress too: \"We WILL deliver.\"","tip":"Record your opening line and listen for the pauses. Nervous speakers rush, so aim for a full one-second pause before your key point.","lines":[{"t":"What really matters here is the customer.","m":"What REALly MATters here | is the CUStomer."},{"t":"Let me be absolutely clear: we will deliver.","m":"Let me be ABsolutely CLEAR: | we WILL deLIVer."},{"t":"The real question is not if, but when.","m":"The REAL QUEStion | is NOT IF, | but WHEN."},{"t":"Make no mistake, this market is changing fast.","m":"Make NO misTAKE, | this MARket is CHANGing FAST."},{"t":"It's not just about money; it's about time.","m":"It's NOT just about MONey; | it's about TIME."}]},"acts":[{"type":"agree","items":["Great speakers are born, not made.","Slides do more harm than good in most presentations.","It's better to speak off the cuff than to memorize a script.","Humor is too risky in a professional presentation.","A confident speaker with a weak idea will beat a nervous speaker with a strong one.","Presenting online is harder than presenting in person.","Investors invest in people, not ideas."]},{"type":"pitch","brief":"In teams, you have three minutes to pitch a startup idea to a panel of investors (the rest of the class). Explain the problem, your solution, who your customers are and why your team will succeed. Then field the investors' questions. At the end, the investors decide which team gets the money.","ideas":["An app that connects retired professionals with small businesses that need a mentor","A subscription service that rents high-quality work clothes to young professionals","A platform that lets companies rent out their empty meeting rooms by the hour","A chain of language-exchange cafés where every coffee comes with a 15-minute conversation","Smart soil sensors that help farmers in central Chile use less water during droughts"],"questions":["Who exactly is your customer, and how do you know they'll pay?","What's stopping a bigger company from copying your idea?","How will you make money in your first year?","Why is your team the right team to do this?","What's your biggest risk, and how will you manage it?","How much money are you asking for, and what will you do with it?"]},{"type":"speed","motions":["A great pitch matters more than a great product.","Every university student should have to take a public speaking course.","Reading from a script is never acceptable in a professional presentation.","No online presentation should last longer than ten minutes.","Stories persuade people more effectively than data.","Companies should ban slides in internal meetings."]}],"ex":{"gap":{"items":[{"s":"Before we meet the investors, we need to ___ the financial plan. Right now, it's just a few bullet points.","a":"flesh out"},{"s":"Don't ___ the risks. Investors will notice if you skip them.","a":"gloss over"},{"s":"To ___ her message, she ended with a story about a real customer.","a":"drive home"},{"s":"Good speakers ___: if the audience looks bored, they change their approach.","a":"read the room"},{"s":"When the projector stopped working in the middle of her talk, Ana had to ___.","a":"think on her feet"},{"s":"I didn't have time to prepare, so I spoke ___.","a":"off the cuff"}]},"match":{"pairs":[["field questions","answer questions from an audience"],["deliver a pitch","present a business idea to persuade people"],["a proven track record","a history of past success"],["at stake","at risk; able to be won or lost"],["with conviction","in a way that shows you truly believe it"],["strike a chord with","make people feel an emotional connection"]]},"fix":{"items":[{"s":"What's in stake for our customers?","wrong":"in","fix":"at"},{"s":"Her speech about failure really struck a chord to the audience.","wrong":"to","fix":"with"},{"s":"She has a proven trajectory in the tec
