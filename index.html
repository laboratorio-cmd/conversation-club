re set in their ways are happier.","Your job is an important part of your identity.","You can't truly know yourself without living abroad."]},{"type":"fishbowl","questions":["Is identity something we discover or something we create?","To what extent do our core values stem from our upbringing rather than our own choices?","Can you have a genuine sense of belonging to more than one country or culture?","Is it a strength or a weakness to wear your heart on your sleeve at work?","When is it worth standing up for your values, even if it costs you a job or a friendship?","Does becoming set in your ways with age mean you've lost something or found yourself?"]}],"ex":{"gap":{"items":[{"s":"It took her years to ___ the fact that she would never be a professional dancer.","a":"come to terms with"},{"s":"He always ___: you know exactly how he feels the moment he walks into a room.","a":"wears his heart on his sleeve"},{"s":"The movie didn't ___ the hype. I was really disappointed.","a":"live up to"},{"s":"My grandmother is very ___. She still refuses to use a cell phone.","a":"set in her ways"},{"s":"Her decision to quit was completely ___ her family's expectations.","a":"at odds with"},{"s":"Many of my insecurities ___ changing schools so often as a child.","a":"stem from"}]},"match":{"pairs":[["stand up for","defend a person or an idea"],["a sense of belonging","the feeling of being accepted in a group"],["shape someone's identity","influence who someone becomes"],["regardless of","without being affected by"],["core values","the principles that guide your behavior"],["march to the beat of your own drum","do things your own way, whatever others think"]]},"fix":{"items":[{"s":"Everyone should be treated equally, regardless their background.","wrong":"regardless their","fix":"regardless of their"},{"s":"I've finally come to terms of my divorce.","wrong":"come to terms of","fix":"come to terms with"},{"s":"I always try to stand up my friends when someone criticizes them.","wrong":"stand up my friends","fix":"stand up for my friends"},{"s":"My fear of public speaking stems of a bad experience at school.","wrong":"stems of","fix":"stems from"}]}},"rec":{"prompt":"Which experiences or people have shaped your identity the most? Have your values changed over time?","model":"I'd say the experience that has shaped my identity the most is becoming a father. Before that, I was fairly ambitious and, to be honest, quite self-centered. When my daughter was born, I had to come to terms with the fact that my time was no longer my own. My core values didn't disappear. I still believe in hard work and honesty, but my priorities shifted. These days, what matters most to me is being someone she can look up to: someone who stands up for others and admits his mistakes. I'm not always successful, but I'd like to think I'm getting there.","use":["shape someone's identity","come to terms with","core values","stand up for"]},"tips":[{"who":"teacher","t":"In the fishbowl, give each outer-circle student a specific job: one listens for lesson expressions, one for belief phrases, one for contrastive stress. Focused feedback is far more useful than “it was good”."},{"who":"student","t":"Be careful: “stand up for someone” means defend them, but “stand someone up” means not show up for a date with them!"},{"who":"student","t":"Write a short paragraph about your own core values using at least four expressions from this lesson, then read it aloud, stressing the words that carry the contrast."}]},{"id":"b1-music","lv":"B1","tp":"music","title":"Music I Love","img":7241548,"goals":["talk about the music you like using phrasal verbs like be into, turn up and sing along","show interest and keep a conversation about music going","describe a concert or a song that means a lot to you"],"warm":["What kind of music are you into?","Do you listen to music while you work or study?","What was the last concert you went to?","What song do you have on repeat right now?"],"model":{"kind":"dialogue","title":"A Great Weekend","intro":"Valentina and her American coworker Jake are having coffee before work on Monday morning.","lines":[{"sp":"Jake","t":"Hey, Valentina! You look tired. Busy weekend?"},{"sp":"Valentina","t":"Yeah, but a good one! I [[went to a concert]] on Saturday night."},{"sp":"Jake","t":"Nice! Who did you see?"},{"sp":"Valentina","t":"Los Bunkers. They're a rock band from Concepción. Have you heard of them?"},{"sp":"Jake","t":"Hmm, the name [[rings a bell]]. Were they good?"},{"sp":"Valentina","t":"Amazing! I'm [[a big fan of]] them, and the whole crowd [[sang along]] to every song."},{"sp":"Jake","t":"Sounds like fun. I love [[live music]], but I'm not [[in the mood for]] huge crowds these days."},{"sp":"Valentina","t":"So what are you [[into]] right now?"},{"sp":"Jake","t":"Honestly? Jazz. I listen to it while I work. I have a Nina Simone album [[on repeat]] at the moment."},{"sp":"Valentina","t":"Jazz? Really? I never would've guessed!"},{"sp":"Jake","t":"Ha! There's a little jazz bar near my apartment with live music on Fridays. Do you want to come this week?"},{"sp":"Valentina","t":"Sure, why not? Can we get dinner first?"},{"sp":"Jake","t":"Of course. And drinks are half price before nine."},{"sp":"Valentina","t":"Half price? That's [[music to my ears]]!"}],"questions":[{"q":"Where did Valentina go on Saturday night?","opts":["To a jazz bar","To a music festival","To a rock concert"],"a":2},{"q":"What kind of music is Jake into right now?","opts":["Rock","Jazz","Reggaeton"],"a":1},{"q":"Why does Valentina say \"That's music to my ears\"?","opts":["Drinks are cheaper before nine.","She loves jazz.","Jake is going to sing."],"a":0}]},"lang":[{"e":"be into","t":"PV","d":"to like something a lot","x":"I'm really into rock music at the moment.","s":"be INto"},{"e":"turn up","t":"PV","d":"to increase the volume","x":"Can you turn up the music? I love this song!","s":"turn UP"},{"e":"turn down","t":"PV","d":"to decrease the volume","x":"Please turn down the TV — I'm on the phone.","s":"turn DOWN"},{"e":"sing along","t":"PV","d":"to sing while a song is playing","x":"Everybody sang along to the chorus.","s":"sing aLONG"},{"e":"a catchy song","t":"COL","d":"a song that is easy to remember","x":"That's such a catchy song — I can't stop humming it!","s":"a CATCHy SONG"},{"e":"go to a concert","t":"COL","d":"to attend live music","x":"We went to a concert in Santiago last summer.","s":"go to a CONcert"},{"e":"music to my ears","t":"ID","d":"news that makes you very happy","x":"'No homework today' — that's music to my ears!","s":"MUsic to my EARS"},{"e":"be a fan of","t":"PREP","d":"to like and support an artist or team","x":"I'm a big fan of Shakira.","s":"be a FAN of"},{"e":"ring a bell","t":"ID","d":"to sound familiar","x":"Her name rings a bell, but I can't remember any of her songs.","s":"ring a BELL"},{"e":"on repeat","t":"PREP","d":"playing the same song again and again","x":"I've had this song on repeat all week.","s":"on rePEAT"},{"e":"in the mood for","t":"PREP","d":"wanting to do or have something at a particular moment","x":"I'm not in the mood for loud music tonight.","s":"in the MOOD for"},{"e":"live music","t":"COL","d":"music played by musicians in front of an audience, not recorded","x":"This bar has live music every Friday night.","s":"LIVE MUsic"}],"func":{"title":"Showing interest in a conversation","when":"Use these to react to what people say and keep a conversation about music (or anything else!) going.","phrases":[{"p":"Oh, really?","use":"showing surprise or interest"},{"p":"No way!","use":"showing strong surprise (informal)"},{"p":"That sounds amazing!","use":"reacting positively"},{"p":"Me too! / Same here.","use":"saying you feel the same"},{"p":"Me neither.","use":"agreeing with a negative sentence"},{"p":"How come?","use":"asking for the reason (informal 'why?')"},{"p":"What's it like?","use":"asking for a description"},{"p":"Tell me more!","use":"encouraging the speaker to continue"},{"p":"So what are you into these days?","use":"asking a follow-up question"},{"p":"I know what you mean.","use":"showing you understand"}],"task":"In pairs, Student A talks for 2 minutes about a favorite singer or band. Student B can't talk about their own taste — they can only react and ask follow-up questions, using at least 5 phrases from the list. Then swap roles."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, English speakers join them, so they sound like one word: turn it up sounds like 'tur-ni-tup'. This is why phrasal verbs often sound like one long word.","tip":"Say the sentence slowly, joining the linked words, then speed up little by little. Don't stop between the verb and the small word after it.","lines":[{"t":"I'm into rock music.","m":"I'm‿INto ROCK MUsic."},{"t":"Can you turn it up?","m":"Can you TURN‿it‿UP? ↗"},{"t":"I'm a big fan of Shakira.","m":"I'm‿a BIG FAN‿of shaKIra."},{"t":"Everybody sang along.","m":"EVerybody SANG‿aLONG."},{"t":"I've had it on repeat all week.","m":"I've HAD‿it‿on rePEAT‿all WEEK."}]},"acts":[{"type":"wyr","items":[["Listen to only one song forever","Never listen to music again"],["Go to a concert by your favorite band","Meet the singer privately"],["Sing in public","Dance in public"],["Only listen to music in English","Only listen to music in Spanish"],["Be a famous singer","Be a famous DJ"],["Have an amazing voice","Play any instrument perfectly"]]},{"type":"picture","prompts":["Describe the person in the photo.","Where do you think he is?","What kind of music might he be listening to?","How do you usually listen to music?"]},{"type":"taboo","cards":[{"w":"be into","taboo":["like","love","enjoy"]},{"w":"turn up","taboo":["volume","louder","increase"]},{"w":"sing along","taboo":["song","voice","together"]},{"w":"a catchy song","taboo":["remember","head","easy"]},{"w":"music to my ears","taboo":["happy","news","good"]},{"w":"ring a bell","taboo":["familiar","remember","know"]},{"w":"on repeat","taboo":["again","play","same"]},{"w":"live music","taboo":["band","concert","recorded"]},{"w":"in the mood for","taboo":["want","feel","like"]}]}],"ex":{"gap":{"items":[{"s":"It's too quiet. Can you ___ the music, please?","a":"turn up"},{"s":"At the concert last night, everybody ___ to the chorus.","a":"sang along"},{"s":"Her name ___, but I don't know any of her songs.","a":"rings a bell"},{"s":"I'm really tired. I'm not ___ a party tonight.","a":"in the mood for"},{"s":"I've had this song ___ all week — I play it twenty times a day!","a":"on repeat"},{"s":"No class tomorrow? That's ___!","a":"music to my ears"}]},"match":{"pairs":[["be into","to like something a lot"],["turn down","to make the volume lower"],["a catchy song","a song that's easy to remember"],["ring a bell","to sound familiar"],["live music","music played in front of an audience"],["in the mood for","wanting something at this moment"]]},"fix":{"items":[{"s":"I listen music every morning on the bus.","wrong":"listen music","fix":"listen to music"},{"s":"I'm really into play the guitar.","wrong":"into play","fix":"into playing"},{"s":"I love this song! Can you turn up it?","wrong":"turn up it","fix":"turn it up"},{"s":"I'm a big fan from Bad Bunny.","wrong":"fan from","fix":"fan of"}]}},"rec":{"prompt":"Talk about a singer or band you love. What kind of music do they play, how did you discover them, and have you ever seen them live?","model":"I'm really into Latin pop, and I've been a big fan of Shakira since I was a teenager. I discovered her music on the radio, and I couldn't stop dancing. Her songs are so catchy! A few years ago, I finally went to one of her concerts, and it was incredible. The whole stadium sang along to every song, and I lost my voice by the end! These days I listen to her music when I'm cooking, and I always turn up the volume when my favorite song comes on.","use":["be into","be a fan of","sing along","turn up"]},"tips":[{"who":"teacher","t":"Before the Taboo game, model one card yourself so students hear how to explain an expression without the forbidden words (e.g., 'You say this when you hear a name and you think you know it…'). Give each student 1 minute per card."},{"who":"student","t":"'Live' in 'live music' rhymes with 'five' /laɪv/, not with 'give'. Practice the difference: 'I love LIVE music' and 'I LIVE in Santiago.'"},{"who":"student","t":"Make a playlist of five songs you love and say one sentence about each with the lesson expressions: 'I always sing along to…', 'This one is so catchy…', 'I have this one on repeat…'."}]},{"id":"b2-music","lv":"B2","tp":"music","title":"The Power of Music","img":15509661,"goals":["describe how music makes you feel using idioms like strike a chord and blow someone away","agree and disagree politely in a discussion about music","find a compromise in a disagreement about music and noise"],"warm":["Can music change your mood?","Which song reminds you of a special moment?","Is music today better or worse than in the past?","Do you have a musical guilty pleasure you're a little embarrassed about?"],"model":{"kind":"text","title":"Confessions of a Former Music Snob","intro":"Camila, a music blogger from Valparaíso, writes about how her taste in music has changed.","paras":["I used to be a total music snob. If a song wasn't by one of my favorite indie bands, I wasn't interested. Jazz? Too complicated. Reggaeton? Too repetitive. Then, a few years ago, things started to change.","It started with jazz. My roommate played it every morning, and at first I tried to [[drown it out]] with my headphones. But slowly, it [[grew on me]]. Jazz really is [[an acquired taste]]: the more you listen, the more you hear. Now I'm the one who plays it every morning.","Then came my first big music festival. I didn't plan anything; I just [[played it by ear]] and wandered from stage to stage. That's how I discovered a band I'd never heard of, and their show completely [[blew me away]]. The singer was totally [[in tune with]] the crowd. Her guitar was a little [[out of tune]], but nobody cared. When she sang a slow song about missing home, it really [[struck a chord]] with me. I'd just moved to a new city.","And reggaeton? OK, I'll admit it: it's my [[guilty pleasure]]. One catchy chorus and it's [[stuck in my head]] for days. I'm not a [[die-hard fan]], but I know every word of a few songs.","My advice? Don't decide too quickly what you like. Give music a chance to surprise you."],"questions":[{"q":"How did Camila feel about jazz at first?","opts":["She loved it immediately.","She didn't like it and tried to block it out.","She had never heard it before."],"a":1},{"q":"Why did the slow song strike a chord with Camila?","opts":["It was by her favorite band.","The singer's guitar was out of tune.","She had recently moved to a new city."],"a":2},{"q":"What is Camila's advice?","opts":["Give new music time before you decide.","Only listen to music you already know.","Become a die-hard fan of one band."],"a":0}]},"lang":[{"e":"grow on","t":"PV","d":"to start to like something gradually","x":"I didn't like the album at first, but it grew on me.","s":"GROW on"},{"e":"blow someone away","t":"PV","d":"to impress someone a lot","x":"Her voice completely blew me away.","s":"blow someone aWAY"},{"e":"stuck in your head","t":"ID","d":"a song you can't stop hearing in your mind","x":"That chorus has been stuck in my head all day.","s":"STUCK in your HEAD"},{"e":"strike a chord","t":"ID","d":"to cause an emotional reaction","x":"The lyrics really struck a chord with me.","s":"strike a CHORD"},{"e":"face the music","t":"ID","d":"to accept the consequences of your actions","x":"He broke the rules, and now he has to face the music.","s":"FACE the MUsic"},{"e":"play it by ear","t":"ID","d":"to decide what to do as things happen","x":"Let's not plan — we'll play it by ear.","s":"play it by EAR"},{"e":"a die-hard fan","t":"COL","d":"an extremely loyal fan","x":"My cousin is a die-hard Beatles fan.","s":"a DIE-hard FAN"},{"e":"out of tune","t":"PREP","d":"not producing the correct notes","x":"The guitar is completely out of tune.","s":"out of TUNE"},{"e":"drown out","t":"PV","d":"to be so loud that another sound can't be heard","x":"The music was so loud it drowned out our conversation.","s":"drown OUT"},{"e":"an acquired taste","t":"COL","d":"something you only start to like after trying it several times","x":"Jazz is an acquired taste, but once you get into it, you're hooked.","s":"an acQUIRED TASTE"},{"e":"a guilty pleasure","t":"COL","d":"something you enjoy but feel a little embarrassed about","x":"Cheesy '80s power ballads are my guilty pleasure.","s":"a GUILTy PLEAsure"},{"e":"in tune with","t":"PREP","d":"understanding and sensitive to other people's feelings or needs","x":"Great DJs are always in tune with the crowd.","s":"in TUNE with"}],"func":{"title":"Agreeing and disagreeing politely","when":"Use these in discussions when you want to give your opinion without sounding rude.","phrases":[{"p":"I couldn't agree more.","use":"strong agreement"},{"p":"You've got a point there.","use":"accepting someone's argument"},{"p":"That's exactly what I was thinking.","use":"agreeing enthusiastically"},{"p":"I see what you mean, but…","use":"polite disagreement"},{"p":"I'm not so sure about that.","use":"soft disagreement"},{"p":"I agree up to a point, but…","use":"partial agreement"},{"p":"Fair enough, but don't you think…?","use":"accepting a point, then challenging it"},{"p":"I have to disagree with you there.","use":"clear but polite disagreement"},{"p":"Let's agree to disagree.","use":"ending a disagreement in a friendly way"},{"p":"Maybe we could meet halfway?","use":"suggesting a compromise"}],"task":"In pairs, take turns making strong statements about music (e.g., 'Music was better in the '90s' or 'Reggaeton isn't real music'). Your partner reacts with a phrase from the list and gives a reason. Make 5 statements each and try to use every phrase at least once."},"pron":{"focus":"Sentence stress: content words","explain":"English stresses the important words (nouns, main verbs, adjectives, adverbs) and says the small words (a, the, of, in, my, has, been) quickly and weakly. This gives English its rhythm. In idioms, the stress usually falls on the key noun: strike a CHORD, play it by EAR.","tip":"Tap the table on every stressed syllable as you say the sentence. The taps should feel regular, like a drumbeat, and the small words should squeeze in between.","lines":[{"t":"That song has been stuck in my head all day.","m":"That SONG has been STUCK in my HEAD all DAY."},{"t":"Her voice completely blew me away.","m":"Her VOICE comPLETEly BLEW me aWAY."},{"t":"The lyrics really struck a chord with me.","m":"The LYRics REALly STRUCK a CHORD with me."},{"t":"Let's not plan. We'll play it by ear.","m":"LET'S NOT PLAN. | We'll PLAY it by EAR."},{"t":"I didn't like it at first, but it grew on me.","m":"I DIDn't LIKE it at FIRST, | but it GREW on me."}]},"acts":[{"type":"ranking","task":"You are organizing a music festival. Rank these from MOST to LEAST important.","items":["A famous headliner","A good sound system","Cheap tickets","Food and drinks","Safety and security","Easy public transportation"]},{"type":"roleplay","cards":[{"sit":"Your neighbor plays loud music every night.","a":"You live next door. You can't sleep, and you have an important job interview tomorrow. Ask politely for the music to be turned down.","b":"You are practicing with your band for a concert this weekend. You think it's only 'a little loud.' Try to find a compromise."},{"sit":"Two friends are choosing a concert to go to.","a":"You want to see a big pop star in a stadium. Convince your friend: the show, the lights, the experience.","b":"You prefer a small jazz club with live musicians. Convince your friend: the atmosphere, the price, the quality."}]},{"type":"speed","motions":["Music festivals are too expensive for what you get.","Everyone should learn to play a musical instrument at school.","Listening to music while you work makes you more productive.","Live music is always better than recorded music.","Everyone has a guilty pleasure, so nobody should be a music snob.","Song lyrics matter more than the melody."]}],"ex":{"gap":{"items":[{"s":"I hated this album at first, but it slowly ___ me.","a":"grew on"},{"s":"Her performance at the festival completely ___. I had goosebumps!","a":"blew me away"},{"s":"I can't stop humming that chorus. It's been ___ all morning.","a":"stuck in my head"},{"s":"Stop playing! Your guitar sounds terrible. It's completely ___.","a":"out of tune"},{"s":"Hardly anyone likes jazz the first time they hear it. It's ___.","a":"an acquired taste"},{"s":"The music in the bar was so loud it ___ our conversation.","a":"drowned out"}]},"match":{"pairs":[["strike a chord","to cause a strong emotional reaction"],["face the music","to accept the consequences of what you did"],["play it by ear","to decide what to do as things happen"],["a die-hard fan","an extremely loyal supporter"],["a guilty pleasure","something you enjoy but are a bit embarrassed about"],["in tune with","understanding what other people feel or need"]]},"fix":{"items":[{"s":"I didn't like this song, but it grew me on after a few weeks.","wrong":"grew me on","fix":"grew on me"},{"s":"The concert was incredible. It blew away me.","wrong":"blew away me","fix":"blew me away"},{"s":"The lyrics really struck a chord to me.","wrong":"chord to me","fix":"chord with me"},{"s":"I'm agree with you — music can change your mood.","wrong":"I'm agree","fix":"I agree"}]}},"rec":{"prompt":"Choose a song that strikes a chord with you. When did you first hear it, how does it make you feel, and why is it special?","model":"The song that really strikes a chord with me is 'Gracias a la vida' by Violeta Parra. To be honest, when I first heard it as a teenager, I thought it was a bit slow and old-fashioned. But it grew on me, especially after I moved away from home to study. The lyrics are so simple, but they make me feel grateful for small things. A few years ago, I heard a young singer perform it in a small bar in Valparaíso, and her voice completely blew me away. The whole room went quiet. Now, whenever I'm stressed, I play it, and it stays stuck in my head for the rest of the day, in a good way.","use":["strike a chord","grow on","blow someone away","stuck in your head"]},"tips":[{"who":"teacher","t":"Before the role-play, give students 1 minute to plan their arguments and remind them to use the phrases for agreeing and disagreeing. Afterward, ask each pair what compromise they reached and who was more convincing."},{"who":"student","t":"Separable or not? With 'blow away', a pronoun goes in the middle (It blew me away), but 'grow on' never separates (It grew on me)."},{"who":"student","t":"Keep a 'song diary' this week: every time a song gets stuck in your head, write one sentence about it using an expression from this lesson."}]},{"id":"c1-music","lv":"C1","tp":"music","title":"Music, Culture & Industry","img":32072177,"goals":["discuss how the music industry works using sophisticated idioms and phrasal verbs","hedge and soften your opinions on controversial issues like streaming and AI","persuade a group in a balloon debate about the future of music"],"warm":["Should artists be political?","Is streaming fair to musicians?","What makes a song timeless?","Would you pay more for streaming if more of the money went directly to artists?"],"model":{"kind":"text","title":"The Viral Paradox","intro":"An opinion piece from an online culture magazine about how social media is changing the music industry.","paras":["Not long ago, the road to success in music was slow and fairly predictable: you played small venues, built a loyal following and, if you were lucky, got signed by a label. Today, a fifteen-second clip can turn an unknown teenager into [[a household name]] almost overnight. Songs [[go viral]], artists [[break through]] [[on the back of]] a single dance trend, and labels scramble to sign them before the hype fades.","On the surface, this looks like a democratic revolution: anyone with a phone can be heard. The reality is messier. Many overnight sensations end up as [[one-hit wonders]], because algorithms reward a catchy hook rather than a coherent body of work. And as soon as one sound takes off, labels [[jump on the bandwagon]] and [[churn out]] dozens of near-identical tracks.","For artists, the pressure is relentless. Musicians are now expected to be content creators too, posting daily and [[tooting their own horn]] in ways many find exhausting. Those who refuse risk being ignored; those who play the game are often accused of [[selling out]]. Holding on to your [[artistic integrity]] has rarely been harder.","Still, it would be unfair to paint an entirely bleak picture. Online culture has also given older songs a second life: in 2022, Kate Bush's 1985 hit 'Running Up That Hill' climbed the charts again after it featured in a hit TV series and spread across TikTok. Perhaps the real challenge is balance, making sure visibility doesn't come [[at the expense of]] creativity. The artists who manage that are the ones who truly [[hit the right note]]."],"questions":[{"q":"According to the writer, why do many viral artists become one-hit wonders?","opts":["Algorithms reward a catchy hook rather than a consistent body of work.","Record labels refuse to sign them.","They stop posting on social media."],"a":0},{"q":"What dilemma do musicians face on social media?","opts":["They have to choose between playing live and recording albums.","They aren't allowed to use older songs in their videos.","If they don't promote themselves, they may be ignored; if they do, they may be accused of selling out."],"a":2},{"q":"What does the Kate Bush example show?","opts":["Old songs can't compete with new ones.","Online culture can give older songs a second life.","TV series are more powerful than record labels."],"a":1}]},"lang":[{"e":"churn out","t":"PV","d":"to produce large amounts quickly, often of low quality","x":"Some labels just churn out the same pop hits.","s":"churn OUT"},{"e":"break through","t":"PV","d":"to finally become successful","x":"She finally broke through with her second album.","s":"break THROUGH"},{"e":"sell out","t":"PV","d":"to give up your principles for money","x":"Fans accused the band of selling out.","s":"sell OUT"},{"e":"go viral","t":"COL","d":"to spread very quickly online","x":"The song went viral on TikTok overnight.","s":"go VIral"},{"e":"a one-hit wonder","t":"ID","d":"an artist famous for only one song","x":"Many '90s bands were one-hit wonders.","s":"a one-hit WONder"},{"e":"hit the right note","t":"ID","d":"to do or say something appropriate","x":"The singer's speech hit the right note with the audience.","s":"hit the RIGHT NOTE"},{"e":"toot your own horn","t":"ID","d":"to boast about your achievements","x":"He's talented, but he loves tooting his own horn.","s":"TOOT your own HORN","uk":"UK: blow your own trumpet"},{"e":"on the back of","t":"PREP","d":"as a result of","x":"The band became famous on the back of one viral video.","s":"on the BACK of"},{"e":"jump on the bandwagon","t":"ID","d":"to join something because it has suddenly become popular or successful","x":"When reggaeton exploded, lots of pop stars jumped on the bandwagon.","s":"jump on the BANDwagon"},{"e":"a household name","t":"COL","d":"a person or brand that almost everyone has heard of","x":"After one hit single, she became a household name.","s":"a HOUSEhold NAME"},{"e":"artistic integrity","t":"COL","d":"staying true to your own creative values, even under commercial pressure","x":"She turned down a huge sponsorship deal to protect her artistic integrity.","s":"arTIStic inTEGrity"},{"e":"at the expense of","t":"PREP","d":"causing harm or loss to something else","x":"Labels are chasing quick hits at the expense of long-term careers.","s":"at the exPENSE of"}],"func":{"title":"Hedging and softening your opinions","when":"Use these when you discuss controversial topics and want to sound thoughtful rather than aggressive.","phrases":[{"p":"It could be argued that…","use":"presenting a view without fully committing to it"},{"p":"To some extent, I'd agree, but…","use":"partial agreement"},{"p":"I'd be inclined to think that…","use":"giving a tentative opinion"},{"p":"There's a case to be made for…","use":"acknowledging an argument you may not fully support"},{"p":"Arguably, …","use":"suggesting something is true but open to debate"},{"p":"It's not quite as clear-cut as that.","use":"pointing out that an issue is complex"},{"p":"That may well be true, but…","use":"conceding a point before challenging it"},{"p":"I tend to think that…","use":"softening a personal view"},{"p":"From what I've read, …","use":"limiting your claim to what you know"},{"p":"I'm not entirely convinced that…","use":"polite skepticism"}],"task":"In pairs, choose three statements from the Agree or Disagree? activity. For each one, give your opinion twice: first bluntly, then softened with at least two hedging phrases. Your partner decides which version sounds more persuasive and explains why."},"pron":{"focus":"Contrastive stress","explain":"When we correct someone or compare two ideas, we put extra stress on the words that carry the contrast. This helps listeners follow your argument in a debate: in 'It wasn't the SONG that went viral, it was the DANCE,' the contrast is between song and dance.","tip":"Before you speak, find the two ideas you're contrasting and make them louder, longer and higher in pitch. Everything else can be quieter and faster.","lines":[{"t":"It wasn't the song that went viral, it was the dance.","m":"It WASn't the SONG that went viral, | it was the DANCE."},{"t":"She didn't sell out; she simply changed direction.","m":"She DIDn't SELL OUT; | she SIMply CHANGED diRECtion."},{"t":"Some labels churn out hits; others build careers.","m":"SOME labels CHURN OUT HITS; | OTHers build CAREERS."},{"t":"It was the timing, not the talent, that helped them break through.","m":"It was the TIMing, | NOT the TALent, | that helped them break through."},{"t":"He isn't tooting his own horn; he's just stating the facts.","m":"He ISn't TOOTing his OWN HORN; | he's JUST stating the FACTS."}]},"acts":[{"type":"agree","items":["Streaming platforms have destroyed the value of music.","AI-generated music is real art.","Artists have a responsibility to speak about politics.","Talent shows produce one-hit wonders, not real artists.","Older music is better than modern music.","Going viral matters more than talent today."]},{"type":"minute","items":["Why some songs become timeless","The impact of TikTok on music","An artist who sold out — or didn't","Music as a form of protest","Should concert tickets be cheaper?","The future of the music industry"]},{"type":"balloon","sit":"The music industry is in a hot-air balloon that is losing altitude, and only one person can stay on board. Each of you plays a role and argues why the future of music needs YOU most. After each round, the group votes one person out, and the others defend themselves again.","roles":[{"name":"A streaming platform CEO","why":"you give millions of people instant access to almost all recorded music"},{"name":"An independent singer-songwriter","why":"you stand for originality and artistic integrity"},{"name":"A record label executive","why":"you find, fund and develop talent that might never break through alone"},{"name":"A live music promoter","why":"concerts are where fans truly connect with artists, and touring is a major source of income for musicians"},{"name":"An AI music developer","why":"your tools let anyone create music, even without training"},{"name":"A music teacher","why":"without music education, there will be no next generation of musicians"}]}],"ex":{"gap":{"items":[{"s":"After ten years of playing small bars, the band finally ___ (= became successful) with their third album.","a":"broke through"},{"s":"Fans accused the singer of ___ when she wrote a jingle for a fast-food chain.","a":"selling out"},{"s":"Nobody remembers anything else he recorded. He's a classic ___.","a":"one-hit wonder"},{"s":"As soon as vinyl became fashionable again, every major label ___ and started reissuing old albums.","a":"jumped on the bandwagon"},{"s":"Some festivals now chase profit ___ the fan experience: tickets cost more, but the lineups keep getting worse.","a":"at the expense of"},{"s":"She turned down a fortune from a fashion brand to protect her ___.","a":"artistic integrity"}]},"match":{"pairs":[["churn out","to produce in large quantities, without much care"],["hit the right note","to say or do something perfectly suited to the situation"],["toot your own horn","to boast about your own achievements"],["on the back of","as a result of"],["a household name","someone almost everybody has heard of"],["go viral","to spread rapidly online"]]},"fix":{"items":[{"s":"Her success came on the back from a single viral video.","wrong":"back from","fix":"back of"},{"s":"Streaming has grown at the expenses of album sales.","wrong":"expenses","fix":"expense"},{"s":"Many fans accused the band to sell out.","wrong":"to sell out","fix":"of selling out"},{"s":"Despite of going viral, the song was soon forgotten.","wrong":"Despite of","fix":"Despite"}]}},"rec":{"prompt":"Has streaming been good or bad for musicians? Give a balanced, hedged opinion with at least one example.","model":"I'd be inclined to say that streaming has been a mixed blessing. On the one hand, it's never been easier for new artists to break through. A teenager in Santiago can upload a song tonight and, on the back of a few playlists, have listeners all over the world by next month. On the other hand, it's arguably happened at the expense of musicians' income, since a single stream pays only a fraction of a cent. That pushes artists to release constantly and chase trends, which can make it hard to hold on to their artistic integrity. So, to some extent, streaming has opened doors, but I'm not entirely convinced it has made the industry fairer.","use":["break through","on the back of","at the expense of","artistic integrity"]},"tips":[{"who":"teacher","t":"During the balloon debate, give one or two students the role of observer: they note every hedging phrase and lesson expression they hear. Give feedback on persuasive language at the end, not during the debate."},{"who":"student","t":"To sound more C1, replace some of your 'I think' with 'I'd be inclined to think', 'I tend to think' or 'Arguably'. Record yourself for one minute and count how many times you say 'I think'."},{"who":"student","t":"'On the back of' and 'at the expense of' are very common in news and business articles. When you read about music or business in English this week, underline them and notice what comes before and after."}]},{"id":"b1-plans","lv":"B1","tp":"plans","title":"Weekend & Vacation Plans","img":8121653,"goals":["talk about your weekend and vacation plans using phrasal verbs like hang out and look forward to","make, accept and decline invitations politely","change or cancel plans with a friend in a natural way"],"warm":["What are you doing this weekend?","What are you looking forward to this month?","Do you plan everything or decide at the last minute?","What's the best way to spend a long weekend?"],"model":{"kind":"dialogue","title":"Any Plans for Saturday?","intro":"Sofía calls her friend Matt on Thursday evening to make plans for the weekend.","lines":[{"sp":"Sofía","t":"Hi, Matt! Are you doing anything this weekend?"},{"sp":"Matt","t":"Not much. I usually just relax and sleep a lot [[on the weekend]]. Why?"},{"sp":"Sofía","t":"Some friends and I are going to Cajón del Maipo on Saturday. Are you [[up for]] a day trip?"},{"sp":"Matt","t":"Sounds great! What's the plan?"},{"sp":"Sofía","t":"We're leaving at eight. We're going to [[hang out]] by the river and have a barbecue."},{"sp":"Matt","t":"Eight on a Saturday? Ouch! But OK, I'm in."},{"sp":"Sofía","t":"Great! I'm really [[looking forward to]] it. I haven't had any [[free time]] all month."},{"sp":"Matt","t":"Me neither. Wait, is it going to rain on Saturday?"},{"sp":"Sofía","t":"Maybe. If it rains, we'll [[call off]] the trip and [[go out]] for lunch in the city instead."},{"sp":"Matt","t":"Good idea. And what about Sunday? Do you want to see a movie?"},{"sp":"Sofía","t":"Sorry, I'll have to [[take a rain check]]. It's my mom's birthday."},{"sp":"Matt","t":"No problem. Let's [[make plans]] for next weekend, then. It's [[a long weekend]], right?"},{"sp":"Sofía","t":"Yes! Let's go to the beach. We'll [[have a blast]]."},{"sp":"Matt","t":"Perfect. Just don't change the plan [[at the last minute]] this time!"}],"questions":[{"q":"Where are Sofía and her friends going on Saturday?","opts":["To the movies","To Cajón del Maipo","To the beach"],"a":1},{"q":"What will they do if it rains?","opts":["Go out for lunch in the city","Stay at home and sleep","Go to the river anyway"],"a":0},{"q":"Why can't Sofía see a movie on Sunday?","opts":["She's too tired.","She has to work.","It's her mom's birthday."],"a":2}]},"lang":[{"e":"look forward to","t":"PV","d":"to feel happy about something in the future","x":"I'm really looking forward to the holidays.","s":"look FORward to"},{"e":"hang out","t":"PV","d":"to spend time relaxing with friends","x":"We usually hang out at the park on Sundays.","s":"hang OUT"},{"e":"go out","t":"PV","d":"to leave home to have fun","x":"Do you want to go out tonight?","s":"go OUT"},{"e":"call off","t":"PV","d":"to cancel an event","x":"They called off the party because of the rain.","s":"call OFF"},{"e":"be up for","t":"PV","d":"to be willing to do something","x":"Are you up for a movie tonight?","s":"be UP for"},{"e":"make plans","t":"COL","d":"to organize what you will do","x":"Let's make plans for Saturday.","s":"make PLANS"},{"e":"free time","t":"COL","d":"time when you are not working or studying","x":"What do you do in your free time?","s":"FREE TIME"},{"e":"on the weekend","t":"PREP","d":"on Saturday and Sunday","x":"I relax and sleep a lot on the weekend.","s":"on the WEEKend","uk":"UK: at the weekend"},{"e":"take a rain check","t":"ID","d":"to say no to an invitation now but suggest doing it another time","x":"I can't come tonight. Can I take a rain check?","s":"take a RAIN check"},{"e":"have a blast","t":"ID","d":"to have a really good time","x":"We had a blast at the beach last weekend.","s":"have a BLAST"},{"e":"at the last minute","t":"PREP","d":"very late, just before something happens","x":"He always changes his plans at the last minute.","s":"at the LAST MINute"},{"e":"a long weekend","t":"COL","d":"a weekend with an extra day off, like a Friday or a Monday","x":"We're going to the coast for the long weekend.","s":"a LONG WEEKend"}],"func":{"title":"Making, accepting and declining invitations","when":"Use these when you invite friends to do something or answer an invitation.","phrases":[{"p":"Do you want to…?","use":"inviting someone (informal)"},{"p":"How about…?","use":"making a suggestion"},{"p":"Are you free on Saturday?","use":"checking if someone is available"},{"p":"Sounds great! I'm in!","use":"accepting with enthusiasm"},{"p":"I'd love to!","use":"accepting politely"},{"p":"I'd love to, but I can't. I have to…","use":"declining politely with a reason"},{"p":"Sorry, I can't make it.","use":"declining"},{"p":"Maybe another time?","use":"suggesting a plan for the future"},{"p":"What time works for you?","use":"agreeing on a time"},{"p":"Let's meet at the mall at six.","use":"agreeing on a place and time"}],"task":"Write down three things you'd like to do this weekend (e.g., go hiking, see a movie, try a new café). In pairs, invite your partner to each one. Your partner accepts one invitation, declines one politely with a reason, and suggests another day for the third. Then swap roles."},"pron":{"focus":"Weak forms: to, for, at, a, can","explain":"Small words like to, for, at, a and can are usually unstressed. Their vowel becomes a short, relaxed sound called schwa /ə/: to → /tə/, for → /fər/, at → /ət/, can → /kən/. If you stress every small word, your English sounds slow and robotic.","tip":"Say the words in CAPITALS clearly and 'swallow' the small words in between. Listen to the model and copy the rhythm, not each separate word.","lines":[{"t":"I'm really looking forward to the weekend.","m":"I'm REALly LOOKing FORward to the WEEKend."},{"t":"Are you up for a movie tonight?","m":"Are you UP for a MOVie toNIGHT? ↗"},{"t":"We usually hang out at the park.","m":"We USually HANG OUT at the PARK."},{"t":"They called it off at the last minute.","m":"They CALLED it OFF at the LAST MINute."},{"t":"Can I take a rain check?","m":"Can I TAKE a RAIN check? ↗"}]},"acts":[{"type":"roleplay","cards":[{"sit":"Making weekend plans with a friend.","a":"Invite your friend to do something on Saturday (a movie, the park, dinner). Be flexible about the time.","b":"You are busy on Saturday morning. Suggest another activity and agree on a time and place."},{"sit":"Your plans are canceled.","a":"Call your friend and explain that you have to call off your trip. Give a reason and apologize.","b":"You are disappointed. Ask why and suggest a new date."}]},{"type":"minute","items":["My plans for this weekend","Something I'm looking forward to","My ideal free day","Where I like to hang out","A plan that was called off","My next vacation"]},{"type":"fluency","topics":["The best weekend you've had this year","A trip or event you're looking forward to","A plan that changed at the last minute","Your perfect long weekend in Chile","How you usually spend your free time"]}],"ex":{"gap":{"items":[{"s":"It started raining, so they ___ the barbecue.","a":"called off"},{"s":"I'm too tired tonight. Can I ___? Maybe next Friday?","a":"take a rain check"},{"s":"Are you ___ a coffee after class?","a":"up for"},{"s":"My sister always changes her plans ___. It drives me crazy!","a":"at the last minute"},{"s":"Monday is a holiday, so it's ___. Let's go to the beach!","a":"a long weekend"},{"s":"I'm really ___ seeing my grandparents next month.","a":"looking forward to"}]},"match":{"pairs":[["hang out","to spend relaxed time with friends"],["call off","to cancel"],["be up for","to be willing to do something"],["free time","time when you're not working or studying"],["have a blast","to have a really good time"],["a long weekend","Saturday and Sunday plus an extra day off"]]},"fix":{"items":[{"s":"I'm looking forward to see you on Saturday.","wrong":"to see","fix":"to seeing"},{"s":"What do you usually do in the weekend?","wrong":"in the weekend","fix":"on the weekend"},{"s":"It was raining, so they called off it.","wrong":"called off it","fix":"called it off"},{"s":"I don't have many free time this week.","wrong":"many free time","fix":"much free time"}]}},"rec":{"prompt":"Tell a friend about your plans for the next long weekend or vacation. Where are you going, who with, and what are you looking forward to most?","model":"For the next long weekend, I'm going to Pucón with my sister and two friends. We rented a small cabin near the lake, and I'm really looking forward to it because I haven't had much free time lately. On Saturday, we're going to go hiking near the volcano, and on Sunday we're just going to hang out by the lake and have a barbecue. If the weather is bad, we'll visit the hot springs instead. I'm sure we're going to have a blast. The only problem is the drive. It's a long way from Santiago, so we're leaving really early on Friday!","use":["look forward to","free time","hang out","have a blast"]},"tips":[{"who":"teacher","t":"Before the role-plays, drill the intonation of invitations ('Do you want to come? ↗') and polite refusals ('I'd love to, but… ↘'). A friendly, rising tone makes an invitation sound warm instead of demanding."},{"who":"student","t":"In American English, say 'on the weekend' and 'vacation'. In British English you'll hear 'at the weekend' and 'holiday'. Both are correct, but try to be consistent."},{"who":"student","t":"'Look forward to' is followed by a noun or an -ing verb: 'I'm looking forward to the trip' or 'I'm looking forward to seeing you', never 'to see you'."}]},{"id":"b2-plans","lv":"B2","tp":"plans","title":"Goals & Ambitions","img":14560330,"goals":["talk about your goals and ambitions using phrasal verbs and idioms like follow through and in the long run","express hopes and intentions with different degrees of certainty","give and respond to advice about reaching a personal goal"],"warm":["Where do you see yourself in five years?","Do you write your goals down?","What's something you've always wanted to do?","What's one thing on your bucket list?"],"model":{"kind":"dialogue","title":"From the Couch to the Finish Line","intro":"Tom and Daniela are coworkers. They're chatting in the office kitchen on Monday morning.","lines":[{"sp":"Tom","t":"Daniela! I heard you ran the half marathon on Sunday. Congratulations!"},{"sp":"Daniela","t":"Thanks! A year ago, I couldn't run for five minutes without stopping."},{"sp":"Tom","t":"Seriously? So how did you do it?"},{"sp":"Daniela","t":"I [[set a goal]] in January and made a simple plan: three short runs a week. The hard part was [[sticking with]] it when it was cold and dark."},{"sp":"Tom","t":"Well, it definitely [[paid off]]. I'm terrible at that. I start things, but I never [[follow through]]."},{"sp":"Daniela","t":"Really? What are you [[working toward]] right now?"},{"sp":"Tom","t":"Honestly? I'd love to become a UX designer. But I'd need to take a course, build a portfolio… It feels impossible."},{"sp":"Daniela","t":"It's not impossible. Break it into small steps. First, [[sort out]] your schedule so you have time to study."},{"sp":"Tom","t":"That makes sense. But what if I fail?"},{"sp":"Daniela","t":"Then you learn something. Sometimes you have to [[step out of your comfort zone]]."},{"sp":"Tom","t":"True. And [[in the long run]], it would be a much better job for me."},{"sp":"Daniela","t":"Exactly. If you really want it, [[go for it]]!"},{"sp":"Tom","t":"OK. I'm hoping to sign up for a course next month. Will you check in with me now and then to make sure I'm [[on track]]?"},{"sp":"Daniela","t":"Deal. And who knows? Once you have the skills, [[the sky's the limit]]."},{"sp":"Tom","t":"Ha! First, I need to finish this coffee."}],"questions":[{"q":"What helped Daniela reach her goal?","opts":["She ran every day for a month.","She hired a personal trainer.","She made a simple plan and stuck with it."],"a":2},{"q":"What is Tom's problem?","opts":["He doesn't follow through on his plans.","He doesn't get along with his coworkers.","He has already failed a design course."],"a":0},{"q":"What does Tom ask Daniela to do?","opts":["Go running with him every week","Check in with him to make sure he's on track","Help him build a portfolio"],"a":1}]},"lang":[{"e":"follow through","t":"PV","d":"to complete something you started","x":"Great ideas mean nothing if you don't follow through.","s":"follow THROUGH"},{"e":"sort out","t":"PV","d":"to organize or solve something","x":"I need to sort out my finances first.","s":"sort OUT"},{"e":"pay off","t":"PV","d":"to be successful after a lot of effort","x":"All that practice finally paid off.","s":"pay OFF"},{"e":"go for it","t":"ID","d":"to try something with confidence","x":"If you really want that job, go for it!","s":"GO for it"},{"e":"in the long run","t":"ID","d":"eventually; after a long time","x":"Learning English will pay off in the long run.","s":"in the LONG RUN"},{"e":"the sky's the limit","t":"ID","d":"there are no limits to what you can achieve","x":"With your talent, the sky's the limit.","s":"the SKY'S the LIMit"},{"e":"set a goal","t":"COL","d":"to decide what you want to achieve","x":"I set a goal to run a 10K by December.","s":"set a GOAL"},{"e":"work toward","t":"PREP","d":"to make an effort to achieve something","x":"I'm working toward a promotion.","s":"WORK toWARD","uk":"UK: work towards"},{"e":"stick with","t":"PV","d":"to continue doing something, even when it's difficult","x":"Learning the guitar is hard at first, but stick with it.","s":"STICK with"},{"e":"a bucket list","t":"COL","d":"a list of things you want to do before you die","x":"Seeing the northern lights is on my bucket list.","s":"a BUCKet list"},{"e":"step out of your comfort zone","t":"COL","d":"to do something new or difficult that makes you a little nervous","x":"Moving abroad forced me to step out of my comfort zone.","s":"step OUT of your COMfort zone"},{"e":"on track","t":"PREP","d":"making the progress you need to reach a goal","x":"I'm on track to finish my degree next year.","s":"on TRACK"}],"func":{"title":"Talking about hopes, plans and intentions","when":"Use these to talk about the future with different levels of certainty.","phrases":[{"p":"I'm planning to…","use":"a plan you have already decided on"},{"p":"I'm hoping to…","use":"something you want but aren't sure about"},{"p":"I'm thinking of (+ -ing)…","use":"an idea you're considering"},{"p":"My plan is to…","use":"stating a clear intention"},{"p":"I've always dreamed of (+ -ing)…","use":"a long-term dream"},{"p":"If all goes well, …","use":"a plan that depends on circumstances"},{"p":"There's a good chance I'll…","use":"something likely"},{"p":"I doubt I'll…, but…","use":"something unlikely"},{"p":"Sooner or later, I'd like to…","use":"a goal with no fixed date"},{"p":"It's not set in stone, but…","use":"a plan that might change"}],"task":"Write down three goals: one for this year, one for the next five years and one 'dream' goal. In pairs, tell your partner about each one using a different phrase. Your partner asks two follow-up questions (How? When? What's stopping you?) and gives one piece of advice. Then swap."},"pron":{"focus":"Chunking and pausing","explain":"Fluent speakers don't say words one by one; they group them into chunks (thought groups) with a short pause between them. Each chunk usually has one main stress. Expressions like in the long run or go for it are single chunks, so never pause in the middle of them.","tip":"Mark the pauses (|) in a sentence before you say it. Breathe at each pause, and say each chunk as if it were one long word.","lines":[{"t":"If you really want that job, go for it!","m":"If you REALly WANT that JOB, | GO for it!"},{"t":"All that practice finally paid off.","m":"ALL that PRACtice | FInally PAID OFF."},{"t":"In the long run, learning English will pay off.","m":"In the LONG RUN, | LEARNing ENGlish | will PAY OFF."},{"t":"I'm on track to finish my degree next year.","m":"I'm on TRACK | to FINish my deGREE | next YEAR."},{"t":"Great ideas mean nothing if you don't follow through.","m":"GREAT iDEas mean NOTHing | if you DON'T follow THROUGH."}]},"acts":[{"type":"wyr","items":[["Have a job you love with a low salary","Have a boring job with a huge salary"],["Achieve one big dream","Achieve many small goals"],["Plan your whole life","Live day by day"],["Start your own company","Work for a famous company"],["Retire at 40","Work until 70 doing what you love"],["Speak five languages","Play five instruments"]]},{"type":"ranking","task":"Rank these life goals from MOST to LEAST important for you.","items":["Buying a house","Traveling the world","Having a family","Getting a great job","Learning new skills","Staying healthy"]},{"type":"fishbowl","questions":["Is it better to share your goals with other people or keep them private?","Should goals be realistic, or should we aim for things that seem impossible?","Is it ever OK to give up on a goal? When?","What matters more for success: talent, hard work or luck?","Do 'success stories' on social media motivate people or make them feel worse?","At what age is it too late to start a new career?"]}],"ex":{"gap":{"items":[{"s":"She practiced every day for months, and it really ___. She won the competition!","a":"paid off"},{"s":"Learning a language is hard at first, but if you ___ (= keep doing) it, you'll see results.","a":"stick with"},{"s":"Before I start my own business, I need to ___ my finances.","a":"sort out"},{"s":"Skydiving and seeing the northern lights are both on my ___.","a":"bucket list"},{"s":"I'm studying three hours a day, so I'm ___ to pass the exam in June.","a":"on track"},{"s":"Good running shoes are expensive, but ___ they're cheaper than an injury.","a":"in the long run"}]},"match":{"pairs":[["follow through","to finish what you started"],["go for it","to try something with confidence"],["the sky's the limit","there's no limit to what you can achieve"],["set a goal","to decide what you want to achieve"],["step out of your comfort zone","to try something new that makes you nervous"],["work toward","to make an effort to achieve something"]]},"fix":{"items":[{"s":"I'm thinking to start my own business.","wrong":"thinking to start","fix":"thinking of starting"},{"s":"My goal is learn Italian this year.","wrong":"is learn","fix":"is to learn"},{"s":"All my hard work finally paid it off.","wrong":"paid it off","fix":"paid off"},{"s":"I'm working toward get a promotion.","wrong":"toward get","fix":"toward getting"}]}},"rec":{"prompt":"Describe a goal you're working toward right now. Why is it important to you, what are you doing to achieve it, and what's the hardest part?","model":"Right now I'm working toward a promotion to team leader. It's important to me because I want more responsibility, and in the long run, it would open a lot of doors. To get there, I'm taking an online leadership course, and I volunteer to lead small projects whenever I can. The hardest part is sticking with the course after a long day at work. Sometimes I'm exhausted and I just want to watch TV! But I try to study for at least thirty minutes every evening, and so far I'm on track to finish it by March. If all goes well, I'll apply for the position in April.","use":["work toward","in the long run","stick with","on track"]},"tips":[{"who":"teacher","t":"Run the fishbowl with 4–5 students in the inner circle. Give each observer one job: note good expressions, note mistakes, or count who speaks most. Swap the circles after 6–7 minutes and share feedback at the end."},{"who":"student","t":"Write your three biggest goals in English with the lesson language ('I'm working toward…', 'In the long run, I want to…') and stick them somewhere you'll see them every day."},{"who":"student","t":"'Pay off' has two meanings: 'to be successful after effort' (Hard work pays off) and 'to finish paying money you owe' (I paid off my car loan). Context tells you which one!"}]},{"id":"c1-plans","lv":"C1","tp":"plans","title":"The World in 2050","img":8566636,"goals":["speculate about the future using nuanced language of probability","discuss long-term change with sophisticated idioms like pave the way for and the writing is on the wall","pitch and defend an innovation persuasively under tough questioning"],"warm":["What will cities look like in 2050?","Are you optimistic about the future?","Which invention will change our lives the most?","What's one thing we take for granted today that might disappear by 2050?"],"model":{"kind":"text","title":"2050: What Can We Really Predict?","intro":"An article from a science and technology website about which predictions for 2050 are realistic.","paras":["Predicting the future is a notoriously risky business. In the mid-20th century, plenty of people assumed that by the year 2000 we'd all be driving flying cars. We aren't. So any forecast for 2050 should be taken with a grain of salt. Still, some trends are clear enough to allow a few educated guesses.","Take energy. Many countries, including Chile, have set targets to reach net-zero emissions or carbon neutrality by around 2050, and electric vehicles keep getting cheaper. Gas-powered cars are already being [[phased out]] in some markets, and some analysts believe that, for traditional gas stations, [[the writing is on the wall]].","Work is harder to call. AI [[is bound to]] automate many routine tasks, but whether that will [[bring about]] mass unemployment or simply create new kinds of jobs remains to be seen. Historically, new technologies have destroyed some jobs while [[paving the way for]] others that nobody could have imagined.","Medicine may offer the most hopeful picture. Dozens of gene-editing therapies are [[in the pipeline]], and the first treatment based on CRISPR was approved in 2023. It's [[a distinct possibility]] that, by 2050, some genetic diseases that are incurable today will be treatable.","Of course, none of this will [[pan out]] exactly as expected. But [[in all likelihood]], daily life in 2050 will be [[a far cry from]] the world we know today."],"questions":[{"q":"What is the writer's attitude toward predictions?","opts":["They are risky, but some educated guesses are possible.","They are pointless and should be ignored.","Experts are usually right about the future."],"a":0},{"q":"According to the article, what is still uncertain about AI and work?","opts":["Whether AI will automate any tasks at all","Whether it will cause mass unemployment or create new jobs","Whether governments will phase out AI"],"a":1},{"q":"Which example of medical progress does the writer mention?","opts":["A cure for all genetic diseases","Flying ambulances in big cities","The approval of the first CRISPR-based treatment in 2023"],"a":2}]},"lang":[{"e":"phase out","t":"PV","d":"to gradually stop using something","x":"The city plans to phase out diesel buses by 2035.","s":"phase OUT"},{"e":"bring about","t":"PV","d":"to cause something to happen","x":"Technology could bring about huge changes in education.","s":"bring aBOUT"},{"e":"in the pipeline","t":"ID","d":"being planned or developed","x":"New laws on AI are in the pipeline.","s":"in the PIPEline"},{"e":"the writing is on the wall","t":"ID","d":"there are clear signs that something bad will happen","x":"For traditional stores, the writing is on the wall.","s":"the WRITing is on the WALL"},{"e":"pave the way for","t":"ID","d":"to make something possible in the future","x":"These discoveries pave the way for new medicines.","s":"PAVE the WAY for"},{"e":"a far cry from","t":"ID","d":"very different from","x":"Life in 2050 will be a far cry from today.","s":"a FAR CRY from"},{"e":"be bound to","t":"COL","d":"to be certain to happen","x":"Robots are bound to replace some jobs.","s":"be BOUND to"},{"e":"by the end of","t":"PREP","d":"no later than a certain time","x":"By the end of the century, sea levels will have risen.","s":"by the END of"},{"e":"pan out","t":"PV","d":"to develop or end in a particular way","x":"Let's wait and see how the new policy pans out.","s":"pan OUT"},{"e":"a distinct possibility","t":"COL","d":"something that could quite realistically happen","x":"A four-day workweek is a distinct possibility in some industries.","s":"a disTINCT possiBILity"},{"e":"in all likelihood","t":"PREP","d":"very probably","x":"In all likelihood, most of us will be working with AI assistants within a few years.","s":"in ALL LIKElihood"},{"e":"for the foreseeable future","t":"PREP","d":"for as long as anyone can predict","x":"Housing prices are likely to stay high for the foreseeable future.","s":"for the forSEEable FUture"}],"func":{"title":"Speculating and predicting","when":"Use these to talk about the future and show exactly how certain you are.","phrases":[{"p":"There's every chance that…","use":"very likely"},{"p":"I wouldn't be surprised if…","use":"quite likely"},{"p":"The odds are that…","use":"probably (informal)"},{"p":"Assuming current trends continue, …","use":"a prediction based on what is happening now"},{"p":"It remains to be seen whether…","use":"uncertain; we'll have to wait"},{"p":"It's anyone's guess.","use":"nobody can know"},{"p":"I can't see that happening any time soon.","use":"skeptical"},{"p":"I'd be very surprised if…","use":"very unlikely"},{"p":"It's highly unlikely that…","use":"almost certainly not"},{"p":"Who's to say that…?","use":"questioning someone else's certainty"}],"task":"In pairs, take turns making a prediction about 2050 in one area (transportation, work, health, education, food). Your partner reacts with a different phrase each time, shows how certain they are and gives a reason. Change the area every 30 seconds."},"pron":{"focus":"Intonation: certainty vs. doubt","explain":"A falling tone (↘) at the end of a statement sounds sure and final. A fall-rise (↘↗) on a key word suggests doubt, reservation or a hidden 'but…'. Compare 'It'll WORK ↘' (I'm sure) with 'It MIGHT ↘↗ work' (but I'm not convinced). Yes/no questions usually rise (↗).","tip":"Exaggerate the fall-rise when you practice. In real conversation, a smaller version will still sound natural and nuanced.","lines":[{"t":"Robots are bound to replace some jobs.","m":"ROBots are BOUND to rePLACE some JOBS. ↘"},{"t":"In all likelihood, cities will be greener.","m":"In ALL LIKElihood, | CITies will be GREENer. ↘"},{"t":"It might pan out, but I have my doubts.","m":"It MIGHT ↘↗ pan OUT, | but I HAVE my DOUBTS. ↘"},{"t":"Life in 2050 will be a far cry from today.","m":"LIFE in 2050 | will be a FAR CRY from toDAY. ↘"},{"t":"Will humans live on Mars? It remains to be seen.","m":"Will HUmans LIVE on MARS? ↗ | It reMAINS to be SEEN. ↘"}]},"acts":[{"type":"roleplay","cards":[{"sit":"A city council meeting in 2040.","a":"You are the mayor. You want to phase out all cars from the downtown area. Defend your plan.","b":"You own a store downtown. You think the plan will destroy your business. Argue against it and propose alternatives."},{"sit":"A job interview in 2050.","a":"You are a manager at a company that uses AI for most tasks. Ask the candidate why a human is better than an AI for this job.","b":"You are the candidate. Convince the manager that human skills are irreplaceable."}]},{"type":"roulette","items":["Which jobs are bound to disappear by 2050?","What changes are in the pipeline in your city?","Will humans live on Mars one day?","What should be phased out as soon as possible?","How will education be a far cry from today's?","What invention could bring about world peace?","Would you like to live forever? Why?","Is the writing on the wall for social media?"]},{"type":"pitch","brief":"It's 2030. In small groups, choose one idea (or invent your own) and prepare a 2-minute pitch for a panel of investors. Explain what problem it solves, how it will change life by 2050 and why now is the right time. The other groups are the investors: they ask tough questions, then decide where to put their money.","ideas":["A vertical farm in every apartment building","An AI tutor that adapts to each student's mood and learning style","Solar-powered desalination plants to supply drinking water to northern Chile","Self-driving electric minibuses for small rural towns","A health 'digital twin' that predicts illnesses before symptoms appear"],"questions":["What's to stop a bigger company from copying your idea?","How will you make money, and when?","What could go wrong, and how would you deal with it?","Who might lose out if your idea succeeds?","What evidence do you have that people actually want this?","Why are you so sure this will still be relevant in 2050?"]}],"ex":{"gap":{"items":[{"s":"Chile plans to ___ its coal-fired power plants by 2040.","a":"phase out"},{"s":"It's too early to know how the new policy will ___.","a":"pan out"},{"s":"Online shopping keeps growing. For many small stores, ___.","a":"the writing is on the wall"},{"s":"Several new AI laws are ___, but none of them have been passed yet.","a":"in the pipeline"},{"s":"Daily life in 2050 will be ___ daily life in 1950.","a":"a far cry from"},{"s":"Prices are expected to stay high ___, so don't expect them to drop soon.","a":"for the foreseeable future"}]},"match":{"pairs":[["bring about","to cause something to happen"],["pave the way for","to make something possible later"],["be bound to","to be certain to happen"],["phase out","to gradually stop using something"],["a distinct possibility","something that could realistically happen"],["by the end of","no later than"]]},"fix":{"items":[{"s":"By 2050, robots are bound replacing many jobs.","wrong":"bound replacing","fix":"bound to replace"},{"s":"Life in 2050 will be a far cry of life today.","wrong":"far cry of","fix":"far cry from"},{"s":"It remains to see whether the plan will work.","wrong":"remains to see","fix":"remains to be seen"},{"s":"In all likelihoods, prices will keep rising.","wrong":"likelihoods","fix":"likelihood"}]}},"rec":{"prompt":"What will your city or country be like in 2050? Make two or three predictions, and show how certain you are about each one.","model":"I think Santiago in 2050 will be a far cry from the city we know today. In all likelihood, most buses and taxis will be electric, because that change is already happening. I'd also say that remote work is bound to keep growing, so traffic might be a little lighter, though I wouldn't bet on it! What I'm less sure about is housing. There's every chance that the city will keep expanding, but it remains to be seen whether we'll build enough affordable homes. Personally, I'm hoping for more green spaces and better public transportation, but we'll have to wait and see how things pan out.","use":["a far cry from","in all likelihood","be bound to","pan out"]},"tips":[{"who":"teacher","t":"Give groups 8–10 minutes to prepare their pitch and require at least three lesson expressions in each one. Investors must give a 'deal or no deal' verdict and justify it with the speculation phrases."},{"who":"student","t":"Vary your certainty instead of using 'will' every time: 'be bound to' (certain), 'in all likelihood' (very probable), 'a distinct possibility' (realistic) and 'I'd be very surprised if…' (unlikely)."},{"who":"student","t":"'The writing is on the wall' always predicts something negative, usually the end of something. Don't use it for good news!"}]},{"id":"b1-travel","lv":"B1","tp":"travel","title":"Vacations & Trips","img":7459355,"goals":["talk about a past trip using travel phrasal verbs like set off, check in and look around","make polite requests and ask for recommendations at a hotel, airport or tourist office","describe a place you'd like to visit and explain why"],"warm":["What's the best trip you've ever taken?","Do you prefer the beach or the mountains?","What do you always pack?","Have you ever gotten lost in a new place? What happened?"],"model":{"kind":"dialogue","title":"Back from the South","intro":"Valentina is back at work after a week in the south of Chile. Her coworker Mike asks about her trip.","lines":[{"sp":"Mike","t":"Hey, Vale! Welcome back. So, how was your week [[on vacation]]?"},{"sp":"Valentina","t":"Amazing, thanks! We went to Puerto Varas and Chiloé."},{"sp":"Mike","t":"Nice! Did you go [[by plane]]?"},{"sp":"Valentina","t":"Yes, we flew to Puerto Montt, and my cousin [[picked us up]] at the airport. He even lent us his car."},{"sp":"Mike","t":"Lucky you! Where did you stay?"},{"sp":"Valentina","t":"We were [[on a budget]], so I [[booked a room]] in a small hostel. We [[checked in]] at three and then went out to [[look around]] the town."},{"sp":"Mike","t":"Did you [[go sightseeing]] in Chiloé too?"},{"sp":"Valentina","t":"Of course! We [[set off]] really early on Wednesday and took the ferry. The old wooden churches are beautiful."},{"sp":"Mike","t":"Sounds perfect. Any problems?"},{"sp":"Valentina","t":"Well, we [[got lost]] on the way back. We were [[in the middle of nowhere]], with no phone signal!"},{"sp":"Mike","t":"Oh no! What did you do?"},{"sp":"Valentina","t":"We stopped at a farm to ask for directions. And guess what? The farmer was from Santiago — he went to school with my dad!"},{"sp":"Mike","t":"No way! [[It's a small world]]."}],"questions":[{"q":"How did Valentina get to Puerto Montt?","opts":["By bus","By plane","By car"],"a":1},{"q":"Why did she stay in a small hostel?","opts":["She didn't have much money to spend.","Her cousin worked there.","All the hotels were full."],"a":0},{"q":"What happened when they got lost?","opts":["A police officer helped them.","Their phone showed them the way.","A farmer who knew her dad helped them."],"a":2}]},"lang":[{"e":"set off","t":"PV","d":"to start a journey","x":"We set off early in the morning.","s":"set OFF"},{"e":"check in","t":"PV","d":"to arrive and register at a hotel or airport","x":"We checked in at the hotel at 3 p.m.","s":"check IN"},{"e":"look around","t":"PV","d":"to visit and explore a place","x":"We spent the day looking around the old town.","s":"look aROUND"},{"e":"pick up","t":"PV","d":"to go and get someone, usually in a car","x":"My uncle picked us up at the airport.","s":"pick UP"},{"e":"go sightseeing","t":"COL","d":"to visit famous places as a tourist","x":"We went sightseeing in Rome all day.","s":"go SIGHTseeing"},{"e":"book a room","t":"COL","d":"to reserve a hotel room","x":"I booked a room online for two nights.","s":"book a ROOM"},{"e":"get lost","t":"COL","d":"to not know where you are or how to get somewhere","x":"We got lost downtown on our first night.","s":"get LOST"},{"e":"by plane / by train","t":"PREP","d":"using a type of transportation (no \"the\": by bus, by car, by boat)","x":"We traveled from Santiago to Chillán by train.","s":"by PLANE / by TRAIN"},{"e":"on vacation","t":"PREP","d":"away from work or school, usually on a trip","x":"We're going on vacation to Brazil in February.","s":"on vaCAtion","uk":"UK: on holiday"},{"e":"on a budget","t":"PREP","d":"with only a small amount of money to spend","x":"We traveled around Peru on a budget and stayed in hostels.","s":"on a BUDget"},{"e":"in the middle of nowhere","t":"ID","d":"very far from any town or people","x":"Our cabin was in the middle of nowhere — no stores, no Wi-Fi.","s":"in the MIDdle of NOwhere"},{"e":"it's a small world","t":"ID","d":"said when you meet someone you know, or someone connected to you, in an unexpected place","x":"I met my old teacher at a café in Lisbon. It's a small world!","s":"it's a SMALL WORLD"}],"func":{"title":"Making polite requests and asking for recommendations","when":"Use these at hotels, airports and tourist offices — or anywhere you need help when you travel.","phrases":[{"p":"Could you tell me…?","use":"asking for information politely"},{"p":"Do you know where/if…?","use":"a softer, indirect question (Do you know where the station is? — not \"where is the station\")"},{"p":"Would it be possible to…?","use":"a very polite request"},{"p":"Is it OK if I…?","use":"asking for permission"},{"p":"What would you recommend?","use":"asking for a recommendation"},{"p":"Is there anywhere nice to … around here?","use":"asking about places nearby"},{"p":"You should definitely…","use":"giving a strong recommendation"},{"p":"Sorry, could you say that again?","use":"asking someone to repeat"},{"p":"Thanks, that's really helpful.","use":"thanking someone for information"}],"task":"In pairs: A is a tourist who has just arrived in your city; B works at the tourist information desk. A asks at least four polite questions (transportation, food, places to look around, a day trip) and B gives recommendations. Then swap roles and choose a different city."},"pron":{"focus":"Linking: consonant + vowel in phrasal verbs","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them with no gap: set‿off sounds like \"se-toff\" and check‿in like \"che-kin\". In phrasal verbs, the particle (off, in, up, around) is usually stressed.","tip":"Say the phrase slowly with no gap, then faster and faster: \"che-kin, che-kin, check in\". Never stop between the verb and the particle.","lines":[{"t":"We set off early in the morning.","m":"We set‿OFF‿EARly in the MORNing."},{"t":"We checked in at the hotel at three.","m":"We checked‿IN‿at the hoTEL at THREE."},{"t":"My cousin picked us up at the airport.","m":"My COUSin picked‿us‿UP‿at the AIRport."},{"t":"Let's look around the old town.","m":"Let's look‿aROUND the OLD TOWN."},{"t":"We got lost in the middle of nowhere.","m":"We got LOST‿in the MIDdle‿of NOwhere."}]},"acts":[{"type":"picture","prompts":["Describe the place in the photo.","Would you like to travel there? Why or why not?","What activities can you do there?","Who would you take with you?"]},{"type":"roleplay","cards":[{"sit":"At a hotel reception.","a":"You are a tourist. Check in, ask about breakfast time and ask for a recommendation to look around the city.","b":"You are the receptionist. Help the tourist, give information and recommend two places."},{"sit":"At the airport.","a":"Your suitcase didn't arrive. Explain the problem to the airline staff and describe your suitcase.","b":"You work for the airline. Ask questions and explain what will happen next."}]},{"type":"fluency","topics":["The best trip you've ever taken: where you went, how you got there and what you did","A time you got lost (or almost got lost)","Your perfect weekend trip in Chile","A trip that went wrong","How you like to travel: on a budget or in comfort?"]}],"ex":{"gap":{"items":[{"s":"Our flight is at 7 a.m., so we need to ___ for the airport at 4:30.","a":"set off"},{"s":"Don't take a taxi, Ana! My brother can ___ at the airport. (3 words)","a":"pick you up"},{"s":"I ___ online for three nights. It was cheaper than at the front desk. (3 words)","a":"booked a room"},{"s":"I'm not working next week because I'll be ___ in Brazil. Beach time!","a":"on vacation"},{"s":"Hotels were really expensive, so we traveled ___ and stayed in hostels.","a":"on a budget"},{"s":"The cabin had no neighbors, no stores and no Wi-Fi. It was really ___.","a":"in the middle of nowhere"}]},"match":{"pairs":[["set off","start a journey"],["pick someone up","go and get someone in a car"],["go sightseeing","visit famous places as a tourist"],["check in","register when you arrive at a hotel"],["on a budget","without much money to spend"],["it's a small world","what you say when you meet someone you know in an unexpected place"]]},"fix":{"items":[{"s":"We traveled to Cusco in plane.","wrong":"in plane","fix":"by plane"},{"s":"Last summer we went to sightseeing in Lima.","wrong":"went to sightseeing","fix":"went sightseeing"},{"s":"We lost ourselves in the old town.","wrong":"lost ourselves","fix":"got lost"},{"s":"We're going on vacations to Brazil in February.","wrong":"on vacations","fix":"on vacation"}]}},"rec":{"prompt":"Tell us about a trip you really enjoyed: where you went, how you got there, where you stayed and what you did.","model":"Last summer I went on vacation to La Serena with two friends. We were on a budget, so we went by bus — it took about seven hours. We set off at night and arrived early in the morning. I booked a room in a small hostel near the beach, and we checked in at noon. In the afternoon we looked around downtown and visited the Japanese garden. The next day we went sightseeing in the Elqui Valley. It's beautiful, and the sky at night is amazing. The best part? In a tiny restaurant there, we met a guy from my old school. It's a small world!","use":["on vacation","set off","check in","go sightseeing"]},"tips":[{"who":"teacher","t":"Before the hotel role-play, drill indirect questions on the board (Do you know where the station is? / Could you tell me what time breakfast is?). Students often keep normal question word order."},{"who":"student","t":"Make a card with the four phrasal verbs (set off, check in, look around, pick up) and say one true sentence with each about your last trip."},{"who":"student","t":"When you tell a travel story, use time words — first, then, after that, in the end — so people can follow it easily."}]},{"id":"b2-travel","lv":"B2","tp":"travel","title":"Travel Experiences","img":4173229,"goals":["tell an engaging travel story using storytelling phrases and travel idioms","compare travel styles and explain what kind of traveler you are","persuade a travel partner and reach a compromise on a trip plan"],"warm":["Have you ever had a travel disaster?","Do you prefer traveling alone or in a group?","Are you a tourist or a traveler?","If you could get away tomorrow, where would you go?"],"model":{"kind":"text","title":"One Backpack, One Canceled Flight","intro":"A blog post by Sofía, a Chilean traveler, about an unexpected week in Peru.","paras":["After eight months of working nonstop, I had a serious case of [[itchy feet]]. So when my boss offered me a week off — [[on short notice]] — I didn't think twice. I packed one small backpack (I always [[travel light]]) and booked the cheapest flight to Cusco I could find.","Of course, cheap meant complicated. I had to [[stop over]] in Lima, and then my connecting flight was canceled. Instead of getting angry, I took a taxi to Miraflores, ate amazing ceviche and spent the afternoon walking along the cliffs, [[soaking up the atmosphere]]. Not a bad way to spend a delay!","In Cusco, I skipped the big tours. I teamed up with two Argentinian travelers from my hostel, and we [[hit the road]] at sunrise in a rented car. [[On the way to]] the Sacred Valley, we stopped in a tiny village [[off the beaten path]], where an old woman invited us in for coca tea. Later we hiked up a hill with [[a breathtaking view]] of the snow-capped mountains.","Honestly, it was [[a once-in-a-lifetime experience]], and I came home more relaxed than I'd been in years. Sometimes you just need to [[get away]] — even when your plans fall apart."],"questions":[{"q":"Why did Sofía decide to travel?","opts":["She really wanted to travel after months of hard work.","She had won a free flight.","Her friends invited her to Peru."],"a":0},{"q":"How did she react when her flight was canceled?","opts":["She complained to the airline.","She decided to go back home.","She made the most of it and explored Lima."],"a":2},{"q":"What was special about the village?","opts":["It had a famous market.","It was far from the usual tourist routes.","It was full of tourists."],"a":1}]},"lang":[{"e":"get away","t":"PV","d":"to go on vacation to escape your routine","x":"We need to get away for a few days.","s":"get aWAY"},{"e":"stop over","t":"PV","d":"to stay somewhere briefly during a long journey (noun: a stopover / a layover)","x":"We stopped over in Madrid for two days.","s":"stop Over"},{"e":"soak up","t":"PV","d":"to enjoy and take in an atmosphere, the sun, a view, etc.","x":"We sat in the main square for hours, soaking up the atmosphere.","s":"soak UP"},{"e":"off the beaten path","t":"ID","d":"far from the places where most tourists go","x":"We found a beach off the beaten path.","s":"off the BEATen PATH","uk":"UK: off the beaten track"},{"e":"hit the road","t":"ID","d":"to start a journey; to leave","x":"It's getting late — let's hit the road!","s":"hit the ROAD"},{"e":"itchy feet","t":"ID","d":"a strong desire to travel","x":"After a month at home, I get itchy feet.","s":"ITCHy FEET"},{"e":"live out of a suitcase","t":"ID","d":"to travel so much that you never really unpack","x":"I've been living out of a suitcase since March. I miss my own bed!","s":"LIVE out of a SUITcase"},{"e":"travel light","t":"COL","d":"to travel with very little luggage","x":"I always travel light — just a backpack.","s":"travel LIGHT"},{"e":"a breathtaking view","t":"COL","d":"an extremely beautiful view","x":"The hotel had a breathtaking view of the lake.","s":"a BREATHtaking VIEW"},{"e":"a once-in-a-lifetime experience","t":"COL","d":"a very special experience you will probably only have once","x":"Seeing the Northern Lights was a once-in-a-lifetime experience.","s":"a ONCE-in-a-LIFEtime exPERience"},{"e":"on the way to","t":"PREP","d":"duri
