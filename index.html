h industry.","wrong":"trajectory","fix":"track record"},{"s":"We need to flesh out it before Friday.","wrong":"flesh out it","fix":"flesh it out"}]}},"rec":{"prompt":"Pitch an idea you believe in (a product, a change at work or a cause) in one minute. Make every sentence count.","model":"Picture this: every week, good ideas die in meeting rooms because nobody feels safe enough to share them. What's at stake isn't just innovation; it's whether talented people stay or leave. My proposal is simple: a monthly open pitch session where anyone, from interns to directors, can present an idea in five minutes. No slides, no hierarchy. I'm not going to gloss over the risks. Some ideas will be bad, and that's fine. But let me drive this point home: the companies that listen to everyone are usually the ones that adapt fastest. I say this with conviction because I've seen it work at my previous job. Give it three months. That's all I'm asking.","use":["at stake","gloss over","drive home (a point)","with conviction"]},"tips":[{"who":"teacher","t":"Record the pitches (with permission) and replay 30 seconds of each. Ask the class to identify one moment of effective emphasis and one moment where the speaker rushed."},{"who":"student","t":"Rehearse your opening and closing word for word, but use bullet points for the middle. You'll sound natural without losing your structure."},{"who":"student","t":"When you can't answer a question, don't apologize for your English. Say \"Let me get back to you on that\" and move on with confidence."}],"photo":{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Tom_Kristian_Abel_pitching_at_Fellin_H%C3%A4kk_hackathon_2026.jpg/1280px-Tom_Kristian_Abel_pitching_at_Fellin_H%C3%A4kk_hackathon_2026.jpg","by":"Maido Parv","lic":"CC BY-SA","url":"https://commons.wikimedia.org/w/index.php?curid=183823452"}},{"id":"b1-workplace","lv":"B1","tp":"workplace","title":"Problems at Work","goals":["describe common problems at work using phrasal verbs and collocations","explain a problem politely and ask a boss or coworker for help","suggest simple solutions to everyday workplace problems"],"warm":["What's the most annoying thing that can happen to you at work or school?","What do you do when you have too much work and not enough time?","Who do you talk to first when you have a problem at work?","Do you prefer to solve problems alone or with other people? Why?"],"model":{"kind":"dialogue","title":"A bad week at the office","intro":"Camila talks to her coworker Jake during a coffee break.","lines":[{"sp":"Jake","t":"Hey, Camila, you look stressed. Is everything OK?"},{"sp":"Camila","t":"Not really. I'm totally [[swamped]]. I was sick on Monday, so I [[fell behind]] on everything."},{"sp":"Jake","t":"Oh no. What do you have to finish?"},{"sp":"Camila","t":"The sales report for Friday. Honestly, I don't think I can [[meet the deadline]]."},{"sp":"Jake","t":"Who's [[in charge of]] the report? Marta?"},{"sp":"Camila","t":"Yes. And this morning my laptop stopped working, and IT still can't [[figure out]] what's wrong. That was [[the last straw]]."},{"sp":"Jake","t":"Have you talked to Marta? Maybe she can [[put off]] Thursday's team meeting so you have more time."},{"sp":"Camila","t":"I don't want to look bad. The project is already [[behind schedule]], and everyone's [[working overtime]]."},{"sp":"Jake","t":"It's not your fault. You were sick! Just explain the situation. She'd rather know today than on Friday."},{"sp":"Camila","t":"You're right. I'll talk to her after lunch."},{"sp":"Jake","t":"And send me the sales data. I can [[deal with]] the charts this afternoon."},{"sp":"Camila","t":"Really? Thanks, Jake. I owe you one."},{"sp":"Jake","t":"No problem. Just make sure you and Marta are [[on the same page]] about the new date. And when this is over, [[take a day off]]!"}],"questions":[{"q":"Why did Camila fall behind on her work?","opts":["She was sick on Monday.","Her laptop was new.","She was on vacation."],"a":0},{"q":"What does Jake offer to do?","opts":["Talk to Marta for her","Make the charts","Fix her laptop"],"a":1},{"q":"What is Camila going to do after lunch?","opts":["Take a day off","Call IT again","Talk to Marta"],"a":2}]},"lang":[{"e":"fall behind","t":"PV","d":"to do less work than planned; to get late with your work","x":"I was sick for a week and fell behind on my emails.","s":"fall beHIND"},{"e":"deal with","t":"PV","d":"to take action to solve a problem or handle a situation","x":"Can you deal with this customer? I'm on another call.","s":"DEAL with"},{"e":"figure out","t":"PV","d":"to find the answer or solution to something","x":"I can't figure out why the printer isn't working.","s":"figure OUT"},{"e":"put off","t":"PV","d":"to move something to a later time; to postpone","x":"Let's put off the meeting until Thursday.","s":"put OFF"},{"e":"be swamped","t":"ID","d":"to have much more work than you can easily do","x":"Sorry, I can't talk right now. I'm swamped.","s":"be SWAMPED"},{"e":"the last straw","t":"ID","d":"the final problem in a series that makes you lose your patience","x":"The Wi-Fi went down in the middle of my presentation. That was the last straw!","s":"the LAST STRAW"},{"e":"on the same page","t":"ID","d":"agreeing about something or understanding it in the same way","x":"Let's have a quick call so we're all on the same page.","s":"on the SAME PAGE"},{"e":"meet a deadline","t":"COL","d":"to finish something by the time it is due","x":"We worked all weekend to meet the deadline.","s":"MEET a DEADline"},{"e":"work overtime","t":"COL","d":"to work more hours than usual, often for extra pay","x":"I worked overtime three nights this week.","s":"work OVertime"},{"e":"take a day off","t":"COL","d":"to not go to work for one day","x":"I'm taking a day off on Friday to go to the dentist.","s":"take a DAY OFF"},{"e":"in charge of","t":"PREP","d":"responsible for something or someone","x":"Who's in charge of ordering office supplies?","s":"in CHARGE of"},{"e":"behind schedule","t":"PREP","d":"later than planned","x":"The new website is two weeks behind schedule.","s":"beHIND SCHEDule"}],"func":{"title":"Explaining a problem and asking for help","when":"Use these when you need to tell your boss or a coworker about a problem.","phrases":[{"p":"Do you have a minute?","use":"starting the conversation politely"},{"p":"Sorry to bother you, but…","use":"interrupting someone who is busy"},{"p":"I'm having a problem with…","use":"introducing the problem"},{"p":"The thing is, …","use":"explaining the main reason"},{"p":"Could you help me with…?","use":"asking for help"},{"p":"Would it be possible to…?","use":"asking for something politely (more time, a change)"},{"p":"What do you suggest?","use":"asking for advice"},{"p":"Why don't you…?","use":"making a suggestion"},{"p":"How about asking…?","use":"making a suggestion (How about + -ing)"},{"p":"Thanks, I really appreciate it.","use":"thanking someone for their help"}],"task":"Work in pairs. Student A chooses a problem: a broken laptop, too much work, or a coworker who is always late. Student B is A's boss. A explains the problem using at least four phrases, and B suggests two solutions. After two minutes, swap roles and choose a different problem."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them, so 'figure out' sounds like 'figu-rout'. This happens a lot with phrasal verbs, because many particles start with a vowel: out, off, up, on.","tip":"Say each sentence slowly with the links, then a little faster. Don't stop between the verb and the particle.","lines":[{"t":"We figured it out.","m":"We FIGured‿it‿OUT↘."},{"t":"Can we put it off until Friday?","m":"Can we PUT‿it‿OFF‿until FRIday↗?"},{"t":"Who's in charge of it?","m":"WHO'S‿in CHARGE‿of‿it↘?"},{"t":"I'll deal with it right away.","m":"I'll DEAL with‿it RIGHT‿aWAY↘."},{"t":"I worked overtime all week.","m":"I WORKED‿OVertime‿ALL WEEK↘."}]},"acts":[{"type":"ranking","task":"Rank these workplace problems from MOST annoying (1) to LEAST annoying (7). Then compare with a partner and explain your top three.","items":["A coworker who is always late for meetings","A slow computer or bad Wi-Fi","Too many emails and messages","A boss who changes plans at the last minute","A noisy office","Long meetings that could be an email","A coworker who never answers your messages"]},{"type":"roleplay","cards":[{"sit":"The office printer is broken, and you need to print a contract for a client meeting in 30 minutes.","a":"You're an employee. Explain the problem to your coworker and ask for help. Stay calm, but you're in a hurry.","b":"You're a coworker. You want to help, but you're busy too. Suggest at least two solutions (another printer, a print shop nearby, sending the contract by email)."},{"sit":"A project is behind schedule because a teammate was on vacation.","a":"You're the employee. Explain why you fell behind and ask your manager for two more days.","b":"You're the manager. The client is waiting. You can give one extra day, but not two, unless A has a really good plan."},{"sit":"A coworker plays music without headphones every afternoon, and you can't concentrate.","a":"You can't concentrate. Explain the problem politely and suggest a solution.","b":"You're the coworker with the music. You didn't know it was a problem, and music helps you work. Find a solution together."}]},{"type":"taboo","cards":[{"w":"fall behind","taboo":["late","slow","finish"]},{"w":"deal with","taboo":["problem","solve","handle"]},{"w":"figure out","taboo":["understand","answer","find"]},{"w":"put off","taboo":["postpone","later","delay"]},{"w":"be swamped","taboo":["busy","work","much"]},{"w":"meet a deadline","taboo":["time","finish","date"]},{"w":"work overtime","taboo":["hours","extra","late"]},{"w":"take a day off","taboo":["vacation","work","rest"]},{"w":"in charge of","taboo":["boss","responsible","manager"]},{"w":"behind schedule","taboo":["late","plan","time"]}]}],"ex":{"gap":{"items":[{"s":"I was sick for three days, so I ___ on my work. (= didn't do as much as planned)","a":"fell behind"},{"s":"We worked all weekend so we could meet the ___.","a":"deadline"},{"s":"Who's ___ the new interns? I have a question about their schedule. (= responsible for)","a":"in charge of"},{"s":"I can't ___ how to use this new software. Can you show me? (= understand, find the answer)","a":"figure out"},{"s":"Nothing on Friday's agenda is urgent, so let's ___ the meeting until next week. (= postpone)","a":"put off"},{"s":"The customer is really angry. Can you ___ her? I have no idea what to say. (= handle)","a":"deal with"}]},"match":{"pairs":[["be swamped","have too much work to do"],["the last straw","the final problem that makes you lose your patience"],["on the same page","agreeing about what to do"],["behind schedule","later than planned"],["take a day off","not go to work for one day"],["work overtime","work more hours than usual"]]},"fix":{"items":[{"s":"I have to finish this report until Friday.","wrong":"until","fix":"by"},{"s":"Can you help me? I need to deal this problem today.","wrong":"deal this problem","fix":"deal with this problem"},{"s":"My boss is in charge for the budget.","wrong":"in charge for","fix":"in charge of"},{"s":"I'm stressed because I have too many works.","wrong":"too many works","fix":"too much work"}]}},"rec":{"prompt":"Describe a problem you had at work or school. What happened, and how did you deal with it?","model":"Last year, I had a big problem at work. Two people on my team quit in the same month, so we were all swamped. I fell behind on my reports, and I was worried we wouldn't meet the deadline for an important client. Then my laptop broke, and honestly, that was the last straw. So I talked to my manager. I explained the situation and asked if we could hire someone for a few months. She agreed, and a new person joined us two weeks later. In the end, we dealt with the problem together and finished the project only three days late. I learned that it's better to ask for help early.","use":["fall behind","deal with","meet a deadline","the last straw"]},"tips":[{"who":"teacher","t":"Before the role-play, brainstorm workplace problems on the board in three groups: technology, people, and time. Students who don't work can use situations from school or university."},{"who":"student","t":"Watch the word order with 'it': you can say 'put it off' and 'figure it out', but 'deal with it' never changes. Never say 'put off it'."},{"who":"student","t":"When you explain a problem, start with 'The thing is…'. It sounds natural and gives you a second to think."}],"photo":{"src":"https://images.pexels.com/photos/6285280/pexels-photo-6285280.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/frustrated-man-working-in-home-office-6285280/"}},{"id":"b2-workplace","lv":"B2","tp":"workplace","title":"Workplace Conflicts","goals":["talk about conflicts between coworkers using idiomatic language","disagree and complain diplomatically without damaging relationships","negotiate a fair solution to a workplace conflict"],"warm":["What kinds of things cause arguments between coworkers or classmates?","Are you someone who avoids conflict or faces it directly?","Have you ever had a difficult boss or teammate? How did you handle it?","Is a little conflict at work healthy, or should teams always try to agree?"],"model":{"kind":"text","title":"Ask the Workplace Coach","intro":"Diego, a project manager in Santiago, writes to an online advice column about a problem with a coworker.","paras":["Dear Coach, I work closely with Carla, our head of design, and lately we've been [[butting heads]] over everything. Last week, I suggested a few changes to her team's timeline, and she said I was [[stepping on her toes]]. Then I found out she'd complained about me to our director [[behind my back]]. I didn't say anything, but now we barely speak, and the whole team can feel the tension. What should I do? — Frustrated in Santiago","Dear Frustrated, First, try not to [[take it personally]]. When two people care about the same project, they're often [[at odds]] simply because they have different priorities. Your first step is to [[clear the air]]. Ask Carla for a short private meeting, in person rather than by email, and start by acknowledging her point of view.","Then [[raise your concern]] calmly: explain that you felt undermined when she went to the director without talking to you first. If she [[pushes back]], listen before you respond. You don't need to win, but you don't need to [[back down]] on everything, either. The goal is to [[hash out]] a better way of working together, like a weekly check-in where you agree on timelines. Most conflicts don't end with a winner. They end when both people [[reach a compromise]] they can live with."],"questions":[{"q":"Why is Diego upset with Carla?","opts":["She missed an important deadline.","She complained about him to the director without telling him.","She changed the timeline of his project."],"a":1},{"q":"What does the coach suggest doing first?","opts":["Talking to Carla privately and in person","Sending Carla a detailed email","Asking the director to decide"],"a":0},{"q":"According to the coach, what is the goal of the conversation?","opts":["To prove who was right","To make Carla apologize to the team","To agree on a better way of working together"],"a":2}]},"lang":[{"e":"push back (on)","t":"PV","d":"to resist or argue against a plan, idea, or request","x":"The team pushed back on the idea of working Saturdays.","s":"push BACK on"},{"e":"back down","t":"PV","d":"to stop insisting that you are right or that you'll get what you want","x":"Neither of them wanted to back down, so the meeting went nowhere.","s":"back DOWN"},{"e":"hash out","t":"PV","d":"to discuss something in detail until you reach an agreement","x":"Let's sit down tomorrow and hash out the details.","s":"hash OUT"},{"e":"butt heads (with)","t":"ID","d":"to disagree strongly, often again and again","x":"Our sales and marketing managers butt heads all the time.","s":"BUTT HEADS"},{"e":"step on someone's toes","t":"ID","d":"to upset someone by getting involved in their work or responsibilities","x":"I don't want to step on anyone's toes, but I have a few ideas for your project.","s":"STEP on someone's TOES"},{"e":"clear the air","t":"ID","d":"to talk openly about a problem to end bad feelings","x":"We went for a coffee to clear the air after the argument.","s":"CLEAR the AIR"},{"e":"reach a compromise","t":"COL","d":"to agree on a solution where both sides give up something","x":"After two hours, we finally reached a compromise.","s":"REACH a COMpromise"},{"e":"take it personally","t":"COL","d":"to feel offended by criticism or a comment, as if it were an attack on you","x":"Don't take it personally. She's like that with everyone.","s":"take it PERsonally"},{"e":"raise a concern","t":"COL","d":"to mention a worry or a problem, often formally","x":"I'd like to raise a concern about the new schedule.","s":"RAISE a conCERN"},{"e":"at odds (with)","t":"PREP","d":"in disagreement; having different goals or opinions","x":"Our goals are often at odds with the finance team's.","s":"at ODDS with"},{"e":"behind someone's back","t":"PREP","d":"secretly, without the person knowing","x":"She complained about me to our boss behind my back.","s":"beHIND someone's BACK"},{"e":"out of line","t":"PREP","d":"(of behavior or comments) not acceptable; rude or inappropriate","x":"Shouting at the intern in front of everyone was completely out of line.","s":"OUT of LINE"}],"func":{"title":"Disagreeing and complaining diplomatically","when":"Use these when you need to disagree with a coworker or complain without damaging the relationship.","phrases":[{"p":"I see where you're coming from, but…","use":"showing you understand before you disagree"},{"p":"I'm not sure I agree with that.","use":"disagreeing softly"},{"p":"I feel a bit frustrated when…","use":"an 'I' statement: talking about your feelings, not attacking"},{"p":"Correct me if I'm wrong, but…","use":"challenging someone politely"},{"p":"I think there may have been a misunderstanding.","use":"reducing blame"},{"p":"Can we look at this from a different angle?","use":"changing the direction of the discussion"},{"p":"What would work for you?","use":"inviting the other person to suggest a solution"},{"p":"How about we meet halfway?","use":"proposing a compromise"},{"p":"Let's agree to disagree on that.","use":"ending a disagreement calmly"},{"p":"I appreciate you being honest with me.","use":"keeping the relationship positive"}],"task":"Work in pairs. Choose a conflict: a coworker presented your idea as their own, the person at the next desk talks loudly on the phone all day, or the vacation schedule seems unfair. Student A complains, and Student B defends their position. Use at least five phrases and try to reach a compromise in three minutes. Then swap roles with a new conflict."},"pron":{"focus":"Fall-rise intonation for polite disagreement","explain":"A fall-rise tone (↘↗) on a key word means 'Yes, partly… but there's more.' It makes disagreement sound softer and invites the other person to keep talking. A sharp fall (↘) on everything can sound final or even aggressive.","tip":"Exaggerate the fall-rise at first ('Maaaybe…'), then make it smaller and more natural. Record yourself and check that you sound calm, not annoyed.","lines":[{"t":"I see where you're coming from, but I'm not sure.","m":"I SEE where you're COMing from↘↗, | but I'm NOT SURE↘."},{"t":"Maybe, but that's not what we agreed.","m":"MAYbe↘↗, | but THAT'S not what we aGREED↘."},{"t":"It's a good idea in theory, but it won't work this month.","m":"It's a GOOD idea in THEory↘↗, | but it WON'T WORK this MONTH↘."},{"t":"Personally, I'd rather talk to her first.","m":"PERsonally↘↗, | I'd RATHer TALK to her FIRST↘."},{"t":"We don't have to agree on everything.","m":"We don't HAVE to agree on EVerything↘↗."}]},"acts":[{"type":"agree","items":["A little conflict makes a team stronger.","You should never complain about a coworker to your boss.","It's better to ignore small problems than to make a big deal out of them.","Managers should stay out of arguments between employees.","Conflicts are easier to solve face-to-face than by email or chat.","Being friends with your coworkers makes conflicts harder to solve.","If you know you're right, you shouldn't back down."]},{"type":"story","starters":["It all started when someone ate my lunch from the office fridge…","The meeting was going well until my manager said, 'Actually, that was my idea.'","Two coworkers had been at odds for months. Then the boss asked them to share a desk…","At 5:55 on a Friday, an email went to the whole company by mistake…","Nobody knew who kept changing the temperature in the office, until one day…"]},{"type":"negotiation","sit":"Valentina and Rodrigo work at the same travel agency in Santiago. Both have asked for December 26–30 off, but their manager says one of them must be in the office every day that week. They need to agree on a plan before they talk to the manager tomorrow.","a":{"role":"Valentina","goal":"Take the whole week off. You've already bought plane tickets to Punta Arenas for December 26–30 to visit Torres del Paine with your family.","limits":"You can change your flights, but it costs 150,000 pesos and you'd lose two days of the trip. Working from Patagonia isn't possible. Last year, you worked over the holidays so Rodrigo could travel."},"b":{"role":"Rodrigo","goal":"Take the whole week off. Your sister is getting married in La Serena on December 28, and you're in the wedding.","limits":"You must be in La Serena from the 27th to the 29th. You could work in the office on the 26th and the 30th. You only have three vacation days left this year. You don't really remember Valentina covering for you last year."}}],"ex":{"gap":{"items":[{"s":"Sales wants lower prices, but Finance wants higher profits, so their goals are ___ each other. (= in conflict with)","a":"at odds with"},{"s":"Sorry, I don't want to ___ your toes, but could I suggest a change to your slides?","a":"step on"},{"s":"She said my report was 'a bit messy.' I tried not to ___, but it hurt. (= feel offended)","a":"take it personally"},{"s":"Management wanted us to work on Saturdays, but the whole team ___ the idea. (= resisted)","a":"pushed back on"},{"s":"We argued for an hour, but in the end we ___: each team gets the room two days a week. (= agreed on a solution)","a":"reached a compromise"},{"s":"After the argument, they went for a coffee to ___. (= talk openly and end the bad feelings)","a":"clear the air"}]},"match":{"pairs":[["butt heads","disagree strongly, again and again"],["back down","stop insisting you're right"],["hash out","discuss something until you agree"],["behind someone's back","without the person knowing"],["out of line","rude or not acceptable"],["raise a concern","mention a worry, often formally"]]},"fix":{"items":[{"s":"I discussed with my coworker about the schedule.","wrong":"discussed with my coworker about the schedule","fix":"discussed the schedule with my coworker"},{"s":"She always complains me about the noise.","wrong":"complains me","fix":"complains to me"},{"s":"Carla and Diego have been at odds since two months.","wrong":"since two months","fix":"for two months"},{"s":"Don't take it so personal. She criticizes everyone.","wrong":"personal","fix":"personally"}]}},"rec":{"prompt":"Think of a disagreement you had with a coworker, classmate, or roommate. What was it about, and how did you resolve it?","model":"A couple of years ago, I shared an office with a guy named Felipe, and we used to butt heads all the time, mostly about the air conditioning. I like it cold; he likes it warm. It sounds silly, but it got really tense. One day he made a joke about me in front of the whole team, and I took it personally. A few days later, I invited him for a coffee to clear the air. It turned out he was stressed about other things, too. In the end, we reached a compromise: we set it to a reasonable temperature, and I started keeping a sweater at my desk. Now we actually get along really well.","use":["butt heads","take it personally","clear the air","reach a compromise"]},"tips":[{"who":"teacher","t":"For the negotiation, give each student only their own card and set a five-minute limit. Then ask each pair to report their deal to the class, and vote on the fairest and most creative solution."},{"who":"student","t":"Before you disagree, show that you've listened: repeat the other person's point in your own words ('So what you're saying is…'). It calms most conflicts down."},{"who":"student","t":"Avoid 'You always…' and 'You never…'; they sound like attacks. Try 'I feel… when…' instead: 'I feel frustrated when plans change at the last minute.'"}],"photo":{"src":"https://images.pexels.com/photos/7876100/pexels-photo-7876100.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/angry-colleagues-arguing-at-office-7876100/"}},{"id":"c1-workplace","lv":"C1","tp":"workplace","title":"Office Politics & Difficult Conversations","goals":["discuss office politics and power dynamics using sophisticated, nuanced vocabulary","handle difficult conversations tactfully, using hedging and softening language","give and respond to critical feedback while protecting professional relationships"],"warm":["What does 'office politics' mean to you? Is it always negative?","Is it possible to get ahead at work without playing politics?","What's the most difficult conversation you've ever had to have at work or in your personal life?","In your experience, do people in Chile tend to be direct or indirect when they criticize someone at work?"],"model":{"kind":"dialogue","title":"Podcast: Work, Unfiltered","intro":"Podcast host Laura interviews Martín, an organizational psychologist, about office politics and difficult conversations.","lines":[{"sp":"Laura","t":"Martín, many of our listeners say they hate office politics. Can you simply opt out?"},{"sp":"Martín","t":"Honestly, no. Wherever people share resources and ambitions, there's politics. The real question is whether you engage with it ethically. People who refuse to engage at all often end up [[out of the loop]] when the important decisions are made [[behind closed doors]]."},{"sp":"Laura","t":"So what does engaging ethically look like?"},{"sp":"Martín","t":"It starts with [[reading the room]]: knowing who influences whom and what people actually care about. That's awareness, not manipulation. What crosses the line is [[taking credit for]] other people's work, or [[throwing a colleague under the bus]] when something goes wrong."},{"sp":"Laura","t":"Let's talk about difficult conversations. Why do we avoid them?"},{"sp":"Martín","t":"Mostly because we're afraid of [[coming across as]] aggressive. So we [[gloss over]] the real issue or [[play it down]]: 'It's not a big deal, but…' And the other person walks away without realizing there's a problem at all."},{"sp":"Laura","t":"And the issue gets [[swept under the rug]]."},{"sp":"Martín","t":"Exactly, until it explodes. Meanwhile, the whole team is [[walking on eggshells]]."},{"sp":"Laura","t":"How should a manager [[broach the subject]], then?"},{"sp":"Martín","t":"Be specific, do it early, and separate the behavior from the person. Something like, 'I've noticed you've interrupted Carolina in the last three meetings. Can you help me understand what's going on?' You're describing facts, not assuming [[a hidden agenda]]."},{"sp":"Laura","t":"And if they get defensive?"},{"sp":"Martín","t":"Then you listen. Defensiveness is usually fear. Once people feel heard, they're far more open to change."}],"questions":[{"q":"According to Martín, what happens to people who refuse to take part in office politics?","opts":["They are usually promoted faster.","They often miss out on important decisions.","Their managers see them as more ethical."],"a":1},{"q":"Why do people avoid difficult conversations, according to Martín?","opts":["They're afraid of seeming aggressive.","They don't have enough time.","Their companies discourage them."],"a":0},{"q":"What does Martín recommend when the other person becomes defensive?","opts":["Ending the conversation and trying again later","Repeating the facts more firmly","Listening, because defensiveness usually comes from fear"],"a":2}]},"lang":[{"e":"gloss over","t":"PV","d":"to deal with a problem quickly and superficially so that people don't notice how serious it is","x":"The report glosses over the fact that we lost two major clients.","s":"gloss OVer"},{"e":"play down","t":"PV","d":"to make something seem less important or serious than it really is","x":"She played down the delay, but the client was clearly upset.","s":"play DOWN"},{"e":"come across as","t":"PV","d":"to give a particular impression to other people","x":"I don't want to come across as defensive, so I'll start by asking questions.","s":"come aCROSS as"},{"e":"throw someone under the bus","t":"ID","d":"to blame someone else, or let them take the blame, to protect yourself","x":"When the launch failed, he threw his own team under the bus.","s":"THROW someone under the BUS"},{"e":"read the room","t":"ID","d":"to understand the mood and attitudes of a group and adapt to them","x":"She read the room and decided not to bring up salaries that day.","s":"READ the ROOM"},{"e":"walk on eggshells","t":"ID","d":"to be extremely careful about what you say or do because someone gets upset easily","x":"Since the reorganization, everyone's been walking on eggshells around the director.","s":"WALK on EGGshells"},{"e":"sweep something under the rug","t":"ID","d":"to hide a problem instead of dealing with it","x":"You can't just sweep the complaints under the rug and hope they disappear.","s":"SWEEP something under the RUG","uk":"UK: sweep something under the carpet"},{"e":"broach the subject","t":"COL","d":"to start talking about a sensitive or difficult topic","x":"I wasn't sure how to broach the subject of his constant interruptions.","s":"BROACH the SUBject"},{"e":"take credit for","t":"COL","d":"to accept praise for something, sometimes when another person did the work","x":"My manager took credit for my proposal in front of the board.","s":"take CREDit for"},{"e":"a hidden agenda","t":"COL","d":"a secret aim behind what someone says or does","x":"I don't think she has a hidden agenda; she just wants the project to succeed.","s":"a HIDden aGENda"},{"e":"behind closed doors","t":"PREP","d":"privately, without other people knowing or being present","x":"The decision was made behind closed doors, and most of the staff found out from the press.","s":"beHIND CLOSED DOORS"},{"e":"out of the loop","t":"PREP","d":"not informed about what is happening or being decided","x":"I was on vacation for two weeks and felt completely out of the loop.","s":"OUT of the LOOP"}],"func":{"title":"Hedging and softening in difficult conversations","when":"Use these to raise sensitive issues, give critical feedback, or respond to criticism without damaging the relationship.","phrases":[{"p":"There's something I've been meaning to talk to you about.","use":"broaching a difficult subject"},{"p":"I wanted to run something by you.","use":"opening a sensitive topic informally"},{"p":"I may be wrong, but it seems to me that…","use":"hedging an observation"},{"p":"I've noticed that…, and I was wondering whether…","use":"stating a fact, then inviting an explanation"},{"p":"I'm not suggesting that…; it's more that…","use":"preventing a misunderstanding"},{"p":"From where I'm standing, …","use":"framing a point as your personal perspective"},{"p":"How do you see it?","use":"inviting the other person's side of the story"},{"p":"I hear what you're saying.","use":"acknowledging a point without necessarily agreeing"},{"p":"Would you be open to…?","use":"proposing a change tactfully"},{"p":"So, where do we go from here?","use":"moving the conversation toward next steps"}],"task":"In pairs: Student A is a team leader who must tell Student B, a talented but difficult team member, that colleagues feel B dominates meetings and takes credit for shared work. B reacts defensively at first. A has three minutes to reach an agreed next step, using at least six phrases. Then swap with a new situation: B tells A, their manager, that A's last-minute requests are burning the team out."},"pron":{"focus":"Chunking and pausing","explain":"In a serious conversation, speaking in clear chunks (thought groups) with short pauses makes you sound calm and in control. Each chunk usually has one main stress, and your voice falls at the end of a statement. Rushing everything together can sound nervous or defensive.","tip":"Before a difficult conversation, write down your opening sentence and mark the pauses with a slash. Breathe at each pause: it slows you down and makes you sound more confident.","lines":[{"t":"There's something I've been meaning to talk to you about.","m":"There's SOMEthing | I've been MEANing to TALK to you aBOUT↘."},{"t":"I'm not saying you did it on purpose, but it did affect the team.","m":"I'm NOT saying | you did it on PURpose↘↗, | but it DID affect the TEAM↘."},{"t":"From where I'm standing, the issue isn't your work; it's how it's communicated.","m":"From where I'm STANDing, | the ISSUE isn't your WORK↘↗; | it's HOW it's comMUNicated↘."},{"t":"If we sweep this under the rug, it'll only get worse.","m":"If we SWEEP this under the RUG, | it'll ONly get WORSE↘."},{"t":"So, where do we go from here?","m":"SO↘ | WHERE do we GO from HERE↘?"}]},"acts":[{"type":"ranking","task":"Rank these behaviors from MOST acceptable (1) to LEAST acceptable (7). Be ready to explain exactly where you draw the line.","items":["Having lunch with your boss's boss to get noticed","Staying quiet about a colleague's mistake to protect them","Copying your manager on an email to put pressure on a slow colleague","Going over your manager's head to get a project approved","Presenting an idea from a group brainstorm as mainly your own","Agreeing with your boss in meetings even when you privately disagree","Sharing confidential salary information with a close coworker"]},{"type":"devil","motions":["Office politics is a skill to be learned, not a vice to be avoided.","Brutal honesty is kinder than diplomatic feedback.","Managers should never be friends with the people they manage.","Anonymous feedback does more harm than good.","Everyone's salary should be visible to everyone in the company.","Loyalty to your team matters more than loyalty to the company."]},{"type":"fishbowl","questions":["Why do people find it so hard to give honest feedback to their bosses?","Is it ever right to go over your manager's head? Where do you draw the line?","How much do national and company cultures influence how directly people handle conflict? Give examples you know.","Does remote work make office politics better or worse?","What's the difference between networking and 'playing politics'?","If a talented employee is bad for team morale, should the company keep them?"]}],"ex":{"gap":{"items":[{"s":"The CEO ___ the layoffs in one sentence and moved straight on to the good news. (= dealt with quickly to hide how serious they were; starts with 'g')","a":"glossed over"},{"s":"When the launch failed, he threw his own team ___ to protect himself.","a":"under the bus"},{"s":"Before you give a presentation, try to ___: if people look tired, keep it short. (= sense the mood of the group)","a":"read the room"},{"s":"Since the new director arrived, everyone's been ___ because she gets upset so easily. (= being extremely careful)","a":"walking on eggshells"},{"s":"I don't want to ___ arrogant, so I'll start by asking for her opinion. (= give the impression of being; 3 words)","a":"come across as"},{"s":"The decision was made ___, so most of the staff found out from the news. (= in private)","a":"behind closed doors"}]},"match":{"pairs":[["play down","make something seem less serious than it is"],["take credit for","accept praise for something, sometimes unfairly"],["sweep something under the rug","hide a problem instead of dealing with it"],["broach the subject","start talking about a sensitive topic"],["a hidden agenda","a secret aim behind someone's actions"],["out of the loop","not informed about what's happening"]]},"fix":{"items":[{"s":"I'd like to discuss about my performance review.","wrong":"discuss about","fix":"discuss"},{"s":"She's very competent, but she lacks of tact.","wrong":"lacks of","fix":"lacks"},{"s":"My manager made me a feedback about my presentation.","wrong":"made me a feedback","fix":"gave me feedback"},{"s":"If I would have known about the problem, I would have spoken to her earlier.","wrong":"If I would have known","fix":"If I had known"}]}},"rec":{"prompt":"Describe a situation where someone needed to have a difficult conversation at work or in your studies. How was it handled, and what would you do differently?","model":"In my last job, one of our senior engineers was brilliant but always late with his part of every project. For months, nobody wanted to broach the subject, partly because he was so talented and partly because he could be quite sensitive. So the whole team walked on eggshells, and the problem was basically swept under the rug. Eventually, a new manager arrived and asked him for a one-on-one. She didn't come across as accusing; she simply showed him the dates and asked what was getting in the way. It turned out he was overloaded with requests from another department. Looking back, we should have raised it much earlier. Silence wasn't kindness; it just made everything worse.","use":["broach the subject","walk on eggshells","sweep something under the rug","come across as"]},"tips":[{"who":"teacher","t":"In the fishbowl, give each student in the outer circle a specific job: one counts hedging phrases, one notes lesson expressions, and one watches how interruptions are handled. Their feedback makes the swap much more useful."},{"who":"student","t":"At C1, how you say something matters as much as what you say. Compare 'You're wrong' with 'I'm not sure that's quite right.' Collect softeners (slightly, a bit, perhaps, I was wondering whether) and use them on purpose."},{"who":"student","t":"Idioms like 'throw someone under the bus' are perfect in conversation but too informal for written feedback or official emails. Choose a neutral alternative there, such as 'blame others'."}],"photo":{"src":"https://live.staticflickr.com/3894/33379319145_65bd4b1a0d_b.jpg","by":"Güel - Centro de Wellness Murcia","lic":"CC BY","url":"https://www.flickr.com/photos/147909363@N06/33379319145"}},{"id":"b1-tech","lv":"B1","tp":"tech","title":"Technology in Daily Life","goals":["talk about the technology you use every day with common phrasal verbs","ask for help with technology and give simple step-by-step instructions","give your opinion about the good and bad sides of technology"],"warm":["What's the first thing you do with your phone in the morning?","Which app or gadget could you not live without? Why?","Who do you ask for help when you have a problem with technology?","Do you think you spend too much time looking at screens?"],"model":{"kind":"dialogue","title":"Dad's new phone","intro":"Sofía is helping her dad, Héctor, with his new smartphone.","lines":[{"sp":"Héctor","t":"Sofi, can you help me [[set up]] this new phone? I've been trying for an hour."},{"sp":"Sofía","t":"Sure, Dad. Don't worry, [[it's not rocket science]]. First, let's [[back up]] everything from your old phone."},{"sp":"Héctor","t":"Good idea. Last month I deleted all my photos [[by accident]]. I almost cried."},{"sp":"Sofía","t":"Well, now they'll go to the cloud automatically. OK, which apps do you need?"},{"sp":"Héctor","t":"WhatsApp, the bank app, and the weather. Oh, and something to [[make video calls]] to your brother in Canada."},{"sp":"Sofía","t":"You can do that on WhatsApp, too. Honestly, your old phone was so [[out of date]] that half your apps didn't work."},{"sp":"Héctor","t":"I know. It's hard to [[keep up with]] all these changes."},{"sp":"Sofía","t":"Look, now if you want to [[look up]] a recipe or a bus route, just press here and ask."},{"sp":"Héctor","t":"That's [[a game changer]]! But I don't want to end up like your mom, [[glued to]] her phone all day."},{"sp":"Sofía","t":"Ha! There's a [[screen time]] setting. It shows how many hours you use your phone every day."},{"sp":"Héctor","t":"Perfect. Then I can show your mom her numbers!"}],"questions":[{"q":"What happened to Héctor last month?","opts":["He lost his old phone.","He deleted his photos by mistake.","He made a video call to Canada."],"a":1},{"q":"Why didn't many apps work on Héctor's old phone?","opts":["The phone was too old.","He didn't have Wi-Fi.","He forgot his password."],"a":0},{"q":"What does Héctor want to do with the screen time setting?","opts":["Use his phone less at night","Help Sofía study more","Show his wife how much she uses her phone"],"a":2}]},"lang":[{"e":"set up","t":"PV","d":"to prepare a device or an account so it's ready to use","x":"Can you help me set up my new printer?","s":"set UP"},{"e":"back up","t":"PV","d":"to make a copy of your files so you don't lose them","x":"I back up my photos to the cloud every week.","s":"back UP"},{"e":"look up","t":"PV","d":"to search for information, for example online or in a dictionary","x":"I looked up the restaurant's reviews before we went.","s":"look UP"},{"e":"keep up with","t":"PV","d":"to stay informed about something that changes quickly","x":"Technology changes so fast that it's hard to keep up with it.","s":"keep UP with"},{"e":"be glued to","t":"ID","d":"to look at something (a phone, a screen) all the time","x":"My brother is glued to his phone, even during dinner.","s":"be GLUED to"},{"e":"it's not rocket science","t":"ID","d":"it's easy to understand or do","x":"Just follow the steps. It's not rocket science!","s":"it's NOT ROCKet SCIence"},{"e":"a game changer","t":"ID","d":"something that completely changes the way people do things","x":"Online banking was a game changer for my grandparents.","s":"a GAME changer"},{"e":"screen time","t":"COL","d":"the time you spend looking at a phone, computer, or TV","x":"I'm trying to reduce my screen time before bed.","s":"SCREEN time"},{"e":"make a video call","t":"COL","d":"to talk to someone while you see each other on a screen","x":"I make a video call to my parents every Sunday.","s":"make a VIDeo call"},{"e":"addicted to","t":"PREP","d":"unable to stop using or doing something","x":"I think I'm a little addicted to social media.","s":"adDICTed to"},{"e":"by accident","t":"PREP","d":"not on purpose","x":"I deleted all my contacts by accident!","s":"by ACcident"},{"e":"out of date","t":"PREP","d":"old and no longer useful or modern","x":"My laptop is so out of date that it can't run the new software.","s":"OUT of DATE"}],"func":{"title":"Asking for help and giving instructions","when":"Use these when you help someone with technology, or when you need help yourself.","phrases":[{"p":"Could you show me how to…?","use":"asking for help"},{"p":"I can't figure out how to…","use":"explaining what you can't do"},{"p":"First of all, go to…","use":"giving the first step"},{"p":"Then tap on…","use":"giving the next step"},{"p":"After that, …","use":"continuing the instructions"},{"p":"Make sure you…","use":"giving an important tip or warning"},{"p":"What do I do next?","use":"asking for the next step"},{"p":"Did it work?","use":"checking the result"},{"p":"Have you tried restarting it?","use":"suggesting a simple solution"},{"p":"Got it, thanks!","use":"showing you understand"}],"task":"Work in pairs. Student A chooses a simple task: taking a screenshot, sharing your location on WhatsApp, connecting to Wi-Fi, or blocking a phone number. Student B explains how to do it step by step without touching a phone. A asks questions and checks each step. Then swap roles with a different task."},"pron":{"focus":"Stress in phrasal verbs and compound nouns","explain":"In phrasal verbs, the particle is usually stressed: set UP, back UP, look UP. But in compound nouns, the first part is stressed: a BACKup, SCREEN time, a PHONE call. So 'back UP your files' (verb) sounds different from 'make a BACKup' (noun).","tip":"Tap the table lightly on each stressed syllable as you speak. Phrasal verbs: tap on the particle (set UP). Compound nouns: tap on the first word (SCREEN time).","lines":[{"t":"Can you help me set up my new phone?","m":"Can you HELP me set UP my new PHONE↗?"},{"t":"Don't forget to back up your photos.","m":"DON'T forGET to back UP your PHOtos↘."},{"t":"Do you have a backup?","m":"Do you HAVE a BACKup↗?"},{"t":"I always look up recipes online.","m":"I ALways look UP REcipes onLINE↘."},{"t":"My screen time is terrible!","m":"My SCREEN time is TERrible↘!"}]},"acts":[{"type":"wyr","items":[["Lose your phone for a week","Lose your wallet for a week"],["Send only voice messages","Send only text messages"],["Never use social media again","Never watch videos online again"],["Have a robot that cooks","Have a robot that cleans"],["Know your exact screen time every day","Never know it"],["Live without GPS","Live without music apps"],["Have super-fast Wi-Fi but an old phone","Have the newest phone but slow Wi-Fi"]]},{"type":"picture","prompts":["Who do you think the people in the photo are? What's their relationship?","What are they doing on their devices? Guess!","Does this scene look like your home? Why or why not?","How do you think they feel? Are they having a good time together?","If you could give these people one piece of advice, what would it be?"]},{"type":"fluency","topics":["The best piece of technology you've ever bought, and why","A time technology made your day much easier (or much harder)","How your parents or grandparents use technology","Your typical day with your phone, from morning to night","What you would do with a whole weekend without the internet"]}],"ex":{"gap":{"items":[{"s":"Can you help me ___ my new printer? I don't know how to connect it. (= prepare it so it's ready to use)","a":"set up"},{"s":"I didn't know what 'hashtag' meant, so I ___ the word online. (= searched for)","a":"looked up"},{"s":"I deleted the file ___. I didn't mean to! (= not on purpose; 2 words, starts with 'by a')","a":"by accident"},{"s":"My computer is so ___ that it can't install the new software. (= too old; 3 words)","a":"out of date"},{"s":"My kids spend all weekend ___ their tablets. (= looking at them all the time)","a":"glued to"},{"s":"Don't worry, using this app is easy. It's not ___!","a":"rocket science"}]},"match":{"pairs":[["back up","make a copy of your files"],["keep up with","stay informed about new things"],["a game changer","something that changes everything"],["screen time","the time you spend looking at screens"],["addicted to","unable to stop using or doing something"],["make a video call","talk to someone and see them on a screen"]]},"fix":{"items":[{"s":"I'm going to download the app in my phone.","wrong":"in my phone","fix":"on my phone"},{"s":"Can you explain me how this works?","wrong":"explain me","fix":"explain to me"},{"s":"I think I'm addicted of my phone.","wrong":"addicted of","fix":"addicted to"},{"s":"I lost all my informations when my laptop broke.","wrong":"informations","fix":"information"}]}},"rec":{"prompt":"Describe a typical day with your phone. How do you use it, and do you think you use it too much?","model":"Honestly, I'm a bit glued to my phone. The first thing I do in the morning is check WhatsApp and the news. On the bus, I listen to podcasts, and at work I use it to look up information quickly or make video calls with clients. In the evening, I usually watch videos before I go to sleep, which is probably a bad idea. Last week I checked my screen time, and it was almost six hours a day! I was shocked. My phone helps me keep up with my friends and family, but I want to use it less. My plan is to leave it in the kitchen at night.","use":["be glued to","look up","screen time","keep up with"]},"tips":[{"who":"teacher","t":"For the 4/3/2 activity, give students one minute to prepare, then change partners each round (4, then 3, then 2 minutes). Afterward, ask: 'What was easier the third time?' It shows students how repetition builds fluency."},{"who":"student","t":"Change your phone's language to English for a week. You'll learn everyday tech words like settings, storage, update, and notifications without studying."},{"who":"student","t":"We say 'on my phone', 'on the internet', and 'on WhatsApp', not 'in'. Make it a habit!"}],"photo":{"src":"https://images.pexels.com/photos/20459169/pexels-photo-20459169.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/a-family-with-a-little-son-sitting-on-a-bed-parents-looking-at-their-smartphones-and-their-son-playing-a-game-20459169/"}},{"id":"b2-tech","lv":"B2","tp":"tech","title":"Living with AI","goals":["discuss the benefits and risks of AI in everyday life using idiomatic language","give balanced opinions, considering both sides before you reach a conclusion","speculate about how AI might change your studies, work, and daily routine"],"warm":["Have you ever used an AI chatbot or a voice assistant? What for?","What's one task you'd happily give to AI, and one you never would?","Do you trust recommendations from apps (music, movies, shopping)? Why or why not?","How do you think AI will change your job or studies in the next five years?"],"model":{"kind":"dialogue","title":"Is AI making us lazy?","intro":"Two friends, Paula and Nico, are chatting over lunch about how they use AI.","lines":[{"sp":"Nico","t":"I have to admit, I [[rely on]] AI for almost everything now. It plans my meals, summarizes my emails, and it even [[came up with]] the name of my bike shop."},{"sp":"Paula","t":"And you trust it? Last week a chatbot told me a museum was open on Mondays. It wasn't. It just [[made it up]]."},{"sp":"Nico","t":"Sure, you have to [[take it with a grain of salt]]. I always double-check anything important."},{"sp":"Paula","t":"But do you, really? I think it's [[a double-edged sword]]. It saves time, but people stop thinking for themselves."},{"sp":"Nico","t":"Maybe. [[On the plus side]], my dad finally understands his medical test results. He asks AI to explain them in simple words, and then he talks to his doctor."},{"sp":"Paula","t":"OK, that's a good use. I'll give you that. What worries me is work. My cousin's a translator, and she feels her job is [[at risk]]."},{"sp":"Nico","t":"I get that. In my case, AI hasn't [[taken over]] my job; it's changed it. There was [[a steep learning curve]], but once I [[got the hang of]] it, I started spending less time on boring tasks."},{"sp":"Paula","t":"So, overall, you think it's a good thing?"},{"sp":"Nico","t":"Honestly? [[The jury's still out]]. Ask me again in five years."},{"sp":"Paula","t":"Deal. Until then, I'll keep checking museum hours the old-fashioned way."}],"questions":[{"q":"What happened when Paula used a chatbot?","opts":["It gave her false information about a museum.","It refused to answer her question.","It bought the wrong museum tickets."],"a":0},{"q":"How does Nico's dad use AI?","opts":["Instead of going to the doctor","To understand his test results before he talks to his doctor","To book medical appointments"],"a":1},{"q":"What is Nico's final opinion about AI?","opts":["It's clearly positive.","It's clearly negative.","He hasn't decided yet."],"a":2}]},"lang":[{"e":"take over","t":"PV","d":"to take control of something, or to replace someone in a role","x":"Some people worry that AI will take over their jobs.","s":"take OVer"},{"e":"come up with","t":"PV","d":"to think of or produce an idea, a plan, or a solution","x":"The chatbot came up with ten names for my bakery in seconds.","s":"come UP with"},{"e":"make up","t":"PV","d":"to invent something that isn't true","x":"Be careful: chatbots sometimes make up facts and sources.","s":"make UP"},{"e":"a double-edged sword","t":"ID","d":"something that has both good and bad effects","x":"Social media is a double-edged sword for small businesses.","s":"a DOUBle-edged SWORD"},{"e":"take something with a grain of salt","t":"ID","d":"to not completely believe something","x":"I take online reviews with a grain of salt.","s":"take something with a GRAIN of SALT","uk":"UK: take something with a pinch of salt"},{"e":"the jury is still out","t":"ID","d":"people haven't decided yet whether something is good, true, or useful","x":"The jury is still out on whether AI tutors really help kids learn.","s":"the JURy is STILL OUT"},{"e":"get the hang of","t":"ID","d":"to learn how to do something, especially after some practice","x":"Writing good prompts was hard at first, but I'm getting the hang of it.","s":"get the HANG of"},{"e":"weigh the pros and cons","t":"COL","d":"to think carefully about the advantages and disadvantages","x":"Let's weigh the pros and cons before we use AI with our clients.","s":"WEIGH the PROS and CONS"},{"e":"a steep learning curve","t":"COL","d":"a situation where you have to learn a lot quickly, which is hard at first","x":"The new software has a steep learning curve, but it's worth it.","s":"a STEEP LEARNing curve"},{"e":"rely on","t":"PREP","d":"to depend on or trust someone or something","x":"I rely on GPS so much that I can't read a map anymore.","s":"reLY on"},{"e":"at risk of","t":"PREP","d":"in danger of something bad happening","x":"Which jobs are most at risk of automation?","s":"at RISK of"},{"e":"on the plus side","t":"PREP","d":"used to introduce an advantage or a positive point","x":"It's expensive. On the plus side, it saves me hours every week.","s":"on the PLUS side"}],"func":{"title":"Giving balanced opinions","when":"Use these when you discuss a topic with clear advantages and disadvantages, like AI.","phrases":[{"p":"On the one hand, … On the other hand, …","use":"comparing two sides"},{"p":"There's no doubt that…","use":"stating something you're sure about"},{"p":"That said, …","use":"introducing a contrasting point"},{"p":"I'll give you that, but…","use":"accepting someone's point, then continuing your argument"},{"p":"It depends on how you use it.","use":"avoiding a black-and-white answer"},{"p":"The main drawback is that…","use":"focusing on the most important disadvantage"},{"p":"I used to think…, but now…","use":"explaining how your opinion has changed"},{"p":"To be fair, …","use":"admitting something positive about the other side"},{"p":"All things considered, …","use":"reaching a conclusion"},{"p":"Where do you stand on this?","use":"asking for someone's opinion"}],"task":"In pairs, choose one use of AI: writing school essays, helping doctors diagnose patients, screening job applicants, or tutoring children. Student A presents the advantages and Student B the drawbacks, for one minute each, using at least three phrases. Then agree on a balanced conclusion together, starting with 'All things considered…'."},"pron":{"focus":"Contractions in natural speech","explain":"In everyday conversation, Americans use contractions almost all the time: I'd, it's, won't, it'll, I've, the jury's. The contracted part is unstressed and very short. Using full forms (I have, it is) everywhere sounds formal, or as if you're correcting someone.","tip":"Practice the contraction on its own first ('it'll' sounds like 'IT-ul'), then say the whole sentence. Keep the stress on the important words, not on the contraction.","lines":[{"t":"I'd take it with a grain of salt.","m":"I'd TAKE it with a GRAIN of SALT↘."},{"t":"The jury's still out.","m":"The JURy's STILL OUT↘."},{"t":"It's a double-edged sword.","m":"It's a DOUBle-edged SWORD↘."},{"t":"It won't take over your job, but it'll change it.","m":"It WON'T take OVer your JOB↘↗, | but it'll CHANGE it↘."},{"t":"I've finally gotten the hang of it.","m":"I've FInally GOTten the HANG of it↘."}]},"acts":[{"type":"roulette","items":["What's the most useful thing you've ever asked an AI to do?","Has an AI or app ever given you completely wrong information? What happened?","Would you let an AI choose a gift for someone you love?","Should teachers use AI to grade homework? Why or why not?","Would you feel comfortable if your doctor used AI to help diagnose you?","Which job do you think AI will never be able to do?","Do you say 'please' and 'thank you' to voice assistants or chatbots?","How can you tell if a text or a photo was made by AI?","What information would you never share with an AI app?","Is AI making people lazier, or is it freeing up time for more important things?"]},{"type":"speed","motions":["Students should be allowed to use AI for homework.","AI-generated art is real art.","Children under 12 shouldn't use AI chatbots.","Companies should always tell customers when they're talking to a bot.","AI will create more jobs than it destroys.","Recommendation apps make our taste in music and movies more boring."]},{"type":"pitch","brief":"Your team is a small startup in Santiago. Design an AI app that solves a real everyday problem. You have two minutes to pitch it to a panel of investors (the rest of the class): explain what it does, who it's for, and how you'll protect users' data. Choose one idea below or invent your own.","ideas":["An AI tutor that helps teenagers with math homework without just giving them the answers","A voice assistant that helps older people remember their medicines and doctor's appointments","An app that plans a week of cheap, healthy meals from what's already in your fridge","A chatbot that explains rental contracts in simple language before people sign them","An AI travel planner for Chile that avoids crowds and recommends small local businesses"],"questions":["How is your app different from just asking a free chatbot?","What happens if the AI gives a user wrong information?","How will you protect users' personal data?","Who will pay for it, and how much?","What could go wrong, and what's your plan B?"]}],"ex":{"gap":{"items":[{"s":"Don't trust that quote. The chatbot ___: nobody ever said it! (= invented it; it isn't true)","a":"made it up"},{"s":"I asked an AI for business ideas, and it ___ twenty suggestions in seconds. (= produced)","a":"came up with"},{"s":"Writing good prompts was hard at first, but now I'm starting to ___ it. (= learn how to do it well)","a":"get the hang of"},{"s":"Online reviews aren't always honest, so I take them ___. (= I don't believe them completely)","a":"with a grain of salt"},{"s":"Will AI tutors really help kids learn? The jury is ___. (= nobody has decided yet)","a":"still out"},{"s":"Experts say that some office jobs are ___ automation. (= in danger of)","a":"at risk of"}]},"match":{"pairs":[["take over","take control or replace"],["a double-edged sword","something with both good and bad effects"],["weigh the pros and cons","think about the advantages and disadvantages"],["a steep learning curve","something that is hard to learn at first"],["rely on","depend on or trust"],["on the plus side","used to introduce a positive point"]]},"fix":{"items":[{"s":"I'm agree that AI can be very useful.","wrong":"I'm agree","fix":"I agree"},{"s":"Whether it's good or bad depends of how you use it.","wrong":"depends of","fix":"depends on"},{"s":"The chatbot gave me a wrong information.","wrong":"a wrong information","fix":"wrong information"},{"s":"A lot of people is worried about losing their jobs.","wrong":"people is","fix":"people are"}]}},"rec":{"prompt":"How do you use AI in your daily life, or why don't you use it? Mention at least one advantage and one disadvantage.","model":"I use AI a few times a week, mostly at work. I ask it to summarize long documents or help me write emails in English. On the plus side, it saves me a lot of time, and my emails sound more natural. But for me, it's a double-edged sword. Sometimes it gives answers that sound perfect but are wrong, so I take everything with a grain of salt and double-check important facts. I also try not to rely on it too much, because I want to keep improving my own English. So, all things considered, I think AI is a great assistant, but a terrible boss.","use":["rely on","a double-edged sword","take something with a grain of salt","on the plus side"]},"tips":[{"who":"teacher","t":"Before the speed debate, assign sides randomly and remind students that they may have to argue against their real opinion. That's the point: it builds flexible thinking and keeps the discussion balanced."},{"who":"student","t":"When you give an opinion about AI, add one 'That said, …'. Showing both sides makes you sound more thoughtful, and it's more convincing."},{"who":"student","t":"If you practice English with an AI chatbot, ask it to correct your mistakes and explain why. But take its explanations with a grain of salt and check anything strange with your teacher."}],"photo":{"src":"https://images.pexels.com/photos/16094057/pexels-photo-16094057.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/man-using-chatgpt-ai-system-16094057/"}},{"id":"c1-tech","lv":"C1","tp":"tech","title":"AI, Ethics & the Future of Work","goals":["debate the ethical implications of AI at work using precise, sophisticated vocabulary","speculate about the future of work with confidence and appropriate caution","build a persuasive argument by conceding points and counterarguing"],"warm":["Which parts of your job, or your future job, could AI realistically do better than you? Which parts couldn't it do?","If an AI system makes a harmful decision, who should be responsible?","Would you accept being interviewed or evaluated by an algorithm? Under what conditions?","As jobs change, who should help workers learn new skills: companies, schools, or workers themselves?"],"model":{"kind":"text","title":"The future of work: neither utopia nor apocalypse","intro":"An opinion column from an online business magazine.","paras":["Every few months, a new report announces that we're [[on the brink of]] a revolution that will either free us from boring work or leave millions unemployed. The reality is likely to be less dramatic and more complicated. Technology has always [[done away with]] some tasks while creating others: ATMs didn't make bank tellers disappear overnight, and spreadsheets didn't make accountants unnecessary.","What's different this time is speed and scope. AI can now draft contracts, screen job applicants, and write code, so it [[poses a threat to]] white-collar jobs that once seemed safe. Some companies are already [[phasing out]] basic customer service roles in favor of chatbots. Yet automation [[cuts both ways]]: the same tools can make workers more productive and free them from the most tedious parts of their jobs.","The harder questions are ethical. When an algorithm rejects a loan or a job application, who should [[be held accountable]]: the company, the developer, or no one? [[Algorithmic bias]] is not a theoretical problem; systems trained on past decisions can reproduce past discrimination. [[In the wake of]] several widely reported cases, some employers now pay for independent audits of their hiring software. And once companies start monitoring every keystroke in the name of productivity, we're on [[a slippery slope]] toward workplaces where efficiency comes [[at the expense of]] trust.","None of this is an argument against innovation. It is an argument for asking uncomfortable questions now, even if they [[open a can of worms]]. Ultimately, the debate [[boils down to]] a simple choice: will we design AI around people, or expect people to adapt to AI?"],"questions":[{"q":"What is the writer's main view about AI and jobs?","opts":["AI will cause mass unemployment very soon.","The effects will be complicated, with both losses and gains.","AI will mainly affect factory jobs."],"a":1},{"q":"According to the article, why can hiring algorithms be unfair?","opts":["They can learn from past decisions that were discriminatory.","They can't read applications written in other languages.","They are too slow to process thousands of applications."],"a":0},{"q":"What does the writer say about monitoring every keystroke?","opts":["It's the best way to measure productivity.","It's already illegal in most countries.","It could lead to workplaces with less trust."],"a":2}]},"lang":[{"e":"phase out","t":"PV","d":"to stop using something gradually, in stages","x":"The bank is phasing out paper statements over the next two years.","s":"phase OUT"},{"e":"do away with","t":"PV","d":"to get rid of something completely","x":"Automation could do away with many repetitive tasks, but not with the need for human judgment.","s":"do aWAY with"},{"e":"boil down to","t":"PV","d":"to have something as the main or most basic point","x":"In the end, the whole debate boils down to one question: who benefits?","s":"boil DOWN to"},{"e":"a slippery slope","t":"ID","d":"a first step that is likely to lead to worse and worse things","x":"Tracking employees' keystrokes is a slippery slope.","s":"a SLIPpery SLOPE"},{"e":"open a can of worms","t":"ID","d":"to start dealing with something that creates many new, complicated problems","x":"Asking who owns AI-generated music really opens a can of worms.","s":"OPEN a CAN of WORMS"},{"e":"cut both ways","t":"ID","d":"to have both advantages and disadvantages","x":"Working from home cuts both ways: more freedom, but fewer boundaries.","s":"CUT BOTH WAYS"},{"e":"pose a threat to","t":"COL","d":"to be a possible danger to something or someone","x":"Deepfakes pose a serious threat to trust in online video.","s":"POSE a THREAT to"},{"e":"algorithmic bias","t":"COL","d":"unfair results produced by an automated system, often because of the data it learned from","x":"Algorithmic bias can lead to unfair decisions about loans or jobs.","s":"algoRITHmic BIas"},{"e":"be held accountable (for)","t":"COL","d":"to be made responsible for something and its consequences","x":"If an AI system causes harm, someone must be held accountable.","s":"be HELD acCOUNTable"},{"e":"at the expense of","t":"PREP","d":"causing loss or harm to something else","x":"Efficiency shouldn't come at the expense of fairness.","s":"at the exPENSE of"},{"e":"in the wake of","t":"PREP","d":"after, and as a result of, an important event","x":"In the wake of the data leak, the company rewrote its privacy policy.","s":"in the WAKE of"},{"e":"on the brink of","t":"PREP","d":"very close to something important or dramatic happening","x":"Some experts believe we're on the brink of a new industrial revolution.","s":"on the BRINK of"}],"func":{"title":"Conceding and counterarguing","when":"Use these to build a persuasive argument: admit what's true in the other side's view, then show why your position is stronger.","phrases":[{"p":"Admittedly, …","use":"conceding a point"},{"p":"Granted, …, but…","use":"accepting a point before challenging it"},{"p":"While it's true that…, it doesn't necessarily follow that…","use":"conceding, then questioning the logic"},{"p":"That argument assumes that…","use":"challenging a hidden assumption"},{"p":"The flip side is that…","use":"pointing out the opposite effect"},{"p":"It's not a question of whether…, but of how…","use":"reframing the debate"},{"p":"There's a strong case for…","use":"persuading"},{"p":"If we take that to its logical conclusion, …","use":"showing where an idea could lead"},{"p":"I'd go so far as to say that…","use":"making a strong claim"},{"p":"Ultimately, it boils down to…","use":"summarizing your position"}],"task":"In pairs, debate this motion: 'Job applicants should always be told when AI is used to assess them.' Each person speaks for 90 seconds. Before you counterargue, you must concede at least one point with 'Granted…' or 'Admittedly…'. Then switch sides and repeat with new arguments."},"pron":{"focus":"Contrastive stress","explain":"To highlight a contrast, we give extra stress to the words being compared, often with a fall-rise on the first idea and a fall on the second. Everything else stays light and quick. This makes your argument easier to follow and more persuasive.","tip":"Before you speak, identify the two ideas you're contrasting and underline them. Make only those words louder, longer, and higher; don't stress every word.","lines":[{"t":"It's not a question of whether, but of how.","m":"It's NOT a question of WHETHer↘↗, | but of HOW↘."},{"t":"AI won't replace workers; it'll replace tasks.","m":"AI won't replace WORKers↘↗; | it'll replace TASKS↘."},{"t":"The question isn't who built it, but who's accountable.","m":"The QUEStion isn't who BUILT it↘↗, | but who's acCOUNTable↘."},{"t":"Granted, it saves time, but at what cost?","m":"GRANTed↘↗, | it saves TIME↘↗, | but at WHAT COST↘?"},{"t":"It might create jobs, but not the same jobs.","m":"It MIGHT create JOBS↘↗, | but not the SAME jobs↘."}]},"acts":[{"type":"wyr","items":[["Be hired by an algorithm that's fair but can't explain its decisions","Be hired by a human who explains everything but has biases"],["Work four days a week with AI tracking your productivity","Work five days a week with complete privacy"],["Have your job automated and get a year's salary to retrain","Keep your job with a 20% pay cut"],["Be diagnosed by an AI that's right 95% of the time","Be diagnosed by a human doctor who's right 85% of the time"],["Have an AI assistant that knows everything about you and saves you 10 hours a week","Keep your data private and do everything yourself"],["Work for a company that replaces 30% of its staff with AI and doubles everyone else's salary","Work for a company that keeps everyone but freezes salaries for five years"],["Know the exact year your job will be automated","Never know until it happens"]]},{"type":"expert","topic":"Using AI to screen job applicants","expert":"You're a consultant who helps companies use AI in hiring. You believe it can save time and even reduce some human bias, but you know its limits. Prepare three arguments and be ready to admit at least one weakness honestly.","journalists":"You're business journalists preparing an article. You want clear answers, not marketing language. Ask follow-up questions, challenge vague answers, and ask for concrete examples.","questions":["If the system learns from past hiring decisions, how can it avoid repeating past discrimination?","Can a rejected candidate find out why the algorithm said no?","Who is held accountable when the system makes an unfair decision?","Isn't this just a way to cut HR costs at the expense of candidates?","Would you be comfortable if your own children were screened this way?","What should never be decided by an algorithm?"]},{"type":"balloon","sit":"It's 2040. A hot-air balloon carrying six professionals is losing height, and someone has to jump. Each person must convince the group that their job will still need a human in an age of advanced AI. After each round, the group votes one person out.","roles":[{"name":"A nurse","why":"empathy, physical care, and judgment in emergencies"},{"name":"A software developer","why":"someone has to design, check, and take responsibility for the AI"},{"name":"A primary school teacher","why":"children learn through relationships, not just information"},{"name":"A lawyer","why":"complex cases need ethical judgment and accountability"},{"name":"A plumber","why":"every building is different, and robots still struggle with messy physical work"},{"name":"A graphic designer","why":"creativity, taste, and understanding what a client really wants"}]}],"ex":{"gap":{"items":[{"s":"Our company is going to ___ the old software over the next two years, one department at a time. (= stop using gradually)","a":"phase out"},{"s":"Reading employees' private messages is ___: where would it stop? (= a first step toward worse things)","a":"a slippery slope"},{"s":"Asking who owns AI-generated songs could ___ for the music industry. (= create many new, complicated problems)","a":"open a can of worms"},{"s":"Automation ___: it creates opportunities, but also new risks. (= has both advantages and disadvantages)","a":"cuts both ways"},{"s":"If a self-driving car causes an accident, who should ___? (= be made responsible)","a":"be held accountable"},{"s":"Speed should never come ___ safety. (= causing harm to)","a":"at the expense of"}]},"match":{"pairs":[["do away with","get rid of something completely"],["boil down to","have something as the main point"],["pose a threat to","be a danger to"],["algorithmic bias","unfair results from an automated system"],["in the wake of","after, and because of, an important event"],["on the brink of","very close to something important happening"]]},"fix":{"items":[{"s":"The number of jobs that will disappear are hard to predict.","wrong":"are hard","fix":"is hard"},{"s":"AI has made possible to automate many routine tasks.","wrong":"made possible to","fix":"made it possible to"},{"s":"Despite of the risks, many companies are adopting AI.","wrong":"Despite of","fix":"Despite"},{"s":"Workers who don't update their skills risk to lose their jobs.","wrong":"risk to lose","fix":"risk losing"}]}},"rec":{"prompt":"Will AI make work better or worse in your field over the next ten years? Give a balanced answer and a clear conclusion.","model":"I work in marketing, and I think AI will cut both ways. On the one hand, it already writes first drafts, analyzes data, and saves us hours every week, so we can focus on strategy and creativity. On the other hand, it clearly poses a threat to junior roles, because many of the tasks that used to train beginners are now automated. There's also an ethical side: if an AI-generated campaign spreads false information, someone has to be held accountable, and right now the rules aren't very clear. For me, it boils down to how companies use it. If they use AI to support people, work will get better. If they use it only to cut costs, it'll get worse.","use":["cut both ways","pose a threat to","be held accountable","boil down to"]},"tips":[{"who":"teacher","t":"Run the balloon debate in rounds. After each vote, the person who leaves becomes a judge and asks the next speaker a tough question. Push students to speculate precisely: could, might well, is likely to, there's every chance that."},{"who":"student","t":"C1 speakers rarely say simply 'AI is good' or 'AI is bad.' Practice qualifying your claims: 'in some sectors', 'at least in the short term', 'for routine tasks'. It makes you sound more credible."},{"who":"student","t":"As you read the news in English, keep a list of AI-ethics collocations: algorithmic bias, data privacy, job displacement, human oversight. Try to use two of them in your next class."}],"photo":{"src":"https://images.pexels.com/photos/8386434/pexels-photo-8386434.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/person-reaching-out-to-a-robot-8386434/"}},{"id":"b1-environment","lv":"B1","tp":"environment","title":"Green Habits","goals":["talk about your everyday green habits using common phrasal verbs","describe simple ways to waste less at home and when you go out","make and respond to friendly suggestions"],"warm":["What do you usually do with plastic bottles and cans at home?","How do you get to work or class most days?","Is it easy to recycle where you live? Why or why not?","What is one thing you do to save water or electricity?"],"model":{"kind":"dialogue","title":"A Greener Apartment","intro":"Camila and her roommate Diego are talking in the kitchen of their apartment in Santiago.","lines":[{"sp":"Camila","t":"Diego, did you [[throw away]] the glass jars again? I was going to use them for rice and beans."},{"sp":"Diego","t":"Oops, sorry! I didn't know you wanted them."},{"sp":"Camila","t":"It's OK. It's just that I'm trying to [[go green]] this year. Nothing big, just small things."},{"sp":"Diego","t":"Like what?"},{"sp":"Camila","t":"Well, I want to [[cut down on]] [[single-use plastic]]. I bought cloth bags for the supermarket, and I take my own bottle to work."},{"sp":"Diego","t":"That's cool. But does it really [[make a difference]]?"},{"sp":"Camila","t":"I think so. [[Every little bit helps]]. And it saves money, too."},{"sp":"Diego","t":"OK, so what can I do? I'm not very good at this stuff."},{"sp":"Camila","t":"Easy. [[Turn off]] your computer at night. It's on all the time! It's a simple way to [[save energy]]."},{"sp":"Diego","t":"Fair enough. Anything else?"},{"sp":"Camila","t":"Why don't you walk to the gym [[instead of]] driving? It's only ten minutes [[on foot]]."},{"sp":"Diego","t":"Hmm… so I get some exercise and spend less on gas? I guess that [[kills two birds with one stone]]."},{"sp":"Camila","t":"Exactly! See? You're better at this than you think."}],"questions":[{"q":"Why is Camila a little upset at the beginning?","opts":["Diego threw away some jars she wanted to use.","Diego forgot to buy rice and beans.","Diego left the lights on all night."],"a":0},{"q":"What does Camila suggest Diego should do with his computer?","opts":["Sell it and buy a new one.","Use it less at work.","Turn it off at night."],"a":2},{"q":"Why does Diego like the idea of walking to the gym?","opts":["It's faster than driving.","He gets exercise and spends less on gas.","Camila will walk with him."],"a":1}]},"lang":[{"e":"throw away","t":"PV","d":"to put something in the trash because you don't want it","x":"Don't throw away those boxes. We can use them when we move.","s":"throw aWAY"},{"e":"turn off","t":"PV","d":"to stop a light, a machine, or water by using a switch or faucet","x":"Please turn off the lights when you leave the room.","s":"turn OFF"},{"e":"cut down on","t":"PV","d":"to use or do less of something","x":"We're trying to cut down on plastic bags.","s":"cut DOWN on"},{"e":"go green","t":"ID","d":"to start living in a way that is better for the environment","x":"Our office decided to go green, so now we print much less.","s":"go GREEN"},{"e":"every little bit helps","t":"ID","d":"small actions are useful, too","x":"I know one cloth bag won't save the planet, but every little bit helps.","s":"EVery LITtle bit HELPS","uk":"UK: every little helps"},{"e":"kill two birds with one stone","t":"ID","d":"to do two useful things with one action","x":"I bike to work, so I kill two birds with one stone: I exercise and save money.","s":"KILL two BIRDS with one STONE"},{"e":"make a difference","t":"COL","d":"to have a good effect on a situation","x":"Small changes at home can make a big difference.","s":"make a DIFference"},{"e":"save energy","t":"COL","d":"to use less electricity, gas, etc.","x":"LED light bulbs help you save energy.","s":"save ENergy"},{"e":"single-use plastic","t":"COL","d":"plastic things you use once and then throw away, like straws or cups","x":"Many cafés in Santiago don't give out single-use plastic straws anymore.","s":"SINgle-use PLAStic"},{"e":"instead of","t":"PREP","d":"in place of something or someone (+ noun or -ing)","x":"I take the subway instead of driving.","s":"inSTEAD of"},{"e":"on foot","t":"PREP","d":"walking","x":"The market is close, so I always go on foot.","s":"on FOOT"},{"e":"be bad for","t":"PREP","d":"to harm or damage something","x":"Too much packaging is bad for the environment.","s":"be BAD for"}],"func":{"title":"Making and responding to suggestions","when":"Use these when you give friendly advice to friends, family, roommates, or coworkers.","phrases":[{"p":"Why don't you…?","use":"
