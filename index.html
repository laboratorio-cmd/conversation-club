 story","Say when a post is sponsored","Stop sharing posts from friends"],"a":2}]},"lang":[{"e":"fall for","t":"PV","d":"to be tricked into believing something that isn't true","x":"My uncle fell for a fake message about free airline tickets.","s":"FALL for"},{"e":"make up","t":"PV","d":"to invent a story, often to deceive people","x":"The reporter was fired for making up quotes.","s":"make UP"},{"e":"back up","t":"PV","d":"to support a claim with evidence","x":"That's an interesting claim. Can you back it up?","s":"back UP"},{"e":"turn out","t":"PV","d":"to be found to be something in the end, often as a surprise","x":"The “miracle” face cream turned out to be ordinary moisturizer.","s":"turn OUT"},{"e":"too good to be true","t":"ID","d":"so good that it is probably false or a trick","x":"A free phone for answering three questions? It sounds too good to be true.","s":"too GOOD to be TRUE"},{"e":"jump on the bandwagon","t":"ID","d":"to join something just because it is popular","x":"Every brand jumped on the bandwagon and started making dance videos.","s":"JUMP on the BANDwagon"},{"e":"take something at face value","t":"ID","d":"to accept something as it appears, without questioning it","x":"Don't take online reviews at face value. Some of them are fake.","s":"take something at FACE VALue"},{"e":"spread misinformation","t":"COL","d":"to share false information with many people","x":"Fake accounts are often used to spread misinformation.","s":"SPREAD misinforMAtion"},{"e":"a sponsored post","t":"COL","d":"social media content that a company pays for","x":"She always makes it clear when something is a sponsored post.","s":"a SPONsored POST"},{"e":"a huge following","t":"COL","d":"a very large number of fans or followers","x":"He has a huge following on YouTube, mostly teenagers.","s":"a HUGE FOLlowing"},{"e":"in good faith","t":"PREP","d":"honestly, believing that something is true or right","x":"Most people share fake news in good faith. They really think it's true.","s":"in good FAITH"},{"e":"on the lookout for","t":"PREP","d":"watching carefully in order to notice something","x":"Always be on the lookout for strange links in messages.","s":"on the LOOKout for"}],"func":{"title":"Expressing doubt and skepticism politely","when":"Use these when someone tells you something you're not sure is true, and you don't want to sound rude.","phrases":[{"p":"I'm not so sure about that.","use":"mild doubt"},{"p":"Really? Where did you read that?","use":"asking for the source"},{"p":"That sounds a bit fishy to me.","use":"informal suspicion"},{"p":"Hmm, I find that hard to believe.","use":"polite disbelief"},{"p":"I'd want to see some evidence first.","use":"asking for proof"},{"p":"Are you sure it's not just an ad?","use":"suggesting another explanation"},{"p":"It might be true, but I'd double-check it.","use":"partial acceptance"},{"p":"Who's behind that account?","use":"questioning the source"},{"p":"I'm a little skeptical, to be honest.","use":"stating your doubt openly"},{"p":"OK, that makes sense. I stand corrected.","use":"accepting that you were wrong"}],"task":"Student A tells B three surprising “facts” (some true, some invented). B responds to each one with a different doubt phrase and asks for evidence, and A must try to back up every claim. B then decides: true or fake? Swap roles."},"pron":{"focus":"Intonation for surprise and doubt","explain":"When we're surprised or doubtful, our voice moves more. A high rise (↗) on “Really?” shows surprise. A fall-rise (↘↗) shows that we don't completely agree, and a clear fall (↘) at the end sounds confident.","tip":"Exaggerate the voice movement when you practice. In a real conversation, it will sound natural, not too much.","lines":[{"t":"Really? Where did you read that?","m":"↗REALly? | WHERE did you READ that↘?"},{"t":"It sounds too good to be true.","m":"It SOUNDS too GOOD to be ↘TRUE."},{"t":"Can you back that up?","m":"Can you BACK that ↗UP?"},{"t":"I'm not so sure about that.","m":"I'm ↘NOT so ↘↗SURE about that."},{"t":"It turned out to be a scam.","m":"It TURNED‿OUT to be a ↘SCAM."}]},"acts":[{"type":"agree","items":["Influencers should always say when they are paid to promote something.","Most people can easily tell the difference between real and fake news.","Sharing fake news by mistake is not a big deal.","It's the reader's job, not the app's, to check if a story is true.","Being an influencer is a real job.","Schools should teach children how to spot fake news.","Influencers are a bad influence on teenagers.","I trust a review from a stranger online more than an ad."]},{"type":"ranking","task":"You see a shocking post online. Rank these warning signs from the MOST to the LEAST suspicious, and explain your top three.","items":["The headline is in CAPITAL LETTERS with lots of exclamation marks","No other news site is reporting the story","The web address looks strange or has a spelling mistake","The photo looks edited or very old","It asks you to share it “before it gets deleted”","The account was created last week","It makes you feel very angry or scared"]},{"type":"negotiation","sit":"A skincare brand wants a popular lifestyle influencer to promote its new sunscreen on Instagram for one month. Agree on a deal in eight minutes.","a":{"role":"Marketing manager at the skincare brand","goal":"Get 4 posts and 8 stories in one month, with the influencer saying she uses the sunscreen every day.","limits":"Your maximum budget is $3,000. You want to approve every post before it goes live. You can offer free products for her followers as a giveaway."},"b":{"role":"Influencer with 80,000 followers","goal":"Earn at least $2,500 and keep your followers' trust.","limits":"You'll only say you use it every day if you try it for two weeks first. Every post must be labeled as a sponsored post. The brand can check facts, but it can't change your words."}}],"ex":{"gap":{"items":[{"s":"My grandmother ___ a fake message saying she had won a car. She almost sent them her bank details!","a":"fell for"},{"s":"The influencer's “secret family recipe” ___ to be copied from an old cookbook.","a":"turned out"},{"s":"Nobody could find the source. The journalist had ___ the whole story.","a":"made up"},{"s":"A brand-new phone for $20? That's ___.","a":"too good to be true"},{"s":"That's a big claim. Can you ___ with any evidence?","a":"back it up/back that up"},{"s":"Don't believe every review you read. Never take them ___.","a":"at face value"}]},"match":{"pairs":[["jump on the bandwagon","join something because it's popular"],["in good faith","honestly, believing it is true"],["a sponsored post","content that a company pays for"],["spread misinformation","share false information widely"],["on the lookout for","watching carefully for"],["a huge following","a very large number of fans online"]]},"fix":{"items":[{"s":"Many people fell in that fake giveaway.","wrong":"fell in","fix":"fell for"},{"s":"She gave me a lot of informations about the brand.","wrong":"informations","fix":"information"},{"s":"That's a big claim. Can you back up it?","wrong":"back up it","fix":"back it up"},{"s":"He is an influencer very famous in Chile.","wrong":"an influencer very famous","fix":"a very famous influencer"}]}},"rec":{"prompt":"Tell us about a time you (or someone you know) fell for something fake online, or explain how you check if a story is true.","model":"A couple of years ago, my dad fell for a message on WhatsApp. It said a supermarket was giving away gift cards worth 100,000 pesos to celebrate its anniversary, and he forwarded it to the whole family group! I told him it sounded too good to be true, but he said, “Why would anyone make that up?” Well, it turned out to be a scam to steal people's data. Luckily, he didn't enter his bank details. Since then, we've had a family rule: if you can't back it up with a link from a reliable news site or the official page, you don't share it. Now my dad is the first one to say, “That looks fishy!”","use":["fall for","too good to be true","turn out","back up"]},"tips":[{"who":"teacher","t":"Start the class with two real headlines and one invented one, and ask students to vote. It quickly shows how easy it is to fall for fake news. Choose non-political stories so the discussion stays on media skills."},{"who":"student","t":"Phrasal verbs like “make up” and “back up” go around pronouns: “make it up”, not “make up it”. Practice saying them aloud with “it” and “that”."},{"who":"student","t":"Follow one English-language fact-checking account or news podcast and note the expressions people use to show doubt."}],"photo":{"src":"https://images.pexels.com/photos/7480532/pexels-photo-7480532.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/a-ring-light-with-smartphone-7480532/"}},{"id":"c1-media","lv":"C1","tp":"media","title":"Media, Truth & Power","goals":["discuss the influence of media owners, algorithms and advertisers using sophisticated, nuanced language","hedge and qualify your opinions so that you sound balanced and credible","question and defend editorial decisions in a structured, high-pressure discussion"],"warm":["What makes a news source trustworthy for you?","Is it possible for journalism to be completely objective?","Who has more influence today: journalists or content creators?","Would you pay for news? Why or why not?"],"model":{"kind":"dialogue","title":"Who Decides What's True?","intro":"On a weekly podcast about the media, host Laura talks to investigative journalist Diego Fuentes and media researcher Dr. Hannah Cole.","lines":[{"sp":"Laura","t":"Diego, let's start with the big question. Can the press still [[hold the powerful accountable]]?"},{"sp":"Diego","t":"It can, but it's harder than it used to be. Investigations are expensive, and when budgets shrink, they're usually the first thing to go."},{"sp":"Hannah","t":"And that's where ownership comes in. If a media group has [[a vested interest]] in, say, real estate, you're less likely to see it digging into the property sector."},{"sp":"Laura","t":"So they don't lie, exactly; they just [[gloss over]] certain stories?"},{"sp":"Hannah","t":"Precisely. It's less about what's published and more about what's quietly left out. You often have to [[read between the lines]]."},{"sp":"Diego","t":"To be fair, plenty of owners do respect [[editorial independence]]. I've worked for some who never once interfered."},{"sp":"Laura","t":"What about algorithms? They decide what most of us see now."},{"sp":"Hannah","t":"They're [[a double-edged sword]]. They connect people with stories they'd never have found, but they also reward content that [[stirs up]] outrage, often [[at the expense of]] accuracy."},{"sp":"Diego","t":"And they can trap us in [[an echo chamber]], where everything confirms what we already believe."},{"sp":"Laura","t":"Is there any good news, then?"},{"sp":"Diego","t":"Actually, yes. In some countries, more readers are paying for quality journalism than ten years ago, and nonprofit newsrooms are filling some of the gaps."},{"sp":"Hannah","t":"I'd add that people are becoming more aware that what they see online is curated, not neutral. That's a healthy kind of skepticism."},{"sp":"Laura","t":"Let's hope so. Diego, Hannah, thanks for joining us."}],"questions":[{"q":"According to Hannah, how does media ownership most often affect coverage?","opts":["Owners force journalists to publish false stories","Some stories are left out or only mentioned briefly","Owners rarely have any effect on coverage"],"a":1},{"q":"What does Diego say in fairness to media owners?","opts":["Many of them respect editorial independence","They pay for most investigations","They avoid owning other businesses"],"a":0},{"q":"What positive trend does Hannah mention at the end?","opts":["Algorithms are becoming more neutral","Investigations are getting cheaper","People understand better that what they see online is selected"],"a":2}]},"lang":[{"e":"gloss over","t":"PV","d":"to mention something only briefly to avoid attention or criticism","x":"The annual report glossed over the company's environmental record.","s":"GLOSS Over"},{"e":"play down","t":"PV","d":"to make something seem less important or serious than it is","x":"The airline tried to play down the safety concerns.","s":"play DOWN"},{"e":"stir up","t":"PV","d":"to deliberately cause strong feelings such as anger or fear","x":"Some headlines are designed to stir up anger rather than inform.","s":"stir UP"},{"e":"an echo chamber","t":"ID","d":"a situation where you only hear opinions that match your own","x":"If you only follow people who agree with you, you end up in an echo chamber.","s":"an ECHo chamber"},{"e":"a double-edged sword","t":"ID","d":"something that has both clear advantages and clear disadvantages","x":"Social media is a double-edged sword for journalists: it gives them reach but exposes them to abuse.","s":"a DOUBle-edged SWORD"},{"e":"read between the lines","t":"ID","d":"to understand a hidden meaning that isn't stated directly","x":"You have to read between the lines to see what the press release really means.","s":"READ between the LINES"},{"e":"hold someone accountable","t":"COL","d":"to make someone accept responsibility for their actions","x":"Investigative journalists help hold companies accountable when they break the rules.","s":"HOLD someone acCOUNTable"},{"e":"a vested interest","t":"COL","d":"a personal reason, often financial, for wanting a particular outcome","x":"Be careful: the people who funded that study have a vested interest in the result.","s":"a VESTed INterest"},{"e":"editorial independence","t":"COL","d":"the freedom of journalists to decide what to publish without pressure from owners or advertisers","x":"The new owners promised to respect the paper's editorial independence.","s":"ediTOrial indePENdence"},{"e":"at the expense of","t":"PREP","d":"causing harm or loss to something else","x":"Some outlets chase clicks at the expense of accuracy.","s":"at the exPENSE of"},{"e":"in the public interest","t":"PREP","d":"useful or important for society as a whole","x":"The court decided that publishing the documents was in the public interest.","s":"in the PUBlic INterest"},{"e":"behind closed doors","t":"PREP","d":"in private, without the public knowing","x":"The merger was negotiated behind closed doors.","s":"beHIND CLOSED DOORS"}],"func":{"title":"Hedging and qualifying your opinions","when":"Use these in debates on sensitive topics so that you sound careful, balanced and credible rather than absolute.","phrases":[{"p":"To some extent, …","use":"partial agreement"},{"p":"It's not quite as simple as that.","use":"challenging an oversimplification"},{"p":"There's a case to be made that…","use":"introducing a view without fully committing to it"},{"p":"That may well be true, but…","use":"conceding before disagreeing"},{"p":"Broadly speaking, …","use":"generalizing carefully"},{"p":"I'd be wary of assuming that…","use":"warning against a hasty conclusion"},{"p":"The evidence seems to suggest that…","use":"making a tentative claim based on evidence"},{"p":"To be fair, …","use":"acknowledging the other side"},{"p":"Arguably, …","use":"presenting a debatable claim"},{"p":"I'm inclined to think that…","use":"giving a soft, considered opinion"}],"task":"In pairs, Student A reads out a strong, absolute statement (for example, “All news is biased” or “Algorithms are destroying journalism”). Student B restates it using at least three hedging phrases so that it sounds balanced. Swap roles with a new statement, then decide together which version would be more persuasive in a meeting and why."},"pron":{"focus":"Contrastive and emphatic stress","explain":"To highlight a contrast, we put strong stress on the words being compared, which tells the listener exactly where the difference lies. We can also stress an auxiliary such as “do” to insist that something is true, especially after someone has suggested the opposite.","tip":"Find the words being contrasted first, then make them louder, longer and higher. Keep everything else quick and light.","lines":[{"t":"It's less about what's published and more about what's left out.","m":"It's LESS about what's PUBlished | and MORE about what's LEFT‿OUT."},{"t":"They don't lie, exactly; they just gloss over certain stories.","m":"They don't LIE, exactly; | they just GLOSS‿Over certain STOries."},{"t":"Plenty of owners do respect editorial independence.","m":"PLENty of OWNers DO reSPECT ediTOrial indePENdence."},{"t":"They reward outrage at the expense of accuracy.","m":"They reWARD OUTrage | at the exPENSE of ACCuracy."},{"t":"I didn't say they lied; I said they played it down.","m":"I didn't say they LIED; | I said they played‿it DOWN."}]},"acts":[{"type":"ranking","task":"Rank these from the BIGGEST to the SMALLEST threat to trustworthy news over the next ten years. Use hedging language to justify your order.","items":["AI-generated fake videos and audio","Algorithms that reward outrage","Media owners with vested interests","Local newspapers closing down","Audiences who only read headlines","Online harassment of journalists","Advertisers putting pressure on news outlets"]},{"type":"expert","topic":"A national newspaper has published leaked internal documents from Lumo, a fictional tech company. They suggest Lumo knew its app was keeping teenagers awake late at night, but kept quiet about it.","expert":"You are the newspaper's editor. Defend your decision to publish: explain why it was in the public interest, how you checked that the documents were genuine, and why you won't name the employee who leaked them. Hedge where the evidence is uncertain, but don't back down.","journalists":"You are reporters from other outlets at a press conference. Some of you think the story is important; others suspect the paper has a vested interest, because its owner also invests in a rival app. Ask tough follow-up questions and don't accept vague answers.","questions":["How can you be sure the documents are genuine?","Your owner has money in a rival app. Isn't that a conflict of interest?","Did you give Lumo a chance to respond before you published?","Why protect your source if the leak may have broken the law?","Weren't you stirring up panic among parents to sell subscriptions?","Would you have published the same story about your owner's company?"]},{"type":"devil","motions":["Journalists should never share their personal opinions in public.","Algorithms, not editors, now decide what counts as news.","Anonymous sources do more harm than good.","News should be free for everyone, even if quality suffers.","The private lives of celebrities are never in the public interest.","Fact-checking makes little difference: people believe what they want to believe."]}],"ex":{"gap":{"items":[{"s":"The CEO ___ the data breach, insisting it was just “a minor technical issue.” (= made it seem less serious)","a":"played down"},{"s":"Headlines like “NOBODY IS SAFE ANYMORE” are designed to ___ fear rather than inform.","a":"stir up"},{"s":"Some news sites chase clicks ___ accuracy.","a":"at the expense of"},{"s":"If you only follow people who share your views, you can end up in ___.","a":"an echo chamber"},{"s":"Be skeptical of that study: the company that paid for it has ___ in the results.","a":"a vested interest"},{"s":"Publishing the airlines' safety records was clearly ___, even though the airlines objected.","a":"in the public interest"}]},"match":{"pairs":[["You have to read between the lines","to understand what the statement really means."],["Social media is a double-edged sword:","it gives journalists reach but exposes them to abuse."],["The deal was negotiated behind closed doors,","so the public never heard the details."],["A free press exists partly to hold","the powerful accountable."],["The owners promised to respect the paper's editorial independence","and never interfere with what it publishes."],["The spokesperson glossed over","the most uncomfortable questions."]]},"fix":{"items":[{"s":"The newspaper should be hold accountable for the error.","wrong":"be hold","fix":"be held"},{"s":"It's a journalist's job to inform about what is happening in the world.","wrong":"inform about","fix":"report on"},{"s":"The owner clearly has a vested interest on the result.","wrong":"interest on","fix":"interest in"},{"s":"How a story is covered often depends of who owns the outlet.","wrong":"depends of","fix":"depends on"}]}},"rec":{"prompt":"Is it still possible to find truly independent news today? Give a balanced answer and say where you personally get information you trust.","model":"I'd say it's possible, but it takes effort. Broadly speaking, every outlet has someone paying the bills, whether that's advertisers, subscribers or an owner with a vested interest in certain industries. That doesn't automatically mean the reporting is biased, though; many newsrooms protect their editorial independence quite fiercely. Personally, I try not to rely on a single source. I read one local paper, one international outlet and a couple of specialist newsletters, and I deliberately follow some people I disagree with, so I don't end up in an echo chamber. What worries me most is speed: so much content is produced at the expense of accuracy that I've learned to wait a day before forming an opinion on a breaking story.","use":["a vested interest","editorial independence","an echo chamber","at the expense of"]},"tips":[{"who":"teacher","t":"Before the devil's advocate activity, agree on a simple rule: no current politicians or parties. It keeps the debate on how the media works and makes it safe for everyone to argue either side."},{"who":"student","t":"Hedging is a key C1 skill. Record yourself giving a strong opinion, then say it again with “arguably”, “to some extent” or “the evidence seems to suggest”. Notice how much more credible you sound."},{"who":"student","t":"Read the same story in two different outlets and note what each one plays down or glosses over. It's excellent practice for reading between the lines, and for new vocabulary."}],"photo":{"src":"https://images.pexels.com/photos/33317197/pexels-photo-33317197.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/female-spokesperson-giving-press-interview-outdoors-33317197/"}},{"id":"b1-ethics","lv":"B1","tp":"ethics","title":"What Would You Do?","goals":["describe everyday moral situations using common phrasal verbs and expressions","talk about imaginary situations using “If I…, I'd…”","give advice and make suggestions about small everyday dilemmas"],"warm":["Have you ever found money on the street? What did you do?","Is it ever OK to tell a white lie?","What would you do if a cashier gave you too much change?","Who do you ask for advice when you have a difficult decision to make?"],"model":{"kind":"text","title":"Ask Sam: “I Found a Wallet Full of Cash”","intro":"A reader writes to an online advice column about a difficult choice, and the columnist answers.","paras":["Dear Sam, last week I found a wallet on the sidewalk near my office. Inside, there was an ID card and 200,000 pesos in cash. I wanted to [[give it back]], but my coworker laughed and said, “Just keep the money. Nobody saw you, so you'll [[get away with]] it.” Now the wallet is in my desk drawer, and I feel terrible. What should I do? — Confused in Concepción","Dear Confused, the fact that you're asking shows that you want to [[do the right thing]]. Think about the owner for a minute. Nobody loses a wallet [[on purpose]], so right now they're probably worried and stressed, and maybe they don't have money for the week. The ID card has a name on it, so you can look for the person online, or you can simply [[turn in]] the wallet at the nearest police station.","Before you listen to your coworker, [[think twice]]. Be [[honest with]] yourself: how would you feel if someone kept your money? Return the wallet with everything inside. I promise you'll sleep better tonight. — Sam"],"questions":[{"q":"Where did the writer find the wallet?","opts":["In a taxi","On the sidewalk near the office","In the office kitchen"],"a":1},{"q":"What did the coworker suggest?","opts":["Keeping the money","Calling the police","Posting a photo online"],"a":0},{"q":"What does Sam advise?","opts":["Keeping the cash and returning the ID","Asking the coworker for help","Returning the wallet with everything inside"],"a":2}]},"lang":[{"e":"give back","t":"PV","d":"to return something to the person it belongs to","x":"I found a phone on the bus and gave it back to the owner.","s":"give BACK"},{"e":"turn in","t":"PV","d":"to take something you found to the police or an office","x":"Someone turned in my lost keys at the front desk.","s":"turn IN","uk":"UK: hand in"},{"e":"get away with","t":"PV","d":"to do something wrong and not be punished","x":"He copied his friend's homework and got away with it.","s":"get aWAY with"},{"e":"let someone down","t":"PV","d":"to disappoint someone who trusted you","x":"I promised to help my friend move, and I don't want to let her down.","s":"let someone DOWN"},{"e":"a white lie","t":"ID","d":"a small lie you tell to be kind","x":"I told my aunt I loved her soup. It was a white lie!","s":"a WHITE LIE"},{"e":"do the right thing","t":"ID","d":"to act in an honest or fair way, even when it's difficult","x":"It wasn't easy, but she did the right thing and told her boss.","s":"do the RIGHT THING"},{"e":"think twice","t":"ID","d":"to think very carefully before you do something","x":"I'd think twice before keeping money that isn't mine.","s":"think TWICE"},{"e":"tell the truth","t":"COL","d":"to say what really happened","x":"It's always better to tell the truth, even when it's hard.","s":"tell the TRUTH"},{"e":"keep a promise","t":"COL","d":"to do what you said you would do","x":"My dad always keeps his promises.","s":"keep a PROMise"},{"e":"on purpose","t":"PREP","d":"deliberately, not by accident","x":"I didn't break it on purpose. It just fell!","s":"on PURpose"},{"e":"by mistake","t":"PREP","d":"without wanting to, because of an error","x":"I took my coworker's lunch from the fridge by mistake.","s":"by misTAKE"},{"e":"honest with","t":"PREP","d":"telling someone the truth and not hiding anything","x":"I want you to be honest with me. Do you like the new logo?","s":"HONest with"}],"func":{"title":"Giving advice and making suggestions","when":"Use these when a friend tells you about a problem and asks what they should do.","phrases":[{"p":"If I were you, I'd…","use":"giving strong personal advice"},{"p":"You should… / You shouldn't…","use":"giving direct advice"},{"p":"Why don't you…?","use":"making a friendly suggestion"},{"p":"Have you thought about…?","use":"making a gentle suggestion"},{"p":"It might be a good idea to…","use":"giving softer advice"},{"p":"Maybe you could…","use":"making a soft suggestion"},{"p":"I wouldn't… if I were you.","use":"giving a warning"},{"p":"I think the best thing to do is…","use":"giving your opinion"},{"p":"What would you do if…?","use":"asking for someone's opinion"},{"p":"That's a good idea! / Hmm, I'm not sure about that.","use":"reacting to advice"}],"task":"Student A chooses a situation from the ranking activity (or a real problem) and asks for advice. Student B gives three pieces of advice, each with a different phrase. A chooses the best advice and explains why. Swap roles after two minutes."},"pron":{"focus":"Contractions: I'd, you'd and wouldn't","explain":"In natural speech, we almost always contract “would”: I would → I'd, you would → you'd, would not → wouldn't. The 'd is very short, and sometimes you can hardly hear it, so listen for the main verb after it. In questions, “would you” often sounds like “wouldja”.","tip":"Say “I'd” like the word “eyed”. In “I'd give”, the d almost disappears, so put the stress on the verb.","lines":[{"t":"If I were you, I'd give it back.","m":"If I were YOU, | I'd GIVE‿it BACK."},{"t":"I'd turn it in at the police station.","m":"I'd TURN‿it‿IN at the poLICE STAtion."},{"t":"I wouldn't tell a white lie.","m":"I WOULDn't tell a WHITE LIE."},{"t":"What would you do?","m":"WHAT would‿you DO↘?"},{"t":"You'd never get away with it.","m":"You'd NEVer get‿aWAY with‿it."}]},"acts":[{"type":"ranking","task":"Rank these actions from the WORST to the LEAST bad. Then compare with a partner and explain your top and bottom choices.","items":["Keeping extra change that a cashier gave you by mistake","Telling a friend you love their terrible haircut","Using your neighbor's Wi-Fi without asking","Calling in sick to work when you're not sick","Not telling the waiter they forgot to charge you for dessert","Reading someone's messages when they leave their phone open","Taking pens and paper home from the office"]},{"type":"roleplay","cards":[{"sit":"Two friends are leaving a café. You notice the waiter forgot to charge you for two coffees.","a":"You think you should go back and pay. It's a small family café and you go there every week.","b":"You think it's the café's problem, not yours, and you're in a hurry. Try to convince your friend to leave, but change your mind if A has good arguments."},{"sit":"Your friend has a job interview tomorrow and shows you a new outfit. You think it looks terrible.","a":"You're excited and nervous about the interview. Ask your friend for an honest opinion about your outfit.","b":"You don't want to let your friend down or make them more nervous, but you think the outfit is a bad choice. Find a kind way to be honest."},{"sit":"You borrowed a coworker's laptop charger and broke it by mistake.","a":"You broke the charger. Tell your coworker what happened, say sorry and offer a solution.","b":"You're the coworker. You need the charger for an important presentation this afternoon. React and agree on a solution together."}]},{"type":"fluency","topics":["A time you found something that wasn't yours","A time someone was very honest with you","A promise you kept (or broke) and what happened","A time you did something wrong and told the truth","A difficult decision you made and why","Someone you know who always does the right thing"]}],"ex":{"gap":{"items":[{"s":"I found a phone on the bus. I called the owner and ___ the next day.","a":"gave it back"},{"s":"Please be ___ me. Do you really like my new haircut?","a":"honest with"},{"s":"Sorry, I didn't break your glasses ___. It was an accident!","a":"on purpose"},{"s":"I sent the message to my boss ___. It was meant for my sister!","a":"by mistake"},{"s":"My grandma asked if I liked her new sweater. I said yes, but it was ___.","a":"a white lie"},{"s":"You promised to come to my birthday party. Please don't ___!","a":"let me down"}]},"match":{"pairs":[["do the right thing","act in a fair and honest way"],["think twice","think carefully before doing something"],["turn in","take something you found to the police or an office"],["keep a promise","do what you said you would do"],["tell the truth","say what really happened"],["get away with","do something wrong and not be punished"]]},"fix":{"items":[{"s":"If I would find a wallet, I'd give it back.","wrong":"If I would find","fix":"If I found"},{"s":"I said the truth to my boss.","wrong":"said the truth","fix":"told the truth"},{"s":"Sorry, I deleted your file without wanting.","wrong":"without wanting","fix":"by mistake"},{"s":"If I were you, I will tell her.","wrong":"I will tell","fix":"I'd tell"}]}},"rec":{"prompt":"Your friend finds a phone in a taxi. What should they do? Give your advice and say what you would do in that situation.","model":"If I were you, I'd give it back right away. First, I'd wait for it to ring, because the owner will probably call their own number. If that doesn't work, I'd turn it in to the taxi company. I know some people think, “It's a free phone, and I'll get away with it,” but I'd think twice about that. Phones have photos, messages and important information, and losing all that is really stressful. Just imagine it was your phone! For me, it's simple: do the right thing, and one day someone will do the same for you.","use":["give back","turn in","get away with","think twice"]},"tips":[{"who":"teacher","t":"Dilemmas work best when students commit first. Ask everyone to write their answer before the discussion, then reveal and compare. Remind the class that there's often no single “right” answer."},{"who":"student","t":"Practice the second conditional with real situations: “If I found…, I'd…”. Say three sentences like this before every class."},{"who":"student","t":"Don't translate “decir la verdad” word for word. In English, we “tell the truth” and “tell a lie”, but we “say something”."}],"photo":{"src":"https://images.pexels.com/photos/8719570/pexels-photo-8719570.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/a-person-looking-the-wallet-8719570/"}},{"id":"b2-ethics","lv":"B2","tp":"ethics","title":"Moral Dilemmas","goals":["discuss moral dilemmas using idiomatic expressions about honesty, loyalty and conscience","weigh the pros and cons of a difficult choice and justify your decision","disagree politely and reach a group decision in a discussion"],"warm":["What's the hardest decision you've ever had to make?","Is it worse to lie or to break a promise?","Would you report a friend who was doing something wrong at work?","Do you think most people are basically honest?"],"model":{"kind":"dialogue","title":"Should I Say Something?","intro":"After work, Sofía tells her friends Matt and Priya about a problem at her office.","lines":[{"sp":"Sofía","t":"Can I ask you guys something? I'm facing a real [[moral dilemma]] at work."},{"sp":"Matt","t":"Sure. What's going on?"},{"sp":"Sofía","t":"My team leader, Carlos, has been adding extra hours to his timesheet. Not a lot, maybe three or four a week, but the company is paying for work he isn't doing."},{"sp":"Priya","t":"Wow. Does anyone else know?"},{"sp":"Sofía","t":"I think a couple of people do, but they [[turn a blind eye]]. He's really popular, and he's always [[stood up for]] us with management."},{"sp":"Matt","t":"So you feel you should keep quiet [[out of loyalty]]."},{"sp":"Sofía","t":"Exactly. But it also goes [[against my principles]]. If I [[go along with]] it, I'm part of it, right?"},{"sp":"Priya","t":"Hmm, I'm not sure it's that black and white. Maybe it's [[a gray area]]. What if he works from home in the evenings?"},{"sp":"Sofía","t":"I thought about that, but no. I've seen him leave at four and write down seven."},{"sp":"Matt","t":"Then it's not a gray area. He's [[breaking the rules]]. But I wouldn't go straight to HR. Talk to him first."},{"sp":"Priya","t":"I agree. Give him a chance to fix it. If he tries to [[cover it up]], then you can decide whether to [[blow the whistle]]."},{"sp":"Sofía","t":"You're right. Honestly, I've had [[a guilty conscience]] about keeping quiet for weeks. I just needed to say it out loud."}],"questions":[{"q":"What is Carlos doing?","opts":["Working from home without permission","Writing down more hours than he really works","Taking very long lunch breaks"],"a":1},{"q":"Why hasn't Sofía said anything yet?","opts":["Carlos has always supported the team","She's afraid of losing her job","She isn't sure it's true"],"a":0},{"q":"What do Matt and Priya advise her to do first?","opts":["Report Carlos to HR immediately","Forget about it","Speak to Carlos directly"],"a":2}]},"lang":[{"e":"cover up","t":"PV","d":"to hide a mistake or something wrong so people don't find out","x":"The manager tried to cover up the mistake instead of fixing it.","s":"cover UP"},{"e":"stand up for","t":"PV","d":"to defend someone or something that is being criticized","x":"She stood up for her coworker when the boss blamed him unfairly.","s":"stand UP for"},{"e":"go along with","t":"PV","d":"to accept a plan or decision, often without really agreeing","x":"I didn't like the idea, but I went along with it to avoid an argument.","s":"go aLONG with"},{"e":"turn a blind eye","t":"ID","d":"to pretend not to notice something wrong","x":"The coach turned a blind eye to players arriving late.","s":"turn a BLIND EYE"},{"e":"a gray area","t":"ID","d":"a situation where it isn't clear what is right or wrong","x":"Using the company laptop for personal projects is a bit of a gray area.","s":"a GRAY Area","uk":"UK: a grey area"},{"e":"blow the whistle","t":"ID","d":"to tell the authorities or the public about wrongdoing in an organization","x":"An employee blew the whistle on the company's illegal dumping.","s":"blow the WHIStle"},{"e":"a moral dilemma","t":"COL","d":"a difficult choice where every option seems wrong in some way","x":"Finding out my best friend's secret put me in a real moral dilemma.","s":"a MORal diLEMma"},{"e":"a guilty conscience","t":"COL","d":"a bad feeling because you know you did something wrong","x":"He couldn't sleep because of a guilty conscience.","s":"a GUILty CONscience"},{"e":"break the rules","t":"COL","d":"to do something that is not allowed","x":"You can't break the rules just because you're the boss.","s":"BREAK the RULES"},{"e":"on the fence","t":"PREP","d":"not able to decide between two options","x":"I'm still on the fence about whether to tell her.","s":"on the FENCE"},{"e":"out of loyalty","t":"PREP","d":"because you feel you must support someone","x":"He kept quiet out of loyalty to his old boss.","s":"OUT of LOYalty"},{"e":"against your principles","t":"PREP","d":"opposite to what you believe is right","x":"Lying to customers goes against my principles.","s":"aGAINST your PRINciples"}],"func":{"title":"Weighing options and justifying your choices","when":"Use these when you discuss a difficult decision and need to compare options and explain your reasons.","phrases":[{"p":"On the one hand, … On the other hand, …","use":"comparing two sides"},{"p":"The way I see it, …","use":"giving your point of view"},{"p":"The main reason I'd… is that…","use":"justifying a choice"},{"p":"It all depends on…","use":"showing that the answer isn't simple"},{"p":"I'm on the fence about this one.","use":"saying you're undecided"},{"p":"If it were me, I'd probably…","use":"saying what you would do"},{"p":"The downside of that is…","use":"pointing out a disadvantage"},{"p":"I see where you're coming from, but…","use":"disagreeing politely"},{"p":"I could live with that.","use":"accepting a compromise"},{"p":"At the end of the day, …","use":"giving your final conclusion"}],"task":"In groups of three, choose one motion from the speed debate. Each person gives a quick opinion using “The way I see it…” and “The main reason…”. Then the group has two minutes to agree on one decision, using at least two phrases for disagreeing and concluding."},"pron":{"focus":"Chunking and pausing","explain":"Fluent speakers group words into meaningful chunks and make a short pause (|) between them. Each chunk usually has one or two main stresses. This makes long opinions much easier to follow.","tip":"Mark the pauses before you speak. Never pause in the middle of an expression like “turn a blind eye” or “at the end of the day”.","lines":[{"t":"On the one hand, he's my friend; on the other hand, it's wrong.","m":"On the ONE hand, | he's my FRIEND; | on the OTHer hand, | it's WRONG."},{"t":"I've had a guilty conscience about it for weeks.","m":"I've had a GUILty CONscience | about it for WEEKS."},{"t":"If I go along with it, I'm part of it.","m":"If I go aLONG with it, | I'm PART of it."},{"t":"The way I see it, you can't just turn a blind eye.","m":"The WAY I see it, | you CAN'T just turn a BLIND EYE."},{"t":"At the end of the day, it goes against my principles.","m":"At the END of the DAY, | it goes aGAINST my PRINciples."}]},"acts":[{"type":"wyr","items":[["tell your best friend a painful truth","keep quiet to protect their feelings"],["work for a company you think is unethical for a high salary","work for a company you admire for half the money"],["blow the whistle and lose your job","keep quiet and keep your job"],["have a friend who is always brutally honest","have a friend who tells you white lies to make you feel good"],["be known as someone who always tells the truth","be known as someone who is always kind"],["break a rule to help a stranger","follow the rule and say no"],["always know when someone is lying to you","be able to lie without anyone ever noticing"]]},{"type":"roleplay","cards":[{"sit":"Two roommates. One of them scratched a neighbor's car while parking last night. Nobody saw it.","a":"You scratched the car. It's a small scratch, and the repair would cost about 150,000 pesos, which you don't have right now. You'd prefer to say nothing.","b":"You think your roommate should leave a note with their phone number. Try to persuade them without making them feel bad. Maybe offer to help."},{"sit":"An employee and a manager. The employee has found out that a coworker lied on their résumé about having a university degree.","a":"You're the employee. You're on the fence: the coworker is excellent at the job, but lying about a degree goes against your principles. Ask your manager for advice without naming anyone at first.","b":"You're the manager. You'd like to know who it is, but you also want to be fair. Help the employee think through the options before deciding anything."},{"sit":"Two friends. One asks the other to be a reference for a job as a team leader.","a":"You really need this job. Ask your friend to give you a great reference and say you're organized and reliable.","b":"You like your friend, but you know they're often late and disorganized. You don't want to lie to the employer, but you don't want to let your friend down either."}]},{"type":"speed","motions":["It's OK to lie to protect someone's feelings.","You should always report a coworker who breaks the rules.","Loyalty to your friends is more important than honesty.","If you find cash on the street with no ID, it's fine to keep it.","Companies should reward employees who blow the whistle.","Parents have the right to read their teenagers' private messages."]}],"ex":{"gap":{"items":[{"s":"Everyone in the office knew about the problem, but they all ___ to it.","a":"turned a blind eye"},{"s":"When the boss blamed Ana unfairly, Luis ___ her in front of everyone.","a":"stood up for"},{"s":"The company tried to ___ the mistake, but a journalist found out.","a":"cover up"},{"s":"I'm still ___ about accepting the job. I can see good and bad points.","a":"on the fence"},{"s":"He kept his boss's secret ___, even though he didn't agree with it.","a":"out of loyalty"},{"s":"An employee finally ___ on the company's illegal practices by contacting a journalist.","a":"blew the whistle"}]},"match":{"pairs":[["a gray area","a situation where right and wrong aren't clear"],["a guilty conscience","a bad feeling because you did something wrong"],["go along with","accept something, often without really agreeing"],["against your principles","opposite to what you believe is right"],["break the rules","do something that isn't allowed"],["a moral dilemma","a difficult choice where every option seems wrong"]]},"fix":{"items":[{"s":"I'm agree with you: he should tell the truth.","wrong":"I'm agree","fix":"I agree"},{"s":"Sofía discussed with her boss yesterday, and now they're not speaking.","wrong":"discussed with","fix":"argued with"},{"s":"I have a moral dilemma about if I should tell her.","wrong":"about if","fix":"about whether"},{"s":"Lying to customers is against to my principles.","wrong":"against to","fix":"against"}]}},"rec":{"prompt":"Describe a moral dilemma you (or someone you know) faced. What were the options, what did you decide, and do you think it was the right choice?","model":"A few years ago, I faced a real moral dilemma at university. My best friend copied part of her final project from a classmate's work, and the professor thought the classmate was the one who had copied. I was on the fence for days. On the one hand, I didn't want to get my friend in trouble; on the other hand, it just wasn't fair. In the end, I talked to my friend and told her that if she didn't say something, I would stand up for the other student myself. She went to the professor the next day. It was hard, but I think it was the right choice. Otherwise, I'd still have a guilty conscience.","use":["a moral dilemma","on the fence","stand up for","a guilty conscience"]},"tips":[{"who":"teacher","t":"Dilemmas can touch on personal experiences. Let students talk about “a friend” or “someone I know” if they prefer, and keep the focus on the language of justifying, not on judging people."},{"who":"student","t":"Learn idioms with their prepositions: “turn a blind eye TO something”, “blow the whistle ON someone”. The preposition is part of the expression."},{"who":"student","t":"When you need time to think, don't stay silent. Say “That's a tough one…” or “I'm on the fence about this one…” while you organize your ideas."}],"photo":{"src":"https://images.pexels.com/photos/7774260/pexels-photo-7774260.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/woman-thinking-7774260/"}},{"id":"c1-ethics","lv":"C1","tp":"ethics","title":"Ethics in a Complex World","goals":["debate complex ethical questions in business, technology and everyday life using nuanced language","build and challenge arguments by conceding points and drawing clear distinctions","speculate about the long-term consequences of ethical decisions and reach a reasoned conclusion"],"warm":["Can a company be truly ethical and still maximize its profits?","Is it fair to judge people from the past by today's moral standards?","If an algorithm makes a harmful decision, who should be responsible?","What has shaped your sense of right and wrong the most: your family, your culture or your own experience?"],"model":{"kind":"text","title":"Legal Isn't the Same as Right","intro":"An opinion column in a business magazine argues that ethics matter more than ever in a fast-changing world.","paras":["Ask most executives whether their company is ethical, and they'll point to a code of conduct and a clean legal record. But we need to [[draw a distinction]] between what is legal and what is right. Laws tend to lag behind technology, which means that many of today's most important questions fall into territory that no regulator has mapped yet.","Take an app that nudges teenagers to stay online for longer. It may be perfectly legal, yet the [[unintended consequences]], from lost sleep to poorer concentration, are hard to ignore. Its designers probably had good intentions. Still, once engagement becomes the only metric, it's [[a slippery slope]]: each small tweak seems harmless, until someone realizes the product has [[crossed the line]].","Real dilemmas rarely offer a clean choice. More often, leaders are forced to pick [[the lesser of two evils]]: cutting jobs to keep a factory open, or delaying a product launch when investors' money is [[at stake]]. The worst response is to [[shy away from]] these decisions or hide behind the legal department. Employees notice when a company fails to [[live up to]] the values printed on its office walls.","Ultimately, it [[comes down to]] trust. A firm that turns down a lucrative contract [[on moral grounds]], or declares [[a conflict of interest]] before it becomes a scandal, may lose money this quarter. [[In the long run]], though, it earns something far harder to buy."],"questions":[{"q":"What is the writer's main argument?","opts":["Laws are usually stricter than ethics","Being legal doesn't automatically make something ethical","Executives should ignore their legal departments"],"a":1},{"q":"Why does the writer call the teen app example a “slippery slope”?","opts":["Small changes that seem harmless can add up to something harmful","The app was designed to break the law","Its designers wanted to hurt teenagers"],"a":0},{"q":"What does the writer believe ethical companies gain in the long run?","opts":["Higher profits every quarter","Fewer contracts to manage","Trust"],"a":2}]},"lang":[{"e":"come down to","t":"PV","d":"to be, in the end, mainly about one important thing","x":"In the end, it comes down to whether the benefits outweigh the risks.","s":"come DOWN to"},{"e":"shy away from","t":"PV","d":"to avoid something because it is difficult or unpleasant","x":"Good leaders don't shy away from unpopular decisions.","s":"shy aWAY from"},{"e":"live up to","t":"PV","d":"to be as good as what was promised or expected","x":"Few companies really live up to the values on their websites.","s":"live UP to"},{"e":"a slippery slope","t":"ID","d":"a situation where one small step is likely to lead to worse ones","x":"Once you start bending the rules for one client, it's a slippery slope.","s":"a SLIPpery SLOPE"},{"e":"the lesser of two evils","t":"ID","d":"the less harmful of two bad options","x":"Closing one branch to save the other three was the lesser of two evils.","s":"the LESSer of two Evils"},{"e":"cross the line","t":"ID","d":"to go beyond what is morally acceptable","x":"Monitoring work emails is one thing, but reading employees' private messages crosses the line.","s":"CROSS the LINE"},{"e":"draw a distinction","t":"COL","d":"to show clearly how two similar things are different","x":"We need to draw a distinction between privacy and secrecy.","s":"DRAW a disTINCtion"},{"e":"unintended consequences","t":"COL","d":"results of an action that nobody planned or expected","x":"Even well-meaning rules can have unintended consequences.","s":"uninTENDed CONsequences"},{"e":"a conflict of interest","t":"COL","d":"a situation where personal interests could influence a professional decision","x":"Judging a contest your cousin entered would be a clear conflict of interest.","s":"a CONflict of INterest"},{"e":"at stake","t":"PREP","d":"at risk; that could be lost or damaged","x":"When people's health is at stake, safety matters more than speed.","s":"at STAKE"},{"e":"on moral grounds","t":"PREP","d":"for ethical reasons","x":"She turned down the contract on moral grounds.","s":"on MORal GROUNDS"},{"e":"in the long run","t":"PREP","d":"over a long period of time; eventually","x":"Honesty usually pays off in the long run.","s":"in the LONG RUN"}],"func":{"title":"Conceding and counter-arguing","when":"Use these in debates to acknowledge the other side before you make your own point. It makes you sound fair-minded and more persuasive.","phrases":[{"p":"Granted, … but…","use":"conceding a point before disagreeing"},{"p":"I take your point, but…","use":"accepting part of an argument"},{"p":"That's a fair point; however, …","use":"formal concession"},{"p":"Admittedly, …","use":"admitting a weakness in your own position"},{"p":"Even so, …","use":"keeping your position after a concession"},{"p":"That holds true up to a point.","use":"limited agreement"},{"p":"Where I'd draw the line is…","use":"setting a limit"},{"p":"But doesn't that assume that…?","use":"challenging an assumption"},{"p":"Let's not confuse … with …","use":"drawing a distinction"},{"p":"All things considered, …","use":"reaching a conclusion"}],"task":"In pairs, take a question from the fishbowl list. Student A makes a 30-second argument. Student B must concede one point (“Granted…” / “Admittedly…”) and then challenge an assumption (“But doesn't that assume…?”). Continue for three rounds, then summarize the discussion together, starting with “All things considered…”."},"pron":{"focus":"Fall-rise intonation for concession","explain":"When we concede a point but plan to disagree, we often use a fall-rise (↘↗) on the idea we're conceding. It signals “yes, but…” and prepares the listener for a contrast. The main point that follows usually ends with a clear, confident fall (↘).","tip":"Exaggerate the fall-rise on words like “Granted” and “Admittedly”, pause briefly, then say your main point with a firm fall.","lines":[{"t":"Granted, it's legal, but is it right?","m":"↘↗GRANTed, | it's ↘↗LEgal, | but is it ↘RIGHT?"},{"t":"Admittedly, they acted with good intentions.","m":"↘↗adMITtedly, | they acted with GOOD inTENtions↘."},{"t":"In the long run, honesty pays off.","m":"In the ↘↗LONG RUN, | HONesty pays ↘OFF."},{"t":"It's the lesser of two evils, but it's still an evil.","m":"It's the ↘↗LESSer of two Evils, | but it's STILL‿an ↘Evil."},{"t":"Where I'd draw the line is reading private messages.","m":"Where I'd DRAW the ↘↗LINE | is READing PRIvate ↘MESSages."}]},"acts":[{"type":"balloon","sit":"A hot-air balloon carrying six moral values is losing height. Only one can stay on board and guide humanity for the next hundred years. Each person defends their value with real-life examples and explains why the others are less essential. After the final speeches, the group votes.","roles":[{"name":"Honesty","why":"Without truth there's no trust, and without trust nothing else works."},{"name":"Compassion","why":"Rules mean little if we stop caring about other people's suffering."},{"name":"Fairness","why":"Equal treatment is the basis of every team, family and society that works."},{"name":"Loyalty","why":"Families, friendships and teams survive because people stand by each other."},{"name":"Freedom","why":"Values that are forced on people aren't really values at all."},{"name":"Responsibility","why":"Someone has to own the consequences of our actions, including for future generations."}]},{"type":"roleplay","cards":[{"sit":"A software company's AI hiring tool has been rejecting a higher share of applicants over 50. The launch is in two weeks.","a":"You're the product manager. A delay would cost the company a major client and possibly jobs on your team. Argue that you can fix the problem after launch and that the pattern may be a statistical quirk.","b":"You're the head of ethics. You believe launching now would be unfair to older applicants and could damage the company's reputation in the long run. Push for a delay, but be ready to propose a compromise."},{"sit":"A family business has been offered a very profitable contract by a client with a poor record on workers' rights.","a":"You're the CEO, the founder's daughter or son. The contract would save 30 jobs in a difficult year, and you believe you can push the client to improve from the inside.","b":"You're the founder, now an advisor. You built the company's reputation on doing business the right way, and you want to turn the contract down on moral grounds."},{"sit":"Two old friends. One has discovered that the other's startup is exaggerating its results to investors.","a":"You're the founder. Everyone in the industry “rounds up” a little, and you're sure the real numbers will catch up within six months. Ask your friend to keep it between the two of you.","b":"You were invited to invest too, and you know that other friends have put their savings into the company. Decide how far your loyalty goes and where you draw the line."}]},{"type":"fishbowl","questions":["Is it possible to separate what is legal from what is ethical in business? Where do the two clash most often?","Should we judge people by their intentions or by the consequences of their actions?","When an AI system makes a harmful decision, who should take responsibility: the developer, the company or the user?","Is it ever right to break a rule for a good reason? Where would you draw the line?","Can you be a good person and still work for a company whose values you disagree with?","What might future generations criticize us for that we consider completely normal today?"]}],"ex":{"gap":{"items":[{"s":"Closing one of the two factories was painful, but it was ___.","a":"the lesser of two evils"},{"s":"Small exceptions quickly become habits. Once you start, it's ___.","a":"a slippery slope"},{"s":"The new policy had some ___: it was meant to reduce waste, but it actually increased costs.","a":"unintended consequences"},{"s":"With thousands of jobs ___, the board couldn't afford to rush the decision.","a":"at stake"},{"s":"The architect refused to design the building ___, saying it would destroy a protected wetland.","a":"on moral grounds"},{"s":"In the end, the decision ___ one question: can we justify it to our customers?","a":"came down to/comes down to"}]},"match":{"pairs":[["The company failed to live up to","the values it advertised so proudly."],["A good leader doesn't shy away from","unpopular but necessary decisions."],["Reviewing your own sister's job application would be","a clear conflict of interest."],["We need to draw a distinction between","what is legal and what is right."],["Reading employees' private messages","crosses the line."],["Cutting corners on safety may save money now, but","it will cost far more in the long run."]]},"fix":{"items":[{"s":"Who is responsible of the mistake in the final report?","wrong":"responsible of","fix":"responsible for"},{"s":"She refused to sign the contract in moral grounds.","wrong":"in moral grounds","fix":"on moral grounds"},{"s":"The new product didn't live up its promises.","wrong":"live up its","fix":"live up to its"},{"s":"We discussed about the ethics of AI for hours.","wrong":"discussed about","fix":"discussed"}]}},"rec":{"prompt":"Is it ever acceptable to bend the rules for a good reason? Give a balanced answer with an example from work or everyday life.","model":"I'd say it depends on what's at stake. Granted, rules exist for good reasons, and if everyone bent them whenever it suited them, it would quickly become a slippery slope. Even so, I think we need to draw a distinction between rules that protect people and rules that are simply bureaucracy. For example, a nurse I know once let a frightened patient's daughter stay after visiting hours. Technically, she broke the rules, but nobody was harmed and the patient slept far better. Where I'd draw the line is when bending a rule benefits you personally or puts someone else at risk. In the long run, people trust those who are flexible for the right reasons, not for their own convenience.","use":["at stake","a slippery slope","draw a distinction","in the long run"]},"tips":[{"who":"teacher","t":"Set a clear ground rule before the fishbowl: no debates about specific politicians, parties or religions. Steer abstract questions toward work, technology and everyday examples so everyone can take part comfortably."},{"who":"student","t":"Concession language makes C1 arguments sound mature. In every discussion, try to use “Granted…” or “I take your point, but…” at least once before you disagree."},{"who":"student","t":"Keep a “nuance notebook”: when you hear a strong opinion, rewrite it in a more balanced way using the lesson's phrases."}],"photo":{"src":"https://images.pexels.com/photos/8112197/pexels-photo-8112197.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/a-figurine-of-lady-justice-8112197/"}}];
var EXAM = {"ielts":{"p1":[{"topic":"Your hometown","qs":["Where did you grow up?","What do you like most about that place?","How has your hometown changed since you were a child?","Is it a good place for families with young children? Why or why not?","Would you like to live there when you're older?"]},{"topic":"Work or studies","qs":["What do you do? Are you working, studying, or both?","What does a typical day look like for you?","What's the most enjoyable part of your job or your studies?","Is there anything you would like to change about it?","Do you think you'll be doing the same kind of work in ten years?"]},{"topic":"Food and cooking","qs":["What kind of food do you usually eat during the week?","Do you enjoy cooking? Why or why not?","Who did most of the cooking in your home when you were growing up?","Is there a dish from your country that you think everyone should try?","Do you prefer eating at home or eating out?"]},{"topic":"Weekends","qs":["How do you usually spend your weekends?","Do you prefer busy weekends or quiet ones?","What did you do last weekend?","Do you ever have to work or study on the weekend?","Is there something new you'd like to try on a weekend soon?"]},{"topic":"Music","qs":["What kind of music do you listen to most often?","When do you usually listen to music?","Have your musical tastes changed since you were a teenager?","Have you ever learned to play an instrument?","Do you prefer listening to music at home or going to live concerts?"]},{"topic":"Weather and seasons","qs":["What's the weather usually like where you live?","Which season do you enjoy the most? Why?","Does the weather ever affect your mood?","What do you usually do on rainy days?","Would you like to live somewhere with a very different climate?"]},{"topic":"Getting around","qs":["How do you usually get to work or school?","How long does it usually take you to get there?","Is public transportation good in your city?","Do you ever walk or ride a bike to get places?","What would make getting around your city easier?"]},{"topic":"Sports and exercise","qs":["Do you do any kind of exercise regularly?","What sports were popular at your school?","Do you prefer exercising alone or with other people?","Do you like watching sports on TV? Which ones?","Is there a sport you'd like to learn in the future?"]},{"topic":"Phones and apps","qs":["How much time do you spend on your phone each day?","Which apps do you use the most?","Do you remember your first cell phone?","Are there times when you turn your phone off completely?","Do you think you could live without a smartphone for a week?"]},{"topic":"Reading","qs":["Do you enjoy reading? What kinds of things do you read?","Do you prefer printed books or reading on a screen?","Did you read a lot when you were a child?","Where's your favorite place to read?","Is there a book you would like to read again?"]},{"topic":"Friends","qs":["Do you have a lot of friends, or just a few close ones?","How did you meet your best friend?","What do you usually do when you get together with friends?","Is it easy to make new friends as an adult?","How do you keep in touch with friends who live far away?"]},{"topic":"Shopping","qs":["Do you enjoy shopping? Why or why not?","Do you prefer shopping online or in stores?","What was the last thing you bought for yourself?","Are there any street markets near where you live?","Do you usually plan what you buy, or do you buy things on impulse?"]}],"p2":[{"topic":"Describe an older person who taught you something valuable outside a classroom.","bullets":["who this person is","how you know them","what they taught you","how they taught it to you"],"end":"and explain why this lesson has stayed with you.","model":"I'd like to talk about my grandfather, Luis, who lived with us for a few years when I was a teenager. He'd been a carpenter all his life, and even after he retired, he spent most afternoons in a tiny workshop he'd set up in our backyard. What he taught me wasn't really carpentry, although I did learn how to use a few tools. It was patience. I was the kind of kid who wanted everything done immediately, and if something went wrong, I'd just give up. One summer, I asked him to help me build a bookshelf for my room, and I assumed we'd finish it in an afternoon. In the end, it took us almost three weeks, because he insisted on measuring everything twice and sanding every piece by hand. At the time, I found it incredibly frustrating, but he never lectured me. He just showed me, again and again, that rushing usually meant doing the job twice. Whenever I complained, he'd smile and quote an old Spanish saying: “Dress me slowly, because I'm in a hurry.” I think the lesson has stayed with me because I still use it at work. When I'm under pressure, I remind myself to slow down and check things properly. And that bookshelf, by the way, is still standing in my parents' house.","p3":["Who has more influence on young people today: parents, teachers, or friends?","What kinds of skills are better learned at home than at school?","Do you think older people are given enough respect in your country?","Do grandparents play a bigger or smaller role in raising children than they used to?","Is patience becoming less common in modern society? Why do you think that is?"]},{"topic":"Describe someone you know whose job you admire.","bullets":["who this person is","what their job involves","how you know about their work","what makes them good at it"],"end":"and explain how you feel about this person.","model":"The person I want to describe is my cousin Valentina, who works as a nurse in the emergency room of a public hospital in Santiago. We grew up together, so we're more like sisters than cousins, and we still talk almost every day. Her job involves a bit of everything. She assesses patients when they arrive, decides who needs to be seen first, gives medication, and, honestly, spends a lot of time calming people down. Most of what I know about her work comes from her stories, but last year I actually saw her in action when my father had a minor accident and we ended up in her department. What struck me that night was how calm she was. The waiting room was packed, people were shouting, and yet she managed to explain everything to us clearly and kindly, without ever seeming rushed. I think what makes her so good is that combination of technical skill and empathy. She's also incredibly organized; she keeps track of a dozen things at once and somehow never loses her temper. I have to admit, I feel enormous admiration for her, and maybe a little guilt, because her job is so much more demanding than mine and she's paid far less than she deserves. Whenever I complain about a stressful day at the office, I think of her and try to keep things in perspective.","p3":["What qualities make someone successful in their career?","Should jobs like nursing and teaching be paid more than they are now? Why?","Is it more important to enjoy your job or to earn a good salary?","How can employers help their staff stay motivated?","Do you think people will change careers more often in the future?"]},{"topic":"Describe a place outside the city where you go to relax.","bullets":["where it is","how you get there","what you do there","who you usually go with"],"end":"and explain why you like this place so much.","model":"I'd like to talk about the Cajón del Maipo, which is a river valley in the Andes, about an hour and a half from Santiago. It's one of those places that most people in the city know about, but surprisingly few visit regularly. Getting there is pretty easy. You can take a bus from the edge of the city, but I usually drive with a group of friends, leaving very early on a Saturday morning so we can avoid the traffic. The road follows the river the whole way, and as you go higher, the landscape becomes more and more dramatic, with steep mountains on both sides. What we do depends on the season. In summer, we hike to a waterfall or go rafting, which is a real thrill, because the water is fast and freezing cold. In winter, there's sometimes snow, so we just go for a short walk, have a barbecue, and sit by the fire drinking tea. I think the main reason I love it is the contrast with my everyday life. During the week, I'm surrounded by noise and screens, and in the Cajón there's almost no phone signal, so you're forced to disconnect. The air is cleaner, the night sky is full of stars, and I always come back feeling as if I've had a much longer break than just one day.","p3":["Why do you think people who live in cities feel the need to spend time in nature?","Should access to national parks be free for everyone?","How can tourism damage natural areas, and what can be done about it?","Do children today spend less time outdoors than children did in the past?","Who should be responsible for protecting natural places: the government or ordinary citizens?"]},{"topic":"Describe a public building in your area that you use regularly.","bullets":["what the building is","where it is located","how often you go there","what you usually do there"],"end":"and explain why you enjoy spending time there.","model":"The building I'd like to describe is the public library in my neighborhood, in the south of the city. It opened about five years ago in an old factory that had been abandoned for decades, and the renovation was really impressive. They kept the brick walls and the huge windows, but inside it's modern, bright, and full of plants. I go there at least once a week, usually on Saturday mornings, and sometimes after work if I need to concentrate on something. At home there are always distractions, like the TV or my neighbors' dog, so the library is my escape. Most of the time, I borrow novels or work on my laptop, but the library offers much more than books. There are free workshops on all kinds of things, from photography to basic computer skills for older adults, and on weekends there's usually something going on for kids. Last month, I even joined a book club there, which has been a great way to meet people who live nearby. I think I enjoy it because it's one of the few places in the city where you can spend the whole day without having to buy anything. It's open to everyone, and you see all sorts of people there: students, retirees, families. It makes me feel connected to my community, and, to be honest, it's also the quietest place I know.","p3":["Why are public spaces like libraries and parks important for a city?","Do you think public libraries will still exist in fifty years?","Should local governments spend more money on public spaces or on other services?","How have the places where young people meet changed in recent years?","What can be done to make public places safer and more welcoming?"]},{"topic":"Describe an old object that has been passed down in your family.","bullets":["what the object is","who it belonged to before","how it came to you","where you keep it now"],"end":"and explain why it means so much to you.","model":"The object I'd like to talk about is an old notebook that belonged to my grandmother. It isn't worth anything in terms of money: the cover is falling apart, some pages are stained with oil, and her handwriting is pretty hard to read. But to me, it's priceless. Basically, it's where she wrote down all her recipes over about forty years, from simple everyday dishes to the things she only made at Christmas or for the September holidays, like her famous empanadas. She gave it to me shortly before she passed away, about eight years ago. I think she chose me because I was the only grandchild who used to hang around in the kitchen with her, asking questions and stealing bits of dough. I keep it on a shelf in my kitchen, but I've also scanned every page, just in case, and shared the files with my cousins, so the recipes won't disappear if something happens to the original. The reason it matters so much is that it feels like a conversation with her. Next to some recipes she added little comments, such as “too salty last time” or “Pedro's favorite,” and when I read them, I can almost hear her voice. Whenever I cook something from it for my own family, I feel like I'm keeping a small part of her alive.","p3":["Why do people keep objects that have no practical use?","Are young people today less attached to physical possessions than older generations?","How has technology changed the way families preserve their memories?","Some people say we own too many things. Do you agree?","What objects from our time do you think future generations will value?"]},{"topic":"Describe a digital tool that saves you time every day.","bullets":["what it is","how you found out about it","how you use it","how much time it saves you"],"end":"and explain how your life would be different without it.","model":"I'd like to talk about a transportation app that I use pretty much every day. It shows you exactly where the buses are in real time, how long you'll have to wait at your stop, and the fastest way to get from one place to another, combining buses, the metro, and walking. I found out about it from a coworker about three years ago. I was complaining that I'd waited forty minutes for a bus in the rain, and she just laughed, took out her phone, and showed me the app. I downloaded it that same afternoon, and I've used it ever since. Mainly, I use it to plan my commute. Before I leave home, I check when my bus is coming, so instead of standing at the stop for ages, I can finish my coffee and walk out at just the right moment. It's also really useful when I have to go somewhere unfamiliar, because it tells me where to get off and even warns me when there are delays or detours. Without it, I think my life would be noticeably more stressful. I'd waste a lot more time waiting, and I'd probably be late more often. It's funny, really: it's such a simple tool, but it gives me back maybe half an hour a day, which adds up to a lot of time over a year.","p3":["Do you think people rely too much on apps in their daily lives?","Which groups of people find it hardest to adapt to new technology, and why?","Should companies be allowed to collect data about how people use their apps?","Has technology made getting around cities easier or more stressful?","What everyday tasks do you think will be done entirely by machines in the future?"]},{"topic":"Describe a family celebration you remember clearly.","bullets":["what the occasion was","when and where it took place","who was there","what happened during the celebration"],"end":"and explain why you remember it so well.","model":"The celebration I remember best is my grandparents' fiftieth wedding anniversary, which we had about six years ago at my uncle's house in the countryside, near Talca. It was a big deal in our family, because, as my grandfather kept reminding everyone, not many couples make it to fifty years. Practically the whole family was there, around sixty people, including relatives who had flown in from Argentina and Spain, and some cousins I hadn't seen since I was a child. My aunts spent days preparing food, and we had a huge lunch outdoors under the trees that went on for hours. The part I remember most clearly happened in the evening. My cousins and I had secretly put together a slideshow of old photos, from my grandparents' wedding day to the present. Just as we were about to show it, there was a power outage, and the whole house went dark. For a moment, we thought the surprise was ruined, but then someone found some candles, my uncle brought out his guitar, and instead of the slideshow, everyone started telling stories about my grandparents. I think I remember it so well because it turned out to be much more emotional than anything we had planned. My grandmother cried, my grandfather sang, and I learned things about my family I'd never known. Sadly, my grandfather died two years later, so that night feels even more special now.","p3":["Are family celebrations as important today as they were in the past?","Why do some people prefer to celebrate with friends rather than with family?","How have weddings and other celebrations changed in your country?","Do you think people spend too much money on celebrations?","What role do traditions play in keeping families together?"]},{"topic":"Describe a trip where something unexpected happened.","bullets":["where you were going","who you were with","what happened","how you dealt with the situation"],"end":"and explain what you learned from the experience.","model":"A few years ago, my best friend and I decided to drive from Santiago up to La Serena and then into the Elqui Valley, which is famous for its clear skies and stargazing. We'd planned everything carefully: where we would stay, which observatory we'd visit, even where we'd stop for lunch. Unfortunately, about two hours into the drive, the car started making a strange noise, and then it simply died on the side of the highway. Neither of us knows much about cars, so we just stood there in the heat, feeling completely helpless. To make things worse, we were in an area with a very weak phone signal. Eventually, a truck driver pulled over and helped us call a tow truck. The car had to stay in a small town for two days while a mechanic waited for a spare part, so our perfectly planned trip turned into a long weekend in a place we'd never even heard of. At first we were really annoyed, but the people there were incredibly friendly. The owner of the guesthouse invited us to dinner with her family, and we spent the evenings walking around and chatting with locals. What I learned is that the best moments of a trip aren't always the ones you plan. We never made it to the observatory, but we still talk about that weekend more than any other trip we've taken.","p3":["Why do some people like to plan every detail of a trip, while others prefer to improvise?","How has the internet changed the way people organize their vacations?","What are the advantages of traveling with friends compared to traveling alone?","Do you think tourism always benefits small towns and local communities?","How should people react when things go wrong while they're traveling?"]},{"topic":"Describe a skill you learned as an adult.","bullets":["what the skill is","when and how you learned it","who helped you","how often you use it now"],"end":"and explain why this skill is important to you.","model":"I'd like to talk about swimming, which I only learned to do properly when I was thirty-two. As a child, I never had lessons, and I always felt a bit embarrassed at the beach, because I could only splash around where my feet touched the bottom. A couple of years ago, a new public pool opened near my office, and they offered beginner classes for adults early in the morning. I signed up almost as a joke, but I ended up going three times a week for about six months. I still remember the first class: I was the youngest in a group of mostly retired people, and some of them were much braver than I was. The person who helped me most was the instructor, a former competitive swimmer named Andrés. He was incredibly patient, and he had a way of breaking everything down into tiny steps, so it never felt overwhelming. The hardest part for me wasn't the technique; it was learning to relax and trust the water. Nowadays, I swim at least twice a week before work, and it's become a really important part of my routine. Apart from being great exercise, it's the only time I'm completely away from my phone. But I think the main reason it matters to me is that it proved I could still overcome a fear as an adult, and that's given me the confidence to try other new things.","p3":["Is it harder to learn new skills as an adult than as a child? Why?","What practical skills do you think every adult should have?","Should employers pay for their workers to learn new skills?","Do schools focus too much on academic subjects and not enough on practical ones?
