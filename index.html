making a friendly suggestion"},{"p":"How about…? / What about…?","use":"suggesting an idea (+ -ing: How about walking?)"},{"p":"Maybe you could…","use":"making a soft, polite suggestion"},{"p":"You could try…","use":"suggesting something to test (+ -ing: You could try biking.)"},{"p":"Let's…","use":"suggesting something to do together"},{"p":"That's a great idea!","use":"accepting a suggestion with enthusiasm"},{"p":"Sounds good. I'll give it a try.","use":"accepting a suggestion"},{"p":"Hmm, I'm not sure about that.","use":"politely not accepting"},{"p":"That might be hard for me, because…","use":"saying no and giving a reason"}],"task":"In pairs, Student A describes a \"bad green habit\" (for example: \"I drive two blocks to the store\" or \"I leave my phone charger plugged in all day\"). Student B makes two suggestions with different phrases. A accepts one and politely says no to the other, giving a reason. Swap roles after each habit and try to do three habits each in 3 minutes."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them, so the two words sound like one: \"turn off\" sounds like \"tur-noff\" and \"instead of\" sounds like \"instea-dof\".","tip":"Don't stop between the parts of a phrasal verb. Say it slowly as one word, then say it faster.","lines":[{"t":"Turn off your computer at night.","m":"TURN‿OFF your comPUTer‿at NIGHT."},{"t":"Let's cut down on plastic.","m":"Let's CUT DOWN‿on PLAStic."},{"t":"I walk instead of driving.","m":"I WALK‿inSTEAD‿of DRIVing."},{"t":"It's ten minutes on foot.","m":"It's TEN MINutes‿on FOOT."},{"t":"It makes a big difference.","m":"It MAKES‿a BIG DIFference."}]},"acts":[{"type":"wyr","items":[["give up your car for a year","give up meat for a year"],["take only five-minute showers","never use heating or air conditioning again"],["buy only secondhand clothes","keep the same phone for six years"],["bike to work in the rain","take a very crowded bus"],["grow your own vegetables","keep chickens in your backyard"],["spend a Saturday cleaning a beach","spend a Saturday planting trees"],["live in a tiny eco-house in the country","live in a big apartment in the city"]]},{"type":"taboo","cards":[{"w":"throw away","taboo":["trash","garbage","bin"]},{"w":"turn off","taboo":["switch","light","on"]},{"w":"cut down on","taboo":["less","reduce","stop"]},{"w":"go green","taboo":["environment","planet","color"]},{"w":"every little bit helps","taboo":["small","important","change"]},{"w":"kill two birds with one stone","taboo":["two","same","time"]},{"w":"make a difference","taboo":["change","important","effect"]},{"w":"single-use plastic","taboo":["bag","bottle","once"]},{"w":"instead of","taboo":["replace","other","choose"]},{"w":"on foot","taboo":["walk","feet","legs"]}]},{"type":"ranking","task":"Rank these green habits from easiest (1) to hardest (7) for you. Then compare with a partner and explain your top and bottom choices.","items":["Taking shorter showers","Carrying a reusable water bottle","Separating your trash for recycling","Eating less meat","Walking or biking short distances instead of driving","Buying secondhand clothes","Unplugging chargers when you're not using them"]}],"ex":{"gap":{"items":[{"s":"Please ___ the lights when you leave the classroom.","a":"turn off"},{"s":"I go to work ___ because I live only five blocks away.","a":"on foot"},{"s":"We're trying to ___ meat, so now we only eat it twice a week.","a":"cut down on"},{"s":"Don't ___ that box! We can use it again.","a":"throw away"},{"s":"I drink tap water ___ buying bottled water.","a":"instead of"},{"s":"Using a cloth bag is a small change, but it can really ___ (= have a good effect).","a":"make a difference"}]},"match":{"pairs":[["go green","start living in a more eco-friendly way"],["kill two birds with one stone","do two useful things with one action"],["every little bit helps","small actions are useful, too"],["single-use plastic","plastic you use once and then throw away"],["save energy","use less electricity or gas"],["be bad for","harm or damage something"]]},"fix":{"items":[{"s":"I go to work in foot every day.","wrong":"in foot","fix":"on foot"},{"s":"I take the bus instead of drive.","wrong":"instead of drive","fix":"instead of driving"},{"s":"Don't forget to close the water when you brush your teeth.","wrong":"close the water","fix":"turn off the water"},{"s":"Plastic bags are very bad to the ocean.","wrong":"bad to","fix":"bad for"}]}},"rec":{"prompt":"What are two green habits you already have, and one you'd like to start? Talk for one minute.","model":"I'm not perfect, but I try to go green in small ways. First, I always carry a cloth bag, so I don't need plastic bags at the supermarket. Second, I turn off the lights and unplug my charger when I leave home. It's an easy way to save energy, and my electricity bill is lower, too. One habit I'd like to start is biking to work instead of taking the bus. It's only twenty minutes, so I'd kill two birds with one stone: I'd get some exercise and help the planet. Every little bit helps, right?","use":["go green","turn off","save energy","kill two birds with one stone"]},"tips":[{"who":"teacher","t":"Before the taboo game, model one card yourself so students see how to explain an expression without the forbidden words. Give 45 seconds per card to keep the energy high."},{"who":"student","t":"This week, every time you do something green, say one sentence about it out loud, for example: \"I walked to the store instead of driving.\" Small daily practice makes the phrases automatic."},{"who":"student","t":"In phrasal verbs, the second word is usually stressed: turn OFF, throw aWAY, cut DOWN on. Practice them in short sentences until they sound natural."}],"photo":{"src":"https://images.pexels.com/photos/7512913/pexels-photo-7512913.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/female-sorting-plastic-bottles-at-home-7512913/"}},{"id":"b2-environment","lv":"B2","tp":"environment","title":"Climate & Cities","goals":["discuss how climate change affects cities using idiomatic language","compare practical solutions for greener, more livable cities","give your opinion and politely challenge other people's views"],"warm":["What do you like most and least about the city or town where you live?","Have summers where you live become hotter in recent years?","If you could change one thing about transportation in your city, what would it be?","In 20 years, would you rather live in a big city or a small town? Why?"],"model":{"kind":"text","title":"Can Our Cities Keep Their Cool?","intro":"A short post from a blog about city life, written by an urban planner in Santiago.","paras":["Every summer in Santiago, the same question comes up: why does the city feel so much hotter than the countryside? Part of the answer is the \"urban heat island\" effect. Concrete and asphalt absorb heat during the day and release it at night, so cities stay warmer than the areas around them. And with [[extreme weather]] becoming more common, many cities are increasingly [[vulnerable to]] heat waves, floods, and droughts.","The problem can easily turn into [[a vicious cycle]]: when it's hot, people turn up the air conditioning, which uses more energy, adds to emissions, and pumps even more hot air into the streets. And heat is just [[the tip of the iceberg]]. Traffic, smog, and noise all make city life harder.","So what's being done? Some cities have [[come up with]] creative solutions. Trees and [[green spaces]] provide shade and cool the air, so many cities are planting more of them. Others are [[switching to]] electric buses and planning to [[phase out]] older diesel ones; Santiago now has one of the largest electric bus fleets outside China. Better [[public transportation]] and safe bike lanes also help people leave their cars at home.","Of course, not everyone is convinced. Critics say a few new parks are [[a drop in the bucket]], and some residents aren't [[in favor of]] losing parking spaces to bike lanes. Those are fair points. But [[in the long run]], cities that adapt now will probably be healthier and more pleasant places to live."],"questions":[{"q":"According to the post, why are cities often hotter than the countryside?","opts":["Concrete and asphalt absorb heat and release it at night.","Cities are usually closer to the ocean.","People in cities use less air conditioning."],"a":0},{"q":"Why does the writer call air conditioning part of a \"vicious cycle\"?","opts":["Air conditioners break easily in very hot weather.","Using more AC adds energy use and heat, which makes the problem worse.","Most people in Santiago can't afford air conditioning."],"a":1},{"q":"What is the writer's overall view?","opts":["Bike lanes and parks are a waste of money.","Only national governments can solve the problem.","The critics make fair points, but adapting cities is worth it."],"a":2}]},"lang":[{"e":"phase out","t":"PV","d":"to stop using something gradually, over a period of time","x":"The city plans to phase out diesel buses by the end of the decade.","s":"phase OUT"},{"e":"switch to","t":"PV","d":"to change from one thing to another","x":"A lot of delivery companies are switching to electric bikes.","s":"SWITCH to"},{"e":"come up with","t":"PV","d":"to think of an idea, plan, or solution","x":"The students came up with a clever way to reduce food waste.","s":"come UP with"},{"e":"a drop in the bucket","t":"ID","d":"a very small amount compared with what is needed","x":"Ten new trees are a drop in the bucket for a city this size.","s":"a DROP in the BUCKet","uk":"UK: a drop in the ocean"},{"e":"the tip of the iceberg","t":"ID","d":"a small, visible part of a much bigger problem","x":"The flooding last winter was just the tip of the iceberg.","s":"the TIP of the ICEberg"},{"e":"a vicious cycle","t":"ID","d":"a situation where one problem causes another that makes the first one worse","x":"More traffic leads to more roads, which leads to more traffic. It's a vicious cycle.","s":"a VIcious CYcle","uk":"UK: a vicious circle"},{"e":"green spaces","t":"COL","d":"parks and areas with grass and trees in a city","x":"Our neighborhood really needs more green spaces for kids.","s":"GREEN SPAces"},{"e":"public transportation","t":"COL","d":"buses, trains, and subways that everyone can use","x":"If public transportation were faster, I'd sell my car.","s":"PUBlic transporTAtion","uk":"UK: public transport"},{"e":"extreme weather","t":"COL","d":"very dangerous or unusual weather, like heat waves, heavy rain, or strong storms","x":"Extreme weather is becoming more common in many parts of the world.","s":"exTREME WEAther"},{"e":"in the long run","t":"PREP","d":"after a long period of time; in the end","x":"Solar panels are expensive at first, but they save money in the long run.","s":"in the LONG RUN"},{"e":"be vulnerable to","t":"PREP","d":"to be easily hurt or damaged by something","x":"Cities near the coast are vulnerable to flooding.","s":"be VULnerable to"},{"e":"in favor of","t":"PREP","d":"supporting an idea or plan","x":"Most people in my building are in favor of the new bike lane.","s":"in FAvor of","uk":"UK: in favour of"}],"func":{"title":"Giving opinions and challenging politely","when":"Use these in discussions where people may not agree, like a class debate or a neighborhood meeting.","phrases":[{"p":"As far as I'm concerned, …","use":"giving a strong personal opinion"},{"p":"The way I see it, …","use":"giving your opinion"},{"p":"I'm all for…, but…","use":"supporting an idea but adding a concern"},{"p":"I see where you're coming from, but…","use":"showing you understand before you disagree"},{"p":"That's a fair point, but have you considered…?","use":"challenging politely with a new argument"},{"p":"I'm not so sure about that.","use":"disagreeing softly"},{"p":"What makes you say that?","use":"asking someone to explain their opinion"},{"p":"Correct me if I'm wrong, but…","use":"politely questioning a fact"},{"p":"That's exactly what I was thinking.","use":"agreeing strongly"},{"p":"Let's agree to disagree.","use":"ending a disagreement in a friendly way"}],"task":"In pairs, A thinks the city should replace one lane of car traffic on a busy avenue with a bike lane; B thinks it's a bad idea. Discuss for 3 minutes. Each of you must use at least four phrases, including one to show understanding and one to challenge politely. At the end, try to agree on one compromise."},"pron":{"focus":"Sentence stress: content words","explain":"In English, we stress the important words (nouns, main verbs, adjectives, and negatives) and say the small grammar words (a, the, to, of, are) quickly and weakly. This creates the natural rhythm of English.","tip":"Tap the table on each stressed syllable. The time between taps should feel about the same, even when there are more small words in between.","lines":[{"t":"A few new parks are just a drop in the bucket.","m":"A FEW NEW PARKS are just a DROP in the BUCKet."},{"t":"Heat waves are just the tip of the iceberg.","m":"HEAT waves are just the TIP of the ICEberg."},{"t":"The city plans to phase out diesel buses.","m":"The CIty PLANS to phase OUT DIEsel BUSes."},{"t":"Bike lanes save money in the long run.","m":"BIKE lanes SAVE MONey in the LONG RUN."},{"t":"Are most people in favor of more green spaces?","m":"Are MOST PEOple in FAvor of more GREEN SPAces↗?"}]},"acts":[{"type":"agree","items":["Cars should be banned from city centers on weekends.","Every new building should have a green roof or solar panels.","Public transportation should be free for everyone.","Working from home is the best way to reduce rush-hour traffic.","It's better to live in a small apartment in the city than in a big house in the suburbs.","Cities should plant trees instead of building more parking lots.","It's easier to live sustainably in a city than in the countryside."]},{"type":"roleplay","cards":[{"sit":"A neighborhood meeting about turning a parking lot into a small park.","a":"You own a small shop next to the parking lot. You're worried your customers won't have anywhere to park. Explain your concerns and ask about alternatives.","b":"You live nearby with two small children, and there's no green space in the area. Persuade A that the park is a good idea and suggest a compromise."},{"sit":"Two coworkers discuss a new company policy: no more free parking, but free public transportation passes for everyone.","a":"You live far from the office, and the bus takes twice as long as driving. Explain the problem politely and ask for a solution.","b":"You work in HR. Explain the reasons for the policy and look for solutions together (flexible hours, carpooling, working from home some days)."},{"sit":"Two roommates are choosing a new apartment.","a":"You want a cheaper, bigger apartment in the suburbs with a small garden. You don't mind driving.","b":"You want a smaller, more expensive apartment near a subway station so you can sell the car. Try to reach an agreement."}]},{"type":"pitch","brief":"Your city has a small budget to make one neighborhood cooler and greener. In groups, choose one idea, prepare a 90-second pitch, and present it to the \"city council\" (the rest of the class). The council asks questions and then votes, but nobody can vote for their own group.","ideas":["Rooftop gardens on schools and public buildings","A car-free main avenue every Sunday","Shaded bus stops and free drinking fountains on every main street","A free bike-sharing program for students","Painting roofs white to reflect the sun"],"questions":["How much will it cost, and who will pay for it?","Who benefits the most from your idea?","What problems could it cause for local businesses or drivers?","How will we know if it's working?","Why is your idea better than the others?"]}],"ex":{"gap":{"items":[{"s":"Many coastal cities are ___ flooding as sea levels rise.","a":"vulnerable to"},{"s":"The country plans to ___ its coal power plants over the next twenty years.","a":"phase out"},{"s":"Our company ___ electric cars last year, and we've saved a lot on fuel.","a":"switched to"},{"s":"Recycling one bottle is ___, but if millions of people do it, it adds up.","a":"a drop in the bucket"},{"s":"Solar panels are expensive at first, but they save you money ___.","a":"in the long run"},{"s":"The students ___ a great idea to reduce food waste in the cafeteria.","a":"came up with"}]},"match":{"pairs":[["the tip of the iceberg","a small visible part of a much bigger problem"],["a vicious cycle","a problem that causes another problem, which makes the first one worse"],["green spaces","parks and areas with grass and trees in a city"],["extreme weather","heat waves, heavy rain, and very strong storms"],["be in favor of","support an idea or plan"],["public transportation","buses, trains, and subways that everyone can use"]]},"fix":{"items":[{"s":"Most of my neighbors are in favor to the new park.","wrong":"in favor to","fix":"in favor of"},{"s":"Santiago is very vulnerable for droughts.","wrong":"vulnerable for","fix":"vulnerable to"},{"s":"The city is going to switch electric buses next year.","wrong":"switch electric","fix":"switch to electric"},{"s":"I use the public transportations every day.","wrong":"the public transportations","fix":"public transportation"}]}},"rec":{"prompt":"How could your city become a better place to live in the next ten years? Give two ideas and explain why.","model":"I think my city has improved a lot, but there's still plenty to do. First, I'd love to see more green spaces in every neighborhood, not just in a few. Trees make a huge difference in summer, and parks give people somewhere to relax and meet. Second, we need better public transportation. If the subway reached more areas, a lot of people would switch to it and leave their cars at home. Some people say these changes are just a drop in the bucket, but I disagree. In the long run, they'll make the city healthier and more pleasant for everyone.","use":["green spaces","public transportation","switch to","in the long run"]},"tips":[{"who":"teacher","t":"For the pitch, give groups 10 minutes to prepare and assign roles (speaker, note-taker, timekeeper). While the council asks questions, note good uses of the target language to praise at the end."},{"who":"student","t":"When you disagree, start with a softener like \"I see where you're coming from, but…\". It sounds more natural and keeps the discussion friendly."},{"who":"student","t":"Learn idioms as complete chunks with their usual verb: \"That's just a drop in the bucket,\" \"It's only the tip of the iceberg.\" Saying the whole chunk sounds much more natural."}],"photo":{"src":"https://live.staticflickr.com/7446/11968881095_87f839da65_b.jpg","by":"Paul Krueger","lic":"CC BY","url":"https://www.flickr.com/photos/30604571@N00/11968881095"}},{"id":"c1-environment","lv":"C1","tp":"environment","title":"Climate Policy & Responsibility","goals":["debate who should take responsibility for tackling climate change using precise, nuanced language","evaluate the trade-offs of different climate policies in a balanced, non-partisan way","hedge and qualify your opinions so you sound measured and credible"],"warm":["Who has the most power to reduce emissions: individuals, companies, or governments?","Have you ever changed a habit because of its environmental impact? Did it feel worthwhile?","Would you pay more for a product if the extra money went toward cutting emissions?","How much should today's adults sacrifice for future generations?"],"model":{"kind":"dialogue","title":"The Climate Question: Who Pays?","intro":"On a radio show, host Laura talks to Martín, an economist, and Priya, an environmental scientist, about responsibility for climate action.","lines":[{"sp":"Laura","t":"Let's start with the big question. When it comes to climate change, who should [[shoulder the burden]]: individuals, companies, or governments?"},{"sp":"Martín","t":"Honestly, I think it's a mistake to frame it as an either-or question. [[There's no silver bullet]]. Individual choices matter, but they won't get us very far without the right incentives."},{"sp":"Priya","t":"I'd broadly agree. That said, I'm wary of putting too much on consumers. Most people can't choose how their electricity is generated. Large emitters need to [[be held accountable for]] what they release."},{"sp":"Laura","t":"Some would argue that a carbon tax does exactly that."},{"sp":"Martín","t":"In theory, yes. But companies tend to [[pass on]] the cost to consumers, and lower-income households can end up paying proportionally more. Any serious policy has to [[factor in]] who gets hit hardest."},{"sp":"Priya","t":"Which is why some countries return part of the revenue to households. It's not perfect, but it addresses that concern."},{"sp":"Laura","t":"What about companies that announce ambitious climate targets?"},{"sp":"Priya","t":"Some are genuinely changing. Others just [[pay lip service to]] sustainability: a glossy report, a green logo, and business as usual."},{"sp":"Martín","t":"To be fair, regulation can have [[unintended consequences]], too. If the rules in one country are much stricter, production may simply move somewhere with weaker standards."},{"sp":"Laura","t":"So how can governments [[strike a balance]]?"},{"sp":"Priya","t":"By setting clear long-term goals, so businesses can plan ahead. What we can't afford is to keep [[kicking the can down the road]]."},{"sp":"Martín","t":"Agreed, although I'd add that people won't accept policies that come [[at the expense of]] their jobs. The transition has to be seen as fair, or it won't last."}],"questions":[{"q":"What is Martín's main concern about carbon taxes?","opts":["They are too complicated to collect.","The cost may be passed on to consumers and hit lower-income households hardest.","They have never been tried anywhere."],"a":1},{"q":"What does Priya criticize some companies for?","opts":["Talking about sustainability without really changing.","Refusing to publish any reports.","Moving all their factories abroad."],"a":0},{"q":"What do both guests seem to agree on?","opts":["Individuals should carry most of the responsibility.","Regulations should be removed to protect jobs.","No single measure is enough, and delaying action is a mistake."],"a":2}]},"lang":[{"e":"shy away from","t":"PV","d":"to avoid something because it is difficult or unpleasant","x":"Politicians often shy away from unpopular measures like fuel taxes.","s":"SHY aWAY from"},{"e":"factor in","t":"PV","d":"to include something when you calculate or decide something","x":"When you compare the options, you have to factor in the cost of doing nothing.","s":"FACtor IN"},{"e":"pass on","t":"PV","d":"to make someone else pay a cost (pass something on to someone)","x":"If fuel taxes go up, airlines will simply pass the cost on to passengers.","s":"pass ON"},{"e":"kick the can down the road","t":"ID","d":"to delay dealing with a problem, leaving it for later","x":"If we keep kicking the can down the road, the problem will only get more expensive.","s":"KICK the CAN down the ROAD"},{"e":"there's no silver bullet","t":"ID","d":"there is no single, simple solution to a complex problem","x":"There's no silver bullet for climate change; we need a mix of policies.","s":"there's NO SILver BULLet"},{"e":"pay lip service to","t":"ID","d":"to say you support something without doing much to help it","x":"Some brands pay lip service to sustainability but change very little.","s":"pay LIP SERvice to"},{"e":"shoulder the burden","t":"COL","d":"to accept responsibility for a difficult task or cost","x":"Why should young people shoulder the burden of decisions they didn't make?","s":"SHOULder the BURden"},{"e":"unintended consequences","t":"COL","d":"results of an action that nobody planned or expected","x":"In some places, banning plastic bags had an unintended consequence: people bought more plastic trash bags.","s":"uninTENDed CONsequences"},{"e":"strike a balance","t":"COL","d":"to find a reasonable middle point between two different needs","x":"We need to strike a balance between economic growth and protecting nature.","s":"STRIKE a BALance"},{"e":"at the expense of","t":"PREP","d":"in a way that harms or costs something else","x":"Growth shouldn't come at the expense of clean air.","s":"at the exPENSE of"},{"e":"be accountable for","t":"PREP","d":"to be responsible for something and have to explain it","x":"Companies should be held accountable for the pollution they cause.","s":"be acCOUNTable for"},{"e":"in light of","t":"PREP","d":"because of; after considering (new information)","x":"In light of the new data, the city updated its flood plans.","s":"in LIGHT of"}],"func":{"title":"Hedging and qualifying your opinions","when":"Use these to sound measured and credible when you discuss complex or sensitive issues.","phrases":[{"p":"I'd broadly agree, although…","use":"agreeing in general, with a reservation"},{"p":"To some extent, …","use":"limiting how far you agree"},{"p":"That said, …","use":"introducing a contrasting point"},{"p":"It could be argued that…","use":"presenting a view without fully owning it"},{"p":"There's a case to be made for…","use":"recognizing that an argument has some merit"},{"p":"I'm wary of…","use":"expressing caution about an idea"},{"p":"It's not as clear-cut as it seems.","use":"showing that an issue is complex"},{"p":"To be fair, …","use":"acknowledging the other side's point"},{"p":"As I understand it, …","use":"signaling that your knowledge may be limited"},{"p":"Where I'd push back is…","use":"disagreeing with one specific point"}],"task":"In pairs, discuss this question for 3 minutes: \"Should flying be more expensive to reduce emissions?\" You can't answer with a simple \"yes\" or \"no\"; you must use at least five different phrases. Your partner listens, checks off each phrase they hear, and then tells you which point sounded most convincing."},"pron":{"focus":"Chunking and pausing in longer sentences","explain":"In long, complex sentences, fluent speakers divide their ideas into chunks (thought groups) with a short pause between them. The key word in each chunk gets the main stress. This makes your argument easier to follow and gives you time to think.","tip":"Before you speak, mark the pauses in the sentence with a pencil. Read it slowly with the pauses, then at normal speed, still keeping the pauses.","lines":[{"t":"There's no silver bullet, so we need a mix of policies.","m":"There's no SILver BULLet, | so we NEED a MIX of POLicies."},{"t":"In light of the new data, governments can't keep kicking the can down the road.","m":"In LIGHT of the new DAta, | GOVernments can't KEEP | KICKing the CAN down the ROAD."},{"t":"Companies should be held accountable for their emissions, not just their promises.","m":"COMpanies should be held acCOUNTable for their eMISsions, | NOT just their PROMises."},{"t":"To be fair, every policy has unintended consequences.","m":"To be FAIR, | EVery POLicy has uninTENDed CONsequences."},{"t":"We need to strike a balance between economic growth and environmental protection.","m":"We NEED to STRIKE a BALance | between ecoNOMic GROWTH | and environMENtal proTECtion."}]},"acts":[{"type":"devil","motions":["Individuals have no real responsibility for climate change; it's entirely up to governments and corporations.","Countries that industrialized first should pay most of the cost of fighting climate change.","Flying should be rationed: everyone gets a fixed number of flights per year.","Nuclear power is essential for a low-carbon future.","Protecting jobs today matters more than meeting long-term climate targets.","Companies that make misleading green claims should face heavy fines."]},{"type":"expert","topic":"The real cost of going carbon neutral","expert":"You are an energy economist. You support climate action, but you are honest about costs, trade-offs, and uncertainty. Use hedging language, give examples, and avoid simple answers or political slogans.","journalists":"You are journalists from three different media: a business newspaper, a youth climate blog, and a rural radio station. Ask tough follow-up questions, and push the expert politely when an answer is vague.","questions":["Who will pay for the transition, and is that fair?","What happens to workers in mining or fossil-fuel regions?","Why should a small country act if its share of global emissions is tiny?","Are electric cars really cleaner if the electricity comes from coal?","Why should my generation pay for problems created by previous ones?","Which popular climate policy do you think is overrated, and why?"]},{"type":"ranking","task":"Your group advises a government with a limited budget. Rank these measures from most to least effective for your country, considering cost, fairness, and public support. You must reach a group consensus.","items":["A carbon tax, with part of the money returned to households","Subsidies for solar panels and home insulation","A ban on sales of new gasoline and diesel cars from 2035","Major investment in public transportation","Strict rules against misleading \"green\" advertising","Large-scale forest protection and tree planting","Climate education in every school"]}],"ex":{"gap":{"items":[{"s":"Politicians often ___ unpopular measures like fuel taxes, especially before an election.","a":"shy away from"},{"s":"When you calculate the cost of the project, you also have to ___ the cost of doing nothing.","a":"factor in"},{"s":"The big question is which group should ___ of paying for cleaner energy.","a":"shoulder the burden"},{"s":"Critics say the new rules protect the environment ___ local jobs.","a":"at the expense of"},{"s":"The city decided to update its flood defenses ___ the latest scientific report.","a":"in light of"},{"s":"Postponing the decision for another ten years would just be ___.","a":"kicking the can down the road"}]},"match":{"pairs":[["there's no silver bullet","no single solution will solve the whole problem"],["pay lip service to","say you support something without really acting on it"],["unintended consequences","results that nobody planned or expected"],["strike a balance","find a reasonable middle point between two needs"],["pass on (a cost)","make someone else pay for it"],["be accountable for","be responsible for something and have to explain it"]]},"fix":{"items":[{"s":"We need to strike a balance among growth and sustainability.","wrong":"among","fix":"between"},{"s":"Companies should be accountable of their emissions.","wrong":"accountable of","fix":"accountable for"},{"s":"Air pollution in the city has fallen a lot in the last years.","wrong":"in the last years","fix":"in recent years"},{"s":"Many governments are shying away to make difficult decisions.","wrong":"shying away to make","fix":"shying away from making"}]}},"rec":{"prompt":"Who should take the most responsibility for tackling climate change: individuals, companies, or governments? Give a balanced answer.","model":"It's tempting to blame one group, but I don't think it's that simple. There's no silver bullet. Individuals can make a difference, but most of us can't choose how our electricity is generated or how products are made. That's why I'd argue that governments and large companies should shoulder most of the burden. Governments can set clear long-term rules so businesses can plan, and companies should be held accountable for their emissions, not just their marketing. That said, policies need to be fair. If the costs fall mainly on low-income families, people will lose patience and the whole effort could fail. So for me, the key is to strike a balance between ambition and fairness.","use":["there's no silver bullet","shoulder the burden","be accountable for","strike a balance"]},"tips":[{"who":"teacher","t":"Remind students that the goal is to explore arguments, not to win a political fight: no names of parties or politicians. In the devil's advocate activity, clap to signal the switch after 90 seconds, then ask which side was harder to argue and why."},{"who":"student","t":"At C1, sounding credible matters more than sounding certain. Instead of \"Carbon taxes don't work,\" try \"The evidence on carbon taxes is mixed, although…\"."},{"who":"student","t":"When you see a news story about climate policy this week, summarize it out loud in 30 seconds, using at least two expressions from this lesson."}],"photo":{"src":"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvd2s1MDUxNzI3My1pbWFnZS1rcDZjcmpoay5qcGc.jpg","by":"rawpixel","lic":"CC0","url":"https://www.rawpixel.com/image/3338657/free-photo-image-cc0-creative-commons"}},{"id":"b1-health","lv":"B1","tp":"health","title":"Healthy Habits","goals":["talk about your daily habits for eating, sleeping, and exercise","use common phrasal verbs and expressions about a healthy lifestyle","keep a conversation going by showing interest and asking follow-up questions"],"warm":["What does a healthy day look like for you?","How many hours do you usually sleep on a weeknight?","What's your favorite way to stay active?","Is there a food you know is unhealthy but you love anyway?"],"model":{"kind":"dialogue","title":"Lunch Break","intro":"Coworkers Valentina and Tomás are having lunch together at the office.","lines":[{"sp":"Tomás","t":"Wow, a salad? What happened to the burgers?"},{"sp":"Valentina","t":"Ha! I'm trying to [[cut back on]] [[junk food]]. I felt tired all the time."},{"sp":"Tomás","t":"Really? Me too, but I think it's because I don't [[get a good night's sleep]]. I'm always on my phone until one in the morning."},{"sp":"Valentina","t":"That's not great. Do you [[work out]]?"},{"sp":"Tomás","t":"Not really. Honestly, I'm a total [[couch potato]] on weekends."},{"sp":"Valentina","t":"I used to be one, too! But last month I [[took up]] swimming. Now I go [[at least]] twice a week."},{"sp":"Tomás","t":"Seriously? Isn't it hard?"},{"sp":"Valentina","t":"At first, yes. I was so [[out of shape]]! But now I love it. It's really [[good for]] stress."},{"sp":"Tomás","t":"Hmm, maybe I should try something like that. But I'm not giving up burgers!"},{"sp":"Valentina","t":"You don't have to. Everything [[in moderation]], right? I still have pizza on Fridays."},{"sp":"Tomás","t":"Now that's a plan I can follow."},{"sp":"Valentina","t":"And try to put your phone away an hour before bed. It really helps me."}],"questions":[{"q":"Why is Valentina eating a salad?","opts":["The burgers were sold out.","She's trying to eat less junk food.","Tomás told her to eat healthier."],"a":1},{"q":"What does Tomás think is the reason he feels tired?","opts":["He doesn't sleep well because he uses his phone late.","He works out too much.","He doesn't eat enough salad."],"a":0},{"q":"How does Valentina feel about swimming now?","opts":["She finds it boring.","She wants to stop going.","She loves it, although it was hard at first."],"a":2}]},"lang":[{"e":"work out","t":"PV","d":"to exercise, especially at a gym","x":"I work out three times a week after work.","s":"work OUT"},{"e":"take up","t":"PV","d":"to start a new sport, hobby, or activity","x":"My mom took up yoga when she retired.","s":"take UP"},{"e":"cut back on","t":"PV","d":"to eat, drink, or use less of something","x":"I'm cutting back on coffee. Now I only have one cup a day.","s":"cut BACK on"},{"e":"couch potato","t":"ID","d":"a person who watches a lot of TV and doesn't exercise","x":"In winter, I turn into a real couch potato.","s":"COUCH poTAto"},{"e":"be out of shape","t":"ID","d":"to be physically unfit","x":"I ran for the bus and couldn't breathe. I'm so out of shape!","s":"be OUT of SHAPE"},{"e":"take it easy","t":"ID","d":"to relax and not work too hard","x":"I'm going to take it easy this weekend and just read.","s":"TAKE it EAsy"},{"e":"get a good night's sleep","t":"COL","d":"to sleep well for enough hours","x":"I can't concentrate if I don't get a good night's sleep.","s":"get a GOOD night's SLEEP"},{"e":"junk food","t":"COL","d":"unhealthy food, like chips, candy, and fast food","x":"There's too much junk food in vending machines.","s":"JUNK food"},{"e":"a balanced diet","t":"COL","d":"eating different kinds of healthy food in the right amounts","x":"A balanced diet includes plenty of fruit and vegetables.","s":"a BALanced DIet"},{"e":"be good for","t":"PREP","d":"to have a positive effect on someone or something","x":"Walking is good for your body and your mind.","s":"be GOOD for"},{"e":"in moderation","t":"PREP","d":"not too much; in reasonable amounts","x":"Chocolate is fine in moderation.","s":"in modeRAtion"},{"e":"at least","t":"PREP","d":"not less than (a number or amount)","x":"I try to walk at least 30 minutes a day.","s":"at LEAST"}],"func":{"title":"Showing interest and keeping the conversation going","when":"Use these when someone tells you about their life, in small talk with coworkers, friends, or classmates.","phrases":[{"p":"Really? / Seriously?","use":"showing surprise"},{"p":"No way!","use":"showing strong surprise (informal)"},{"p":"That's great! / Good for you!","use":"reacting to good news"},{"p":"Oh no, that's too bad.","use":"reacting to bad news"},{"p":"Same here. / Me too.","use":"saying you have the same experience"},{"p":"I know what you mean.","use":"showing you understand"},{"p":"How did you get into that?","use":"asking how someone started an activity"},{"p":"How's it going so far?","use":"asking about someone's progress"},{"p":"What's it like?","use":"asking for a description"}],"task":"In pairs, Student A talks for 2 minutes about a healthy (or unhealthy!) habit. Student B can only react and ask follow-up questions (no talking about their own habits!), using at least five phrases. Then swap roles."},"pron":{"focus":"Weak forms: for, to, at, of, a","explain":"Small grammar words are usually unstressed in natural speech, and their vowel becomes a short, relaxed sound called schwa /ə/: \"for\" sounds like /fər/, \"to\" like /tə/, and \"of\" like /əv/. The important words around them are louder and longer.","tip":"Don't pronounce every word clearly. Say the important words strongly and let the small words almost disappear between them. It sounds more natural, not less correct.","lines":[{"t":"Swimming is good for stress.","m":"SWIMming is GOOD for STRESS."},{"t":"I'm trying to cut back on junk food.","m":"I'm TRYing to cut BACK on JUNK food."},{"t":"I go at least twice a week.","m":"I GO at LEAST TWICE a WEEK."},{"t":"I was so out of shape.","m":"I was SO OUT of SHAPE."},{"t":"Try to get a good night's sleep.","m":"TRY to get a GOOD night's SLEEP."}]},"acts":[{"type":"roulette","items":["What time do you usually go to bed and get up?","Have you ever taken up a new sport? How did it go?","What junk food is the hardest for you to resist?","Do you ever skip breakfast? Why?","When was the last time you felt really out of shape?","What do you do to take it easy after a long day?","Are you a couch potato on the weekend, or are you always busy?","What healthy habit would you like to start this month?","What's a typical healthy meal in your country?","Do you prefer working out alone or with friends?"]},{"type":"minute","items":["Your favorite way to relax","A sport or activity you'd like to take up","Your perfect weekend breakfast","Your sleep routine","A healthy habit you learned from your family","The junk food you love the most","A time you felt really out of shape"]},{"type":"fluency","topics":["Describe your typical day. How healthy is it?","Tell the story of a time you tried to change a habit. Did it work?","Talk about a sport or activity you enjoyed as a child.","Describe a meal you love and when you usually eat it.","Describe your ideal relaxing weekend."]}],"ex":{"gap":{"items":[{"s":"I ___ at the gym three times a week, usually after work.","a":"work out"},{"s":"Last year my dad ___ cycling, and now he rides every Sunday.","a":"took up"},{"s":"I'm trying to ___ coffee. Now I only have one cup a day.","a":"cut back on"},{"s":"I haven't exercised in months, so I'm really ___ (= not physically fit).","a":"out of shape"},{"s":"I walk ___ 20 minutes a day, even when it rains.","a":"at least"},{"s":"Chocolate is OK ___. Just don't eat a whole bar every day!","a":"in moderation"}]},"match":{"pairs":[["couch potato","a person who watches a lot of TV and doesn't exercise"],["take it easy","relax and not work too hard"],["junk food","unhealthy food like chips, candy, and fast food"],["a balanced diet","different kinds of healthy food in the right amounts"],["get a good night's sleep","sleep well for enough hours"],["be good for","have a positive effect on"]]},"fix":{"items":[{"s":"I try to make exercise every day.","wrong":"make exercise","fix":"exercise"},{"s":"Sleeping well is good to your health.","wrong":"good to","fix":"good for"},{"s":"Last year I took up to run.","wrong":"took up to run","fix":"took up running"},{"s":"Yesterday I didn't sleep good.","wrong":"sleep good","fix":"sleep well"}]}},"rec":{"prompt":"Describe your daily habits. What do you do to stay healthy, and what would you like to change?","model":"I think my habits are OK, but not perfect. I usually work out twice a week. I took up running last year, and now I go with a friend on Saturdays. I try to eat well, but I'm a big fan of empanadas, so I eat them in moderation! The thing I really want to change is my sleep. I go to bed too late because I watch shows on my laptop. This month I want to turn it off at eleven and get a good night's sleep. Wish me luck!","use":["work out","take up","in moderation","get a good night's sleep"]},"tips":[{"who":"teacher","t":"Health can be personal. Let students choose what to share, avoid comments about anyone's body or weight, and keep the focus on habits and routines, not appearance."},{"who":"student","t":"Notice the difference between \"work out\" (verb: I work out on Mondays) and \"workout\" (noun: That was a great workout!). Try to use both this week."},{"who":"student","t":"In the 4/3/2 activity, notice how your third version is faster and smoother. Record the last round and compare it with your first try next week."}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/2TUFJQXQ8Q.jpg","by":"Nirzar Pangarkar","lic":"CC0","url":"https://stocksnap.io/photo/bananas-blueberries-2TUFJQXQ8Q"}},{"id":"b2-health","lv":"B2","tp":"health","title":"Stress & Well-being","goals":["talk about stress and how you deal with it using idiomatic language","discuss work-life balance and what helps people feel well","show sympathy and offer support in a natural, non-judgmental way"],"warm":["What stresses you out the most: work, money, traffic, or something else?","What do you do to relax at the end of the day?","Do you think people today are more stressed than our parents were at our age?","Who do you talk to when you're having a hard time?"],"model":{"kind":"dialogue","title":"Coffee After Work","intro":"Sofía meets her old college friend Matt, an American who lives in Santiago, at a café after work.","lines":[{"sp":"Matt","t":"You look exhausted. Is everything OK?"},{"sp":"Sofía","t":"Honestly? I'm [[at the end of my rope]]. We have a huge project due Friday, and my boss keeps adding new tasks."},{"sp":"Matt","t":"That sounds rough. You've [[had a lot on your plate]] lately."},{"sp":"Sofía","t":"Yeah. I'm constantly [[under pressure]], and I can't sleep. I've been [[on edge]] all week."},{"sp":"Matt","t":"I know the feeling. A couple of years ago, I almost [[burned out]] at my old job. I was working twelve-hour days, and it really [[took a toll on]] me."},{"sp":"Sofía","t":"Seriously? What did you do?"},{"sp":"Matt","t":"First, I talked to my manager about my workload. It was awkward, but it helped. I also started going to a boxing class twice a week. It's a great way to [[blow off steam]]."},{"sp":"Sofía","t":"Boxing? You? I can't picture that."},{"sp":"Matt","t":"Ha! Neither could I. And at night, I don't check emails anymore. I cook, listen to music, and just [[wind down]]."},{"sp":"Sofía","t":"I'm terrible at that. My phone is always buzzing."},{"sp":"Matt","t":"Maybe start small and turn off notifications after eight. A better [[work-life balance]] doesn't happen overnight."},{"sp":"Sofía","t":"You're right. Actually, I might [[take a mental health day]] after this deadline."},{"sp":"Matt","t":"Good idea. And if you ever need to vent, you know where to find me."}],"questions":[{"q":"Why is Sofía so stressed?","opts":["She lost her job last week.","She has a big deadline, and her boss keeps giving her more work.","She had an argument with Matt."],"a":1},{"q":"Which of these did Matt NOT do to deal with his stress?","opts":["He took up boxing.","He talked to his manager about his workload.","He started working longer hours."],"a":2},{"q":"What does Sofía decide to do at the end?","opts":["Take a day off to rest after the deadline.","Go to a boxing class with Matt.","Ask her boss for a promotion."],"a":0}]},"lang":[{"e":"stress out","t":"PV","d":"to make someone feel worried and tense (also: be stressed out)","x":"Traffic in the morning really stresses me out.","s":"stress OUT"},{"e":"wind down","t":"PV","d":"to relax gradually after a busy or stressful time","x":"I read for half an hour to wind down before bed.","s":"wind DOWN"},{"e":"burn out","t":"PV","d":"to become completely exhausted from working too hard for too long","x":"If you never take a vacation, you'll burn out.","s":"burn OUT"},{"e":"have a lot on your plate","t":"ID","d":"to have many things to deal with","x":"I can't help this week. I have a lot on my plate.","s":"have a LOT on your PLATE"},{"e":"be at the end of your rope","t":"ID","d":"to have no patience or energy left","x":"After three sleepless nights with the baby, they were at the end of their rope.","s":"be at the END of your ROPE","uk":"UK: be at the end of your tether"},{"e":"blow off steam","t":"ID","d":"to do something that helps you release strong emotions or energy","x":"I go running after work to blow off steam.","s":"BLOW off STEAM","uk":"UK: let off steam"},{"e":"work-life balance","t":"COL","d":"a healthy mix of time for work and for your personal life","x":"I took a lower salary for a better work-life balance.","s":"WORK-LIFE BALance"},{"e":"take a toll on","t":"COL","d":"to have a bad effect on someone or something over time","x":"The long commute started to take a toll on her energy.","s":"take a TOLL on"},{"e":"take a mental health day","t":"COL","d":"to take a day off work or school to rest and recover from stress","x":"Some companies let employees take a mental health day when they need it.","s":"take a MENtal HEALTH day"},{"e":"under pressure","t":"PREP","d":"feeling that you have to do a lot, often quickly or very well","x":"Some people work best under pressure.","s":"UNder PRESsure"},{"e":"on edge","t":"PREP","d":"nervous and easily upset","x":"I was on edge all morning before the interview.","s":"on EDGE"},{"e":"cope with","t":"PREP","d":"to deal successfully with a difficult situation","x":"Everyone has their own way to cope with stress.","s":"COPE with"}],"func":{"title":"Showing sympathy and offering support","when":"Use these when a friend or coworker tells you they're having a hard time.","phrases":[{"p":"That sounds rough.","use":"showing sympathy (informal)"},{"p":"I'm sorry to hear that.","use":"showing sympathy (neutral)"},{"p":"That must be really hard.","use":"showing you understand the situation"},{"p":"No wonder you're tired!","use":"showing that their feelings make sense"},{"p":"I know the feeling.","use":"saying you've had a similar experience"},{"p":"Is there anything I can do?","use":"offering help"},{"p":"Have you thought about…?","use":"gently suggesting an idea"},{"p":"It might help to…","use":"making a soft suggestion"},{"p":"Hang in there.","use":"encouraging someone to keep going"},{"p":"I'm here if you need to talk.","use":"offering support"}],"task":"In pairs, A chooses a stressful situation (too much work, noisy neighbors, an exam next week, moving to a new city) and explains it. B listens and responds using at least four phrases: first show sympathy, then make one gentle suggestion. Swap roles after 90 seconds."},"pron":{"focus":"Intonation: sounding sympathetic","explain":"When you show sympathy, your voice should fall at the end (↘) and sound soft and warm. A flat, fast tone can sound bored or even sarcastic. When you offer help with a yes/no question, your voice usually rises at the end (↗).","tip":"Slow down a little and make the stressed word longer: \"That sounds ROUGH.\" Exaggerate the fall when you practice, then make it more natural.","lines":[{"t":"That sounds rough.","m":"That sounds ROUGH↘."},{"t":"I'm sorry to hear that.","m":"I'm SORry to HEAR that↘."},{"t":"No wonder you're on edge!","m":"NO WONder you're on EDGE↘!"},{"t":"Is there anything I can do?","m":"Is there ANything I can DO↗?"},{"t":"You've had a lot on your plate lately.","m":"You've had a LOT on your PLATE | LATEly↘."}]},"acts":[{"type":"agree","items":["A little stress is actually good for you.","Companies should ban work emails after 7 p.m.","Social media is the biggest cause of stress for young people.","A four-day workweek would make people happier and more productive.","It's better to talk about your problems than to keep them to yourself.","Taking a mental health day is just as valid as taking a sick day.","Money can't buy happiness, but it can reduce stress."]},{"type":"roleplay","cards":[{"sit":"An employee asks their manager for help with their workload.","a":"You're the employee. You've been under pressure for weeks and you're close to burning out. Explain the situation calmly and suggest one or two changes.","b":"You're the manager. You value this employee, but the team is short-staffed. Listen, show sympathy, and try to find a realistic solution together."},{"sit":"A friend is stressed about final exams.","a":"You have three exams next week and feel you can't cope. You haven't been sleeping well.","b":"You're a supportive friend. Show sympathy first, then help A make a simple plan that includes time to study and time to rest."},{"sit":"Two roommates disagree about noise in the evening.","a":"You work from home and need quiet until 7 p.m. Your roommate's loud music really stresses you out.","b":"You play loud music after work to blow off steam. You don't want to stop completely. Find a compromise."}]},{"type":"balloon","sit":"A hot-air balloon is losing height, and only one passenger can stay on board. Each of you is a different \"stress expert.\" Explain why your approach helps people cope with stress better than the others. After everyone speaks, the group votes.","roles":[{"name":"A yoga teacher","why":"breathing, a calm mind, a flexible body"},{"name":"A therapy dog","why":"unconditional love, daily walks, makes everyone smile"},{"name":"A comedian","why":"laughter, perspective, not taking life too seriously"},{"name":"A chef","why":"good food, cooking as a way to wind down, sharing meals"},{"name":"A time-management coach","why":"less chaos, better planning, more free time"},{"name":"A travel agent","why":"a change of scenery, vacations, new experiences"}]}],"ex":{"gap":{"items":[{"s":"I've been ___ all week because I'm waiting to hear about the job interview.","a":"on edge"},{"s":"When I'm really angry, I go to the gym and hit a punching bag to ___ (= release strong emotions).","a":"blow off steam"},{"s":"Before bed, I read for twenty minutes to ___ (= relax gradually).","a":"wind down"},{"s":"Working twelve-hour days for months will ___ your energy and your relationships.","a":"take a toll on"},{"s":"She worked nonstop for two years and finally ___. Now she's taking three months off.","a":"burned out"},{"s":"Many employees struggle to ___ constant emails and messages.","a":"cope with"}]},"match":{"pairs":[["have a lot on your plate","have many things to deal with"],["be at the end of your rope","have no patience or energy left"],["stress out","make someone feel worried and tense"],["work-life balance","a healthy mix of time for work and for personal life"],["under pressure","feeling you have to do a lot, often quickly"],["take a mental health day","take a day off to rest and recover from stress"]]},"fix":{"items":[{"s":"I'm very stressful because of my exams.","wrong":"stressful","fix":"stressed"},{"s":"It's difficult to relax me after work.","wrong":"relax me","fix":"relax"},{"s":"Last year I was burn out, so I changed jobs.","wrong":"was burn out","fix":"was burned out"},{"s":"My boss puts me a lot of pressure.","wrong":"puts me a lot of pressure","fix":"puts a lot of pressure on me"}]}},"rec":{"prompt":"What stresses you out, and what do you do to cope with it? Talk for one minute.","model":"Like most people, I get stressed out at the end of the month, when I have a lot on my plate at work and bills to pay. When I'm under pressure, I tend to stop exercising and sleep badly, which only makes things worse. Over the years, I've learned a few tricks. First, I go for a long walk with my dog. It's the best way to blow off steam. Second, I try to wind down in the evening without screens. I make tea, read a novel, and leave my phone in the kitchen. It doesn't solve everything, but it definitely helps me cope.","use":["stress out","have a lot on your plate","blow off steam","wind down"]},"tips":[{"who":"teacher","t":"Stress can be a sensitive topic. Let students talk about \"people in general\" or an invented character if they prefer, and never push anyone to share personal problems. This lesson is about everyday stress, not medical advice."},{"who":"student","t":"\"Stressed\" describes how you feel; \"stressful\" describes the situation: \"My job is stressful, so I'm stressed.\" Say this sentence three times until it's automatic."},{"who":"student","t":"Notice how people react to bad news with short phrases like \"That sounds rough\" or \"Hang in there.\" Choose two and use them in your next real conversation."}],"photo":{"src":"https://images.pexels.com/photos/8374297/pexels-photo-8374297.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/woman-irritated-at-laptop-8374297/"}},{"id":"c1-health","lv":"C1","tp":"health","title":"Health, Science & Personal Choices","goals":["discuss health trends and scientific claims critically, using precise and nuanced language","debate the balance between personal freedom and public health measures","evaluate evidence and express different degrees of certainty"],"warm":["Where do you usually get health information: doctors, the news, social media, or friends?","Have you ever tried a wellness trend because everyone was talking about it? Was it worth it?","Do you track anything about your health, like steps or sleep? Why or why not?","How much should governments influence what people eat and drink?"],"model":{"kind":"text","title":"Should You Believe That Health Headline?","intro":"An opinion column by a science journalist in a weekend magazine.","paras":["Every week, a new headline promises that some food, supplement, or gadget will transform your health. Coffee is good for you; coffee is bad for you. Before you [[jump on the bandwagon]], it's worth asking a few simple questions about the evidence.","First, where does the claim come from? A single [[peer-reviewed study]] is a good start, but it's rarely the final word, especially if only a few dozen people took part. Glowing testimonials are even weaker: [[anecdotal evidence]] can be persuasive, but it can't tell us what would have happened anyway.","Second, remember that correlation is not causation. If people who follow a certain diet tend to live longer, the diet may be [[linked to]] better health, but researchers can't easily [[rule out]] other factors, such as income, exercise, or access to health care. Headlines, unfortunately, tend to skip that nuance.","None of this means science is unreliable. It means that individual results should be [[taken with a grain of salt]] until they're [[backed up]] by further research, and that it's unwise to overhaul your habits [[on the basis of]] a single news story. When a product's marketing is [[at odds with]] what most experts say, that's usually a red flag.","These questions go beyond our personal [[lifestyle choices]]. In 2016, Chile introduced black warning labels on foods high in sugar, salt, saturated fat, or calories, and studies later suggested that people bought fewer sugary drinks. Supporters see this as smart public health; critics worry about [[a slippery slope]] toward too much government control. Either way, the debate often [[boils down to]] two questions: how much do we trust the evidence, and who should decide?"],"questions":[{"q":"According to the writer, why is anecdotal evidence weak?","opts":["It is usually written by journalists.","It can't show what would have happened anyway.","It is always based on very large studies."],"a":1},{"q":"What is the writer's point about correlation and causation?","opts":["A link between a diet and better health doesn't prove the diet caused it.","Correlation is more reliable than causation.","Researchers can always control for income and exercise."],"a":0},{"q":"How does the writer present the debate about Chile's food labels?","opts":["As a clear success that everyone supports.","As a failure that should be reversed.","As a policy that some people support and others question."],"a":2}]},"lang":[{"e":"back up","t":"PV","d":"to support a claim with evidence or facts","x":"Are those claims backed up by any research?","s":"back UP"},{"e":"rule out","t":"PV","d":"to decide that something is not possible or not the cause","x":"The researchers couldn't rule out other explanations.","s":"rule OUT"},{"e":"boil down to","t":"PV","d":"to have something as the main or most basic point","x":"In the end, it all boils down to personal choice.","s":"boil DOWN to"},{"e":"jump on the bandwagon","t":"ID","d":"to join a popular trend because everyone else is doing it","x":"Half my office jumped on the cold-shower bandwagon last year.","s":"JUMP on the BANDwagon"},{"e":"take something with a grain of salt","t":"ID","d":"to not completely believe something","x":"I take most health advice on social media with a grain of salt.","s":"take something with a GRAIN of SALT","uk":"UK: take something with a pinch of salt"},{"e":"a slippery slope","t":"ID","d":"a first step that could lead to more extreme changes","x":"Some people see taxes on soda as a slippery slope.","s":"a SLIPpery SLOPE"},{"e":"anecdotal evidence","t":"COL","d":"information based on personal stories, not on scientific research","x":"\"It worked for my cousin\" is anecdotal evidence, not proof.","s":"anecDOtal EVidence"},{"e":"a peer-reviewed study","t":"COL","d":"research that other experts checked before it was published","x":"The article was based on a peer-reviewed study of 10,000 adults.","s":"a PEER-reviewed STUDy"},{"e":"lifestyle choices","t":"COL","d":"decisions about how you eat, sleep, exercise, and live","x":"Our lifestyle choices are shaped by money and time, not just willpower.","s":"LIFEstyle CHOIces"},{"e":"be linked to","t":"PREP","d":"to be connected with something (not always as its cause)","x":"Long working hours have been linked to poor sleep.","s":"be LINKED to"},{"e":"at odds with","t":"PREP","d":"different from or in conflict with","x":"The ad's claims are at odds with the actual research.","s":"at ODDS with"},{"e":"on the basis of","t":"PREP","d":"using something as the reason or evidence for a decision","x":"Don't change your routine on the basis of one headline.","s":"on the BAsis of"}],"func":{"title":"Evaluating evidence and expressing certainty","when":"Use these when you discuss studies, news stories, or claims you're not sure about.","phrases":[{"p":"The evidence strongly suggests that…","use":"expressing a high degree of certainty"},{"p":"By and large, experts agree that…","use":"referring to a general consensus"},{"p":"There's some evidence that…, but it's far from conclusive.","use":"expressing limited certainty"},{"p":"The jury's still out on…","use":"saying a question hasn't been decided yet"},{"p":"It's hard to say for sure, but…","use":"expressing uncertainty"},{"p":"That may well be true, but…","use":"conceding a point before adding a doubt"},{"p":"I'd want to see the data before…","use":"asking for evidence"},{"p":"That's a bit of a leap.","use":"saying a conclusion goes too far"},{"p":"It's a classic case of correlation, not causation.","use":"pointing out a logical flaw"},{"p":"Who funded the study?","use":"questioning the source"}],"task":"Your teacher (or partner) reads out a \"health headline\", for example: \"Chocolate lovers are smarter,\" \"Dog owners live longer,\" or \"Cold showers boost productivity.\" In pairs, take 2 minutes per headline to evaluate it, using at least four phrases. Then decide together: believe it, question it, or ignore it?"},"pron":{"focus":"Contrastive stress","explain":"When we contrast two ideas, we put extra stress on the words that are different, so the listener hears the contrast clearly. Words that are repeated or already known are not stressed. This is very common when you correct someone or compare two options.","tip":"Make the contrasted words a little louder, longer, and higher. Keep the rest of the sentence relatively flat and quiet.","lines":[{"t":"It's correlation, not causation.","m":"It's CORrelation, | NOT CAUsation."},{"t":"It's anecdotal evidence, not scientific evidence.","m":"It's anecDOtal evidence, | not SCIENtific evidence."},{"t":"The claim wasn't backed up by research; it was backed up by marketing.","m":"The claim WASN'T backed up by REsearch; | it was backed up by MARketing."},{"t":"Is it linked to diet, or to income?","m":"Is it linked to DIet↗, | or to INcome↘?"},{"t":"I'm not saying it's harmful; I'm saying it's unproven.","m":"I'm NOT saying it's HARMful; | I'm saying it's unPROVen."}]},"acts":[{"type":"speed","motions":["Governments should tax sugary drinks the same way they tax tobacco.","Health apps and smartwatches do more harm than good.","Employers should be allowed to reward staff for healthy lifestyle choices.","Influencers should need a qualification to give nutrition advice.","Living to 120 would be a blessing, not a curse.","When it comes to food and drink, personal freedom matters more than public health."]},{"type":"fishbowl","questions":["Why do health myths spread so easily, and who is responsible for stopping them?","Who should own the data from health apps and wearables: you, your doctor, or the company?","Is it fair for health insurance to cost more for people with unhealthy habits?","How much should we trust science when expert advice sometimes changes?","Are warning labels on food a smart nudge or an unnecessary intrusion?","Would you want to know your genetic risk for certain diseases? Why or why not?"]},{"type":"wyr","items":[["know your genetic risk for every disease","never find out"],["live to 100 with a strict daily routine","live to 80 doing whatever you like"],["have a doctor who is brilliant but cold","have a doctor who is average but caring"],["share all your health data to help medical research","keep it completely private"],["give up sugar for life","give up screens after 9 p.m. for life"],["trust a study paid for by a food company","trust your grandmother's advice"]]}],"ex":{"gap":{"items":[{"s":"The company's claims about its \"miracle\" tea were not ___ by any scientific research.","a":"backed up"},{"s":"Researchers can't ___ other explanations, such as differences in income.","a":"rule out"},{"s":"In the end, the whole debate ___ one question: who should decide what we eat?","a":"boils down to"},{"s":"Reviews from happy customers are just ___; they don't prove that a product works.","a":"anecdotal evidence"},{"s":"In several studies, lack of sleep has been ___ poor concentration.","a":"linked to"},{"s":"His advice is completely ___ what most experts recommend.","a":"at odds with"}]},"match":{"pairs":[["jump on the bandwagon","join a popular trend because everyone else is doing it"],["take something with a grain of salt","not completely believe something"],["a slippery slope","a first step that may lead to more extreme changes"],["a peer-reviewed study","research checked by other experts before publication"],["lifestyle choices","decisions about how you eat, sleep, exercise, and live"],["on the basis of","using something as the reason or evidence for a decision"]]},"fix":{"items":[{"s":"The study was based in only 20 people.","wrong":"based in","fix":"based on"},{"s":"Scientists did an investigation about sleep and memory.","wrong":"did an investigation about","fix":"did research on"},{"s":"Eating late at night is related with poor sleep.","wrong":"related with","fix":"related to"},{"s":"We need more evidences before we can draw any conclusions.","wrong":"evidences","fix":"evidence"}]}},"rec":{"prompt":"Should governments try to influence people's lifestyle choices, for example with food labels or taxes on sugary drinks? Give a balanced answer.","model":"It's a tricky one, and I think it boils down to where you draw the line. On the one hand, clear labels seem reasonable to me. Chile's black warning labels don't ban anything; they just give people information, and studies suggest people bought fewer sugary drinks afterward. On the other hand, I understand why some people see taxes as a slippery slope. If the government can tax soda, what's next? Personally, I'd support measures that inform people rather than punish them, but only on the basis of solid research, not headlines. And of course, I'd take any single study with a grain of salt.","use":["boil down to","a slippery slope","on the basis of","take something with a grain of salt"]},"tips":[{"who":"teacher","t":"Bring two or three real health headlines from this week's news. Let students evaluate them with the functional phrases before you reveal what the original study actually found. Keep the focus on how we judge claims, and don't give or invite personal medical advice."},{"who":"student","t":"Learn the \"evidence family\": evidence and research are uncountable (a piece of evidence, some research), but study is countable (a study, two studies). Getting these right instantly makes you sound more advanced."},{"who":"student","t":"Practice contrastive stress with your own opinions: \"I'm not against TECHnology; I'm against ADdiction.\" Record yourself and check that the contrasted words really stand out."}],"photo":{"src":"https://live.staticflickr.com/4361/37369085486_b4f54a316d_b.jpg","by":"forthwithlife","lic":"CC BY","url":"https://www.flickr.com/photos/154202282@N02/37369085486"}},{"id":"b1-media","lv":"B1","tp":"media","title":"News & Social Media","goals":["talk about how you get the news using common phrasal verbs and collocations","react to news stories and show interest when someone shares something","describe your social media habits and say how much you trust what you see online"],"warm":["How do you usually get the news: TV, radio, websites or social media?","How much time do you spend on social media every day?","What was the last news story that really surprised you?","Do you ever share news with your family or friends? How?"],"model":{"kind":"dialogue","title":"Did You See This?","intro":"Two coworkers, Camila and Ben, are having lunch together in the office kitchen.","lines":[{"sp":"Camila","t":"Ben, did you see the video of the dog driving a car? It's [[gone viral]]. Everyone's sharing it!"},{"sp":"Ben","t":"No! Where did you see it? Was it [[on the news]]?"},{"sp":"Camila","t":"No, I saw it this morning while I was [[scrolling through]] Instagram on the bus."},{"sp":"Ben","t":"Ha! I'm trying to use social media less. I was [[glued to my phone]] every night, and I couldn't sleep."},{"sp":"Camila","t":"Good for you. But how do you [[keep up with]] the news now?"},{"sp":"Ben","t":"I listen to a news podcast on my way to work, and I check one or two [[reliable sources]] at lunch."},{"sp":"Camila","t":"I usually get my news from my friends' posts, to be honest."},{"sp":"Ben","t":"Hmm, I'd [[take that with a grain of salt]]. A lot of those posts aren't true."},{"sp":"Camila","t":"You're right. Actually, now I'm not sure the dog video is real."},{"sp":"Ben","t":"Let's [[look it up]]. Oh, look. It's not real. Someone made it with an AI app."},{"sp":"Camila","t":"Oh no! Well, I still love it. I'm going to [[leave a comment]]: “Best fake video ever!”"},{"sp":"Ben","t":"Of course you are!"}],"questions":[{"q":"Where did Camila see the dog video?","opts":["On the TV news","On social media on the bus","In a news podcast"],"a":1},{"q":"How does Ben get his news now?","opts":["From a podcast and a few reliable websites","From his friends' posts","From the TV at night"],"a":0},{"q":"What do they discover about the video?","opts":["It's from a news website","It's very old","It was made with an AI app"],"a":2}]},"lang":[{"e":"scroll through","t":"PV","d":"to move down a screen to look at posts, news, photos, etc.","x":"I scroll through the news on my phone while I have breakfast.","s":"SCROLL through"},{"e":"keep up with","t":"PV","d":"to stay informed about something that is changing","x":"It's hard to keep up with the news when you're busy at work.","s":"keep UP with"},{"e":"look up","t":"PV","d":"to search for information in a dictionary or online","x":"If I don't understand a word in the article, I look it up.","s":"look UP"},{"e":"find out","t":"PV","d":"to discover a piece of information","x":"I found out about the earthquake on Instagram before it was on TV.","s":"find OUT"},{"e":"go viral","t":"ID","d":"to spread very quickly on the internet","x":"Her video of a singing parrot went viral overnight.","s":"go VIral"},{"e":"take something with a grain of salt","t":"ID","d":"to not believe something completely","x":"I take celebrity gossip with a grain of salt.","s":"take something with a GRAIN of SALT","uk":"UK: take something with a pinch of salt"},{"e":"glued to your phone","t":"ID","d":"looking at your phone all the time","x":"My teenage son is glued to his phone from morning to night.","s":"GLUED to your PHONE"},{"e":"breaking news","t":"COL","d":"news about something that is happening right now","x":"I got a breaking news alert about the storm on my phone.","s":"BREAKing NEWS"},{"e":"leave a comment","t":"COL","d":"to write your opinion under a post or article","x":"I never leave comments on news websites.","s":"leave a COMment"},{"e":"a reliable source","t":"COL","d":"a person or website you can trust for information","x":"Is that blog a reliable source, or is it just one person's opinion?","s":"a reLIable SOURCE"},{"e":"on the news","t":"PREP","d":"reported on TV or radio news programs","x":"Did you see the forest fires on the news last night?","s":"on the NEWS"},{"e":"addicted to","t":"PREP","d":"unable to stop using or doing something","x":"I think I'm a little addicted to short videos.","s":"adDICTed to"}],"func":{"title":"Reacting to news and showing interest","when":"Use these when someone tells you a piece of news or shares a story from the internet.","phrases":[{"p":"Did you hear about…?","use":"introducing a news story"},{"p":"Guess what!","use":"starting with surprising news"},{"p":"No way! / Really?","use":"showing surprise"},{"p":"That's amazing! / That's terrible!","use":"reacting with emotion"},{"p":"Oh, I didn't know that.","use":"receiving new information"},{"p":"What happened next?","use":"asking for more details"},{"p":"Where did you hear that?","use":"asking about the source"},{"p":"Are you sure that's true?","use":"showing doubt politely"},{"p":"Hmm, that sounds a little strange to me.","use":"showing doubt in a friendly way"}],"task":"Student A tells three short news stories from this week: two true and one invented. Student B reacts to each story with at least two phrases and asks where A heard it. Then B guesses which story is invented. Swap roles."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join the two words, so they sound like one long word. “Look it up” sounds like “loo-ki-tup”.","tip":"Read each sentence slowly with the links, then a little faster. Don't stop between the linked words.","lines":[{"t":"Let's look it up.","m":"Let's LOOK‿it‿UP."},{"t":"It went viral overnight.","m":"It went VIral‿overNIGHT."},{"t":"I found out about it on the news.","m":"I FOUND‿OUT‿aBOUT‿it‿on the NEWS."},{"t":"Take it with a grain of salt.","m":"TAKE‿it with‿a GRAIN‿of SALT."},{"t":"Did you leave a comment on it?","m":"Did you LEAVE‿a COMment‿on‿it↗?"}]},"acts":[{"type":"roulette","items":["What's the first app you open in the morning?","How do you keep up with the news in Chile and around the world?","Have you ever posted something and then deleted it? Why?","What kind of videos usually go viral in your country?","Which news sources do you think are the most reliable?","Do you ever leave comments on social media? What kind?","Are you glued to your phone, or can you go a whole day without it?","What's the best piece of news you've heard this year?","Do you follow any accounts that teach you something useful?","Should parents check their children's social media? Why or why not?"]},{"type":"wyr","items":[["get all your news from TV for a year","get all your news from social media for a year"],["have one post that goes viral","have 100 followers who love everything you post"],["read the news every morning","never read the news again"],["give up social media for a month","give up coffee for a month"],["only be able to post photos","only be able to post videos"],["know all the celebrity gossip","know all the sports results"]]},{"type":"taboo","cards":[{"w":"scroll through","taboo":["phone","screen","move"]},{"w":"keep up with","taboo":["news","informed","date"]},{"w":"go viral","taboo":["internet","share","popular"]},{"w":"breaking news","taboo":["new","now","TV"]},{"w":"glued to your phone","taboo":["stick","screen","always"]},{"w":"a reliable source","taboo":["trust","true","information"]},{"w":"find out","taboo":["discover","learn","know"]},{"w":"leave a comment","taboo":["write","post","opinion"]},{"w":"take something with a grain of salt","taboo":["believe","doubt","careful"]}]}],"ex":{"gap":{"items":[{"s":"My sister's video of her cat ___ and now it has two million views!","a":"went viral/has gone viral"},{"s":"Did you see the forest fires ___ last night? It was on every channel.","a":"on the news"},{"s":"I don't know what this word means. I'll ___ in the dictionary.","a":"look it up"},{"s":"Be careful with that website. It isn't ___.","a":"a reliable source"},{"s":"We interrupt this program for ___: a strong earthquake has just hit the north of the country.","a":"breaking news"},{"s":"It's hard to ___ the news when you're on vacation in the mountains with no internet.","a":"keep up with"}]},"match":{"pairs":[["find out","discover a piece of information"],["leave a comment","write your opinion under a post"],["breaking news","news about something happening right now"],["scroll through","move down a screen to see more posts"],["take it with a grain of salt","don't believe it completely"],["addicted to","unable to stop using or doing something"]]},"fix":{"items":[{"s":"The news are really bad today.","wrong":"news are","fix":"news is"},{"s":"I think I'm addicted of social media.","wrong":"addicted of","fix":"addicted to"},{"s":"I knew about the earthquake yesterday when I saw it on Instagram.","wrong":"knew about","fix":"found out about"},{"s":"I don't know that word. Can you look up it?","wrong":"look up it","fix":"look it up"}]}},"rec":{"prompt":"How do you keep up with the news? Talk about the apps, websites or programs you use and how much you trust them.","model":"To be honest, I don't watch the news on TV anymore. I usually keep up with the news on my phone. In the morning, I scroll through a couple of news apps while I'm having breakfast, and I listen to the radio in the car on my way to work. I trust the big newspapers more than social media, because I think they're more reliable sources. When I see a crazy story on Instagram or WhatsApp, I take it with a grain of salt. If it's important, I look it up on a news website. The only problem is that sometimes I'm glued to my phone for too long, so now I try to put it away at nine p.m.","use":["keep up with","scroll through","a reliable source","take something with a grain of salt"]},"tips":[{"who":"teacher","t":"Ask students to bring one surprising, non-political headline from this week. Real stories make the warm-up personal and current, and they're perfect for practicing the reaction phrases."},{"who":"student","t":"When you hear a useful expression in a video or podcast, write down the whole sentence, not just the words. You'll remember how to use it."},{"who":"student","t":"Change your phone's language to English for a week. You'll learn lots of everyday words like “share”, “follow”, “notifications” and “settings”."}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/OJXHDWMWV9.jpg","by":"Wilfred Iven","lic":"CC0","url":"https://stocksnap.io/photo/news-newspaper-OJXHDWMWV9"}},{"id":"b2-media","lv":"B2","tp":"media","title":"Fake News & Influencers","goals":["discuss fake news and influencer culture using idiomatic expressions","express doubt and skepticism politely when you hear a questionable claim","explain how to check whether a post or online claim is genuine"],"warm":["Do you follow any influencers? What do they post about?","Have you ever believed a story online that turned out to be false?","Why do you think fake news spreads so quickly?","Would you buy a product just because an influencer recommended it?"],"model":{"kind":"text","title":"I Fell for It, and Here's What I Learned","intro":"A lifestyle blogger with thousands of followers writes about the day she shared a fake story.","paras":["Last month, I did something embarrassing. A post appeared in my feed saying that a famous chocolate brand was giving away free boxes to celebrate its 100th anniversary. All you had to do was click a link and enter your address. It looked professional and my friends were sharing it, so I [[jumped on the bandwagon]] and shared it with my followers. Within an hour, dozens of them had [[fallen for]] it too.","Of course, the giveaway [[turned out]] to be a scam. The brand had nothing to do with it, and the people behind it were collecting personal data. I had shared it [[in good faith]], but that didn't make me feel any better. When you have [[a huge following]], your mistakes travel fast.","So here are my new rules. First, if something sounds [[too good to be true]], it probably is. Second, I never [[take a post at face value]]: I check whether a reliable news site or the brand's official account can [[back it up]]. Third, I'm always [[on the lookout for]] small details, like spelling mistakes or strange web addresses. And finally, I'll always tell you when something is [[a sponsored post]]. You deserve to know who's paying me."],"questions":[{"q":"Why did the blogger share the post?","opts":["Because the chocolate brand paid her","Because it looked real and her friends were sharing it","Because she wanted to test her followers"],"a":1},{"q":"What was the real purpose of the fake giveaway?","opts":["To collect people's personal information","To advertise a new chocolate","To get more followers for the brand"],"a":0},{"q":"Which of these is NOT one of her new rules?","opts":["Check if a reliable source confirms the
