le life, often with a partner and a home","x":"My parents keep asking when I'm going to settle down.","s":"settle DOWN"},{"e":"hit it off","t":"ID","d":"to like each other immediately","x":"We hit it off right away and talked for hours.","s":"HIT it OFF"},{"e":"a red flag","t":"ID","d":"a warning sign that something is wrong","x":"If someone is rude to the server on a first date, that's a red flag.","s":"a RED FLAG"},{"e":"ghost someone","t":"ID","d":"to suddenly stop answering someone's messages with no explanation (informal)","x":"We went on three dates, and then he just ghosted me.","s":"GHOST someone"},{"e":"long-distance relationship","t":"COL","d":"a romantic relationship between two people who live far apart","x":"They were in a long-distance relationship for two years. She was in Santiago and he was in Madrid.","s":"LONG-DIStance reLAtionship"},{"e":"quality time","t":"COL","d":"time you spend with someone, giving them your full attention","x":"We try to spend quality time together without our phones.","s":"QUALity TIME"},{"e":"make an effort","t":"COL","d":"to try hard to do something, especially for another person","x":"Friendships need work. You have to make an effort to stay in touch.","s":"make an EFfort"},{"e":"be into someone","t":"PREP","d":"to be attracted to someone (informal)","x":"I think Camila's really into you. She laughs at all your jokes.","s":"be INto someone"},{"e":"on the same page","t":"PREP","d":"in agreement about a plan or situation","x":"Before you move in together, make sure you're on the same page about money.","s":"on the SAME PAGE"},{"e":"out of the blue","t":"PREP","d":"suddenly and unexpectedly","x":"My ex texted me out of the blue after two years.","s":"out of the BLUE"}],"func":{"title":"Agreeing and disagreeing tactfully","when":"Use these in discussions with friends or colleagues when you want to share your view without sounding rude.","phrases":[{"p":"I couldn't agree more.","use":"strong agreement"},{"p":"You've got a point there.","use":"accepting someone's argument"},{"p":"I agree up to a point, but…","use":"partial agreement"},{"p":"That's a good point, but…","use":"polite disagreement"},{"p":"I see where you're coming from, but…","use":"showing you understand before disagreeing"},{"p":"I'm not so sure about that.","use":"soft disagreement"},{"p":"To be honest, I see it a bit differently.","use":"polite disagreement"},{"p":"Fair enough, but what about…?","use":"accepting a point, then challenging it"},{"p":"That's exactly what I was going to say!","use":"enthusiastic agreement"}],"task":"In groups of three, discuss the statement \"Dating apps have made people worse at relationships.\" Each person must agree once, partly agree once and disagree once, using a different phrase each time."},"pron":{"focus":"Intonation in questions","explain":"Yes/no questions usually go up at the end ↗. Wh- questions (who, what, how, why) usually go down ↘. In 'or' questions, the voice goes up on the first option and down on the last one.","tip":"Record yourself asking the five questions. If they all sound flat, exaggerate the arrows at first. It will sound more natural than you think.","lines":[{"t":"Are you seeing anyone right now?","m":"Are you SEEing anyone right NOW ↗?"},{"t":"How did you two meet?","m":"HOW did you two MEET ↘?"},{"t":"Did you hit it off right away?","m":"Did you HIT‿it‿OFF right aWAY ↗?"},{"t":"Why did they break up?","m":"WHY did they break UP ↘?"},{"t":"Do you want to grab coffee, or are you busy?","m":"Do you want to grab COFfee ↗ | or are you BUsy ↘?"}]},"acts":[{"type":"speed","motions":["Dating apps have made it harder to find a serious partner.","You should never date a friend's ex.","Long-distance relationships never work.","Couples should live together before they get married.","Online friends can be just as real as offline friends.","It's OK to ghost someone after just one date."]},{"type":"roleplay","cards":[{"sit":"Two friends meet after one of them has canceled plans three times this month.","a":"You're upset. Your friend has canceled on you three times this month, always at the last minute. Tell them how you feel without starting a fight.","b":"You've been overwhelmed at work and haven't wanted to talk about it. You really value this friendship. Apologize, explain, and suggest a plan to spend quality time together."},{"sit":"A couple in a long-distance relationship (Santiago and Barcelona) talk on a video call.","a":"You live in Santiago. Your partner moved to Barcelona six months ago on a two-year work contract. The distance is very hard for you. You want a clear plan: when will you live in the same city again?","b":"You're in Barcelona on a two-year work contract and you love your job. You miss your partner, but you don't want to give up this opportunity. Find a solution you can both accept."},{"sit":"Two roommates who are also good friends talk in the kitchen.","a":"Your roommate's new partner is at your apartment every day and often eats your food. You like them, but it's too much. Bring up the problem politely.","b":"You've just started a relationship and you're very happy. You had no idea this was a problem. Listen, and agree on some house rules together."}]},{"type":"ranking","task":"Rank these from MOST to LEAST important in a long-term relationship. Then compare with a partner and try to agree on a top three.","items":["Having a lot in common","Physical attraction","Being on the same page about money","A good sense of humor","Trust","Wanting the same future (kids, where to live)","Getting along with each other's families"]}],"ex":{"gap":{"items":[{"s":"Martina and I ___ the first time we met. We talked until the café closed.","a":"hit it off"},{"s":"He's really nice, but I'm not ___ him. I just see him as a friend. (1 word)","a":"into"},{"s":"After ten years together, they ___, but they're still good friends. (past tense)","a":"broke up/split up"},{"s":"My grandmother keeps asking me when I'm going to ___ and have kids.","a":"settle down"},{"s":"He never asks you a single question about yourself? That's ___.","a":"a red flag"},{"s":"My cousin was in a ___ for two years. She lived in Chile and he lived in Spain.","a":"long-distance relationship"}]},"match":{"pairs":[["ask someone out","invite someone on a date"],["ghost someone","suddenly stop replying with no explanation"],["quality time","time together with full attention"],["make an effort","try hard to do something"],["on the same page","in agreement about a plan"],["out of the blue","suddenly and unexpectedly"]]},"fix":{"items":[{"s":"She broke up her boyfriend last month.","wrong":"broke up her boyfriend","fix":"broke up with her boyfriend"},{"s":"He asked out her last week, and she said yes.","wrong":"asked out her","fix":"asked her out"},{"s":"We've been together since three years.","wrong":"since three years","fix":"for three years"},{"s":"We met each other in a party in Viña.","wrong":"in a party","fix":"at a party"}]}},"rec":{"prompt":"How have dating and friendship changed since your parents' generation? Give your opinion with examples.","model":"I think relationships today are very different from my parents' time. They met at a friend's party, hit it off immediately and got married two years later. Nowadays, a lot of people meet online, and in some ways that's great because you have more options. But I also think it's easier to give up on people. If you see a red flag, you just move on to the next profile, or you ghost the person, which my parents' generation couldn't really do! On the other hand, couples today seem more open. They talk about money and kids early to make sure they're on the same page.","use":["hit it off","a red flag","ghost someone","on the same page"]},"tips":[{"who":"teacher","t":"Dating can be a sensitive topic. Let students talk about \"people they know\" or \"people in general\" instead of their own love life. The language practice is exactly the same."},{"who":"student","t":"Notice which expressions are informal: \"ghost someone\", \"be into someone\" and \"hit it off\" are perfect with friends, but choose more neutral words in a formal discussion."},{"who":"student","t":"Don't use \"since\" with a period of time. Say \"for three years\" but \"since 2022\"."}],"photo":{"src":"https://live.staticflickr.com/8430/7511763376_675622ede5_b.jpg","by":"Tobyotter","lic":"CC BY","url":"https://www.flickr.com/photos/78428166@N00/7511763376"}},{"id":"c1-relationships","lv":"C1","tp":"relationships","title":"Trust, Conflict & Connection","goals":["discuss trust, conflict and reconciliation using nuanced idiomatic language","handle disagreements diplomatically by softening criticism and acknowledging other views","analyze what makes relationships last and argue your position persuasively"],"warm":["Which is harder to rebuild once it's broken: trust or respect?","Is conflict a healthy part of every close relationship?","Can you stay close friends with someone whose values are very different from yours?","Who do you turn to when you need brutally honest advice, and why that person?"],"model":{"kind":"text","title":"The Fight That Saved Our Friendship","intro":"In a personal essay for an online magazine, Paula, a journalist from Valparaíso, reflects on a falling-out with her closest friend.","paras":["For fifteen years, Ana and I had never had a serious argument. Looking back, that wasn't a sign of a perfect friendship; it was a sign that we were both experts at avoiding conflict. Whenever something bothered me, I would [[bottle it up]], tell myself it didn't matter and move on. Then, two years ago, I found out she had told a mutual friend about my divorce before I was ready to share the news. To me, it felt like a [[breach of trust]], and worse, it had happened [[behind my back]].","I didn't handle it well. Instead of calling her calmly, I [[lashed out]] at her in a long, furious voice message that I still regret. For months afterward, we barely spoke, and when we did meet at a friend's birthday, everyone [[walked on eggshells]] around us.","What finally changed things was a simple text from Ana: \"Can we talk?\" Over a very long lunch, we [[cleared the air]]. She explained that she had assumed our friend already knew; I admitted that I'd been looking for a reason to be angry because of everything else going on in my life. Neither of us was entirely in the right.","We've since [[patched things up]], but the friendship isn't the same. It's better. We've learned to [[set boundaries]] and to [[give each other the benefit of the doubt]]. Above all, we no longer confuse the absence of conflict with closeness."],"questions":[{"q":"According to Paula, why had she and Ana never argued before?","opts":["They agreed about almost everything.","They both avoided dealing with problems.","They didn't see each other very often."],"a":1},{"q":"What does Paula admit during the lunch?","opts":["Part of her anger came from other problems in her life.","She had also shared Ana's secrets.","She had never really trusted Ana."],"a":0},{"q":"What is the main idea of the essay?","opts":["Friends should never discuss each other's private lives.","Once trust is broken, a friendship can't recover.","Facing a conflict honestly can make a friendship stronger."],"a":2}]},"lang":[{"e":"patch things up","t":"PV","d":"to repair a relationship after a disagreement","x":"It took a few months, but they eventually patched things up.","s":"patch things UP"},{"e":"bottle up","t":"PV","d":"to hide strong feelings instead of expressing them","x":"If you bottle up your frustration, it'll come out sooner or later.","s":"bottle UP"},{"e":"lash out at","t":"PV","d":"to suddenly attack someone with angry words","x":"He lashed out at his sister, then immediately regretted it.","s":"lash OUT at"},{"e":"clear the air","t":"ID","d":"to have an honest conversation that ends tension or a misunderstanding","x":"We met for coffee to clear the air after the argument.","s":"CLEAR the AIR"},{"e":"walk on eggshells","t":"ID","d":"to be extremely careful not to upset someone","x":"Since the argument, everyone in the office has been walking on eggshells around her.","s":"walk on EGGshells"},{"e":"give someone the benefit of the doubt","t":"ID","d":"to believe someone's explanation even though you can't be sure it's true","x":"I'll give him the benefit of the doubt. Maybe he really didn't see my message.","s":"give someone the BENefit of the DOUBT"},{"e":"hold a grudge","t":"COL","d":"to stay angry with someone for something they did in the past","x":"Life's too short to hold a grudge.","s":"hold a GRUDGE"},{"e":"a breach of trust","t":"COL","d":"an action that breaks someone's trust in you","x":"Reading your partner's messages without asking is a serious breach of trust.","s":"a BREACH of TRUST"},{"e":"set boundaries","t":"COL","d":"to make clear what behavior you will and won't accept","x":"Setting clear boundaries with your family isn't selfish. It's healthy.","s":"set BOUNDaries"},{"e":"behind someone's back","t":"PREP","d":"secretly, without the person knowing","x":"I can't stand people who criticize their friends behind their backs.","s":"beHIND someone's BACK"},{"e":"on good terms with","t":"PREP","d":"having a friendly relationship with someone, especially after a difficult time","x":"She's still on good terms with her ex-husband.","s":"on GOOD TERMS with"},{"e":"at odds with","t":"PREP","d":"in disagreement or conflict with someone","x":"I'm often at odds with my sister over how to take care of our parents.","s":"at ODDS with"}],"func":{"title":"Softening criticism and handling conflict diplomatically","when":"Use these when you need to raise a sensitive issue, calm a tense conversation or move toward a solution.","phrases":[{"p":"I might be wrong, but I get the impression that…","use":"raising a sensitive issue"},{"p":"I don't want this to come across the wrong way, but…","use":"preparing someone for criticism"},{"p":"It feels to me like…","use":"talking about your feelings, not the other person's faults"},{"p":"I can see why you'd feel that way.","use":"validating the other person"},{"p":"Let me make sure I understand. Are you saying that…?","use":"checking before you react"},{"p":"That's not quite what I meant.","use":"correcting a misunderstanding"},{"p":"Can we take a step back for a second?","use":"calming things down"},{"p":"Fair enough. I take your point.","use":"conceding"},{"p":"I owe you an apology for…","use":"apologizing sincerely"},{"p":"So, where do we go from here?","use":"moving toward a solution"}],"task":"In pairs, choose one conflict: a friend who is always late, a sibling who never helps with your parents, or a colleague who took credit for your idea. Have a three-minute conversation to clear the air. Each of you must use at least five phrases, and nobody can say \"You always…\" or \"You never…\"."},"pron":{"focus":"Chunking and pausing","explain":"Fluent speakers don't say long sentences in one breath. They divide them into thought groups (chunks), pause briefly between them and stress one key word in each chunk. Commas and words like 'but' and 'if' are natural places to pause.","tip":"Mark the chunks with a pencil before you read. Then shadow each line, breathing only at the | marks. Short pauses make you sound more confident and persuasive, not less fluent.","lines":[{"t":"If you bottle up your feelings, they'll come out eventually.","m":"If you bottle UP your FEELings | they'll come OUT eVENtually."},{"t":"I might be wrong, but I get the impression you're upset.","m":"I might be WRONG | but I get the imPRESsion | you're upSET."},{"t":"Once trust is broken, it takes years to rebuild.","m":"Once TRUST is BROken | it takes YEARS to reBUILD."},{"t":"We've had our differences, but we're still on good terms.","m":"We've had our DIFferences | but we're still on GOOD TERMS."},{"t":"Rather than holding a grudge, why not clear the air?","m":"RATHer than HOLDing a GRUDGE | why not CLEAR the AIR ↘?"}]},"acts":[{"type":"fishbowl","questions":["Is it ever right to end a friendship over a single breach of trust?","Why do some people find it so hard to apologize, even when they know they're in the wrong?","Is honesty always the best policy in close relationships, or are some white lies necessary?","Has social media made us more connected to each other, or just more visible?","Can you truly forgive someone if you can't forget what they did?","Should adult children set boundaries with their parents, even if it causes conflict?"]},{"type":"expert","topic":"Why relationships break down, and how to repair them","expert":"You are a well-known couples and family therapist who has just published a book called \"Repair, Don't Replace.\" You believe most conflicts come from poor communication, not from incompatible people. Use the lesson language and give concrete examples (invented and anonymous).","journalists":"You are journalists from a lifestyle magazine, and you're a little skeptical: some of you think therapy is overrated and that some relationships simply shouldn't be saved. Ask tough follow-up questions and push for clear, practical answers.","questions":["Isn't it sometimes healthier to walk away than to patch things up?","How do you rebuild trust after a serious breach? Is it ever really the same?","Why do people bottle things up until they explode?","Aren't \"boundaries\" just a fashionable excuse to be selfish?","What's the single most common mistake people make during an argument?"]},{"type":"agree","items":["A friendship that has never survived a serious argument isn't really a close friendship.","Holding a grudge is sometimes a reasonable way to protect yourself.","Brutal honesty does more harm than good in most relationships.","If you always give people the benefit of the doubt, they'll take advantage of you.","Family members deserve more patience than friends.","Some conflicts are better left unresolved.","Trust, once broken, can never be fully restored."]}],"ex":{"gap":{"items":[{"s":"For years he ___ his anger, until one day it all came out at a family dinner. (past tense)","a":"bottled up"},{"s":"She ___ her colleagues during the meeting, then spent the afternoon apologizing. (3 words)","a":"lashed out at"},{"s":"Reading your partner's private messages without permission is a serious ___.","a":"breach of trust"},{"s":"Since the argument, everyone in the family has been ___ whenever the two brothers are in the same room.","a":"walking on eggshells"},{"s":"It happened ten years ago. Isn't it time to stop ___ and forgive him?","a":"holding a grudge"},{"s":"I'm sure she had a good reason for missing the meeting, so let's give her the ___.","a":"benefit of the doubt"}]},"match":{"pairs":[["patch things up","become friends again after a disagreement"],["clear the air","have an honest talk to remove tension"],["set boundaries","make clear what behavior you won't accept"],["behind someone's back","secretly, without the person knowing"],["on good terms with","having a friendly relationship with"],["at odds with","in disagreement or conflict with"]]},"fix":{"items":[{"s":"I've decided to give him the benefit of doubt.","wrong":"benefit of doubt","fix":"benefit of the doubt"},{"s":"She talked about me behind of my back.","wrong":"behind of","fix":"behind"},{"s":"He lashed out to his sister when she criticized him.","wrong":"lashed out to","fix":"lashed out at"},{"s":"It's important to put boundaries with your family.","wrong":"put boundaries","fix":"set boundaries"}]}},"rec":{"prompt":"Think of a time you had a conflict with someone close to you (no names needed). How was it resolved, and what did you learn?","model":"A few years ago, I had a serious disagreement with my brother about how to take care of our father when he got sick. For months, we were constantly at odds with each other, and I'm ashamed to say I bottled up a lot of resentment instead of saying anything. Eventually, it all came out at a family lunch, which wasn't ideal. A week later, though, we met for coffee to clear the air. I realized he'd been under enormous pressure too, so I decided to give him the benefit of the doubt. We're on good terms now, and the main lesson for me was that holding a grudge only hurts you.","use":["at odds with","bottle up","clear the air","give someone the benefit of the doubt"]},"tips":[{"who":"teacher","t":"This topic can get personal. Remind students they can talk about hypothetical situations or \"a friend of mine\", and model each activity first with a light, invented example."},{"who":"student","t":"Watch out for translation traps: \"poner límites\" is \"set boundaries\" (not \"put limits\"), and \"guardar rencor\" is \"hold a grudge\". Keep a list of these and review it before class."},{"who":"student","t":"In a real conflict, \"I\" statements (\"I felt left out\") sound much less aggressive than \"you\" statements (\"You ignored me\"). Practice turning three \"you\" complaints into \"I\" statements."}],"photo":{"src":"https://images.pexels.com/photos/4340080/pexels-photo-4340080.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/people-talking-while-drinking-coffee-at-the-restaurant-4340080/"}},{"id":"b1-careers","lv":"B1","tp":"careers","title":"Jobs & Job Interviews","goals":["describe your job, skills and work experience using common work expressions","answer typical job interview questions with clear, simple examples","buy time and check questions politely in an interview"],"warm":["What do you do, and what do you like most about your job or studies?","What was your first job? How did you get it?","Have you ever had a job interview in English? How did it go?","What's more important to you in a job: the salary, the people or the schedule?"],"model":{"kind":"dialogue","title":"A job interview at a travel company","intro":"Diego is interviewing for a customer service job at a travel company in Santiago.","lines":[{"sp":"Laura","t":"Thanks for coming in, Diego. So, why did you [[apply for]] this position?"},{"sp":"Diego","t":"Well, I love traveling, and I have four years of [[experience in]] customer service. I think I'd be a good fit for your team."},{"sp":"Laura","t":"Great. Tell me a little about your current job."},{"sp":"Diego","t":"I work at a hotel in Viña del Mar. I'm [[in charge of]] the front desk on weekends, so I deal with a lot of guests."},{"sp":"Laura","t":"And what would your coworkers say about you?"},{"sp":"Diego","t":"That I'm a [[team player]]. I [[get along with]] everyone, and I'm always happy to help."},{"sp":"Laura","t":"Good to hear. What would you say you're [[good at]]?"},{"sp":"Diego","t":"That's a good question. Let me think… I'm good at staying calm. When a guest is angry, I listen first, and then I look for a solution."},{"sp":"Laura","t":"Our team is very busy, so you'd need to [[learn the ropes]] quickly. Is that a problem?"},{"sp":"Diego","t":"Not at all. I'm ready to [[take on]] new challenges, and I always [[meet my deadlines]]."},{"sp":"Laura","t":"Perfect. Before you go, could you [[fill out]] this form with your references?"},{"sp":"Diego","t":"Of course. Thank you for your time!"}],"questions":[{"q":"Where does Diego work now?","opts":["At a travel agency in Santiago","At a hotel in Viña del Mar","At a call center"],"a":1},{"q":"What does Diego do when a guest is angry?","opts":["He listens first and then looks for a solution","He calls his manager","He offers the guest a discount"],"a":0},{"q":"What does Laura ask Diego to do before he leaves?","opts":["Send his résumé again","Call her next week","Fill out a form with his references"],"a":2}]},"lang":[{"e":"fill out","t":"PV","d":"to complete a form by writing information in it","x":"Please fill out this form and sign it at the bottom.","s":"fill OUT","uk":"UK: fill in"},{"e":"get along with","t":"PV","d":"to have a friendly relationship with someone","x":"I get along really well with my coworkers.","s":"get aLONG with"},{"e":"take on","t":"PV","d":"to accept a new job, task or responsibility","x":"She took on extra work while her boss was away.","s":"take ON"},{"e":"learn the ropes","t":"ID","d":"to learn how to do a new job or activity","x":"It took me a few weeks to learn the ropes.","s":"LEARN the ROPES"},{"e":"get your foot in the door","t":"ID","d":"to get a first chance to work in a company or industry","x":"An internship is a great way to get your foot in the door.","s":"get your FOOT in the DOOR"},{"e":"a team player","t":"ID","d":"a person who works well with other people","x":"We're looking for a team player with good communication skills.","s":"a TEAM player"},{"e":"make a good impression","t":"COL","d":"to make people think good things about you","x":"Arrive a little early if you want to make a good impression.","s":"make a GOOD imPRESsion"},{"e":"meet a deadline","t":"COL","d":"to finish work by the time it is due","x":"We stayed late to meet the deadline.","s":"meet a DEADline"},{"e":"apply for","t":"PREP","d":"to formally ask for a job, a place at a school, etc.","x":"I applied for a job at a bank, but I didn't get it.","s":"apPLY for"},{"e":"experience in","t":"PREP","d":"knowledge and skills you get from doing a type of work","x":"I have five years of experience in sales.","s":"exPERience in"},{"e":"in charge of","t":"PREP","d":"responsible for a person, a group or an activity","x":"Who's in charge of the new project?","s":"in CHARGE of"},{"e":"be good at","t":"PREP","d":"to have the skill to do something well","x":"I'm good at explaining things clearly.","s":"be GOOD at"}],"func":{"title":"Buying time and giving examples in an interview","when":"Use these in job interviews, or whenever you need a moment to think before you answer a question.","phrases":[{"p":"That's a good question.","use":"buy time before you answer"},{"p":"Let me think about that for a second.","use":"buy time before you answer"},{"p":"Could you repeat the question, please?","use":"ask someone to say it again"},{"p":"Sorry, do you mean…?","use":"check that you understand the question"},{"p":"For example, in my last job, I…","use":"give a real example"},{"p":"One thing I'm really good at is…","use":"talk about a strength"},{"p":"I'd say my biggest strength is…","use":"talk about a strength"},{"p":"I'm not very good at… yet, but I'm practicing.","use":"talk about a weakness in a positive way"},{"p":"Does that answer your question?","use":"check that your answer was clear"}],"task":"Work in pairs. A is the interviewer and asks four questions: 'Tell me about yourself.' 'What are you good at?' 'Tell me about a problem at work and how you solved it.' 'Why do you want this job?' B answers using at least four phrases: one to buy time, one to check the question and at least one real example. Then swap roles."},"pron":{"focus":"Linking: consonant + vowel","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them, so the two words sound like one: 'in charge of' sounds like 'in char-jof', and 'fill out' sounds like 'fi-lout'.","tip":"Don't stop between the small words. Say each line slowly with the links, then faster, as if it were one long word.","lines":[{"t":"I'm in charge of a team.","m":"I'm in CHARGE‿of‿a TEAM."},{"t":"I get along with everyone.","m":"I GET‿aLONG with‿EVeryone."},{"t":"Could you fill out this form?","m":"Could you FILL‿OUT this FORM↗?"},{"t":"I'm ready to take on a new challenge.","m":"I'm READy to TAKE‿ON‿a NEW CHALlenge."},{"t":"She made a good impression.","m":"She MADE‿a GOOD‿imPRESsion."}]},"acts":[{"type":"roleplay","cards":[{"sit":"A job interview at a café chain","a":"You're the store manager. You need someone who can work on weekends and learn the ropes fast. Ask about B's experience, strengths and schedule. Then decide if you'll hire B.","b":"You're the candidate. You have two years of experience in customer service, but you can't work on Sunday mornings. Make a good impression and explain why you're a team player."},{"sit":"Calling about a job ad","a":"You saw an ad for a part-time job at a language school. Call and ask about the schedule, the salary and how to apply.","b":"You're the school's office manager. Answer A's questions. Applicants have to fill out an online form and send a résumé by Friday. The salary depends on experience."},{"sit":"First day at a new job","a":"It's your first day. Ask your new coworker about the team, the boss, lunch breaks and anything else you need to know.","b":"You've worked here for three years. Help A learn the ropes. Give two useful tips and one friendly warning (for example, the boss hates long emails)."}]},{"type":"roulette","items":["What's the best job you've ever had? Why?","What's one thing you're really good at?","Have you ever applied for a job you didn't really want? What happened?","Who do you get along with best at work or school? Why?","What's the hardest part of learning the ropes in a new job?","How can you make a good impression in a job interview?","Are you a team player, or do you prefer working alone?","What's the strangest interview question you've ever heard?","Would you like to be in charge of a team one day? Why or why not?","What's your dream job, and how could you get your foot in the door?"]},{"type":"taboo","cards":[{"w":"apply for","taboo":["job","ask","send"]},{"w":"fill out","taboo":["form","write","complete"]},{"w":"get along with","taboo":["friends","like","relationship"]},{"w":"learn the ropes","taboo":["new","start","how"]},{"w":"a team player","taboo":["group","together","help"]},{"w":"in charge of","taboo":["boss","manager","responsible"]},{"w":"meet a deadline","taboo":["time","finish","date"]},{"w":"make a good impression","taboo":["first","nice","think"]},{"w":"take on","taboo":["accept","more","work"]},{"w":"get your foot in the door","taboo":["company","chance","begin"]}]}],"ex":{"gap":{"items":[{"s":"I ___ three jobs last month, but I only got one interview.","a":"applied for"},{"s":"Please ___ this form and give it to the receptionist.","a":"fill out/fill in"},{"s":"It's only my first week, so I'm still ___.","a":"learning the ropes"},{"s":"Sofía is ___ the marketing team. Six people work for her.","a":"in charge of"},{"s":"Wear something professional to the interview. You want to ___.","a":"make a good impression"},{"s":"I'd love to work in TV. An internship could help me ___.","a":"get my foot in the door"}]},"match":{"pairs":[["learn the ropes","learn how to do a new job"],["take on","accept new work or responsibility"],["a team player","someone who works well with others"],["get your foot in the door","get a first chance in a company or industry"],["meet a deadline","finish something on time"],["get along with","have a friendly relationship with"]]},"fix":{"items":[{"s":"I have five years of experience on marketing.","wrong":"experience on","fix":"experience in"},{"s":"I'm very good in solving problems.","wrong":"good in","fix":"good at"},{"s":"She is in charge for the sales team.","wrong":"in charge for","fix":"in charge of"},{"s":"I want to do a good impression in the interview.","wrong":"do a good impression","fix":"make a good impression"}]}},"rec":{"prompt":"Answer this interview question: 'Tell me about yourself and your work experience.'","model":"Sure. My name is Camila, and I'm an accountant. I have six years of experience in finance, and right now I'm in charge of payroll at a mining company in Antofagasta. I'm good with numbers, of course, but I think my biggest strength is that I'm a team player. I get along with people from different departments, and I always meet my deadlines, even at the end of the month, when things get really busy. I'm applying for this job because I'm ready to take on more responsibility and learn new things.","use":["experience in","in charge of","a team player","take on"]},"tips":[{"who":"teacher","t":"Before the role-plays, brainstorm five common interview questions on the board. Students answer them once in pairs, then again 'for real' in the role-play. The second answer is always better, and students notice it."},{"who":"student","t":"Prepare a 30-second answer to 'Tell me about yourself' and practice it out loud until it feels natural. It's the first question in almost every interview."},{"who":"student","t":"Learn these expressions with their prepositions: experience IN, good AT, in charge OF, apply FOR. Write one true sentence about yourself with each one."}],"photo":{"src":"https://images.pexels.com/photos/5668863/pexels-photo-5668863.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/professional-man-interviewing-an-applicant-5668863/"}},{"id":"b2-careers","lv":"B2","tp":"careers","title":"Career Paths & Interviews","goals":["describe your career path and its turning points using idiomatic expressions","highlight your strengths and handle tricky interview questions with confidence","discuss different career choices and give reasons for your opinions"],"warm":["How did you end up in your current job or field of study?","Have you ever changed careers, or would you like to? Why?","What's the hardest interview question you've ever been asked?","Is it better to stay with one company for years or to change jobs often?"],"model":{"kind":"text","title":"How I changed careers at 32","intro":"Javiera, a designer from Santiago, wrote this post on a professional networking site.","paras":["Five years ago, I was a civil engineer at a construction company. The pay was good, but honestly, it felt like a [[dead-end job]]. My manager had been in the same position for twenty years, so there was no real chance to [[climb the career ladder]]. Meanwhile, I was spending my weekends designing websites for friends, and I realized I was far more [[passionate about]] design than about concrete.","So I decided to [[make a career change]]. I took an online UX design course at night and built a small portfolio. At first, I didn't feel [[qualified for]] any of the jobs I saw, but a mentor reminded me that engineers have plenty of [[transferable skills]]: project management, problem-solving, dealing with demanding clients. I already had all of that.","In interviews, I focused on those skills instead of apologizing for my background, and that helped me [[stand out]]. After every interview, I [[followed up]] with a short thank-you email. Three months later, I got an offer from a fintech startup, and because I already knew how to manage projects, I was able to [[hit the ground running]].","Was it easy? Not at all. It was [[a steep learning curve]], and I learned most things [[on the job]]. Now I'm even [[branching out into]] product management. My advice? Don't wait for the “perfect moment.” Start small, and don't let fear make the decision for you."],"questions":[{"q":"Why did Javiera feel her engineering job was a dead end?","opts":["The salary was too low","There was no real chance of promotion","She didn't get along with her manager"],"a":1},{"q":"What did her mentor point out?","opts":["Many of her engineering skills were useful in design too","She should go back to college first","She should only apply for engineering jobs"],"a":0},{"q":"What did she do after every interview?","opts":["She asked for feedback","She updated her portfolio","She sent a short thank-you email"],"a":2}]},"lang":[{"e":"stand out","t":"PV","d":"to be easy to notice because you're better or different","x":"With hundreds of applicants, you need a résumé that stands out.","s":"stand OUT"},{"e":"branch out into","t":"PV","d":"to start working in a new and different area","x":"After ten years in sales, she branched out into marketing.","s":"branch OUT into"},{"e":"follow up","t":"PV","d":"to contact someone again after a meeting, an interview, etc.","x":"Follow up with a short email a few days after the interview.","s":"follow UP"},{"e":"climb the career ladder","t":"ID","d":"to get promoted to higher and higher positions","x":"He climbed the career ladder fast and became a director at 35.","s":"CLIMB the caREER LADder"},{"e":"a dead-end job","t":"ID","d":"a job with no chance of promotion or development","x":"I didn't want to stay in a dead-end job forever.","s":"a DEAD-end JOB"},{"e":"hit the ground running","t":"ID","d":"to start a new job or project and be effective immediately","x":"We need someone who can hit the ground running.","s":"HIT the GROUND RUNning"},{"e":"transferable skills","t":"COL","d":"skills you can use in many different jobs","x":"Teaching gave me great transferable skills, like public speaking.","s":"transFERable SKILLS"},{"e":"a steep learning curve","t":"COL","d":"a situation where you have to learn a lot very quickly","x":"My first year as a manager was a steep learning curve.","s":"a STEEP LEARNing curve"},{"e":"make a career change","t":"COL","d":"to start working in a completely different field","x":"At 40, she made a career change and became a nurse.","s":"make a caREER CHANGE"},{"e":"on the job","t":"PREP","d":"while you are working, not in a classroom","x":"I learned most of my skills on the job.","s":"on the JOB"},{"e":"passionate about","t":"PREP","d":"very enthusiastic about something","x":"I'm really passionate about sustainable design.","s":"PASsionate about"},{"e":"qualified for","t":"PREP","d":"having the right skills, education or experience for a job","x":"He's highly qualified for the position.","s":"QUALified for"}],"func":{"title":"Highlighting strengths and handling weaknesses","when":"Use these in interviews and performance reviews to sell yourself without sounding arrogant.","phrases":[{"p":"One thing I'm particularly proud of is…","use":"highlight an achievement"},{"p":"I played a key role in…","use":"describe your contribution"},{"p":"As a result, we were able to…","use":"show the result of your work"},{"p":"I've been told I'm good at…","use":"present a strength modestly"},{"p":"What sets me apart is…","use":"explain what makes you different"},{"p":"Something I'm working on is…","use":"present a weakness positively"},{"p":"I used to struggle with…, but now I…","use":"show how you've improved"},{"p":"Let me give you a specific example.","use":"support what you say with evidence"},{"p":"That's exactly why I'm interested in this role.","use":"connect your story to the job"}],"task":"Write down one real achievement and one real weakness. In pairs, B interviews A with three questions: 'What's your greatest strength?', 'What's your biggest weakness?' and 'Tell me about something you're proud of.' A uses at least five phrases. B gives a score from 1 to 5 for 'confident but not arrogant' and explains it. Then swap."},"pron":{"focus":"Stress in phrasal verbs and compound nouns","explain":"In phrasal verbs, the particle usually gets the strongest stress: stand OUT, follow UP, branch OUT. When a phrasal verb becomes a noun or adjective, the stress moves to the first part: a FOLlow-up call. In compound nouns like 'learning curve' or 'job market', the first word is usually stressed: LEARNing curve, JOB market.","tip":"Practice in pairs of words: follow UP / a FOLlow-up call, set UP / a SETup. Exaggerate the difference at first, then say them naturally.","lines":[{"t":"Your résumé needs to stand out.","m":"Your RÉsumé NEEDS to stand OUT."},{"t":"I followed up a week later.","m":"I followed UP | a WEEK LAter."},{"t":"Then I made a follow-up call.","m":"Then I made a FOLlow-up call."},{"t":"It was a steep learning curve.","m":"It was a STEEP LEARNing curve."},{"t":"She branched out into marketing.","m":"She branched OUT‿into MARketing."}]},"acts":[{"type":"agree","items":["It's a bad idea to stay in the same job for more than five years.","Experience is more important than a college degree.","Everyone should make a career change at least once in their life.","It's OK to exaggerate a little in a job interview.","A dead-end job is fine if the salary is good.","You learn more on the job than in any course.","Climbing the career ladder isn't as important to young people as it used to be.","Companies should stop asking candidates about their weaknesses."]},{"type":"fluency","topics":["Your career path so far: how you ended up where you are today","A turning point in your studies or career","The best (or the worst) job interview you've ever had","A skill you learned on the job that no course could teach you","A career change you would make if money weren't a problem"]},{"type":"roleplay","cards":[{"sit":"Explaining a career gap","a":"You're the interviewer. You notice a two-year gap on B's résumé. Ask about it politely and find out if B can hit the ground running.","b":"You're the candidate. You took two years off to care for a family member, and you did several online courses during that time. Explain the gap positively and focus on your transferable skills."},{"sit":"The overqualified candidate","a":"You're the interviewer. B has much more experience than this job needs. You're worried B will get bored and leave after six months. Ask tough questions.","b":"You're the candidate. You want a less senior role because you want more time with your family. Convince A that you're committed and that your experience is an advantage."},{"sit":"Asking about your next step","a":"You've had the same role for four years and you feel stuck. Ask your manager what you need to do to climb the career ladder.","b":"You're A's manager. You value A, but there's no budget for a promotion this year. Suggest alternatives: training, new projects or a chance to branch out into another area."}]}],"ex":{"gap":{"items":[{"s":"With hundreds of applicants for every job, your résumé has to ___.","a":"stand out"},{"s":"I've been doing exactly the same thing for eight years with no chance of promotion. It's a ___.","a":"dead-end job"},{"s":"We need someone with experience who can ___ from day one.","a":"hit the ground running"},{"s":"Teaching gave me a lot of ___, like public speaking and planning, that I now use in sales.","a":"transferable skills"},{"s":"It's a good idea to ___ with a short thank-you email after an interview.","a":"follow up"},{"s":"I never took a course in this. I learned everything ___.","a":"on the job"}]},"match":{"pairs":[["climb the career ladder","get promoted to higher positions over time"],["branch out into","start doing something new and different"],["a steep learning curve","a lot to learn in a short time"],["make a career change","start working in a completely different field"],["qualified for","having the right skills or education for"],["passionate about","very enthusiastic about"]]},"fix":{"items":[{"s":"I'm very passionate for technology.","wrong":"passionate for","fix":"passionate about"},{"s":"I don't think I'm qualified to this position.","wrong":"qualified to","fix":"qualified for"},{"s":"I learned most of my skills in the job.","wrong":"in the job","fix":"on the job"},{"s":"I want to do a career change next year.","wrong":"do a career change","fix":"make a career change"}]}},"rec":{"prompt":"Answer this interview question: 'Walk me through your career path so far.'","model":"Sure. I started out in customer service at a bank, which, honestly, became a dead-end job after a while. But I learned a lot on the job, especially how to deal with difficult clients. Then I decided to make a career change, so I studied data analysis at night. It was a steep learning curve, but my transferable skills from customer service really helped. I know how to explain numbers to people who don't love numbers! Now I'm a data analyst at a retail company, and I'm looking for a role where I can take on bigger projects and keep growing.","use":["on the job","make a career change","a steep learning curve","transferable skills"]},"tips":[{"who":"teacher","t":"During the 4/3/2 fluency activity, listen to one student's first and third versions. Point out how much more fluent the third version was and how many more lesson expressions it had. It's a great confidence boost."},{"who":"student","t":"Prepare your 'career story' in three parts: where you started, a turning point, and where you want to go next. Practice it until you can tell it naturally in about 60 seconds."},{"who":"student","t":"When you talk about a weakness, always add what you're doing about it. 'I used to struggle with public speaking, but now I volunteer to present in every meeting' sounds honest and professional."}],"photo":{"src":"https://images.pexels.com/photos/4240505/pexels-photo-4240505.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/woman-working-in-home-office-4240505/"}},{"id":"c1-careers","lv":"C1","tp":"careers","title":"Careers in a Changing World","goals":["discuss how the world of work is changing using sophisticated, nuanced vocabulary","speculate about the future of jobs, showing exactly how certain you are","build a persuasive argument about careers, skills and the labor market"],"warm":["How different is your job, or your parents' jobs, from how it was 20 years ago?","Does a 'job for life' still exist? Would you want one?","Which skills do you think will be most valuable ten years from now?","Would you rather work for one company or have several sources of income?"],"model":{"kind":"dialogue","title":"Podcast: Is the 'job for life' dead?","intro":"On a career podcast, host Rachel talks to Tomás, a recruiter in Santiago, and Priya, a freelance consultant.","lines":[{"sp":"Rachel","t":"Tomás, you've been a recruiter for fifteen years. Is the 'job for life' really gone?"},{"sp":"Tomás","t":"For most people, yes, and honestly, [[the writing was on the wall]] a long time ago. Companies restructure constantly, and even the big names [[lay off]] staff at the first sign of trouble. Loyalty simply doesn't buy you security anymore."},{"sp":"Rachel","t":"Priya, you left a corporate job to build [[a portfolio career]]. Was that a leap of faith?"},{"sp":"Priya","t":"Partly. I consult for two startups, teach an online course and write for a business magazine. But it's [[a double-edged sword]]. I have far more freedom, but it comes [[at the expense of]] stability. Some months are fantastic; others, not so much."},{"sp":"Rachel","t":"Isn't that the problem with [[the gig economy]] in general?"},{"sp":"Tomás","t":"It can be, especially for people whose skills are easy to replace. But for professionals whose skills are [[in high demand]], it's a completely different story. They can pick and choose."},{"sp":"Rachel","t":"So how do you [[future-proof your career]]?"},{"sp":"Priya","t":"By never assuming that what you know today will be enough. Tools that were essential five years ago are already being [[phased out]], so I set aside a few hours every week to [[stay ahead of the curve]]."},{"sp":"Tomás","t":"And resilience matters just as much. The candidates I admire most are the ones who [[bounced back]] from a setback, like a layoff or a failed business, and used it to reinvent themselves."},{"sp":"Rachel","t":"So adaptability [[in the face of]] constant change is the new job security?"},{"sp":"Tomás","t":"Exactly. No company can guarantee your future anymore, but your ability to keep learning comes pretty close."}],"questions":[{"q":"What does Priya see as the main downside of her portfolio career?","opts":["She has very little free time","Her income is less stable","She misses her former coworkers"],"a":1},{"q":"According to Tomás, who benefits most from the gig economy?","opts":["Recent graduates looking for their first job","People who prefer a fixed schedule","Professionals whose skills are in high demand"],"a":2},{"q":"What do the candidates Tomás admires most have in common?","opts":["They recovered from setbacks and reinvented themselves","They stayed with one employer for many years","They have never had a failed business"],"a":0}]},"lang":[{"e":"phase out","t":"PV","d":"to gradually stop using, making or offering something","x":"The airline is phasing out its older planes.","s":"phase OUT"},{"e":"lay off","t":"PV","d":"to end workers' jobs because there isn't enough work or money, not because of their performance","x":"The company laid off 10% of its staff after the merger.","s":"lay OFF"},{"e":"bounce back","t":"PV","d":"to recover quickly after a difficult experience","x":"She lost her job in March but bounced back with a better offer by June.","s":"bounce BACK"},{"e":"a double-edged sword","t":"ID","d":"something that has both clear advantages and clear disadvantages","x":"Remote work is a double-edged sword: more freedom, but more isolation.","s":"a DOUble-edged SWORD"},{"e":"the writing is on the wall","t":"ID","d":"there are clear signs that something is going to fail or end","x":"When sales fell for the third year in a row, the writing was on the wall.","s":"the WRITing is on the WALL"},{"e":"stay ahead of the curve","t":"ID","d":"to anticipate changes and stay more advanced than others","x":"Short courses help you stay ahead of the curve.","s":"stay aHEAD of the CURVE"},{"e":"the gig economy","t":"COL","d":"a labor market based on short-term, freelance or app-based work","x":"Delivery apps are a big part of the gig economy.","s":"the GIG eCONomy"},{"e":"a portfolio career","t":"COL","d":"a career made up of several part-time, freelance or project roles at the same time","x":"With a portfolio career, she teaches, consults and writes.","s":"a portFOlio caREER"},{"e":"future-proof your career","t":"COL","d":"to protect your career from changes that may happen in the future","x":"Learning to work with AI is one way to future-proof your career.","s":"FUture-proof your caREER"},{"e":"at the expense of","t":"PREP","d":"causing loss or damage to something else","x":"Growth shouldn't come at the expense of employees' health.","s":"at the exPENSE of"},{"e":"in the face of","t":"PREP","d":"when dealing with a difficulty or a threat","x":"In the face of automation, many factory workers retrained as technicians.","s":"in the FACE of"},{"e":"in high demand","t":"PREP","d":"wanted by many people or employers","x":"Cybersecurity specialists are in high demand all over the world.","s":"in HIGH deMAND"}],"func":{"title":"Speculating and expressing degrees of certainty","when":"Use these when you discuss trends, make predictions or speculate about the future, to show exactly how sure you are.","phrases":[{"p":"In all likelihood, …","use":"say something is very probable"},{"p":"It's bound to happen sooner or later.","use":"say something is almost certain"},{"p":"There's every chance that…","use":"say something is very possible"},{"p":"Chances are (that)…","use":"say something is probable (more informal)"},{"p":"If current trends are anything to go by, …","use":"base a prediction on evidence"},{"p":"It's hard to say for sure, but…","use":"make a cautious prediction"},{"p":"It remains to be seen whether…","use":"say the outcome is still uncertain"},{"p":"There's a slim chance that…","use":"say something is unlikely but possible"},{"p":"I can't see that happening any time soon.","use":"express strong doubt"},{"p":"I'd be very surprised if…","use":"say something is very unlikely"}],"task":"In pairs, take turns predicting what will happen to these jobs by 2040: accountant, truck driver, nurse, English teacher, lawyer and software developer. Use a different phrase for each prediction and give a reason. Your partner agrees or challenges your level of certainty ('Really? I'd say it's more likely that…')."},"pron":{"focus":"Chunking and pausing in longer sentences","explain":"Fluent speakers don't deliver long sentences in one continuous stream. They divide them into meaningful chunks (thought groups), pause briefly between them and give each chunk one main stress. Good chunking makes complex ideas easier to follow and makes you sound more confident and authoritative.","tip":"Before you say a long sentence, mark the pauses (|). Pause at commas, before words like 'but', 'so' and 'who', and after a long subject. Never pause in the middle of a fixed expression.","lines":[{"t":"For many freelancers, flexibility comes at the expense of stability.","m":"For MANy FREElancers, | flexiBILity COMES | at the exPENSE of staBILity."},{"t":"For professionals whose skills are in high demand, it's a different story.","m":"For proFESsionals | whose SKILLS are in HIGH deMAND, | it's a DIFferent STORy."},{"t":"If you want to stay ahead of the curve, you have to keep learning.","m":"If you WANT to stay aHEAD of the CURVE, | you HAVE to keep LEARNing."},{"t":"Honestly, the writing was on the wall years ago.","m":"HONestly, | the WRITing was on the WALL | YEARS aGO."},{"t":"The candidates I admire most are the ones who bounced back from a setback.","m":"The CANdidates I adMIRE MOST | are the ONES | who bounced BACK | from a SETback."}]},"acts":[{"type":"expert","topic":"The future of work: which jobs will survive the next 20 years?","expert":"You're a labor market economist who studies automation and AI. Prepare three bold predictions about jobs in 2045 and defend them with examples. Use speculation language to show how certain you are, and admit uncertainty where it's honest.","journalists":"You're journalists from a business magazine whose readers are worried about their jobs. Don't accept vague answers: ask follow-up questions, ask for evidence and push the expert to say how sure they really are.","questions":["Which professions are most at risk, and which ones are safe?","Isn't it unrealistic to tell a 50-year-old to 'just retrain'?","Who should pay for lifelong learning: workers, companies or governments?","Will the gig economy make work more or less secure for the next generation?","What would you tell a teenager choosing a career today?","Which of your predictions are you least sure about, and why?"]},{"type":"balloon","sit":"It's 2045. A hot-air balloon carrying six professionals is losing height, and only one person can stay on board. Each person argues that their job is the most valuable and future-proof. After each round, the group votes one person out.","roles":[{"name":"A data scientist","why":"every decision in an automated world depends on good data"},{"name":"A nurse","why":"human care and empathy can't be automated"},{"name":"A plumber","why":"robots still can't fix your pipes, and skilled trades are in high demand"},{"name":"A primary school teacher","why":"children need human mentors to learn how to learn"},{"name":"A cybersecurity expert","why":"everything is online, so everything can be hacked"},{"name":"A climate engineer","why":"adapting cities to extreme weather is the challenge of the century"}]},{"type":"speed","motions":["The traditional nine-to-five office job will have disappeared within 20 years.","A college degree is no longer the best preparation for a successful career.","The gig economy gives workers more freedom than it takes away.","Companies should be responsible for retraining workers whose jobs are automated.","Changing jobs every two or three years is the smartest way to build a career.","Passion is overrated: a job is just a way to pay the bills."]}],"ex":{"gap":{"items":[{"s":"The bank is gradually ___ paper statements; by next year, everything will be online.","a":"phasing out"},{"s":"After the merger, the company ___ 300 employees.","a":"laid off"},{"s":"Working from home is ___: you save time commuting, but it's easy to feel isolated.","a":"a double-edged sword"},{"s":"Cybersecurity specialists are ___, so they can usually negotiate higher salaries.","a":"in high demand"},{"s":"She lost her biggest client in March but ___ quickly and had two new ones by June.","a":"bounced back"},{"s":"Some freelancers gain flexibility ___ their long-term financial security.","a":"at the expense of"}]},"match":{"pairs":[["the writing is on the wall","there are clear signs that something will fail or end"],["stay ahead of the curve","anticipate changes and stay more advanced than others"],["the gig economy","a labor market of short-term, freelance or app-based work"],["a portfolio career","a career made up of several different part-time or freelance roles"],["future-proof your career","protect your career from future changes"],["in the face of","when confronted with a difficulty"]]},"fix":{"items":[{"s":"Many companies are phasing off their old software.","wrong":"phasing off","fix":"phasing out"},{"s":"Data analysts are in high request right now.","wrong":"in high request","fix":"in high demand"},{"s":"The writing is in the wall for many traditional office jobs.","wrong":"in the wall","fix":"on the wall"},{"s":"In front of automation, many workers are retraining.","wrong":"In front of","fix":"In the face of"}]}},"rec":{"prompt":"Is the 'job for life' a thing of the past? Give your opinion and speculate about how careers will change over the next 20 years.","model":"I'd say the writing has been on the wall for quite a while. Very few people stay with one employer for thirty years anymore, and in all likelihood, that trend will only accelerate as more routine tasks are phased out. That said, I don't think it's all bad news. Flexibility can be a double-edged sword, but for people whose skills are in high demand, it opens a lot of doors. The key, I think, is to future-proof your career by learning constantly and building a strong network. Chances are, the people who do well in twenty years won't be the ones with the most impressive degrees, but the ones who adapt the fastest.","use":["the writing is on the wall","phase out","a double-edged sword","future-proof your career"]},"tips":[{"who":"teacher","t":"In the expert interview, give the journalists one extra rule: they must ask at least one follow-up question after every answer ('Could you be more specific?', 'How sure are you about that?'). This pushes the expert beyond prepared answers."},{"who":"student","t":"At C1, precision matters. Instead of always saying 'maybe', choose a phrase that shows exactly how certain you are: 'in all likelihood' (very likely), 'it remains to be seen' (unsure), 'there's a slim chance' (unlikely)."},{"who":"student","t":"This week, read or listen to one article or podcast about the future of work and note three expressions you could use in your own job. Use them in your next class."}],"photo":{"src":"https://images.pexels.com/photos/18471441/pexels-photo-18471441.jpeg?auto=compress&cs=tinysrgb&w=1400","by":"Pexels","lic":"Pexels License","url":"https://www.pexels.com/photo/robots-are-working-in-a-factory-with-a-machine-18471441/"}},{"id":"b1-meetings","lv":"B1","tp":"meetings","title":"Working in a Team","goals":["talk about your team and how you work together","make, accept and reject suggestions politely","agree on who does what, and by when, in a simple team task"],"warm":["Do you prefer working alone or in a team? Why?","Describe your team at work or a group you study with. How many people are in it?","What makes someone a good teammate?","Have you ever worked in a team where people didn't get along? What happened?"],"model":{"kind":"dialogue","title":"Monday morning team meeting","intro":"Valentina leads a small marketing team in Santiago. It's Monday morning, and the team has a busy week ahead.","lines":[{"sp":"Valentina","t":"OK, let's start. We need to [[come up with]] three ideas for the new juice campaign by Thursday."},{"sp":"Matías","t":"That's tight. And remember, I'll be on vacation starting Wednesday."},{"sp":"Valentina","t":"Right. Kate, could you [[fill in for]] Matías at the client meeting on Wednesday?"},{"sp":"Kate","t":"Sure, no problem. Matías, can you send me your notes [[by the end of the day]]?"},{"sp":"Matías","t":"Of course. And I can [[help out]] with the ideas before I leave."},{"sp":"Valentina","t":"Great. Why don't we have a quick brainstorm right now? Two heads are better than one, and three are even better!"},{"sp":"Kate","t":"How about a campaign with famous athletes?"},{"sp":"Matías","t":"That could work, but athletes are expensive. Maybe we could use real customers instead?"},{"sp":"Valentina","t":"I like both ideas. Let's [[touch base]] tomorrow morning and [[make a decision]] then."},{"sp":"Kate","t":"Sounds good. Just so we're all [[on the same page]]: three ideas, ready by Thursday?"},{"sp":"Valentina","t":"Exactly. Thanks, guys. I love that we really [[work as a team]] here. I know I can always [[rely on]] you."}],"questions":[{"q":"Why can't Matías go to the client meeting on Wednesday?","opts":["He'll be on vacation","He has to meet another client","He doesn't like the client"],"a":0},{"q":"What's the problem with Kate's idea, according to Matías?","opts":["It isn't original","It would be expensive","The client won't like it"],"a":1},{"q":"When will the team make a decision about the campaign?","opts":["This afternoon","On Thursday","Tomorrow morning"],"a":2}]},"lang":[{"e":"come up with","t":"PV","d":"to think of an idea, a plan or a solution","x":"We need to come up with a name for the new product.","s":"come UP with"},{"e":"help out","t":"PV","d":"to help someone, especially when they're busy","x":"Can you help me out with these reports?","s":"help OUT"},{"e":"fill in for","t":"PV","d":"to do someone's job while they are away","x":"Can you fill in for me at the meeting on Friday?","s":"fill IN for"},{"e":"on the same page","t":"ID","d":"agreeing about something or understanding it in the same way","x":"Let's review the plan so we're all on the same page.","s":"on the SAME PAGE"},{"e":"pull your weight","t":"ID","d":"to do your fair share of the work","x":"Everyone on this team pulls their weight.","s":"PULL your WEIGHT"},{"e":"touch base","t":"ID","d":"to contact someone briefly to share news or check progress","x":"Let's touch base on Monday to see how it's going.","s":"touch BASE"},{"e":"make a decision","t":"COL","d":"to decide something","x":"We need to make a decision by Friday.","s":"make a deCIsion"},{"e":"give feedback","t":"COL","d":"to tell someone what's good or bad about their work","x":"My boss gives us feedback after every presentation.","s":"give FEEDback"},{"e":"work as a team","t":"COL","d":"to work together to reach a common goal","x":"We work well as a team because we trust each other.","s":"WORK as a TEAM"},{"e":"rely on","t":"PREP","d":"to trust someone to do something for you","x":"You can always rely on Ana. She never misses a deadline.","s":"reLY on"},{"e":"agree on","t":"PREP","d":"to decide something together, such as a plan, a date or a price","x":"We finally agreed on a date for the event.","s":"aGREE on"},{"e":"by the end of the day","t":"PREP","d":"not later than the end of today","x":"I'll send you the report by the end of the day.","s":"by the END of the DAY"}],"func":{"title":"Making, accepting and rejecting suggestions","when":"Use these in team meetings, group projects or any time you plan something together.","phrases":[{"p":"Why don't we…?","use":"make a suggestion"},{"p":"How about + -ing…?","use":"make a suggestion (How about meeting on Monday?)"},{"p":"Maybe we could…","use":"make a softer suggestion"},{"p":"Let's…","use":"make a direct suggestion"},{"p":"That's a great idea!","use":"accept a suggestion"},{"p":"Sounds good to me.","use":"accept a suggestion"},{"p":"I'm not sure that's a good idea, because…","use":"reject a suggestion politely"},{"p":"That could work, but…","use":"show a problem with a suggestion"},{"p":"What do you think?","use":"ask for someone's opinion"},{"p":"OK, so who's going to…?","use":"decide who does each task"}],"task":"Your team has to organize an end-of-year party for 30 coworkers with a small budget. In pairs or groups of three, make at least four suggestions (place, food, activity and date), accept or reject each one politely, and decide who's going to do each task and by when. You have 3 minutes."},"pron":{"focus":"Intonation in suggestions and questions","explain":"Yes/no questions usually go up at the end (↗). Suggestions with 'Why don't we…?' or 'How about…?' usually go down at the end (↘). When you say 'That could work, but…', your voice goes up on the first part to show you haven't finished. A flat voice can sound bored or even rude in English.","tip":"Exaggerate the arrows at first, like an actor. Then record yourself: if you sound bored, add more up and down.","lines":[{"t":"Why don't we have a quick brainstorm?","m":"Why DON'T we have a QUICK BRAINstorm↘?"},{"t":"How about using real customers?","m":"How aBOUT using REAL CUStomers↘?"},{"t":"Could you fill in for me on Wednesday?","m":"Could you fill IN for me on WEDnesday↗?"},{"t":"Are we all on the same page?","m":"Are we ALL on the SAME PAGE↗?"},{"t":"That could work, but athletes are expensive.","m":"That could WORK↗, | but ATHletes are exPENsive↘."}]},"acts":[{"type":"wyr","items":[["Work in a big team of 15 people","Work in a small team of 3 people"],["Have a lot of short meetings","Have one long meeting a week"],["Be the team leader","Be a team member with less responsibility"],["Work with your best friend","Work with someone you don't know"],["Get feedback every day","Get feedback once a year"],["Have all your meetings in person","Have all your meetings online"],["Make every decision alone","Make every decision as a group"]]},{"type":"ranking","task":"Rank these qualities of a great teammate from MOST to LEAST important. Then compare with a partner and agree on a top 3.","items":["Pulls their weight","Always meets deadlines","Is friendly and positive","Shares ideas in meetings","Helps out when others are busy","Gives honest feedback","Is very good at their job"]},{"type":"fluency","topics":["A great team you were part of (at work, at school or in sports)","A time you helped out a coworker or classmate","The best team leader or boss you've ever had","A group project that went wrong, and what you learned","How decisions are made in your team at work or in your family"]}],"ex":{"gap":{"items":[{"s":"We need a name for the new product. Can you ___ some ideas by Monday?","a":"come up with"},{"s":"I have a doctor's appointment tomorrow morning. Can you ___ me at the 9 o'clock meeting?","a":"fill in for"},{"s":"Before we start, let's make sure we're all ___ about the goals.","a":"on the same page"},{"s":"Tomás never does his share of the work. He doesn't ___.","a":"pull his weight"},{"s":"The client needs the report today, so please send it ___.","a":"by the end of the day"},{"s":"We talked for an hour, but we couldn't ___ a date for the event.","a":"agree on"}]},"match":{"pairs":[["touch base","contact someone briefly to check how things are going"],["help out","help someone, especially when they're busy"],["rely on","trust someone to do something"],["give feedback","tell someone what's good or bad about their work"],["work as a team","work together to reach a goal"],["make a decision","choose what to do"]]},"fix":{"items":[{"s":"Please send me the report until Friday.","wrong":"until Friday","fix":"by Friday"},{"s":"Thanks for all your feedbacks on my presentation.","wrong":"feedbacks","fix":"feedback"},{"s":"I agree on you. It's a great idea.","wrong":"agree on you","fix":"agree with you"},{"s":"Don't worry, you can rely in me.","wrong":"rely in","fix":"rely on"}]}},"rec":{"prompt":"Describe a team you work or study in. What do you do together, and what makes it a good (or difficult) team?","model":"I work in the IT department of a hospital in Concepción, in a team of five people. We work really well as a team because everyone pulls their weight. Every Monday, we have a short meeting to touch base and make sure we're all on the same page. When there's a problem, we try to come up with a solution together. Two heads are better than one! The best thing about my team is that I can always rely on my coworkers. If I'm very busy, someone always helps out.","use":["pull your weight","touch base","on the same page","rely on"]},"tips":[{"who":"teacher","t":"Before the ranking activity, put the suggestion phrases on the board. Students must use a suggestion phrase to propose their top 3, and an accepting or rejecting phrase to respond to their partner."},{"who":"student","t":"Pay attention to the small words: send it BY Friday (not 'until'), agree WITH a person but agree ON a plan, rely ON someone. Make flashcards with these combinations."},{"who":"student","t":"Next time you're in a meeting in Spanish, think of the English phrase you could use: 'Why don't we…?', 'Sounds good to me.' It's free practice!"}],"photo":{"src":"https://cdn.stocksnap.io/img-thumbs/960w/DKO3B7QNG7.jpg","by":"Kristin Hardwick","lic":"CC0","url":"https://stocksnap.io/photo/working-together-DKO3B7QNG7"}},{"id":"b2-meetings","lv":"B2","tp":"meetings","title":"Meetings That Work","goals":["take an active part in meetings using natural, idiomatic meeting language","interrupt politely, keep a discussion on track and check understanding","suggest practical ways to make meetings shorter and more productive"],"warm":["How many meetings do you have in a typical week? Are they useful?","What's the most pointless meeting you've ever been to?","Do you prefer meetings in person or video calls? Why?","What's one rule that would make meetings better where you work or study?"],"model":{"kind":"dialogue","title":"The weekly operations meeting","intro":"Andrés chairs the weekly meeting at a logistics company. Today, the team needs to discuss delivery delays.","lines":[{"sp":"Andrés","t":"OK, everyone, let's [[get down to business]]. We only have thirty minutes, so let's [[stick to the agenda]]. First item: delivery delays in the south."},{"sp":"Carla","t":"Before we start, can I [[bring up]] something quickly? The coffee machine on the third floor still isn't working."},{"sp":"Andrés","t":"Good point, but it's not on the agenda. Let's [[put a pin in that]] and come back to it at the end."},{"sp":"Ben","t":"OK. So, I'm here [[on behalf of]] the warehouse team. Honestly, the delays aren't about the trucks. The [[elephant in the room]] is that we don't have enough staff on weekends."},{"sp":"Carla","t":"Sorry to interrupt, but are you saying we need to hire more people?"},{"sp":"Ben","t":"Not necessarily. We could change the shifts. Actually, that reminds me of when I worked in Temuco. Our manager used to bring empanadas every Friday, and…"},{"sp":"Andrés","t":"Sorry, Ben, I think we're [[going off on a tangent]]. Let's keep this [[on track]]. What exactly do you suggest?"},{"sp":"Ben","t":"Fair enough. Two extra people on Saturdays and Sundays, starting in November."},{"sp":"Andrés","t":"Who's [[in favor of]] trying that for one month?"},{"sp":"Carla","t":"I am, as long as the budget allows it."},{"sp":"Andrés","t":"Great. Then let's [[wrap up]], because I don't want this meeting to [[run over]] again. [[Action items]]: Ben, send me a shift plan by Friday. Carla, check the budget. And yes, I'll call someone about the coffee machine."}],"questions":[{"q":"Why does Andrés stop Carla at the beginning?","opts":["She arrived late to the meeting","She was talking too much","Her topic wasn't on the agenda"],"a":2},{"q":"According to Ben, what's the real cause of the delays?","opts":["Old trucks","Not enough staff on weekends","Bad weather in the south"],"a":1},{"q":"What does Ben have to do by Friday?","opts":["Send a shift plan","Check the budget","Fix the coffee machine"],"a":0}]},"lang":[{"e":"bring up","t":"PV","d":"to start talking about a topic","x":"I'd like to bring up the issue of overtime.","s":"bring UP"},{"e":"run over","t":"PV","d":"to last longer than planned","x":"Sorry I'm late. My last meeting ran over.","s":"run Over"},{"e":"wrap up","t":"PV","d":"to finish a meeting, a discussion or a task","x":"Let's wrap up. We only have five minutes left.","s":"wrap UP"},{"e":"get down to business","t":"ID","d":"to start discussing the main topic","x":"OK, enough small talk. Let's get down to business.","s":"get DOWN to BUSiness"},{"e":"the elephant in the room","t":"ID","d":"an obvious problem that nobody wants to talk about","x":"The budget cut is the elephant in the room.","s":"the ELephant in the ROOM"},{"e":"put a pin in it","t":"ID","d":"to stop discussing something for now and return to it later","x":"Great question, but let's put a pin in it until next week.","s":"PUT a PIN in it"},{"e":"go off on a tangent","t":"ID","d":"to suddenly start talking about something unrelated to the topic","x":"Our boss often goes off on a tangent about his dog.","s":"go OFF on a TANgent"},{"e":"stick to the agenda","t":"COL","d":"to discuss only the topics that were planned","x":"If we stick to the agenda, we'll finish on time.","s":"STICK to the aGENda"},{"e":"action items","t":"COL","d":"specific tasks that people agree to do after a meeting","x":"Please email everyone the action items after the call.","s":"ACtion items"},{"e":"on track","t":"PREP","d":"focused on the topic; progressing as planned","x":"The project is on track to finish in May.","s":"on TRACK"},{"e":"in favor of","t":"PREP","d":"supporting a plan or an idea","x":"Most of the team is in favor of working from home on Fridays.","s":"in FAvor of","uk":"UK: in favour of"},{"e":"on behalf of","t":"PREP","d":"representing another person or group","x":"I'm writing on behalf of the whole team.","s":"on beHALF of"}],"func":{"title":"Interrupting, keeping on track and checking understanding","when":"Use these in meetings and video calls when you need to join the conversation or bring it back to the main point.","phrases":[{"p":"Sorry to interrupt, but…","use":"interrupt politely"},{"p":"Can I just jump in here?","use":"interrupt politely"},{"p":"If I could just add something…","use":"add a point to the discussion"},{"p":"Sorry, go ahead.","use":"let the other person speak when you both start at the same time"},{"p":"Let me just finish this point.","use":"keep speaking when someone interrupts you"},{"p":"I think we're getting off track.","use":"say the discussion has lost focus"},{"p":"Getting back to the main point, …","use":"return to the agenda"},{"p":"Can we take this offline?","use":"move a side issue out of the meeting"},{"p":"Just to clarify, are you saying…?","use":"check that you understand"},{"p":"So, to sum up, …","use":"summarize the discussion"}],"task":"Work in groups of three or four and hold a 3-minute meeting: 'Should our company switch to a four-day week?' One student is the chair. Before you start, each of the others secretly chooses a difficult role: someone who goes off topic, someone who talks too much, or someone who keeps misunderstanding. Everyone must use at least three phrases to interrupt, keep things on track or check understanding."},"pron":{"focus":"Weak forms of small words","explain":"In natural speech, small grammar words like to, of, for, can, and and at are usually unstressed and pronounced with a short, relaxed 'uh' sound (schwa /ə/): to → /tə/, of → /əv/, for → /fər/, can → /kən/. If you stress every word, you sound robotic, and you also speak more slowly.","tip":"Say the stressed words (in CAPITALS) louder and longer, and let the small words 'shrink' between them. Tap the table on each stressed syllable to keep a steady rhythm.","lines":[{"t":"Let's stick to the agenda.","m":"let's STICK to the aGENda."},{"t":"Can I bring up something quickly?","m":"can I bring UP SOMEthing QUICKly↗?"},{"t":"I'm here on behalf of the warehouse team.","m":"I'm HERE on beHALF of the WAREhouse TEAM."},{"t":"Who's in favor of trying that for a month?","m":"WHO'S in FAvor of TRYing THAT for a MONTH↘?"},{"t":"Let's wrap up, because we're out of time.","m":"let's WRAP UP, | because we're OUT of TIME."}]},"acts":[{"type":"fishbowl","questions":["Should all meetings have a strict time limit of 30 minutes?","Are video calls more or less productive than meetings in person?","Should cameras be on or off in online meetings?","Is it rude to check your phone during a meeting?","Should junior employees take turns chairing meetings?","Would a 'no-meeting day' every week improve productivity?"]},{"type":"roleplay","cards":[{"sit":"Planning the office move","a":"You're chairing a meeting about moving to a new office next month. Stick to the agenda, keep the meeting on track and finish with clear action items.","b":"You keep going off on tangents (your weekend, the parking, the view from the old office). Then bring up one real concern: the new office is far from the nearest subway station."},{"sit":"The elephant in the room","a":"You're the manager. The team's project is three weeks behind schedule. Bring up the problem diplomatically and find a solution together.","b":"You're a team member. You know the project is late because the client keeps changing what they want, but nobody has said it. Explain the real problem politely."},{"sit":"The Monday meeting that never ends","a":"Your team's Monday meeting always runs over by 45 minutes. Suggest three changes to your manager.","b":"You're the manager. You like long meetings because you think they build team spirit. Listen, defend your point of view, and then agree to try one change."}]},{"type":"ranking","task":"Your company wants to cut meeting time by 30%. Rank these ideas from MOST to LEAST effective. Then agree on a top 3 as a group.","items":["Send the agenda 24 hours before every meeting","Hold short stand-up meetings where nobody sits down","No meetings on Fridays","A maximum of 25 minutes per meeting","Only invite people who really need to be there","Send a written update instead of meeting whenever possible","Finish every meeting with clear action items"]}],"ex":{"gap":{"items":[{"s":"We have a lot to discuss, so let's ___ and start with the budget.","a":"get down to business"},{"s":"The meeting was supposed to end at 4:00, but it ___ by almost an hour.","a":"ran over"},{"s":"That's an interesting idea, but it's not on today's agenda. Let's ___ and discuss it next week.","a":"put a pin in it"},{"s":"Nobody wants to mention that the project is over budget. It's the ___.","a":"elephant in the room"},{"s":"Who's ___ moving the meeting to Thursday? Raise your hand.","a":"in favor of"},{"s":"Before we finish, let's review the ___: who's doing what, and by when?","a":"action items"}]},"match":{"pairs":[["bring up","mention a topic for discussion"],["wrap up","finish a meeting or discussion"],["go off on a tangent","start talking about something unrelated"],["stick to the agenda","discuss only the planned topics"],["on track","focused and making progress as planned"],["on behalf of","representing someone else"]]},"fix":{"items":[{"s":"Let's put a pin on that and talk about it later.","wrong":"put a pin on","fix":"put a pin in"},{"s":"Most of the team is in favor to the new schedule.","wrong":"in favor to","fix":"in favor of"},{"s":"I'd like to bring on a problem with the budget.","wrong":"bring on","fix":"bring up"},{"s":"Let's do a short meeting tomorrow to wrap up the project.","wrong":"do a short meeting","fix":"have a short meeting"}]}},"rec":{"prompt":"Describe a typical meeting at your work or school. What works, what doesn't, and what would you change?","model":"At my company, we have a team meeting every Monday at nine. In theory, it should take thirty minutes, but it almost always runs over, mainly because people go off on tangents about things that aren't on the agenda. Our manager is very friendly, but she doesn't really keep the discussion on track. If it were up to me, I'd send the agenda the day before and ask everyone to stick to it. I'd also finish every meeting with clear action items, so we all know who's doing what. And maybe I'd finally bring up the elephant in the room: half of our meetings could be an email!","use":["run over","go off on a tangent","stick to the agenda","action items"]},"tips":[{"who":"teacher","t":"During the fishbowl, give each observer in the outer circle a checklist of five phrases from the functional language section. They tick the phra
